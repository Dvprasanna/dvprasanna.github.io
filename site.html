<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keyboard Drawing Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: system-ui, sans-serif;
  background: #0f1220;
  color: #fff;
}

#menu, #toolbar {
  position: fixed;
  left: 0;
  right: 0;
  display: flex;
  gap: 10px;
  justify-content: center;
  z-index: 10;
}

#menu {
  top: 40%;
}

#menu button {
  padding: 14px 22px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  background: #3a6cff;
  color: #fff;
  cursor: pointer;
}

#toolbar {
  bottom: 10px;
}

#toolbar button {
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  background: #222;
  color: #fff;
  cursor: pointer;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<!-- LEVEL SELECTION -->
<div id="menu">
  <button onclick="start('easy')">Easy</button>
  <button onclick="start('medium')">Medium</button>
  <button onclick="start('hard')">Hard</button>
</div>

<!-- TOOLBAR -->
<div id="toolbar" style="display:none">
  <button onclick="restart()">Restart</button>
  <button onclick="undo()">Undo</button>
  <button onclick="redo()">Redo</button>
  <button onclick="hint()">Hint</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const CM = 37.8;           // 1 cm in pixels
const ANGLE_STEP = 5;      // degrees

let cx, cy;
let angle = 0;
let history = [];
let redoStack = [];
let level = "easy";

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cx = canvas.width / 2;
  cy = canvas.height / 2;
  redraw();
}
window.addEventListener("resize", resize);

function start(lvl) {
  level = lvl;
  document.getElementById("menu").style.display = "none";
  document.getElementById("toolbar").style.display = "flex";
  resize();
}

function restart() {
  history = [];
  redoStack = [];
  angle = 0;
  redraw();
}

function drawLine(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = "#00ffcc";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let x = cx, y = cy;

  history.forEach(step => {
    let rad = step.angle * Math.PI / 180;
    let nx = x + Math.cos(rad) * step.len;
    let ny = y + Math.sin(rad) * step.len;
    drawLine(x, y, nx, ny);
    x = nx; y = ny;
  });

  // center point
  ctx.fillStyle = "#ff3366";
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
}

function addStep(len, ang) {
  history.push({ len, angle: ang });
  redoStack = [];
  redraw();
}

function undo() {
  if (history.length) {
    redoStack.push(history.pop());
    redraw();
  }
}

function redo() {
  if (redoStack.length) {
    history.push(redoStack.pop());
    redraw();
  }
}

function hint() {
  alert("Use A D W Z to draw\nP / M to rotate by 5°");
}

document.addEventListener("keydown", e => {
  if (!document.getElementById("toolbar").style.display) return;

  switch (e.key.toLowerCase()) {
    case "a": addStep(CM, 180 + angle); break;
    case "d": addStep(CM, 0 + angle); break;
    case "w": addStep(CM, -90 + angle); break;
    case "z": addStep(CM, 90 + angle); break;
    case "p": angle += ANGLE_STEP; break;
    case "m": angle -= ANGLE_STEP; break;
  }
});
</script>

</body>
</html>
