<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drawing Task Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --topbar-h: 100px;
  --keypad-h: 190px;
}
html,body{
  margin:0;height:100%;background:#0f1220;color:#fff;
  font-family:system-ui,sans-serif;overflow:hidden;
}

/* MENU */
#menu{
  position:fixed;inset:0;
  display:flex;gap:12px;
  justify-content:center;align-items:center;
  background:#0f1220;z-index:20;
}
#menu button{
  padding:14px 22px;border-radius:10px;
  border:none;background:#3a6cff;color:#fff;
}

/* TOP TASK BAR */
#top{
  position:fixed;
  top:env(safe-area-inset-top);
  left:0;right:0;
  height:var(--topbar-h);
  background:#151833;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  z-index:10;
}

/* TOOLBAR */
#toolbar{
  display:flex;gap:6px;
}
#toolbar button{
  padding:6px 10px;border-radius:6px;
  border:none;background:#2b2f55;color:#fff;
}

/* CANVAS */
canvas{
  position:fixed;
  top:calc(var(--topbar-h) + env(safe-area-inset-top));
  bottom:calc(var(--keypad-h) + env(safe-area-inset-bottom));
  left:0;right:0;
}

/* KEYPAD */
#keys{
  position:fixed;
  bottom:env(safe-area-inset-bottom);
  left:0;right:0;
  height:var(--keypad-h);
  background:#11142c;
  display:none;
  justify-content:center;
  gap:26px;
  z-index:10;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,60px);
  gap:6px;
}
.rotatepad{
  display:grid;
  grid-template-columns:repeat(2,60px);
  gap:6px;
}
.key{
  height:50px;border-radius:10px;
  background:#2b2f55;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
}
</style>
</head>

<body>

<div id="menu">
  <button onclick="start('easy')">Easy</button>
  <button onclick="start('medium')">Medium</button>
  <button onclick="start('hard')">Hard</button>
</div>

<div id="top">
  <div id="taskText"></div>
  <div id="progress"></div>
  <div id="toolbar">
    <button onclick="restart()">Restart</button>
    <button onclick="undo()">Undo</button>
    <button onclick="redo()">Redo</button>
    <button onclick="hint()">Hint</button>
  </div>
</div>

<div id="keys">
  <div class="keypad">
    <div></div><div class="key" onclick="cmd('w')">W</div><div></div>
    <div class="key" onclick="cmd('a')">A</div><div class="key">⬤</div><div class="key" onclick="cmd('d')">D</div>
    <div></div><div class="key" onclick="cmd('z')">Z</div><div></div>
  </div>
  <div class="rotatepad">
    <div class="key" onclick="cmd('p')">P ↻</div>
    <div class="key" onclick="cmd('m')">M ↺</div>
  </div>
</div>

<canvas id="c"></canvas>

<script>
/* ---------- DOM ---------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const topBar = document.getElementById("top");
const keys = document.getElementById("keys");
const taskText = document.getElementById("taskText");
const progress = document.getElementById("progress");

/* ---------- CONSTANTS ---------- */
const CM = 37.8;
const STEP = 5;

/* ---------- STATE ---------- */
let cx, cy, angle = 0;
let history = [], redoStack = [];
let level, taskIndex = 0;

/* ---------- TASKS ---------- */
const TASKS = {
  easy: Array.from({length:10},(_,i)=>({
    txt:`Draw ${i+1} cm on +X axis`,
    ang:0, cm:i+1
  })),
  medium: Array.from({length:10},(_,i)=>({
    txt:`Draw ${i+1} cm at 45°`,
    ang:45, cm:i+1
  })),
  hard: Array.from({length:10},(_,i)=>({
    txt:`Draw ${i+1} cm at ${(i+1)*10}°`,
    ang:(i+1)*10, cm:i+1
  }))
};

/* ---------- CORE ---------- */
function resize(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  cx = canvas.width/2;
  cy = canvas.height/2;
  redraw();
}
addEventListener("resize", resize);

function start(lvl){
  level = lvl;
  taskIndex = 0;
  menu.style.display = "none";
  topBar.style.display = "flex";
  keys.style.display = "flex";
  restart();
}

function restart(){
  history = [];
  redoStack = [];
  angle = 0;
  updateTask();
  resize();
}

function updateTask(){
  taskText.textContent = TASKS[level][taskIndex].txt;
  progress.textContent = `Task ${taskIndex+1} / 10`;
}

function step(len, ang){
  history.push({len, ang});
  redoStack = [];
  redraw();
  checkTask();
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let x = cx, y = cy;
  history.forEach(s=>{
    let r = s.ang*Math.PI/180;
    let nx = x + Math.cos(r)*s.len;
    let ny = y + Math.sin(r)*s.len;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(nx,ny);
    ctx.strokeStyle="#00ffcc";
    ctx.lineWidth=2;
    ctx.stroke();
    x=nx;y=ny;
  });
}

/* ---------- TASK CHECK ---------- */
function checkTask(){
  const t = TASKS[level][taskIndex];
  if(!history.length) return;
  const last = history[history.length-1];
  const lenCm = last.len / CM;
  if(Math.abs(lenCm - t.cm) < 0.2 &&
     Math.abs(((last.ang%360)+360)%360 - t.ang) < 5){
    taskIndex++;
    if(taskIndex >= 10){
      alert("🎉 Stage completed!");
      restart();
    } else {
      history = [];
      angle = 0;
      updateTask();
      redraw();
    }
  }
}

/* ---------- UI ---------- */
function undo(){ if(history.length){ redoStack.push(history.pop()); redraw(); } }
function redo(){ if(redoStack.length){ history.push(redoStack.pop()); redraw(); } }
function hint(){ alert(taskText.textContent); }

function cmd(k){
  if(k==="a") step(CM,180+angle);
  if(k==="d") step(CM,angle);
  if(k==="w") step(CM,-90+angle);
  if(k==="z") step(CM,90+angle);
  if(k==="p") angle+=STEP;
  if(k==="m") angle-=STEP;
}

addEventListener("keydown",e=>cmd(e.key.toLowerCase()));
</script>

</body>
</html>
