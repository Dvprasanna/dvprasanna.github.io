<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independent Line Angles</title>
<style>
  body { margin:0; background:#fff; font-family:sans-serif; }
  canvas { display:block; margin:auto; touch-action:none; }
  .controls { text-align:center; padding:8px; }
  input { width:80px; }
</style>
</head>
<body>

<canvas id="c" width="600" height="300"></canvas>

<div class="controls">
  Left Angle:
  <input type="number" id="left" value="0">°
  &nbsp;&nbsp;
  Right Angle:
  <input type="number" id="right" value="0">°
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const THICK = 14;

// initial line
const line = {
  x1: 120, y1: 150,
  x2: 480, y2: 150
};

let anchor = null;
let leftAngle = 0;
let rightAngle = 0;

// ---- DRAW ----
function draw() {
  ctx.clearRect(0,0,600,300);

  if (!anchor) {
    drawSegment(line.x1, line.y1, line.x2, line.y2);
    return;
  }

  // anchor
  ctx.beginPath();
  ctx.arc(anchor.x, anchor.y, 6, 0, Math.PI*2);
  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;
  ctx.stroke();

  // LEFT SEGMENT
  ctx.save();
  ctx.translate(anchor.x, anchor.y);
  ctx.rotate(leftAngle);
  drawSegment(
    line.x1 - anchor.x,
    line.y1 - anchor.y,
    0, 0
  );
  ctx.restore();

  // RIGHT SEGMENT
  ctx.save();
  ctx.translate(anchor.x, anchor.y);
  ctx.rotate(rightAngle);
  drawSegment(
    0, 0,
    line.x2 - anchor.x,
    line.y2 - anchor.y
  );
  ctx.restore();
}

// ---- DRAW THICK SEGMENT ----
function drawSegment(x1,y1,x2,y2){
  const len = Math.hypot(x2-x1, y2-y1);
  const ang = Math.atan2(y2-y1, x2-x1);

  ctx.save();
  ctx.translate(x1,y1);
  ctx.rotate(ang);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, -THICK/2, len, THICK);
  ctx.restore();
}

// ---- PROJECT CLICK TO LINE ----
canvas.addEventListener("pointerdown", e=>{
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left;
  const py = e.clientY - r.top;
  anchor = projectToLine(px, py, line);
  draw();
});

// ---- INPUTS ----
document.getElementById("left").oninput = e=>{
  leftAngle = (+e.target.value || 0) * Math.PI / 180;
  draw();
};

document.getElementById("right").oninput = e=>{
  rightAngle = (+e.target.value || 0) * Math.PI / 180;
  draw();
};

// ---- PROJECTION ----
function projectToLine(px, py, L){
  const vx = L.x2 - L.x1;
  const vy = L.y2 - L.y1;
  const t = ((px - L.x1)*vx + (py - L.y1)*vy) / (vx*vx + vy*vy);
  return {
    x: L.x1 + t*vx,
    y: L.y1 + t*vy
  };
}

draw();
</script>

</body>
</html>
