<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anchor Proof Test</title>
<style>
  body { margin:0; background:#eee; }
  canvas { display:block; margin:auto; background:#fff; }
</style>
</head>
<body>

<canvas id="c" width="800" height="400"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

const TH = 14;

let lines = [];
let mode = "draw";

// ---------- helpers ----------
function pos(e){
  const r=c.getBoundingClientRect();
  return { x:e.clientX-r.left, y:e.clientY-r.top };
}

function distToLine(p,l){
  const vx=l.x2-l.x1, vy=l.y2-l.y1;
  const wx=p.x-l.x1, wy=p.y-l.y1;
  const c1=vx*wx+vy*wy;
  if(c1<=0) return Math.hypot(p.x-l.x1,p.y-l.y1);
  const c2=vx*vx+vy*vy;
  if(c2<=c1) return Math.hypot(p.x-l.x2,p.y-l.y2);
  const b=c1/c2;
  return Math.hypot(p.x-(l.x1+b*vx), p.y-(l.y1+b*vy));
}

function project(p,l){
  const vx=l.x2-l.x1, vy=l.y2-l.y1;
  const t=((p.x-l.x1)*vx+(p.y-l.y1)*vy)/(vx*vx+vy*vy);
  return { x:l.x1+t*vx, y:l.y1+t*vy };
}

function drawLine(l){
  const len=Math.hypot(l.x2-l.x1,l.y2-l.y1);
  const ang=Math.atan2(l.y2-l.y1,l.x2-l.x1);
  ctx.save();
  ctx.translate(l.x1,l.y1);
  ctx.rotate(ang);
  ctx.fillRect(0,-TH/2,len,TH);
  ctx.restore();
}

function redraw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle="#000";

  for(const l of lines){
    drawLine(l);
    if(l.anchor){
      ctx.beginPath();
      ctx.arc(l.anchor.x,l.anchor.y,6,0,Math.PI*2);
      ctx.strokeStyle="red";
      ctx.lineWidth=2;
      ctx.stroke();
    }
  }
}

// ---------- draw lines ----------
let start=null;

c.addEventListener("pointerdown", e=>{
  const p=pos(e);

  if(mode==="draw"){
    start=p;
    lines.push({ x1:p.x,y1:p.y,x2:p.x,y2:p.y, anchor:null });
  }

  else if(mode==="anchor"){
    for(const l of lines){
      if(distToLine(p,l) < TH){
        l.anchor = project(p,l);
        redraw();
        return;
      }
    }
  }
});

c.addEventListener("pointermove", e=>{
  if(!start) return;
  const p=pos(e);
  const l=lines.at(-1);
  l.x2=p.x;
  l.y2=p.y;
  redraw();
});

c.addEventListener("pointerup", ()=>{ start=null; });

// toggle mode with key
window.addEventListener("keydown", e=>{
  if(e.key==="a") mode="anchor";
  if(e.key==="d") mode="draw";
});

redraw();
</script>

</body>
</html>
