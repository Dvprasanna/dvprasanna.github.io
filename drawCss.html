<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Draw</title>

<style>
/* ===============================
   CANVAS DRAW – UI v1.1
   =============================== */

:root{
  --bg:#0f0f0f;
  --surface:#181818;
  --surface2:#202020;
  --text:#eaeaea;
  --muted:#9a9a9a;
  --primary:#4ea1ff;
  --border:#2a2a2a;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}

/* ===============================
   LAYOUT
   =============================== */

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------- TOP BAR ---------- */

.topbar{
  display:flex;
  gap:8px;
  padding:12px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}

button{
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
  min-width:44px;
  font-size:14px;
}

button.primary{
  background:var(--primary);
  color:#000;
}

/* ---------- CANVAS STAGE ---------- */

.stage{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

/* OUTER FRAME (visual placement) */
.canvas-frame{
  background:#000;
  padding:12px;
  border-radius:14px;
  border:2px solid #3a3a3a;
}

/* ACTUAL CANVAS */
canvas{
  display:block;
  background:#000;
  border:1px solid #4ea1ff;   /* CANVAS BORDER */
  border-radius:6px;
  touch-action:none;
}

/* ---------- CONTEXT ---------- */

.context{
  padding:10px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
  background:var(--surface);
  border-top:1px solid var(--border);
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="primary">Draw</button>
    <button>S</button>
    <button class="primary">M</button>
    <button>L</button>
  </div>

  <!-- CANVAS -->
  <div class="stage">
    <div class="canvas-frame">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <!-- CONTEXT -->
  <div class="context">
    Drag from edges for full lines · Drag from corners for circles
  </div>

</div>

<script>
/* ===============================
   CANVAS CORE – v1.1
   =============================== */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const DPR = window.devicePixelRatio || 1;

const W = 600;
const H = 800;
const HOTZONE = 50;

function resizeCanvas(){
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resizeCanvas();

/* ---------- STATE ---------- */

let shapes = [];
let history = [];
let width = 4;

let pointer = { active:false };
let ghost = null;

/* ---------- HELPERS ---------- */

function getPos(e){
  const r = canvas.getBoundingClientRect();
  return { x:e.clientX - r.left, y:e.clientY - r.top };
}

function redraw(){
  ctx.clearRect(0,0,W,H);
  shapes.forEach(s=>{
    ctx.lineWidth = s.w;
    ctx.strokeStyle = '#fff';
    ctx.beginPath();
    if(s.type==='line'){
      ctx.moveTo(s.x1,s.y1);
      ctx.lineTo(s.x2,s.y2);
    }
    if(s.type==='circle'){
      ctx.arc(s.cx,s.cy,s.r,0,Math.PI*2);
    }
    ctx.stroke();
  });
}

function drawGhost(){
  if(!ghost) return;
  ctx.save();
  ctx.setLineDash([6,6]);
  ctx.strokeStyle = '#4ea1ff';
  ctx.lineWidth = ghost.w;
  ctx.beginPath();

  if(ghost.type==='vline'){
    ctx.moveTo(ghost.x,0);
    ctx.lineTo(ghost.x,H);
  }
  if(ghost.type==='hline'){
    ctx.moveTo(0,ghost.y);
    ctx.lineTo(W,ghost.y);
  }
  if(ghost.type==='circle'){
    ctx.arc(ghost.cx,ghost.cy,ghost.r,0,Math.PI*2);
  }

  ctx.stroke();
  ctx.restore();
}

/* ===============================
   POINTER FLOW
   =============================== */

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  const p = getPos(e);
  pointer.active = true;

  const L = p.x <= HOTZONE;
  const R = p.x >= W - HOTZONE;
  const T = p.y <= HOTZONE;
  const B = p.y >= H - HOTZONE;

  ghost = null;

  if((L||R)&&(T||B)){
    ghost = {
      type:'circle',
      cx: L ? 0 : W,
      cy: T ? 0 : H,
      r: 0,
      w: width
    };
  } else if(L||R){
    ghost = { type:'vline', x:p.x, w:width };
  } else if(T||B){
    ghost = { type:'hline', y:p.y, w:width };
  }

  redraw();
  drawGhost();
},{passive:false});

canvas.addEventListener('pointermove', e=>{
  if(!pointer.active || !ghost) return;
  e.preventDefault();

  const p = getPos(e);

  if(ghost.type==='circle'){
    ghost.r = Math.hypot(p.x - ghost.cx, p.y - ghost.cy);
  }
  if(ghost.type==='vline'){
    ghost.x = Math.max(0,Math.min(W,p.x));
  }
  if(ghost.type==='hline'){
    ghost.y = Math.max(0,Math.min(H,p.y));
  }

  redraw();
  drawGhost();
},{passive:false});

canvas.addEventListener('pointerup', e=>{
  e.preventDefault();
  canvas.releasePointerCapture(e.pointerId);

  if(ghost){
    history.push(JSON.stringify(shapes));

    if(ghost.type==='circle'){
      shapes.push({ type:'circle', cx:ghost.cx, cy:ghost.cy, r:ghost.r, w:ghost.w });
    }
    if(ghost.type==='vline'){
      shapes.push({ type:'line', x1:ghost.x, y1:0, x2:ghost.x, y2:H, w:ghost.w });
    }
    if(ghost.type==='hline'){
      shapes.push({ type:'line', x1:0, y1:ghost.y, x2:W, y2:ghost.y, w:ghost.w });
    }
  }

  ghost = null;
  pointer.active = false;
  redraw();
},{passive:false});

/* ===============================
   Version: Canvas Draw v1.1
   =============================== */
</script>

</body>
</html>
