<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Table Tennis</title>

<style>
    body {
        margin: 0;
        background: #1b1b1b;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    canvas {
        background: #2e7d32;          /* table green */
        border: 6px solid #ffffff;   /* table edge */
        touch-action: none;
    }
</style>
</head>
<body>

<canvas id="game" width="600" height="800"></canvas>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ================= TABLE ================= */
const table = {
    x: 100,
    y: 100,
    width: 400,
    height: 600
};

/* ================= PADDLES ================= */
const paddle = {
    width: 120,
    height: 12
};

const topPaddle = {
    x: canvas.width / 2 - paddle.width / 2,
    y: table.y - 25,
    speed: 4
};

const bottomPaddle = {
    x: canvas.width / 2 - paddle.width / 2,
    y: table.y + table.height + 13,
    speed: 7
};

/* ================= BALL ================= */
const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    r: 6,
    dx: 2,
    dy: 5
};

/* ================= INPUT ================= */
let left = false;
let right = false;

// Keyboard
document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") left = true;
    if (e.key === "ArrowRight") right = true;
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") left = false;
    if (e.key === "ArrowRight") right = false;
});

// Touch (mobile)
canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touchX = e.touches[0].clientX - rect.left;

    bottomPaddle.x = touchX - paddle.width / 2;
    clampBottomPaddle();
}, { passive: false });

/* ================= HELPERS ================= */
function clampBottomPaddle() {
    bottomPaddle.x = Math.max(
        table.x,
        Math.min(bottomPaddle.x, table.x + table.width - paddle.width)
    );
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.dy *= -1;
}

/* ================= UPDATE ================= */
function update() {
    // Bottom paddle (player)
    if (left) bottomPaddle.x -= bottomPaddle.speed;
    if (right) bottomPaddle.x += bottomPaddle.speed;
    clampBottomPaddle();

    // Top paddle (AI)
    if (ball.x < topPaddle.x + paddle.width / 2)
        topPaddle.x -= topPaddle.speed;
    else
        topPaddle.x += topPaddle.speed;

    topPaddle.x = Math.max(
        table.x,
        Math.min(topPaddle.x, table.x + table.width - paddle.width)
    );

    // Ball movement
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Side walls
    if (ball.x - ball.r < table.x || ball.x + ball.r > table.x + table.width)
        ball.dx *= -1;

    // Bottom paddle collision
    if (
        ball.y + ball.r > bottomPaddle.y &&
        ball.x > bottomPaddle.x &&
        ball.x < bottomPaddle.x + paddle.width
    ) {
        ball.dy *= -1;
        ball.y = bottomPaddle.y - ball.r;
    }

    // Top paddle collision
    if (
        ball.y - ball.r < topPaddle.y + paddle.height &&
        ball.x > topPaddle.x &&
        ball.x < topPaddle.x + paddle.width
    ) {
        ball.dy *= -1;
        ball.y = topPaddle.y + paddle.height + ball.r;
    }

    // Miss
    if (ball.y < table.y || ball.y > table.y + table.height) {
        resetBall();
    }
}

/* ================= DRAW ================= */
function drawTable() {
    // Table surface
    ctx.fillStyle = "#2e7d32";
    ctx.fillRect(table.x, table.y, table.width, table.height);

    // Border
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.strokeRect(table.x, table.y, table.width, table.height);

    // Net (dashed)
    ctx.setLineDash([10, 6]);
    ctx.beginPath();
    ctx.moveTo(table.x, table.y + table.height / 2);
    ctx.lineTo(table.x + table.width, table.y + table.height / 2);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawPaddle(p) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(p.x, p.y, paddle.width, paddle.height);
}

function drawBall() {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawTable();
    drawPaddle(topPaddle);
    drawPaddle(bottomPaddle);
    drawBall();
}

/* ================= LOOP ================= */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
