<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Table Tennis</title>
<style>
    body {
        margin: 0;
        background: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    canvas {
        border: 3px solid black;
    }
</style>
</head>
<body>

<canvas id="game" width="600" height="800"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ================= TABLE =================
const table = {
    x: 100,
    y: 100,
    width: 400,
    height: 600
};

// ================= PADDLES =================
const paddleWidth = 120;
const paddleHeight = 12;

let topPaddle = {
    x: canvas.width / 2 - paddleWidth / 2,
    y: table.y - 25,
    speed: 5
};

let bottomPaddle = {
    x: canvas.width / 2 - paddleWidth / 2,
    y: table.y + table.height + 13,
    speed: 7
};

// ================= BALL =================
let ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    r: 6,
    dx: 2,
    dy: 5
};

// ================= CONTROLS =================
let left = false;
let right = false;

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") left = true;
    if (e.key === "ArrowRight") right = true;
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") left = false;
    if (e.key === "ArrowRight") right = false;
});

// ================= DRAW =================
function drawRect(x, y, w, h) {
    ctx.strokeRect(x, y, w, h);
}

function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.stroke();
}

function drawTable() {
    // Table
    drawRect(table.x, table.y, table.width, table.height);

    // Net
    ctx.beginPath();
    ctx.moveTo(table.x, table.y + table.height / 2);
    ctx.lineTo(table.x + table.width, table.y + table.height / 2);
    ctx.stroke();
}

// ================= GAME LOGIC =================
function update() {
    // Bottom paddle (player)
    if (left && bottomPaddle.x > table.x)
        bottomPaddle.x -= bottomPaddle.speed;

    if (right && bottomPaddle.x + paddleWidth < table.x + table.width)
        bottomPaddle.x += bottomPaddle.speed;

    // Top paddle (AI)
    if (ball.x < topPaddle.x + paddleWidth / 2)
        topPaddle.x -= topPaddle.speed;
    else
        topPaddle.x += topPaddle.speed;

    topPaddle.x = Math.max(
        table.x,
        Math.min(topPaddle.x, table.x + table.width - paddleWidth)
    );

    // Ball movement
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Table side walls
    if (ball.x - ball.r < table.x || ball.x + ball.r > table.x + table.width)
        ball.dx *= -1;

    // Bottom paddle collision
    if (
        ball.y + ball.r > bottomPaddle.y &&
        ball.x > bottomPaddle.x &&
        ball.x < bottomPaddle.x + paddleWidth
    ) {
        ball.dy *= -1;
        ball.y = bottomPaddle.y - ball.r;
    }

    // Top paddle collision
    if (
        ball.y - ball.r < topPaddle.y + paddleHeight &&
        ball.x > topPaddle.x &&
        ball.x < topPaddle.x + paddleWidth
    ) {
        ball.dy *= -1;
        ball.y = topPaddle.y + paddleHeight + ball.r;
    }

    // Reset if missed
    if (ball.y < table.y || ball.y > table.y + table.height) {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.dy *= -1;
    }
}

// ================= DRAW LOOP =================
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawTable();
    drawRect(topPaddle.x, topPaddle.y, paddleWidth, paddleHeight);
    drawRect(bottomPaddle.x, bottomPaddle.y, paddleWidth, paddleHeight);
    drawBall();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
