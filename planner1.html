<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Floor Plan Tracer</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system;
    overflow: hidden;
    background: #f4f4f4;
  }

  canvas {
    display: block;
    background: #fafafa;
    touch-action: none; /* CRITICAL for mobile */
  }

  #ui {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    background: #ffffff;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    z-index: 10;
  }

  #ui button,
  #ui input {
    width: 100%;
    margin: 4px 0;
    font-size: 16px;
  }
</style>
</head>
<body>

<div id="ui">
  <input type="file" id="imgLoader" accept="image/*">
  <label>Wall Thickness</label>
  <input type="range" id="thickness" min="6" max="40" value="20">
  <button id="doorBtn">Door: OFF</button>
  <button id="roomsBtn">Detect Rooms</button>
</div>

<canvas id="canvas"></canvas>

<script>
/* -------------------- CANVAS (RETINA SAFE) -------------------- */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
addEventListener("resize", resizeCanvas);

/* -------------------- STATE -------------------- */
let bgImage = null;
let walls = [];
let doors = [];
let rooms = [];

let drawing = false;
let start = null;
let doorMode = false;
let wallThickness = 20;

const SNAP_DIST = 14;
let snapHit = null;

/* -------------------- IMAGE LOAD -------------------- */
imgLoader.onchange = e => {
  const img = new Image();
  img.onload = () => bgImage = img;
  img.src = URL.createObjectURL(e.target.files[0]);
};

/* -------------------- UI -------------------- */
thickness.oninput = e => wallThickness = +e.target.value;

doorBtn.onclick = () => {
  doorMode = !doorMode;
  doorBtn.textContent = doorMode ? "Door: ON" : "Door: OFF";
};

/* -------------------- GEOMETRY -------------------- */
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function orthoSnap(a,b){
  return Math.abs(b.x-a.x) > Math.abs(b.y-a.y)
    ? {x:b.x,y:a.y}
    : {x:a.x,y:b.y};
}

/* -------------------- SNAPPING -------------------- */
function getSnapPoints(){
  const pts=[];
  walls.forEach(w=>{
    pts.push(w.a,w.b);
    pts.push({
      x:(w.a.x+w.b.x)/2,
      y:(w.a.y+w.b.y)/2
    });
  });
  return pts;
}

function snapToPoint(p){
  snapHit=null;
  for(const s of getSnapPoints()){
    if(dist(s,p)<SNAP_DIST){
      snapHit=s;
      return s;
    }
  }
  return p;
}

/* -------------------- INPUT -------------------- */
canvas.addEventListener("pointerdown", e=>{
  start = snapToPoint({x:e.offsetX,y:e.offsetY});
  drawing = true;
});

canvas.addEventListener("pointerup", e=>{
  if(!drawing) return;
  const raw = snapToPoint({x:e.offsetX,y:e.offsetY});
  const end = orthoSnap(start, raw);

  if(doorMode){
    doors.push({a:start,b:end});
  } else {
    walls.push({a:start,b:end});
  }
  drawing = false;
});

/* -------------------- ROOMS -------------------- */
const key = p => `${Math.round(p.x)}_${Math.round(p.y)}`;

function buildGraph(){
  const g={};
  walls.forEach(w=>{
    const k1=key(w.a), k2=key(w.b);
    g[k1]??=[]; g[k2]??=[];
    g[k1].push(w.b);
    g[k2].push(w.a);
  });
  return g;
}

function polygonArea(pts){
  let a=0;
  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length;
    a+=pts[i].x*pts[j].y - pts[j].x*pts[i].y;
  }
  return Math.abs(a/2);
}

function detectRooms(){
  const g=buildGraph();
  const visited=new Set();
  rooms=[];

  for(const k in g){
    if(visited.has(k)) continue;
    let path=[], cur=k;

    while(!visited.has(cur)){
      visited.add(cur);
      path.push(cur);
      const n=g[cur];
      if(!n||!n.length) break;

      const next=key(n[0]);
      if(path.includes(next)){
        const loop=path.slice(path.indexOf(next)).map(p=>{
          const [x,y]=p.split("_").map(Number);
          return {x,y};
        });
        if(loop.length>2){
          rooms.push({pts:loop, area:polygonArea(loop)});
        }
        break;
      }
      cur=next;
    }
  }
}
roomsBtn.onclick = detectRooms;

/* -------------------- DRAW LOOP -------------------- */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(bgImage){
    ctx.globalAlpha=0.4;
    ctx.drawImage(bgImage,0,0);
    ctx.globalAlpha=1;
  }

  /* Walls */
  ctx.strokeStyle="#333";
  ctx.lineWidth=wallThickness;
  ctx.lineJoin="bevel";
  ctx.lineCap="butt";

  walls.forEach(w=>{
    ctx.beginPath();
    ctx.moveTo(w.a.x,w.a.y);
    ctx.lineTo(w.b.x,w.b.y);
    ctx.stroke();
  });

  /* Door cuts */
  ctx.strokeStyle="#fafafa";
  ctx.lineWidth=wallThickness-6;
  doors.forEach(d=>{
    ctx.beginPath();
    ctx.moveTo(d.a.x,d.a.y);
    ctx.lineTo(d.b.x,d.b.y);
    ctx.stroke();
  });

  /* Rooms */
  rooms.forEach(r=>{
    ctx.fillStyle="rgba(0,150,255,.18)";
    ctx.beginPath();
    r.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.closePath();
    ctx.fill();

    const cx=r.pts.reduce((s,p)=>s+p.x,0)/r.pts.length;
    const cy=r.pts.reduce((s,p)=>s+p.y,0)/r.pts.length;
    ctx.fillStyle="#000";
    ctx.font="14px system-ui";
    ctx.fillText(Math.round(r.area)+" px²",cx-30,cy);
  });

  /* Snap indicator */
  if(snapHit){
    ctx.strokeStyle="cyan";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(snapHit.x,snapHit.y,6,0,Math.PI*2);
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
