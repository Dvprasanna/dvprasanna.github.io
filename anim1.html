<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>anim1 – Professional Scissor Rig</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#bfbfbf; font-family:sans-serif; }
canvas { display:block; margin:auto; background:#f4f4f4; touch-action:none; }
.controls { text-align:center; padding:8px; background:#ddd; }
button { margin:4px; padding:6px 12px; }
</style>
</head>
<body>

<div class="controls">
  <button id="rectBtn">1. Draw Rect</button>
  <button id="moveBtn">2. Movement</button>
  <button id="animBtn">Anim</button>
  <button id="resetBtn">Reset</button>
</div>

<canvas id="c" width="380" height="260"></canvas>

<script>
/* =========================================================
   CORE DATA
========================================================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const TAU = Math.PI * 2;

/* Static V-shaped scissor (dumb geometry) */
const baseScissor = [
  { a:{x:190,y:130}, b:{x:300,y:90} },   // blade A
  { a:{x:190,y:130}, b:{x:80,y:170} }    // blade B
];

let scissor = structuredClone(baseScissor);

/* =========================================================
   STATE MACHINE
========================================================= */
const State = {
  IDLE: "idle",
  RECT: "rect",
  MOVE: "move",
  ANIM: "anim"
};

let state = State.IDLE;

/* Rectangle (4-point intent model) */
let rectPoints = [];
let rect = null;

/* Motion roles */
let pivot = null;
let startRef = null;
let endRef = null;

/* Animation */
let t = 0;
let animating = false;

/* =========================================================
   MATH HELPERS
========================================================= */
function pos(e){
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x:p.clientX - r.left, y:p.clientY - r.top };
}

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function angle(a,b){ return Math.atan2(b.y-a.y, b.x-a.x); }

function rotate(p,c,a){
  const dx = p.x - c.x, dy = p.y - c.y;
  return {
    x: c.x + dx*Math.cos(a) - dy*Math.sin(a),
    y: c.y + dx*Math.sin(a) + dy*Math.cos(a)
  };
}

function insideRect(p,r){
  const dx=p.x-r.x, dy=p.y-r.y;
  const lx=dx*Math.cos(-r.angle)-dy*Math.sin(-r.angle);
  const ly=dx*Math.sin(-r.angle)+dy*Math.cos(-r.angle);
  return lx>=0 && lx<=r.w && ly>=0 && ly<=r.h;
}

/* =========================================================
   DRAW
========================================================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* Rectangle only after commit */
  if(rect){
    ctx.save();
    ctx.translate(rect.x,rect.y);
    ctx.rotate(rect.angle);
    ctx.fillStyle="rgba(80,130,255,0.45)";
    ctx.fillRect(0,0,rect.w,rect.h);
    ctx.restore();
  }

  /* Scissor */
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#111";
  scissor.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.a.x,l.a.y);
    ctx.lineTo(l.b.x,l.b.y);
    ctx.stroke();
  });

  /* Role markers (only after selection) */
  if(pivot) dot(pivot,"red");
  if(startRef) dot(startRef,"yellow");
  if(endRef) dot(endRef,"lime");

  /* Rect points preview */
  ctx.fillStyle="#333";
  rectPoints.forEach(p=>dot(p,"#333",4));
}

function dot(p,col,r=5){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,TAU);
  ctx.fill();
}

/* =========================================================
   ANIMATION LOOP
========================================================= */
function loop(){
  if(animating && rect && pivot && startRef && endRef){
    t += 0.02;
    if(t>=1){ animating=false; }

    const a0 = angle(pivot,startRef);
    const a1 = angle(pivot,endRef);
    const a  = a0 + (a1-a0)*t;

    scissor = structuredClone(baseScissor);

    scissor.forEach(seg=>{
      if(insideRect(seg.b,rect)){
        seg.b = rotate(seg.b,pivot,a);
      }
    });
  }

  draw();
  requestAnimationFrame(loop);
}
loop();

/* =========================================================
   INPUT
========================================================= */
canvas.addEventListener("pointerdown",e=>{
  const m = pos(e);

  /* Rectangle mode */
  if(state===State.RECT){
    rectPoints.push(m);
    if(rectPoints.length===4){
      const [R1,R2,R3] = rectPoints;
      const ang = angle(R1,R2);
      const dx = R3.x-R1.x, dy = R3.y-R1.y;
      rect = {
        x:R1.x,
        y:R1.y,
        w:dx*Math.cos(-ang)-dy*Math.sin(-ang),
        h:dx*Math.sin(-ang)+dy*Math.cos(-ang),
        angle:ang
      };
      state = State.IDLE;
    }
    return;
  }

  /* Movement role assignment */
  if(state===State.MOVE){
    let candidates=[];
    baseScissor.forEach(l=>{ candidates.push(l.a,l.b); });
    candidates.sort((a,b)=>dist(a,m)-dist(b,m));
    const picked = candidates[0];

    if(!pivot){
      pivot={...picked};
    } else if(!startRef){
      startRef={...picked};
    } else if(!endRef && dist(picked,startRef)>8){
      endRef={...picked};
    }
  }
});

/* =========================================================
   UI
========================================================= */
rectBtn.onclick=()=>{
  rectPoints=[];
  rect=null;
  pivot=startRef=endRef=null;
  state=State.RECT;
};

moveBtn.onclick=()=>{
  pivot=startRef=endRef=null;
  state=State.MOVE;
};

animBtn.onclick=()=>{
  if(rect && pivot && startRef && endRef){
    t=0;
    animating=true;
  }
};

resetBtn.onclick=()=>{
  scissor = structuredClone(baseScissor);
  rectPoints=[];
  rect=null;
  pivot=startRef=endRef=null;
  animating=false;
  state=State.IDLE;
};
</script>

</body>
</html>
