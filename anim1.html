<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Scissor Action – Point Driven</title>
<style>
  body {
    margin: 0;
    background: #ccc;
    touch-action: none;
  }
  canvas {
    display: block;
    margin: auto;
    background: #eee;
  }
</style>
</head>
<body>

<canvas id="c" width="360" height="260"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// ---------- DATA MODEL ----------

// Motion rectangle (top blade only)
const rect = { x: 60, y: 40, w: 240, h: 160 };

// Points
let pivot = { x: 220, y: 120 };   // 🔴
let start = { x: 130, y: 160 };   // 🟡
let end   = { x: 140, y: 80 };    // 🟢

// Bottom blade angle (fixed)
const bottomAngleOffset = -0.7;
const bladeLength = 160;

// Animation
let t = 0;
let dir = 1;

// Drag state
let dragging = null;
const points = [
  { ref: () => pivot, color: "red" },
  { ref: () => start, color: "yellow" },
  { ref: () => end,   color: "lime" }
];

// ---------- HELPERS ----------

function angle(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function drawPoint(p, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
  ctx.fill();
}

function drawBlade(angle) {
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(pivot.x, pivot.y);
  ctx.lineTo(
    pivot.x + Math.cos(angle) * bladeLength,
    pivot.y + Math.sin(angle) * bladeLength
  );
  ctx.stroke();
}

// ---------- DRAW LOOP ----------

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Rectangle (constraint)
  ctx.fillStyle = "rgba(80,130,255,0.7)";
  ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

  // Angles
  const a0 = angle(pivot, start);
  const a1 = angle(pivot, end);
  const a = a0 + t * (a1 - a0);

  // Bottom blade (static)
  drawBlade(a0 + bottomAngleOffset);

  // Top blade (animated)
  drawBlade(a);

  // Points
  drawPoint(pivot, "red");
  drawPoint(start, "yellow");
  drawPoint(end, "lime");

  // Animate
  t += 0.01 * dir;
  if (t > 1 || t < 0) dir *= -1;

  requestAnimationFrame(animate);
}

animate();

// ---------- TOUCH / MOUSE DRAG ----------

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

function hit(p, m) {
  return Math.hypot(p.x - m.x, p.y - m.y) < 12;
}

function down(e) {
  const m = getPos(e);
  for (const p of points) {
    if (hit(p.ref(), m)) {
      dragging = p.ref();
      break;
    }
  }
}

function move(e) {
  if (!dragging) return;
  const m = getPos(e);
  dragging.x = m.x;
  dragging.y = m.y;
}

function up() {
  dragging = null;
}

canvas.addEventListener("mousedown", down);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("mouseup", up);

canvas.addEventListener("touchstart", down);
canvas.addEventListener("touchmove", move);
canvas.addEventListener("touchend", up);
</script>

</body>
</html>
