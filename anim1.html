<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>anim1 – Professional Scissor Animator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#bfbfbf; font-family:sans-serif; }
canvas { display:block; margin:auto; background:#f6f6f6; touch-action:none; }
.controls { text-align:center; padding:8px; background:#ddd; }
button { margin:4px; padding:6px 12px; }
</style>
</head>
<body>

<div class="controls">
  <button id="rectBtn">1. Rect</button>
  <button id="moveBtn">2. Move</button>
  <button id="animBtn">Anim</button>
  <button id="dirBtn">Dir: CW</button>
  <button id="resetBtn">Reset</button>
</div>

<canvas id="c" width="420" height="260"></canvas>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const TAU = Math.PI * 2;

/* ================= STATIC SCISSOR ================= */
const BASE_SCISSOR = [
  { a:{x:210,y:130}, b:{x:340,y:90} },   // blade A
  { a:{x:210,y:130}, b:{x:80,y:170} }    // blade B
];

let scissor = structuredClone(BASE_SCISSOR);

/* ================= STATE ================= */
let rectPoints = [];
let rect = null;

let pivot = null;       // 🔴 geometry
let startRef = null;    // 🟡 geometry
let endRef = null;      // 🟢 anywhere

let animating = false;
let t = 0;
let timeDir = 1;        // open / close
let rotationDir = 1;    // CW / CCW

/* ================= MATH ================= */
const pos = e => {
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x:p.clientX - r.left, y:p.clientY - r.top };
};

const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const angle = (a,b) => Math.atan2(b.y-a.y,b.x-a.x);
const norm = a => (a % TAU + TAU) % TAU;

function lerpAngle(a0,a1,t,dir){
  a0 = norm(a0); a1 = norm(a1);
  let d = a1 - a0;
  if(dir === 1 && d < 0) d += TAU;
  if(dir === -1 && d > 0) d -= TAU;
  return a0 + d * t;
}

function rotate(p,c,a){
  const dx=p.x-c.x, dy=p.y-c.y;
  return {
    x:c.x + dx*Math.cos(a) - dy*Math.sin(a),
    y:c.y + dx*Math.sin(a) + dy*Math.cos(a)
  };
}

function insideRect(p,r){
  const dx=p.x-r.x, dy=p.y-r.y;
  const lx=dx*Math.cos(-r.angle)-dy*Math.sin(-r.angle);
  const ly=dx*Math.sin(-r.angle)+dy*Math.cos(-r.angle);
  return lx>=0 && lx<=r.w && ly>=0 && ly<=r.h;
}

/* ================= DRAW ================= */
function dot(p,col,r=5){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,TAU);
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(rect){
    ctx.save();
    ctx.translate(rect.x,rect.y);
    ctx.rotate(rect.angle);
    ctx.fillStyle="rgba(80,130,255,0.45)";
    ctx.fillRect(0,0,rect.w,rect.h);
    ctx.restore();
  }

  ctx.lineWidth=6;
  ctx.strokeStyle="#111";
  scissor.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.a.x,l.a.y);
    ctx.lineTo(l.b.x,l.b.y);
    ctx.stroke();
  });

  if(pivot) dot(pivot,"red");
  if(startRef) dot(startRef,"yellow");
  if(endRef) dot(endRef,"lime");

  rectPoints.forEach(p=>dot(p,"#333",4));
}

/* ================= LOOP ================= */
function loop(){
  if(animating && pivot && startRef && endRef){
    t += 0.015 * timeDir;

    if(t >= 1){ t = 1; timeDir = -1; }
    if(t <= 0){ t = 0; timeDir = 1; }

    const aStart = angle(pivot,startRef);
    const aEnd   = angle(pivot,endRef);

    const cur = lerpAngle(aStart,aEnd,t,rotationDir);
    const delta = cur - aStart;

    scissor = structuredClone(BASE_SCISSOR);
    scissor.forEach(seg=>{
      if(!rect || insideRect(seg.b,rect)){
        seg.b = rotate(seg.b,pivot,delta);
      }
    });
  }

  draw();
  requestAnimationFrame(loop);
}
loop();

/* ================= INPUT ================= */
canvas.addEventListener("pointerdown",e=>{
  const m = pos(e);

  // rectangle definition
  if(rectPoints.length < 4){
    rectPoints.push(m);
    if(rectPoints.length === 4){
      const [R1,R2,R3] = rectPoints;
      const ang = angle(R1,R2);
      const dx = R3.x-R1.x, dy = R3.y-R1.y;
      rect = {
        x:R1.x,
        y:R1.y,
        w:dx*Math.cos(-ang)-dy*Math.sin(-ang),
        h:dx*Math.sin(-ang)+dy*Math.cos(-ang),
        angle:ang
      };
    }
    return;
  }

  // role picking
  if(!pivot){
    pivot = nearestPoint(m);
    return;
  }
  if(!startRef){
    startRef = nearestPoint(m);
    return;
  }
  if(!endRef){
    endRef = { ...m }; // anywhere
  }
});

function nearestPoint(m){
  let pts=[];
  BASE_SCISSOR.forEach(l=>pts.push(l.a,l.b));
  pts.sort((a,b)=>dist(a,m)-dist(b,m));
  return { ...pts[0] };
}

/* ================= UI ================= */
rectBtn.onclick=()=>{
  rectPoints=[]; rect=null;
  pivot=startRef=endRef=null;
  animating=false;
};

moveBtn.onclick=()=>{
  pivot=startRef=endRef=null;
};

animBtn.onclick=()=>{
  if(pivot && startRef && endRef){
    animating=true;
  }
};

dirBtn.onclick=()=>{
  rotationDir*=-1;
  dirBtn.textContent="Dir: "+(rotationDir===1?"CW":"CCW");
};

resetBtn.onclick=()=>{
  scissor = structuredClone(BASE_SCISSOR);
  rectPoints=[]; rect=null;
  pivot=startRef=endRef=null;
  animating=false;
  t=0; timeDir=1;
};
</script>

</body>
</html>
