<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scissor Animation – Point Driven</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#bbb; font-family:sans-serif; }
canvas { display:block; margin:auto; background:#eee; touch-action:none; }
.controls {
  text-align:center; padding:8px; background:#ddd;
}
button { margin:4px; padding:6px 12px; }
</style>
</head>
<body>

<div class="controls">
  <button id="drawRect">Draw Rect</button>
  <button id="dir">Direction: CW</button>
  <button id="play">Play</button>
</div>

<canvas id="c" width="360" height="260"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

// ---------- STATE ----------
let mode = "idle";
let rotationDir = 1; // 1 = CW, -1 = CCW
let animating = false;
let t = 0;

// ---------- DEFAULT OPEN SCISSOR ----------
let rect = { x:80, y:40, w:200, h:150, angle:0 };

let pivot = { x:200, y:130 };
let start = { x:120, y:170 };
let end   = { x:140, y:80 };

const bladeLen = 150;
const bottomOffset = -0.7;

// ---------- MATH ----------
const TAU = Math.PI * 2;
const norm = a => (a % TAU + TAU) % TAU;

function lerpAngle(a0,a1,t,dir){
  a0=norm(a0); a1=norm(a1);
  let d=a1-a0;
  if(dir===1 && d<0) d+=TAU;
  if(dir===-1 && d>0) d-=TAU;
  return a0+d*t;
}

const angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);

// ---------- DRAW ----------
function drawBlade(a){
  ctx.lineWidth=6;
  ctx.strokeStyle="#111";
  ctx.beginPath();
  ctx.moveTo(pivot.x,pivot.y);
  ctx.lineTo(pivot.x+Math.cos(a)*bladeLen,pivot.y+Math.sin(a)*bladeLen);
  ctx.stroke();
}

function drawPoint(p,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(p.x,p.y,6,0,TAU);
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  // rectangle
  ctx.save();
  ctx.translate(rect.x,rect.y);
  ctx.rotate(rect.angle);
  ctx.fillStyle="rgba(80,130,255,0.6)";
  ctx.fillRect(0,0,rect.w,rect.h);
  ctx.restore();

  // angles
  const a0=angle(pivot,start);
  const a1=angle(pivot,end);
  const a=animating?lerpAngle(a0,a1,t,rotationDir):a0;

  // blades
  drawBlade(a0+bottomOffset);
  drawBlade(a);

  // points
  drawPoint(pivot,"red");
  drawPoint(start,"yellow");
  drawPoint(end,"lime");
}

// ---------- ANIMATION ----------
function animate(){
  if(animating){
    t+=0.02;
    if(t>=1){ animating=false; }
  }
  draw();
  requestAnimationFrame(animate);
}
animate();

// ---------- INPUT ----------
function pos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}

let p1=null,p2=null;

c.addEventListener("pointerdown",e=>{
  if(mode==="draw"){
    if(!p1) p1=pos(e);
    else p2=pos(e);
  }
});

c.addEventListener("pointermove",e=>{
  if(mode==="draw" && p1){
    const m=pos(e);
    const ang=p2?Math.atan2(p2.y-p1.y,p2.x-p1.x):0;
    rect={x:p1.x,y:p1.y,w:m.x-p1.x,h:m.y-p1.y,angle:ang};
  }
});

c.addEventListener("pointerup",()=>{
  if(mode==="draw" && p1 && p2){
    mode="idle"; p1=p2=null;
  }
});

// ---------- UI ----------
drawRect.onclick=()=>{ mode="draw"; p1=p2=null; };
dir.onclick=()=>{
  rotationDir*=-1;
  dir.textContent="Direction: "+(rotationDir===1?"CW":"CCW");
};
play.onclick=()=>{
  t=0; animating=true;
};
</script>

</body>
</html>
