<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>anim1 – Point Driven Scissor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#bbb; font-family:sans-serif; }
canvas { display:block; margin:auto; background:#eee; touch-action:none; }
.controls {
  text-align:center;
  padding:8px;
  background:#ddd;
}
button { margin:4px; padding:6px 12px; }
</style>
</head>
<body>

<div class="controls">
  <button id="drawRect">Draw Rect</button>
  <button id="play">Play</button>
  <button id="dir">Direction: CW</button>
  <button id="reset">Start Over</button>
</div>

<canvas id="c" width="360" height="260"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

const TAU = Math.PI * 2;

// ---------- INITIAL SCISSOR (STATIC DRAWING) ----------
const scissor = {
  pivot: { x: 190, y: 130 },
  blades: [
    { to: { x: 300, y: 90 } },   // top blade
    { to: { x: 80,  y: 170 } }   // bottom blade
  ]
};

// Original copy for reset
const original = JSON.parse(JSON.stringify(scissor));

// ---------- STATE ----------
let rect = null;
let rectStart = null;
let mode = "idle"; // idle | drawRect | select
let rotationDir = 1;
let animating = false;
let t = 0;

// Selected points
let selPivot = false;
let selStart = false;
let selEnd   = false;

// Start / end angle refs
let startAngle = 0;
let endAngle   = 0;

// ---------- UTILS ----------
function pos(e){
  const r = c.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

function dist(a,b){
  return Math.hypot(a.x-b.x, a.y-b.y);
}

function insideRect(p,r){
  return (
    p.x >= r.x &&
    p.x <= r.x + r.w &&
    p.y >= r.y &&
    p.y <= r.y + r.h
  );
}

function normalize(a){
  return (a % TAU + TAU) % TAU;
}

function lerpAngle(a0,a1,t,dir){
  a0=normalize(a0); a1=normalize(a1);
  let d=a1-a0;
  if(dir===1 && d<0) d+=TAU;
  if(dir===-1 && d>0) d-=TAU;
  return a0 + d*t;
}

function rotatePoint(p,pivot,a){
  const dx=p.x-pivot.x;
  const dy=p.y-pivot.y;
  return {
    x: pivot.x + dx*Math.cos(a) - dy*Math.sin(a),
    y: pivot.y + dx*Math.sin(a) + dy*Math.cos(a)
  };
}

// ---------- DRAW ----------
function drawPoint(p,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(p.x,p.y,6,0,TAU);
  ctx.fill();
}

function drawBlade(from,to,col="#111"){
  ctx.lineWidth=6;
  ctx.strokeStyle=col;
  ctx.beginPath();
  ctx.moveTo(from.x,from.y);
  ctx.lineTo(to.x,to.y);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  // rectangle
  if(rect){
    ctx.fillStyle="rgba(80,130,255,0.5)";
    ctx.fillRect(rect.x,rect.y,rect.w,rect.h);
  }

  // blades
  drawBlade(scissor.pivot, scissor.blades[1].to);
  drawBlade(scissor.pivot, scissor.blades[0].to);

  // highlights
  drawPoint(scissor.pivot, selPivot?"red":"#900");
  drawPoint(scissor.blades[0].to, selStart?"yellow":"#aa0");
  drawPoint(scissor.blades[1].to, selEnd?"lime":"#0a0");
}

// ---------- ANIMATION ----------
function animate(){
  if(animating){
    t += 0.03;
    if(t>=1){ animating=false; }

    const a = lerpAngle(startAngle,endAngle,t,rotationDir);

    const orig = original.blades[0].to;
    if(insideRect(orig,rect)){
      scissor.blades[0].to = rotatePoint(orig, scissor.pivot, a);
    }
  }

  draw();
  requestAnimationFrame(animate);
}
animate();

// ---------- INPUT ----------
c.addEventListener("pointerdown",e=>{
  const m=pos(e);

  if(mode==="drawRect"){
    rectStart=m;
    rect={x:m.x,y:m.y,w:0,h:0};
    return;
  }

  // Selection phase
  if(rect){
    if(dist(m,scissor.pivot)<12){
      selPivot=true;
    } else if(dist(m,scissor.blades[0].to)<12){
      selStart=true;
      startAngle=Math.atan2(
        scissor.blades[0].to.y-scissor.pivot.y,
        scissor.blades[0].to.x-scissor.pivot.x
      );
    } else if(dist(m,scissor.blades[1].to)<12){
      selEnd=true;
      endAngle=Math.atan2(
        scissor.blades[1].to.y-scissor.pivot.y,
        scissor.blades[1].to.x-scissor.pivot.x
      );
    }
  }
});

c.addEventListener("pointermove",e=>{
  if(rectStart){
    const m=pos(e);
    rect.w=m.x-rectStart.x;
    rect.h=m.y-rectStart.y;
  }
});

c.addEventListener("pointerup",()=>{
  rectStart=null;
});

// ---------- UI ----------
drawRect.onclick=()=>{ mode="drawRect"; rect=null; };
play.onclick=()=>{
  if(selStart && selEnd){
    t=0; animating=true;
  }
};
dir.onclick=()=>{
  rotationDir*=-1;
  dir.textContent="Direction: "+(rotationDir===1?"CW":"CCW");
};
reset.onclick=()=>{
  Object.assign(scissor,JSON.parse(JSON.stringify(original)));
  rect=null;
  selPivot=selStart=selEnd=false;
  animating=false;
  t=0;
};
</script>

</body>
</html>
