<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>anim1 – Professional Scissor Animation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: #c0c0c0;
  font-family: sans-serif;
}
canvas {
  display: block;
  margin: auto;
  background: #f5f5f5;
  touch-action: none;
}
.controls {
  text-align: center;
  padding: 8px;
  background: #ddd;
}
button {
  margin: 4px;
  padding: 6px 12px;
}
</style>
</head>
<body>

<div class="controls">
  <button id="rectBtn">1. Draw Rect</button>
  <button id="moveBtn">2. Movement</button>
  <button id="animBtn">Anim</button>
  <button id="dirBtn">Dir: CW</button>
  <button id="resetBtn">Reset</button>
</div>

<canvas id="c" width="400" height="260"></canvas>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const TAU = Math.PI * 2;

/* ================= STATIC SCISSOR ================= */
// V-shaped, non-degenerate
const baseScissor = [
  { a:{x:200,y:130}, b:{x:320,y:90} },
  { a:{x:200,y:130}, b:{x:80,y:170} }
];
let scissor = structuredClone(baseScissor);

/* ================= STATE ================= */
const State = { IDLE:0, RECT:1, MOVE:2 };
let state = State.IDLE;

/* Rectangle (4-point model) */
let rectPts = [];
let rect = null;

/* Motion roles */
let pivot = null;
let startRef = null;
let endRef = null;

/* Animation */
let animating = false;
let t = 0;
let timeDir = 1;       // reflection (open / close)
let rotationDir = 1;   // CW / CCW

/* ================= MATH ================= */
function pos(e){
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x:p.clientX - r.left, y:p.clientY - r.top };
}
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function angle(a,b){ return Math.atan2(b.y-a.y, b.x-a.x); }
function norm(a){ return (a % TAU + TAU) % TAU; }

function lerpAngle(a0,a1,t,dir){
  a0 = norm(a0); a1 = norm(a1);
  let d = a1 - a0;
  if(dir===1 && d<0) d+=TAU;
  if(dir===-1 && d>0) d-=TAU;
  return a0 + d*t;
}

function rotate(p,c,a){
  const dx=p.x-c.x, dy=p.y-c.y;
  return {
    x: c.x + dx*Math.cos(a) - dy*Math.sin(a),
    y: c.y + dx*Math.sin(a) + dy*Math.cos(a)
  };
}

function insideRect(p,r){
  const dx=p.x-r.x, dy=p.y-r.y;
  const lx=dx*Math.cos(-r.angle)-dy*Math.sin(-r.angle);
  const ly=dx*Math.sin(-r.angle)+dy*Math.cos(-r.angle);
  return lx>=0 && lx<=r.w && ly>=0 && ly<=r.h;
}

/* ================= DRAW ================= */
function dot(p,col,r=5){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,TAU);
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Rectangle (only after 4th click)
  if(rect){
    ctx.save();
    ctx.translate(rect.x,rect.y);
    ctx.rotate(rect.angle);
    ctx.fillStyle="rgba(80,130,255,0.45)";
    ctx.fillRect(0,0,rect.w,rect.h);
    ctx.restore();
  }

  // Scissor
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#111";
  scissor.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.a.x,l.a.y);
    ctx.lineTo(l.b.x,l.b.y);
    ctx.stroke();
  });

  // Role markers
  if(pivot) dot(pivot,"red");
  if(startRef) dot(startRef,"yellow");
  if(endRef) dot(endRef,"lime");

  // Rect click points preview
  ctx.fillStyle="#333";
  rectPts.forEach(p=>dot(p,"#333",4));
}

/* ================= LOOP ================= */
function loop(){
  if(animating && rect && pivot && startRef && endRef){
    t += 0.02 * timeDir;

    if(t >= 1){ t = 1; timeDir = -1; }
    if(t <= 0){ t = 0; timeDir = 1; }

    const startAngle = angle(pivot, startRef);
    const endAngle   = angle(pivot, endRef);

    const curAngle =
      lerpAngle(startAngle, endAngle, t, rotationDir);

    const delta = curAngle - startAngle;

    scissor = structuredClone(baseScissor);
    scissor.forEach(seg=>{
      if(insideRect(seg.b, rect)){
        seg.b = rotate(seg.b, pivot, delta);
      }
    });
  }

  draw();
  requestAnimationFrame(loop);
}
loop();

/* ================= INPUT ================= */
canvas.addEventListener("pointerdown",e=>{
  const m = pos(e);

  // Rectangle mode
  if(state === State.RECT){
    rectPts.push(m);
    if(rectPts.length === 4){
      const [R1,R2,R3] = rectPts;
      const ang = angle(R1,R2);
      const dx = R3.x-R1.x, dy = R3.y-R1.y;
      rect = {
        x:R1.x,
        y:R1.y,
        w:dx*Math.cos(-ang)-dy*Math.sin(-ang),
        h:dx*Math.sin(-ang)+dy*Math.cos(-ang),
        angle:ang
      };
      state = State.IDLE;
    }
    return;
  }

  // Movement mode
  if(state === State.MOVE){
    if(!pivot){
      pivot = nearestPoint(m);
      return;
    }
    if(!startRef){
      startRef = nearestPoint(m);
      return;
    }
    if(!endRef && rect && insideRect(m,rect)){
      endRef = { ...m };
    }
  }
});

function nearestPoint(m){
  let pts=[];
  baseScissor.forEach(l=>pts.push(l.a,l.b));
  pts.sort((a,b)=>dist(a,m)-dist(b,m));
  return { ...pts[0] };
}

/* ================= UI ================= */
rectBtn.onclick=()=>{
  rectPts=[]; rect=null;
  pivot=startRef=endRef=null;
  animating=false;
  state=State.RECT;
};

moveBtn.onclick=()=>{
  pivot=startRef=endRef=null;
  animating=false;
  state=State.MOVE;
};

animBtn.onclick=()=>{
  if(rect && pivot && startRef && endRef){
    t=0;
    timeDir=1;
    animating=true;
  }
};

dirBtn.onclick=()=>{
  rotationDir*=-1;
  dirBtn.textContent="Dir: "+(rotationDir===1?"CW":"CCW");
};

resetBtn.onclick=()=>{
  scissor = structuredClone(baseScissor);
  rectPts=[]; rect=null;
  pivot=startRef=endRef=null;
  animating=false;
  state=State.IDLE;
};
</script>

</body>
</html>
