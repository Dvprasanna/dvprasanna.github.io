<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Touch Hype Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body { margin:0; overflow:hidden; background:#000; touch-action: none; }
  canvas { display:block; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const words = ["WOW","NICE","GREAT","AWESOME","EPIC","COOL","PERFECT","INSANE","LEGENDS","FIRE","LIT","DOPE","CRAZY","WILD","AMAZING","BRILLIANT","FANTASTIC","YES!","BOOM","SLAY","KING","QUEEN","GOD TIER"];

const fonts = ["Impact","Arial Black","Bebas Neue","Oswald","Montserrat","Roboto","Pacifico","Lobster","Comic Sans MS","Courier New","Georgia","Verdana","Trebuchet MS"];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Load Google Fonts
document.head.insertAdjacentHTML('beforeend', 
  '<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=Lobster&family=Oswald&family=Montserrat&family=Roboto&display=swap" rel="stylesheet">'
);

function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }

let items = [];

function spawn(x, y) {
  const size = rand(60, 220);
  const item = {
    x, y,
    text: words[randInt(0, words.length-1)],
    size,
    font: `${randInt(700,900)} ${size}px ${fonts[randInt(0, fonts.length-1)]}`,
    color: hsl(randInt(0,360), randInt(80,100), randInt(50,80)),
    bgColor: hsl(randInt(0,360), randInt(60,90), randInt(30,60)),
    rotation: rand(-0.6, 0.6),
    shape: ['circle','rect','triangle','star'][randInt(0,3)],
    alpha: 1,
    scale: 0.1,
    targetScale: 1,
    life: 180  // ~3 seconds at 60fps
  };
  items.push(item);
}

function drawShape(item) {
  ctx.save();
  ctx.translate(item.x, item.y);
  ctx.rotate(item.rotation);
  ctx.globalAlpha = item.alpha * 0.6;
  ctx.fillStyle = item.bgColor;

  const s = item.scale;
  switch(item.shape) {
    case 'circle':
      ctx.beginPath();
      ctx.arc(0, 0, item.size * 0.9 * s, 0, Math.PI*2);
      ctx.fill();
      break;
    case 'rect':
      ctx.fillRect(-item.size*1.1*s, -item.size*0.7*s, item.size*2.2*s, item.size*1.4*s);
      break;
    case 'triangle':
      ctx.beginPath();
      ctx.moveTo(0, -item.size*s);
      ctx.lineTo(-item.size*0.95*s, item.size*0.9*s);
      ctx.lineTo(item.size*0.95*s, item.size*0.9*s);
      ctx.closePath();
      ctx.fill();
      break;
    case 'star':
      const spikes = 5;
      const outer = item.size * s;
      const inner = item.size * s * 0.5;
      ctx.beginPath();
      for (let i = 0; i < spikes*2; i++) {
        const r = i % 2 === 0 ? outer : inner;
        const a = i * Math.PI / spikes - Math.PI/2;
        ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fill();
      break;
  }
  ctx.restore();
}

function draw() {
  // Gentle fade trail
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for (let i = items.length-1; i >= 0; i--) {
    const t = items[i];

    // Pop-in animation
    t.scale += (t.targetScale - t.scale) * 0.15;

    // Draw shape + text
    drawShape(t);

    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rotation);
    ctx.globalAlpha = t.alpha;
    ctx.fillStyle = t.color;
    ctx.font = t.font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.scale(t.scale, t.scale);
    ctx.fillText(t.text, 0, 0);
    ctx.restore();

    // Fade out near end
    if (t.life < 60) t.alpha = t.life / 60;

    t.life--;
    if (t.life <= 0) items.splice(i,1);
  }

  requestAnimationFrame(draw);
}
draw();

// Touch / Click handler
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    spawn(touch.clientX, touch.clientY);
  }
});

canvas.addEventListener('mousedown', e => {
  spawn(e.clientX, e.clientY);
});
</script>

</body>
</html>
