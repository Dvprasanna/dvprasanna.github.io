<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rect → Ellipse Mask Editor (v2.0)</title>

<style>
  body {
    margin: 0;
    background: #000;
  }
  canvas {
    display: block;
    background: #000;
    touch-action: none;
  }
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
/* =========================
   SETUP
========================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);

const BG = "#000";
const SHAPE_COLOR = "#00ffcc";
const MASK_VISIBLE = "#666";
const HANDLE_VISIBLE = "#fff";

const HANDLE = 8;
const DRAG_THRESHOLD = 6;

const shapes = [];

let pointerDown = false;
let startPoint = null;
let pendingCreate = false;

let current = null;
let selected = null;
let activeMask = null;
let activeHandle = null;
let offset = { x: 0, y: 0 };

/* =========================
   SHAPE FACTORY
========================= */
function createShape(x, y) {
  return {
    rect: { x, y, w: 0, h: 0 },
    ellipse: null,
    mask: { x, y, w: 0, h: 0 },
    mode: "rect"
  };
}

/* =========================
   EVENTS
========================= */
canvas.addEventListener("pointerdown", e => {
  const p = pos(e);

  pointerDown = true;
  startPoint = p;
  pendingCreate = true;

  current = null;
  activeMask = null;
  activeHandle = null;
  selected = null;

  // hit test (topmost first)
  for (let i = shapes.length - 1; i >= 0; i--) {
    const s = shapes[i];

    const h = hitHandle(p, s.mask);
    if (h !== null) {
      selected = s;
      activeMask = s;
      activeHandle = h;
      pendingCreate = false;
      return;
    }

    if (inside(p, s.mask)) {
      selected = s;
      activeMask = s;
      offset.x = p.x - s.mask.x;
      offset.y = p.y - s.mask.y;
      pendingCreate = false;
      return;
    }

    if (inside(p, s.rect)) {
      selected = s;
      pendingCreate = false;
      return;
    }
  }
  // blank click → deselect only
});
