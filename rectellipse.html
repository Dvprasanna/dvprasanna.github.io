<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rect → Ellipse with Mask (v1.1)</title>

<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: system-ui, sans-serif;
  }
  canvas {
    display: block;
    background: #000;
    touch-action: none;
  }
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);

const shapes = [];
let current = null;
let selected = null;
let resizingMask = false;

/* ============================
   SHAPE
============================ */
function createShape(x, y) {
  return {
    rect: { x, y, w: 0, h: 0 },
    ellipse: null,
    mask: { x, y, w: 0, h: 0 },
    mode: "rect"
  };
}

/* ============================
   EVENTS
============================ */
canvas.addEventListener("pointerdown", e => {
  const p = pos(e);

  selected = null;
  resizingMask = false;

  // check mask handle first
  for (let s of shapes) {
    if (onMaskHandle(p, s)) {
      selected = s;
      resizingMask = true;
      return;
    }
    if (insideRect(p.x, p.y, s.rect)) {
      selected = s;
      return;
    }
  }

  // draw new rect
  current = createShape(p.x, p.y);
  shapes.push(current);
});

canvas.addEventListener("pointermove", e => {
  const p = pos(e);

  if (current) {
    current.rect.w = p.x - current.rect.x;
    current.rect.h = p.y - current.rect.y;
    current.mask.w = current.rect.w;
    current.mask.h = current.rect.h;
  }

  if (resizingMask && selected) {
    selected.mask.w = p.x - selected.mask.x;
    selected.mask.h = p.y - selected.mask.y;
  }
});

canvas.addEventListener("pointerup", () => {
  current = null;
  resizingMask = false;
});

canvas.addEventListener("dblclick", e => {
  const p = pos(e);
  shapes.forEach(s => {
    if (insideRect(p.x, p.y, s.rect)) {
      convertToEllipse(s);
    }
  });
});

/* ============================
   LOGIC
============================ */
function convertToEllipse(s) {
  const r = s.rect;
  s.ellipse = {
    cx: r.x + r.w / 2,
    cy: r.y + r.h / 2,
    rx: Math.abs(r.w / 2),
    ry: Math.abs(r.h / 2)
  };
  s.mask = { ...r };
  s.mode = "ellipse";
}

/* ============================
   DRAW LOOP
============================ */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  shapes.forEach(s => {
    ctx.save();

    // mask
    ctx.beginPath();
    ctx.rect(s.mask.x, s.mask.y, s.mask.w, s.mask.h);
    ctx.clip();

    // rectangle
    ctx.strokeStyle = "#444";
    ctx.strokeRect(s.rect.x, s.rect.y, s.rect.w, s.rect.h);

    // ellipse
    if (s.mode === "ellipse") {
      ctx.beginPath();
      ctx.ellipse(
        s.ellipse.cx,
        s.ellipse.cy,
        s.ellipse.rx,
        s.ellipse.ry,
        0, 0, Math.PI * 2
      );
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.restore();

    // mask handle
    drawHandle(s);
  });

  requestAnimationFrame(draw);
}
draw();

/* ============================
   HELPERS
============================ */
function drawHandle(s) {
  const size = 8;
  ctx.fillStyle = "#ff0";
  ctx.fillRect(
    s.mask.x + s.mask.w - size,
    s.mask.y + s.mask.h - size,
    size, size
  );
}

function onMaskHandle(p, s) {
  const size = 8;
  return (
    p.x >= s.mask.x + s.mask.w - size &&
    p.x <= s.mask.x + s.mask.w &&
    p.y >= s.mask.y + s.mask.h - size &&
    p.y <= s.mask.y + s.mask.h
  );
}

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function insideRect(x, y, r) {
  return (
    x >= r.x &&
    x <= r.x + r.w &&
    y >= r.y &&
    y <= r.y + r.h
  );
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
</script>
</body>
</html>
