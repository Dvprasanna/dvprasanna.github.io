<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rect → Ellipse Mask Editor (v1.8)</title>

<style>
  body {
    margin: 0;
    background: #000;
  }
  canvas {
    display: block;
    background: #000;
    touch-action: none;
  }
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
/* =========================
   SETUP
========================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);

const BG = "#000";
const SHAPE_COLOR = "#00ffcc";
const MASK_VISIBLE = "#666";
const HANDLE_VISIBLE = "#fff";

const HANDLE = 8;
const DRAG_THRESHOLD = 4;

const shapes = [];

let current = null;
let selected = null;
let activeMask = null;
let activeHandle = null;
let dragStart = null;
let offset = { x: 0, y: 0 };

/* =========================
   SHAPE FACTORY
========================= */
function createShape(x, y) {
  return {
    rect: { x, y, w: 0, h: 0 },
    ellipse: null,
    mask: { x, y, w: 0, h: 0 },
    mode: "rect"
  };
}

/* =========================
   EVENTS
========================= */
canvas.addEventListener("pointerdown", e => {
  const p = pos(e);

  selected = null;
  activeMask = null;
  activeHandle = null;
  current = null;
  dragStart = p;

  for (let i = shapes.length - 1; i >= 0; i--) {
    const s = shapes[i];

    const h = hitHandle(p, s.mask);
    if (h !== null) {
      selected = s;
      activeMask = s;
      activeHandle = h;
      return;
    }

    if (inside(p, s.mask)) {
      selected = s;
      activeMask = s;
      offset.x = p.x - s.mask.x;
      offset.y = p.y - s.mask.y;
      return;
    }

    if (inside(p, s.rect)) {
      selected = s;
      return;
    }
  }
});

canvas.addEventListener("pointermove", e => {
  const p = pos(e);

  if (!current && dragStart) {
    const dx = p.x - dragStart.x;
    const dy = p.y - dragStart.y;
    if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
      current = createShape(dragStart.x, dragStart.y);
      shapes.push(current);
      selected = current;
    }
  }

  if (current) {
    current.rect.w = p.x - current.rect.x;
    current.rect.h = p.y - current.rect.y;
    current.mask.w = current.rect.w;
    current.mask.h = current.rect.h;
  }

  if (activeMask && activeHandle !== null) {
    resizeMask(activeMask.mask, p, activeHandle);
  }

  if (activeMask && activeHandle === null) {
    activeMask.mask.x = p.x - offset.x;
    activeMask.mask.y = p.y - offset.y;
  }
});

canvas.addEventListener("pointerup", () => {
  current = null;
  activeMask = null;
  activeHandle = null;
  dragStart = null;
});

canvas.addEventListener("dblclick", e => {
  const p = pos(e);
  shapes.forEach(s => {
    if (inside(p, s.rect)) {
      convertToEllipse(s);
      selected = s;
    }
  });
});

/* =========================
   LOGIC
========================= */
function convertToEllipse(s) {
  const r = s.rect;
  s.ellipse = {
    cx: r.x + r.w / 2,
    cy: r.y + r.h / 2,
    rx: Math.abs(r.w / 2),
    ry: Math.abs(r.h / 2)
  };
  s.mask = { ...r };
  s.mode = "ellipse";
}

/* =========================
   DRAW LOOP
========================= */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  shapes.forEach(s => {
    ctx.save();

    // clipping mask (always active)
    ctx.beginPath();
    ctx.rect(s.mask.x, s.mask.y, s.mask.w, s.mask.h);
    ctx.clip();

    // rectangle
    ctx.strokeStyle = SHAPE_COLOR;
    ctx.lineWidth = 1;
    ctx.strokeRect(s.rect.x, s.rect.y, s.rect.w, s.rect.h);

    // ellipse
    if (s.mode === "ellipse") {
      ctx.beginPath();
      ctx.ellipse(
        s.ellipse.cx,
        s.ellipse.cy,
        s.ellipse.rx,
        s.ellipse.ry,
        0, 0, Math.PI * 2
      );
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.restore();

    // === VISUAL HACK ===
    const maskColor = (s === selected) ? MASK_VISIBLE : BG;
    const handleColor = (s === selected) ? HANDLE_VISIBLE : BG;

    // mask border
    ctx.strokeStyle = maskColor;
    ctx.lineWidth = 1;
    ctx.strokeRect(s.mask.x, s.mask.y, s.mask.w, s.mask.h);

    // handles
    drawHandles(s.mask, handleColor);
  });

  requestAnimationFrame(draw);
}
draw();

/* =========================
   HANDLES
========================= */
function drawHandles(m, color) {
  ctx.fillStyle = color;
  handlePoints(m).forEach(p => {
    ctx.fillRect(
      p.x - HANDLE / 2,
      p.y - HANDLE / 2,
      HANDLE,
      HANDLE
    );
  });
}

function handlePoints(m) {
  return [
    { x: m.x, y: m.y },
    { x: m.x + m.w, y: m.y },
    { x: m.x + m.w, y: m.y + m.h },
    { x: m.x, y: m.y + m.h }
  ];
}

function hitHandle(p, m) {
  const pts = handlePoints(m);
  for (let i = 0; i < pts.length; i++) {
    if (
      Math.abs(p.x - pts[i].x) <= HANDLE &&
      Math.abs(p.y - pts[i].y) <= HANDLE
    ) return i;
  }
  return null;
}

function resizeMask(m, p, h) {
  if (h === 0) { m.w += m.x - p.x; m.h += m.y - p.y; m.x = p.x; m.y = p.y; }
  if (h === 1) { m.w = p.x - m.x; m.h += m.y - p.y; m.y = p.y; }
  if (h === 2) { m.w = p.x - m.x; m.h = p.y - m.y; }
  if (h === 3) { m.w += m.x - p.x; m.x = p.x; m.h = p.y - m.y; }
}

/* =========================
   UTILS
========================= */
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function inside(p, r) {
  return (
    p.x >= r.x &&
    p.x <= r.x + r.w &&
    p.y >= r.y &&
    p.y <= r.y + r.h
  );
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
</script>
</body>
</html>
