<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rect → Ellipse Clipping Mask (v1.4)</title>

<style>
  body {
    margin: 0;
    background: #000;
  }
  canvas {
    display: block;
    background: #000;
    touch-action: none;
  }
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);

const COLOR = "#00ffcc";

const shapes = [];
let current = null;
let activeMask = null;
let maskOffset = { x: 0, y: 0 };

/* ============================
   SHAPE MODEL
============================ */
function createShape(x, y) {
  return {
    rect: { x, y, w: 0, h: 0 },
    ellipse: null,
    mask: { x, y, w: 0, h: 0 },
    mode: "rect"
  };
}

/* ============================
   EVENTS
============================ */
canvas.addEventListener("pointerdown", e => {
  const p = pos(e);

  // check mask hit first (top-most priority)
  for (let i = shapes.length - 1; i >= 0; i--) {
    const s = shapes[i];
    if (insideRect(p.x, p.y, s.mask)) {
      activeMask = s;
      maskOffset.x = p.x - s.mask.x;
      maskOffset.y = p.y - s.mask.y;
      return;
    }
  }

  // otherwise start new rectangle
  current = createShape(p.x, p.y);
  shapes.push(current);
});

canvas.addEventListener("pointermove", e => {
  const p = pos(e);

  if (current) {
    current.rect.w = p.x - current.rect.x;
    current.rect.h = p.y - current.rect.y;
    current.mask.w = current.rect.w;
    current.mask.h = current.rect.h;
  }

  if (activeMask) {
    activeMask.mask.x = p.x - maskOffset.x;
    activeMask.mask.y = p.y - maskOffset.y;
  }
});

canvas.addEventListener("pointerup", () => {
  current = null;
  activeMask = null;
});

canvas.addEventListener("dblclick", e => {
  const p = pos(e);
  shapes.forEach(s => {
    if (insideRect(p.x, p.y, s.rect)) {
      convertToEllipse(s);
    }
  });
});

/* ============================
   LOGIC
============================ */
function convertToEllipse(s) {
  const r = s.rect;
  s.ellipse = {
    cx: r.x + r.w / 2,
    cy: r.y + r.h / 2,
    rx: Math.abs(r.w / 2),
    ry: Math.abs(r.h / 2)
  };
  s.mask = { ...r };
  s.mode = "ellipse";
}

/* ============================
   DRAW LOOP
============================ */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  shapes.forEach(s => {
    ctx.save();

    // clipping mask
    ctx.beginPath();
    ctx.rect(s.mask.x, s.mask.y, s.mask.w, s.mask.h);
    ctx.clip();

    // rectangle
    ctx.strokeStyle = COLOR;
    ctx.lineWidth = 1;
    ctx.strokeRect(s.rect.x, s.rect.y, s.rect.w, s.rect.h);

    // ellipse
    if (s.mode === "ellipse" && s.ellipse) {
      ctx.beginPath();
      ctx.ellipse(
        s.ellipse.cx,
        s.ellipse.cy,
        s.ellipse.rx,
        s.ellipse.ry,
        0, 0, Math.PI * 2
      );
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.restore();

    // mask outline (visual aid)
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = "#666";
    ctx.strokeRect(s.mask.x, s.mask.y, s.mask.w, s.mask.h);
    ctx.setLineDash([]);
  });

  requestAnimationFrame(draw);
}
draw();

/* ============================
   HELPERS
============================ */
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function insideRect(x, y, r) {
  return (
    x >= r.x &&
    x <= r.x + r.w &&
    y >= r.y &&
    y <= r.y + r.h
  );
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
</script>
</body>
</html>
