<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rect → Ellipse Overlay (v1.2)</title>

<style>
  body {
    margin: 0;
    background: #000; /* black bg */
  }
  canvas {
    display: block;
    background: #000; /* black bg */
    touch-action: none;
  }
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);

const shapes = [];
let current = null;

/* ============================
   SHAPE MODEL
============================ */
function createShape(x, y) {
  return {
    rect: { x, y, w: 0, h: 0 },
    ellipse: null,
    mode: "rect"
  };
}

/* ============================
   EVENTS
============================ */
canvas.addEventListener("pointerdown", e => {
  const p = pos(e);
  current = createShape(p.x, p.y);
  shapes.push(current);
});

canvas.addEventListener("pointermove", e => {
  if (!current) return;
  const p = pos(e);
  current.rect.w = p.x - current.rect.x;
  current.rect.h = p.y - current.rect.y;
});

canvas.addEventListener("pointerup", () => {
  current = null;
});

canvas.addEventListener("dblclick", e => {
  const p = pos(e);
  shapes.forEach(s => {
    if (insideRect(p.x, p.y, s.rect)) {
      convertToEllipse(s);
    }
  });
});

/* ============================
   LOGIC
============================ */
function convertToEllipse(s) {
  const r = s.rect;
  s.ellipse = {
    cx: r.x + r.w / 2,
    cy: r.y + r.h / 2,
    rx: Math.abs(r.w / 2),
    ry: Math.abs(r.h / 2)
  };
  s.mode = "ellipse";
}

/* ============================
   DRAW LOOP
============================ */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  shapes.forEach(s => {

    /* rectangle (base) */
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 1;
    ctx.strokeRect(s.rect.x, s.rect.y, s.rect.w, s.rect.h);

    /* ellipse overlay */
    if (s.mode === "ellipse" && s.ellipse) {
      ctx.beginPath();
      ctx.ellipse(
        s.ellipse.cx,
        s.ellipse.cy,
        s.ellipse.rx,
        s.ellipse.ry,
        0, 0, Math.PI * 2
      );
      ctx.fillStyle = "rgba(0, 255, 200, 0.12)";
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
    }

  });

  requestAnimationFrame(draw);
}
draw();

/* ============================
   HELPERS
============================ */
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function insideRect(x, y, r) {
  return (
    x >= r.x &&
    x <= r.x + r.w &&
    y >= r.y &&
    y <= r.y + r.h
  );
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
</script>
</body>
</html>
