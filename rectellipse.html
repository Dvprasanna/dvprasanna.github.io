<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rect → Ellipse Clipping Mask (v1.6)</title>

<style>
  body {
    margin: 0;
    background: #000;
  }
  canvas {
    display: block;
    background: #000;
    touch-action: none;
  }
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);

const COLOR = "#00ffcc";
const HANDLE_SIZE = 8;

const shapes = [];
let current = null;
let activeMask = null;
let activeHandle = null;
let selectedShape = null;
let offset = { x: 0, y: 0 };

/* ============================
   SHAPE MODEL
============================ */
function createShape(x, y) {
  return {
    rect: { x, y, w: 0, h: 0 },
    ellipse: null,
    mask: { x, y, w: 0, h: 0 },
    mode: "rect"
  };
}

/* ============================
   EVENTS
============================ */
canvas.addEventListener("pointerdown", e => {
  const p = pos(e);

  activeMask = null;
  activeHandle = null;
  selectedShape = null;

  // check handles & mask first
  for (let i = shapes.length - 1; i >= 0; i--) {
    const s = shapes[i];
    const h = hitHandle(p, s.mask);
    if (h !== null) {
      selectedShape = s;
      activeMask = s;
      activeHandle = h;
      return;
    }
    if (insideRect(p.x, p.y, s.mask)) {
      selectedShape = s;
      activeMask = s;
      offset.x = p.x - s.mask.x;
      offset.y = p.y - s.mask.y;
      return;
    }
    if (insideRect(p.x, p.y, s.rect)) {
      selectedShape = s;
      return;
    }
  }

  // blank space → draw new rect
  current = createShape(p.x, p.y);
  shapes.push(current);
  selectedShape = current;
});

canvas.addEventListener("pointermove", e => {
  const p = pos(e);

  if (current) {
    current.rect.w = p.x - current.rect.x;
    current.rect.h = p.y - current.rect.y;
    current.mask.w = current.rect.w;
    current.mask.h = current.rect.h;
  }

  if (activeMask && activeHandle !== null) {
    resizeMask(activeMask.mask, p, activeHandle);
  }

  if (activeMask && activeHandle === null) {
    activeMask.mask.x = p.x - offset.x;
    activeMask.mask.y = p.y - offset.y;
  }
});

canvas.addEventListener("pointerup", () => {
  current = null;
  activeMask = null;
  activeHandle = null;
});

canvas.addEventListener("dblclick", e => {
  const p = pos(e);
  shapes.forEach(s => {
    if (insideRect(p.x, p.y, s.rect)) {
      convertToEllipse(s);
      selectedShape = s;
    }
  });
});

/* ============================
   LOGIC
============================ */
function convertToEllipse(s) {
  const r = s.rect;
  s.ellipse = {
    cx: r.x + r.w / 2,
    cy: r.y + r.h / 2,
    rx: Math.abs(r.w / 2),
    ry: Math.abs(r.h / 2)
  };
  s.mask = { ...r };
  s.mode = "ellipse";
}

/* ============================
   DRAW LOOP
============================ */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  shapes.forEach(s => {
    ctx.save();

    // clipping mask (always active)
    ctx.beginPath();
    ctx.rect(s.mask.x, s.mask.y, s.mask.w, s.mask.h);
    ctx.clip();

    // rectangle
    ctx.strokeStyle = COLOR;
    ctx.lineWidth = 1;
    ctx.strokeRect(s.rect.x, s.rect.y, s.rect.w, s.rect.h);

    // ellipse
    if (s.mode === "ellipse") {
      ctx.beginPath();
      ctx.ellipse(
        s.ellipse.cx,
        s.ellipse.cy,
        s.ellipse.rx,
        s.ellipse.ry,
        0, 0, Math.PI * 2
      );
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.restore();

    // mask UI only if selected
    if (s === selectedShape) {
      ctx.strokeStyle = "#666";
      ctx.lineWidth = 1;
      ctx.strokeRect(s.mask.x, s.mask.y, s.mask.w, s.mask.h);
      drawHandles(s.mask);
    }
  });

  requestAnimationFrame(draw);
}
draw();

/* ============================
   HANDLE HELPERS
============================ */
function drawHandles(m) {
  const pts = handlePoints(m);
  ctx.fillStyle = "#fff";
  pts.forEach(p => {
    ctx.fillRect(
      p.x - HANDLE_SIZE / 2,
      p.y - HANDLE_SIZE / 2,
      HANDLE_SIZE,
      HANDLE_SIZE
    );
  });
}

function handlePoints(m) {
  return [
    { x: m.x, y: m.y },
    { x: m.x + m.w, y: m.y },
    { x: m.x + m.w, y: m.y + m.h },
    { x: m.x, y: m.y + m.h }
  ];
}

function hitHandle(p, m) {
  const pts = handlePoints(m);
  for (let i = 0; i < pts.length; i++) {
    if (
      Math.abs(p.x - pts[i].x) <= HANDLE_SIZE &&
      Math.abs(p.y - pts[i].y) <= HANDLE_SIZE
    ) return i;
  }
  return null;
}

function resizeMask(m, p, h) {
  if (h === 0) { m.w += m.x - p.x; m.h += m.y - p.y; m.x = p.x; m.y = p.y; }
  if (h === 1) { m.w = p.x - m.x; m.h += m.y - p.y; m.y = p.y; }
  if (h === 2) { m.w = p.x - m.x; m.h = p.y - m.y; }
  if (h === 3) { m.w += m.x - p.x; m.x = p.x; m.h = p.y - m.y; }
}

/* ============================
   UTIL
============================ */
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function insideRect(x, y, r) {
  return (
    x >= r.x &&
    x <= r.x + r.w &&
    y >= r.y &&
    y <= r.y + r.h
  );
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
</script>
</body>
</html>
