<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMD Canvas</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
}
#canvas{ display:block; background:#000; }
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  background:#111;
  padding:6px;
  display:flex;
  gap:6px;
}
#cmd{
  flex:1;
  height:80px;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
  resize:none;
}
#run{
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px 10px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <textarea id="cmd" placeholder="type or paste commands"></textarea>
  <button id="run">RUN</button>
</div>

<script>
// 1 state
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let docW=0, docH=0, lastDocH=0;

let local  = {x:0,y:0};
let cursor = {x:0,y:0};

let lines = [];
let cursorStack = [];   // for undo

// 2 resize
function resize(){
  const vh=innerHeight, vw=innerWidth;
  if (Math.abs(vh-lastDocH)<100) return;
  lastDocH=vh;

  docW=vw;
  docH=vh-92;
  canvas.width=docW;
  canvas.height=docH;

  if(local.x===0 && local.y===0){
    local.x=docW/2;
    local.y=docH/2;
  }
  draw();
}
addEventListener("resize",resize);
resize();

// 3 draw
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(0,canvas.height);
  ctx.scale(1,-1);

  // axes
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(docW,0);
  ctx.moveTo(0,0); ctx.lineTo(0,docH);
  ctx.stroke();

  // local origin
  ctx.fillStyle="#ff0";
  ctx.beginPath();
  ctx.arc(local.x,local.y,4,0,Math.PI*2);
  ctx.fill();

  // lines
  ctx.strokeStyle="#fff";
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // cursor
  const cx=local.x+cursor.x;
  const cy=local.y+cursor.y;
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// 4 execute one command
function execCommand(cmd){
  cmd=cmd.trim();
  if(!cmd) return;

  let p=cmd.split(/\s+/);
  let useLocal=false, offset=false;

  if(p[0]==="o"){ offset=true; p.shift(); }
  if(p[0]==="g"){ useLocal=true; p.shift(); }

  // utility
  if(p[0]==="?"){
    alert(`X=${cursor.x} Y=${cursor.y}`);
    return;
  }
  if(p[0]==="undo"){
    if(lines.length){
      lines.pop();
      if(cursorStack.length){
        cursor = cursorStack.pop();
      }
      draw();
    }
    return;
  }
  if(p[0]==="cls"){
    lines=[];
    cursorStack=[];
    draw();
    return;
  }
  if(p[0]==="reset"){
    lines=[];
    cursorStack=[];
    cursor={x:0,y:0};
    local.x=docW/2; local.y=docH/2;
    draw();
    return;
  }

  // move absolute
  if(p[0]==="m" && p.length===3){
    if(useLocal){
      local.x=+p[1]; local.y=+p[2];
      cursor={x:0,y:0};
    }else{
      cursor.x=+p[1]; cursor.y=+p[2];
    }
    draw();
    return;
  }

  // move relative
  if(p[0].startsWith("m")){
    const n=+p[1];
    if(useLocal){
      if(p[0]==="mr") local.x+=n;
      if(p[0]==="ml") local.x-=n;
      if(p[0]==="mu") local.y+=n;
      if(p[0]==="md") local.y-=n;
      cursor={x:0,y:0};
    }else{
      if(p[0]==="mr") cursor.x+=n;
      if(p[0]==="ml") cursor.x-=n;
      if(p[0]==="mu") cursor.y+=n;
      if(p[0]==="md") cursor.y-=n;
    }
    draw();
    return;
  }

  // draw
  const bx=useLocal?local.x:local.x+cursor.x;
  const by=useLocal?local.y:local.y+cursor.y;

  function drawLine(dx,dy){
    if(!useLocal){
      // save cursor for undo
      cursorStack.push({x:cursor.x,y:cursor.y});
    }

    if(offset){
      lines.push({x1:bx-dx,y1:by-dy,x2:bx+dx,y2:by+dy});
    }else{
      lines.push({x1:bx,y1:by,x2:bx+dx,y2:by+dy});
      if(!useLocal){
        cursor.x+=dx;
        cursor.y+=dy;
      }
    }
    draw();
  }

  if(p[0]==="r") return drawLine(+p[1],0);
  if(p[0]==="l") return drawLine(-p[1],0);
  if(p[0]==="u") return drawLine(0,+p[1]);
  if(p[0]==="d") return drawLine(0,-p[1]);
  if(p[0]==="a"){
    const len=+p[1], deg=+p[2];
    const rad=deg*Math.PI/180;
    return drawLine(len*Math.cos(rad),len*Math.sin(rad));
  }

  alert("Unknown command: "+cmd);
}

// 5 batch execution
function execBatch(text){
  const list=text.split(/\n+/)
    .map(l=>l.trim())
    .filter(l=>l && !l.startsWith("//"));
  for(const line of list) execCommand(line);
}

// 6 ui
const input=document.getElementById("cmd");
run.onclick=()=>{
  const text=input.value;
  input.value="";
  input.focus();
  if(text.includes("\n")) execBatch(text);
  else execCommand(text);
};
</script>

</body>
</html>
