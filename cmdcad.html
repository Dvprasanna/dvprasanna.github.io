<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DOS CAD</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  font-family:monospace;
  color:#0f0;
  overflow:hidden;
}
#canvas{
  display:block;
  background:#000;
}
#console{
  position:fixed;
  bottom:0; left:0; right:0;
  background:#111;
}
#out{
  padding:4px 8px;
  font-size:13px;
  border-bottom:1px solid #222;
}
#bar{
  display:flex;
  align-items:center;
  height:44px;
  padding:0 8px;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#btn{
  margin-left:6px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px 10px;
}
#btn:active{
  background:#0f0;
  color:#000;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="console">
  <div id="out">READY</div>
  <form id="bar">
    <span>&gt;</span>
    <input id="cmd" autocomplete="off">
    <button id="btn" type="submit">⏎</button>
  </form>
</div>

<script>
/* ===== CANVAS ===== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight - 88;
  draw();
}
addEventListener("resize",resize);
resize();

/* ===== STATE ===== */
let cursor = {x:0,y:0};
let origin = {x:0,y:0};
let pen = {thk:1,col:"#fff"};
let lines = [];
let undo=[], redo=[];

/* ===== UTILS ===== */
const rad = d => d*Math.PI/180;

function save(){
  undo.push(JSON.stringify({cursor,origin,pen,lines}));
  redo.length=0;
}
function load(s){
  const o=JSON.parse(s);
  cursor=o.cursor; origin=o.origin;
  pen=o.pen; lines=o.lines;
}

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.scale(1,-1);

  // axes
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(-9999,0);ctx.lineTo(9999,0);
  ctx.moveTo(0,-9999);ctx.lineTo(0,9999);
  ctx.stroke();

  // lines
  lines.forEach(l=>{
    ctx.strokeStyle=l.col;
    ctx.lineWidth=l.thk;
    ctx.beginPath();
    ctx.moveTo(origin.x+l.x1,origin.y+l.y1);
    ctx.lineTo(origin.x+l.x2,origin.y+l.y2);
    ctx.stroke();
  });

  // cursor
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(origin.x+cursor.x,origin.y+cursor.y,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ===== OUTPUT ===== */
const out=document.getElementById("out");
function ok(t){ out.textContent="OK: "+t; }
function err(t){ out.textContent="ERR: "+t; }

/* ===== COMMANDS ===== */
function exec(cmd){
  cmd=cmd.trim();
  if(!cmd) return;

  const p=cmd.split(/\s+/);

  try{
    if(cmd=="?"){
      return ok(`X=${cursor.x} Y=${cursor.y}`);
    }

    if(cmd=="cls"){
      cursor={x:0,y:0};
      origin={x:0,y:0};
      lines=[]; undo=[]; redo=[];
      draw(); return ok("cleared");
    }

    if(cmd=="un"){
      if(!undo.length) return err("nothing to undo");
      redo.push(JSON.stringify({cursor,origin,pen,lines}));
      load(undo.pop()); draw(); return ok("undo");
    }

    if(cmd=="re"){
      if(!redo.length) return err("nothing to redo");
      undo.push(JSON.stringify({cursor,origin,pen,lines}));
      load(redo.pop()); draw(); return ok("redo");
    }

    if(p[0]=="origin"){
      save();
      const [x,y]=p[1].split(",").map(Number);
      origin={x,y}; draw(); return ok("origin set");
    }

    if(p[0]=="thk"){
      save(); pen.thk=parseFloat(p[1]); return ok("thickness set");
    }

    if(p[0]=="col"){
      save(); pen.col=p[1]; return ok("color set");
    }

    let moveOnly=false;
    if(p[0]=="m"){ moveOnly=true; p.shift(); }

    if(p[0]=="or"){
      save();
      const [a,n]=p[1].split(",").map(Number);
      const nx=cursor.x+Math.cos(rad(a))*n;
      const ny=cursor.y+Math.sin(rad(a))*n;
      if(!moveOnly)
        lines.push({x1:cursor.x,y1:cursor.y,x2:nx,y2:ny,thk:pen.thk,col:pen.col});
      cursor={x:nx,y:ny};
      draw(); return ok(moveOnly?"moved":"line drawn");
    }

    const dir={r:0,u:90,l:180,d:270};
    if(dir[p[0]]!==undefined){
      save();
      const n=parseFloat(p[1]);
      const a=dir[p[0]];
      const nx=cursor.x+Math.cos(rad(a))*n;
      const ny=cursor.y+Math.sin(rad(a))*n;
      if(!moveOnly)
        lines.push({x1:cursor.x,y1:cursor.y,x2:nx,y2:ny,thk:pen.thk,col:pen.col});
      cursor={x:nx,y:ny};
      draw(); return ok(moveOnly?"moved":"line drawn");
    }

    err("unknown command");
  }catch{
    err("syntax error");
  }
}

/* ===== INPUT ===== */
const form=document.getElementById("bar");
const input=document.getElementById("cmd");
const btn=document.getElementById("btn");

form.onsubmit=e=>{
  e.preventDefault();
  exec(input.value);
  input.value=""; input.focus();
};
btn.onclick=e=>{
  e.preventDefault();
  exec(input.value);
  input.value=""; input.focus();
};

input.focus();
</script>

</body>
</html>
