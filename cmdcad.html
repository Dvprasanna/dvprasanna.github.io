<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CMD Canvas</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
  overflow:hidden;
}
#canvas{
  display:block;
  background:#000;
}
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:56px;
  background:#111;
  display:flex;
  gap:6px;
  padding:6px;
  box-sizing:border-box;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#run{
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px 12px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <input id="cmd" placeholder="r 600">
  <button id="run">RUN</button>
</div>

<script>
/* ================= VIEWPORT (iPhone SAFE) ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function viewportHeight(){
  return window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;
}

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = viewportHeight() - 56;
  draw();
}

window.addEventListener("resize", resize);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", resize);
}
resize();

/* ================= LOGICAL STATE ================= */
const WORLD = { w:600, h:800 };   // logical plot size
let cursor = { x:0, y:0 };
let lines  = [];

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // scale logical world to screen
  const sx = canvas.width  / WORLD.w;
  const sy = canvas.height / WORLD.h;
  const s  = Math.min(sx, sy);

  ctx.save();

  // center world
  ctx.translate(
    (canvas.width  - WORLD.w*s)/2,
    (canvas.height - WORLD.h*s)/2
  );

  // cartesian Y up
  ctx.translate(0, WORLD.h*s);
  ctx.scale(s, -s);

  // border (800x600 reference)
  ctx.strokeStyle="#333";
  ctx.strokeRect(0,0,WORLD.w,WORLD.h);

  // lines
  ctx.strokeStyle="#fff";
  ctx.lineWidth=1/s;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // cursor
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,4/s,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ================= COMMAND EXEC ================= */
function exec(cmd){
  cmd = cmd.trim();
  if(!cmd) return;

  const [c,nStr] = cmd.split(/\s+/);
  const n = Number(nStr);
  if(isNaN(n)) return;

  let nx = cursor.x;
  let ny = cursor.y;

  if(c==="r") nx += n;
  if(c==="l") nx -= n;
  if(c==="u") ny += n;
  if(c==="d") ny -= n;

  lines.push({ x1:cursor.x, y1:cursor.y, x2:nx, y2:ny });
  cursor = { x:nx, y:ny };

  draw();
}

/* ================= UI ================= */
const input = document.getElementById("cmd");
const run   = document.getElementById("run");

function runCmd(){
  exec(input.value);
  input.value="";
  input.focus();
}

run.onclick = runCmd;
input.addEventListener("keydown",e=>{
  if(e.key==="Enter") runCmd();
});

input.focus();
</script>

</body>
</html>
