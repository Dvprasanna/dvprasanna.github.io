<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DOS CAD</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family: monospace;
  overflow:hidden;
}

/* CANVAS */
#canvas{
  display:block;
  background:#000;
}

/* COMMAND AREA */
#console{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  box-sizing:border-box;
}

#output{
  padding:4px 8px;
  font-size:13px;
  color:#0f0;
  border-bottom:1px solid #222;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#bar{
  display:flex;
  align-items:center;
  height:44px;
  padding:0 8px;
}

#prompt{ margin-right:6px; }

#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
  font-family: monospace;
}

#enterBtn{
  margin-left:6px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px 10px;
  font-size:16px;
  font-family: monospace;
}

#enterBtn:active{
  background:#0f0;
  color:#000;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="console">
  <div id="output">READY</div>
  <form id="bar">
    <span id="prompt">&gt;</span>
    <input id="cmd" autocomplete="off" />
    <button id="enterBtn" type="submit">⏎</button>
  </form>
</div>

<script>
/* ================= CANVAS ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 88;
  render();
}
window.addEventListener("resize", resize);
resize();

/* ================= STATE ================= */
let origin={x:0,y:0};
let cursor={x:0,y:0};
let view={zoom:1,panX:0,panY:0};
let pen={thk:1,col:"#ffffff"};
let geometry=[];
let undoStack=[], redoStack=[];

/* ================= UTILS ================= */
const rad = a => a*Math.PI/180;

function snapshot(){
  undoStack.push(JSON.stringify({origin,cursor,geometry,pen}));
  redoStack.length=0;
}

function restore(s){
  const o=JSON.parse(s);
  origin=o.origin; cursor=o.cursor;
  geometry=o.geometry; pen=o.pen;
}

function drawLine(x1,y1,x2,y2){
  geometry.push({x1,y1,x2,y2,thk:pen.thk,col:pen.col});
}

/* ================= RENDER ================= */
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2+view.panX, canvas.height/2+view.panY);
  ctx.scale(view.zoom, -view.zoom);

  // axes
  ctx.strokeStyle="#333";
  ctx.lineWidth=1/view.zoom;
  ctx.beginPath();
  ctx.moveTo(-10000,0); ctx.lineTo(10000,0);
  ctx.moveTo(0,-10000); ctx.lineTo(0,10000);
  ctx.stroke();

  // geometry
  geometry.forEach(l=>{
    ctx.strokeStyle=l.col;
    ctx.lineWidth=l.thk/view.zoom;
    ctx.beginPath();
    ctx.moveTo(origin.x+l.x1, origin.y+l.y1);
    ctx.lineTo(origin.x+l.x2, origin.y+l.y2);
    ctx.stroke();
  });

  // cursor
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(origin.x+cursor.x, origin.y+cursor.y, 3/view.zoom, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ================= OUTPUT ================= */
const output=document.getElementById("output");
function log(msg,isErr=false){
  output.textContent=(isErr?"ERR: ":"OK: ")+msg;
}

/* ================= COMMAND EXEC ================= */
function exec(cmd){
  cmd=cmd.trim();
  if(!cmd) return;

  const t=cmd.split(/\s+/);

  try{

    if(cmd==="help"){
      log("type commands; drawing is immediate");
      return;
    }

    if(cmd==="?"){
      log(`X=${cursor.x} Y=${cursor.y}`);
      return;
    }

    if(cmd==="un"){
      if(!undoStack.length) return log("nothing to undo",true);
      redoStack.push(JSON.stringify({origin,cursor,geometry,pen}));
      restore(undoStack.pop());
      render();
      return log("undo");
    }

    if(cmd==="re"){
      if(!redoStack.length) return log("nothing to redo",true);
      undoStack.push(JSON.stringify({origin,cursor,geometry,pen}));
      restore(redoStack.pop());
      render();
      return log("redo");
    }

    if(cmd==="cls"){
      origin={x:0,y:0}; cursor={x:0,y:0};
      geometry=[]; undoStack=[]; redoStack=[];
      render();
      return log("cleared");
    }

    if(t[0]==="thk"){
      snapshot();
      pen.thk=parseFloat(t[1]);
      return log("thickness set");
    }

    if(t[0]==="col"){
      snapshot();
      pen.col=t[1];
      return log("color set");
    }

    if(t[0]==="origin"){
      snapshot();
      const [x,y]=t[1].split(",").map(Number);
      origin={x,y};
      render();
      return log(`origin set to ${x},${y}`);
    }

    let moveOnly=false;
    if(t[0]==="m"){ moveOnly=true; t.shift(); }

    if(t[0]==="or"){
      snapshot();
      const [a,n]=t[1].split(",").map(Number);
      const nx=cursor.x+Math.cos(rad(a))*n;
      const ny=cursor.y+Math.sin(rad(a))*n;
      if(!moveOnly) drawLine(cursor.x,cursor.y,nx,ny);
      cursor={x:nx,y:ny};
      render();
      return log(moveOnly?"moved":"line drawn");
    }

    const map={r:0,u:90,l:180,d:270};
    if(map[t[0]]!==undefined){
      snapshot();
      const n=parseFloat(t[1]);
      const a=map[t[0]];
      const nx=cursor.x+Math.cos(rad(a))*n;
      const ny=cursor.y+Math.sin(rad(a))*n;
      if(!moveOnly) drawLine(cursor.x,cursor.y,nx,ny);
      cursor={x:nx,y:ny};
      render();
      return log(moveOnly?"moved":"line drawn");
    }

    log("unknown command",true);

  }catch(e){
    log("invalid syntax",true);
  }
}

/* ================= INPUT ================= */
const form=document.getElementById("bar");
const input=document.getElementById("cmd");

form.addEventListener("submit",e=>{
  e.preventDefault();
  exec(input.value);
  input.value="";
  input.focus();
});

input.focus();
</script>

</body>
</html>
