<script>
document.addEventListener("DOMContentLoaded", ()=>{

  /* ===== LOG ===== */
  const logBox = document.getElementById("log");
  let logId=0;
  function LOG(t,m){
    logId++;
    logBox.innerHTML += `[${logId}] ${t}: ${m}<br>`;
    logBox.scrollTop = logBox.scrollHeight;
  }
  const DBG=m=>LOG("DBG",m);
  const OK =m=>LOG("OK ",m);
  const ERR=m=>LOG("ERR",m);

  DBG("DOM ready");

  /* ===== CANVAS ===== */
  const canvas=document.getElementById("canvas");
  const ctx=canvas.getContext("2d");

  function resize(){
    DBG("resize()");
    canvas.width=innerWidth;
    canvas.height=innerHeight-168;
    draw();
  }
  addEventListener("resize",resize);

  let cursor={x:0,y:0};
  let lines=[];

  function draw(){
    DBG("draw()");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.save();
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.scale(1,-1);

    ctx.strokeStyle="#333";
    ctx.beginPath();
    ctx.moveTo(-9999,0);ctx.lineTo(9999,0);
    ctx.moveTo(0,-9999);ctx.lineTo(0,9999);
    ctx.stroke();

    ctx.strokeStyle="#fff";
    lines.forEach(l=>{
      ctx.beginPath();
      ctx.moveTo(l.x1,l.y1);
      ctx.lineTo(l.x2,l.y2);
      ctx.stroke();
    });

    ctx.fillStyle="#0f0";
    ctx.beginPath();
    ctx.arc(cursor.x,cursor.y,3,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  resize();

  /* ===== COMMAND ===== */
  function exec(cmd){
    DBG(`exec("${cmd}")`);
    cmd=cmd.trim();
    if(!cmd) return;

    if(cmd==="?"){
      OK(`X=${cursor.x} Y=${cursor.y}`);
      return;
    }

    const p=cmd.split(/\s+/);
    if(p[0]==="r"){
      const n=Number(p[1]);
      if(isNaN(n)) return ERR("invalid number");
      lines.push({x1:cursor.x,y1:cursor.y,x2:cursor.x+n,y2:cursor.y});
      cursor.x+=n;
      draw();
      OK(`line ${n}`);
      return;
    }

    ERR("unknown");
  }

  /* ===== INPUT ===== */
  const input=document.getElementById("cmd");
  const btn=document.getElementById("btn");

  DBG("elements found");

  btn.addEventListener("click",()=>{
    DBG("RUN clicked");
    exec(input.value);
    input.value="";
  });

});
</script>
