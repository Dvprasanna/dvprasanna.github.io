<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas CMD – Math</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
}
#canvas{ display:block; background:#000; }
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:44px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 8px;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#run{
  margin-left:8px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <span>&gt;</span>
  <input id="cmd" type="text" autocomplete="off">
  <button id="run">RUN</button>
</div>

<script>
/* =========================
   STATE
========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let docW = 0;
let docH = 0;
let lastDocH = 0;

let local = { x:0, y:0 };   // local origin
let cursor = { x:0, y:0 };  // cursor relative to local
let lines = [];

/* =========================
   HELP TEXT
========================= */
function helpText(){
  return `
Available commands:

Cursor based (chained):
r n            draw right
l n            draw left
u n            draw up
d n            draw down
a n deg        draw at angle
m x y          move cursor

Local-origin based (one-shot):
g r n
g l n
g u n
g d n
g a n deg

Move local origin:
g m x y        set local origin from global (0,0)

Math:
math(expr)     evaluate expression (sqrt, sin, cos, pi)

Info:
?              cursor position
d              document width & height

Edit:
undo           remove last line
cls            clear drawing
`.trim();
}

/* =========================
   RESIZE (KEYBOARD SAFE)
========================= */
function resize(){
  const vh = window.innerHeight;
  const vw = window.innerWidth;
  if (Math.abs(vh - lastDocH) < 100) return;
  lastDocH = vh;

  docW = vw;
  docH = vh - 44;
  canvas.width = docW;
  canvas.height = docH;

  if (local.x === 0 && local.y === 0){
    local.x = docW / 2;
    local.y = docH / 2;
  }
  draw();
}
window.addEventListener("resize", resize);
resize();

/* =========================
   DRAW
========================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(0, canvas.height);
  ctx.scale(1,-1);

  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(docW,0);
  ctx.moveTo(0,0); ctx.lineTo(0,docH);
  ctx.stroke();

  ctx.fillStyle="#ff0";
  ctx.beginPath();
  ctx.arc(local.x, local.y, 4, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  const cx = local.x + cursor.x;
  const cy = local.y + cursor.y;
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================
   GEOMETRY
========================= */
function drawFromCursor(dx,dy){
  const x1 = local.x + cursor.x;
  const y1 = local.y + cursor.y;
  cursor.x += dx;
  cursor.y += dy;
  lines.push({x1,y1,x2:local.x+cursor.x,y2:local.y+cursor.y});
  draw();
}

function drawFromLocal(dx,dy){
  lines.push({
    x1:local.x,
    y1:local.y,
    x2:local.x+dx,
    y2:local.y+dy
  });
  draw();
}

/* =========================
   SAFE MATH EVALUATION
========================= */
function evalMath(expr){
  try{
    const scope = {
      sqrt: Math.sqrt,
      sin: Math.sin,
      cos: Math.cos,
      tan: Math.tan,
      pow: Math.pow,
      pi: Math.PI,
      e: Math.E
    };
    const fn = new Function(...Object.keys(scope), `return ${expr}`);
    return fn(...Object.values(scope));
  }catch(e){
    return "ERROR: " + e.message;
  }
}

/* =========================
   COMMAND EXECUTION
========================= */
function execCommand(text){
  text = text.trim();
  if(!text) return;

  /* math(expr) */
  if(text.startsWith("math(") && text.endsWith(")")){
    const expr = text.slice(5,-1);
    const result = evalMath(expr);
    alert(`RESULT: ${result}`);
    return;
  }

  const p = text.split(/\s+/);
  let useLocal = false;
  if(p[0] === "g"){
    useLocal = true;
    p.shift();
  }

  if(p[0] === "?"){
    alert(`X=${cursor.x} Y=${cursor.y}`);
    return;
  }

  if(p[0] === "d" && p.length === 1){
    alert(`WIDTH=${docW} HEIGHT=${docH}`);
    return;
  }

  const drawFn = useLocal ? drawFromLocal : drawFromCursor;

  switch(p[0]){
    case "r": return drawFn(Number(p[1]),0);
    case "l": return drawFn(-Number(p[1]),0);
    case "u": return drawFn(0,Number(p[1]));
    case "d": return drawFn(0,-Number(p[1]));
    case "a":{
      const len = Number(p[1]);
      const deg = Number(p[2]);
      const rad = deg*Math.PI/180;
      return drawFn(len*Math.cos(rad), len*Math.sin(rad));
    }
    case "m":
      if(useLocal){
        local.x = Number(p[1]);
        local.y = Number(p[2]);
        cursor={x:0,y:0};
        draw();
        return;
      }else{
        cursor.x = Number(p[1]);
        cursor.y = Number(p[2]);
        draw();
        return;
      }
    case "undo":
      lines.pop(); draw(); return;
    case "cls":
      lines=[]; cursor={x:0,y:0}; draw(); return;
  }

  alert("Unknown or invalid command\n\n" + helpText());
}

/* =========================
   EVENT HANDLER
========================= */
const input = document.getElementById("cmd");
document.getElementById("run").onclick = ()=>{
  execCommand(input.value);
  input.value="";
  input.focus();
};
input.focus();
</script>

</body>
</html>
