<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMD Canvas</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
}
#canvas{ display:block; background:#000; }
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:44px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 8px;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#run{
  margin-left:8px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <span>&gt;</span>
  <input id="cmd" autocomplete="off">
  <button id="run">RUN</button>
</div>

<script>
// 1 state
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let docW = 0;
let docH = 0;
let lastDocH = 0;

let local = { x:0, y:0 };
let cursor = { x:0, y:0 };
let lines = [];

// 2 resize
function resize(){
  // 2.1 viewport
  const vh = innerHeight;
  const vw = innerWidth;
  if (Math.abs(vh - lastDocH) < 100) return;
  lastDocH = vh;

  // 2.2 canvas size
  docW = vw;
  docH = vh - 44;
  canvas.width = docW;
  canvas.height = docH;

  // 2.3 init local origin
  if (local.x === 0 && local.y === 0){
    local.x = docW / 2;
    local.y = docH / 2;
  }
  draw();
}
addEventListener("resize", resize);
resize();

// 3 draw
function draw(){
  // 3.1 clear
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(0,canvas.height);
  ctx.scale(1,-1);

  // 3.2 axes
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(docW,0);
  ctx.moveTo(0,0); ctx.lineTo(0,docH);
  ctx.stroke();

  // 3.3 local origin
  ctx.fillStyle="#ff0";
  ctx.beginPath();
  ctx.arc(local.x,local.y,4,0,Math.PI*2);
  ctx.fill();

  // 3.4 lines
  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  // 3.5 cursor
  const cx = local.x + cursor.x;
  const cy = local.y + cursor.y;
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// 4 command executor
function execCommand(cmd){
  // 4.1 sanitize
  cmd = cmd.trim();
  if (!cmd) return;

  // 4.2 tokenize
  let p = cmd.split(/\s+/);

  // 4.3 prefixes
  let useLocal = false;
  let offset = false;

  if (p[0] === "o"){
    offset = true;
    p.shift();
  }
  if (p[0] === "g"){
    useLocal = true;
    p.shift();
  }
  // 4.3.5 cursor query
  if (p[0] === "?" && p.length === 1){
    alert(`X=${cursor.x} Y=${cursor.y}`);
    return;
  }
  function showHelp(){
  alert(
`DRAW
 r n   draw right
 l n   draw left
 u n   draw up
 d n   draw down
 a n d draw at angle

OFFSET
 o r n   centered offset draw

MOVE
 m x y   move cursor absolute
 mr n    move right
 ml n    move left
 mu n    move up
 md n    move down

REFERENCE
 g l     global -> local
 g c     global -> cursor
 l c     local  -> cursor

QUERY
 ?       cursor position

PREFIX
 g       use local origin
 o       offset (one-shot)`
  );
}
  // 4.4 reference commands
  // 4.4.1 g l
  if (useLocal && p[0] === "l" && p.length === 1){
    lines.push({ x1:0, y1:0, x2:local.x, y2:local.y });
    draw(); return;
  }

  // 4.4.2 g c
  if (useLocal && p[0] === "c" && p.length === 1){
    lines.push({
      x1:0, y1:0,
      x2:local.x + cursor.x,
      y2:local.y + cursor.y
    });
    draw(); return;
  }

  // 4.4.3 l c
  if (p[0] === "l" && p[1] === "c" && p.length === 2){
    lines.push({
      x1:local.x, y1:local.y,
      x2:local.x + cursor.x,
      y2:local.y + cursor.y
    });
    draw(); return;
  }

  // 4.5 move commands
  // 4.5.1 absolute
  if (p[0] === "m" && p.length === 3){
    cursor.x = +p[1];
    cursor.y = +p[2];
    draw(); return;
  }

  // 4.5.2 relative
  if (p[0] === "mr"){ cursor.x += +p[1]; draw(); return; }
  if (p[0] === "ml"){ cursor.x -= +p[1]; draw(); return; }
  if (p[0] === "mu"){ cursor.y += +p[1]; draw(); return; }
  if (p[0] === "md"){ cursor.y -= +p[1]; draw(); return; }

  // 4.6 draw commands
  const baseX = useLocal ? local.x : local.x + cursor.x;
  const baseY = useLocal ? local.y : local.y + cursor.y;

  function drawLine(dx,dy){
    if (offset){
      lines.push({
        x1: baseX - dx,
        y1: baseY - dy,
        x2: baseX + dx,
        y2: baseY + dy
      });
    } else {
      lines.push({
        x1: baseX,
        y1: baseY,
        x2: baseX + dx,
        y2: baseY + dy
      });
      if (!useLocal){
        cursor.x += dx;
        cursor.y += dy;
      }
    }
    draw();
  }

  // 4.6.1 directions
  switch(p[0]){
    case "r": return drawLine(+p[1], 0);
    case "l": return drawLine(-p[1], 0);
    case "u": return drawLine(0, +p[1]);
    case "d": return drawLine(0, -p[1]);
    case "a":{
      const len = +p[1];
      const deg = +p[2];
      const rad = deg * Math.PI / 180;
      return drawLine(len * Math.cos(rad), len * Math.sin(rad));
    }
  }

  // 4.9 fallback
  alert("Unknown command");
}

// 5 ui
const input = document.getElementById("cmd");
run.onclick = ()=>{
  execCommand(input.value);
  input.value = "";
  input.focus();
};
input.focus();
</script>

</body>
</html>
