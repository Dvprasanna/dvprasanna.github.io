<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMD Canvas – Offset</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
}
#canvas{ display:block; background:#000; }
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:44px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 8px;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#run{
  margin-left:8px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <span>&gt;</span>
  <input id="cmd" autocomplete="off">
  <button id="run">RUN</button>
</div>

<script>
/* =========================
   STATE
========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let docW=0, docH=0, lastDocH=0;
let local={x:0,y:0};
let cursor={x:0,y:0};
let lines=[];

/* offset flag (one-shot) */
let offsetOnce = false;

/* =========================
   HELP
========================= */
function helpText(){
return `
Draw (cursor chained):
r n | l n | u n | d n
a n deg
m x y

Local origin draw:
g r n | g l n | g u n | g d n
g a n deg

Reference:
g l   global → local
g c   global → cursor
l c   local → cursor

Offset (one-shot mirror):
o r n | o u n | etc

Move local origin:
g m x y

Math:
math(expr)

Info:
?
d

Edit:
undo
cls
`.trim();
}

/* =========================
   RESIZE (SAFE)
========================= */
function resize(){
  const vh=innerHeight, vw=innerWidth;
  if(Math.abs(vh-lastDocH)<100) return;
  lastDocH=vh;

  docW=vw; docH=vh-44;
  canvas.width=docW; canvas.height=docH;

  if(local.x===0&&local.y===0){
    local.x=docW/2; local.y=docH/2;
  }
  draw();
}
addEventListener("resize",resize);
resize();

/* =========================
   DRAW
========================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(0,canvas.height);
  ctx.scale(1,-1);

  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(docW,0);
  ctx.moveTo(0,0); ctx.lineTo(0,docH);
  ctx.stroke();

  ctx.fillStyle="#ff0";
  ctx.beginPath();
  ctx.arc(local.x,local.y,4,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  const cx=local.x+cursor.x, cy=local.y+cursor.y;
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================
   GEOMETRY
========================= */
function drawSegment(startX,startY,dx,dy){
  lines.push({
    x1:startX,
    y1:startY,
    x2:startX+dx,
    y2:startY+dy
  });
  draw();
}

/* =========================
   COMMAND EXEC
========================= */
function execCommand(t){
  t=t.trim(); if(!t) return;

  /* math */
  if(t.startsWith("math(")&&t.endsWith(")")){
    try{
      const e=t.slice(5,-1);
      const v=new Function(
        "sqrt","sin","cos","tan","pow","pi","e",
        `return ${e}`
      )(Math.sqrt,Math.sin,Math.cos,Math.tan,Math.pow,Math.PI,Math.E);
      alert("RESULT: "+v);
    }catch{ alert("ERROR"); }
    return;
  }

  if(t==="o"){ offsetOnce=true; return; }

  let p=t.split(/\s+/);

  /* reference lines */
  if(p[0]==="g"&&p[1]==="l"&&p.length===2){
    lines.push({x1:0,y1:0,x2:local.x,y2:local.y}); draw(); return;
  }
  if(p[0]==="g"&&p[1]==="c"&&p.length===2){
    lines.push({x1:0,y1:0,x2:local.x+cursor.x,y2:local.y+cursor.y}); draw(); return;
  }
  if(p[0]==="l"&&p[1]==="c"&&p.length===2){
    lines.push({x1:local.x,y1:local.y,x2:local.x+cursor.x,y2:local.y+cursor.y}); draw(); return;
  }

  let useLocal=false;
  if(p[0]==="g"){ useLocal=true; p.shift(); }

  if(p[0]==="?"){ alert(`X=${cursor.x} Y=${cursor.y}`); return; }
  if(p[0]==="d"&&p.length===1){ alert(`W=${docW} H=${docH}`); return; }

  const baseX = useLocal ? local.x : local.x + cursor.x;
  const baseY = useLocal ? local.y : local.y + cursor.y;

  function doDraw(dx,dy){
    if(offsetOnce){
      drawSegment(baseX-dx, baseY-dy, dx, dy);
      offsetOnce=false;
    }else{
      drawSegment(baseX, baseY, dx, dy);
      if(!useLocal){
        cursor.x+=dx; cursor.y+=dy;
      }
    }
  }

  switch(p[0]){
    case "r": return doDraw(+p[1],0);
    case "l": return doDraw(-p[1],0);
    case "u": return doDraw(0,+p[1]);
    case "d": return doDraw(0,-p[1]);
    case "a":{
      const len=+p[1], deg=+p[2];
      const rad=deg*Math.PI/180;
      return doDraw(len*Math.cos(rad),len*Math.sin(rad));
    }
    case "m":
      if(useLocal){
        local.x=+p[1]; local.y=+p[2]; cursor={x:0,y:0};
      }else{
        cursor.x=+p[1]; cursor.y=+p[2];
      }
      draw(); return;
    case "undo": lines.pop(); draw(); return;
    case "cls": lines=[]; cursor={x:0,y:0}; draw(); return;
  }

  alert("Unknown command\n\n"+helpText());
}

/* =========================
   UI
========================= */
const input=document.getElementById("cmd");
run.onclick=()=>{
  execCommand(input.value);
  input.value=""; input.focus();
};
input.focus();
</script>

</body>
</html>
