<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMD Canvas</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
}
#canvas{ display:block; background:#000; }
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:44px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 8px;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#run{
  margin-left:8px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <span>&gt;</span>
  <input id="cmd" autocomplete="off">
  <button id="run">RUN</button>
</div>

<script>
// 1 state
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let docW = 0;
let docH = 0;
let lastDocH = 0;

let local  = { x:0, y:0 };
let cursor = { x:0, y:0 };
let lines  = [];

// 2 resize
function resize(){
  const vh = innerHeight;
  const vw = innerWidth;
  if (Math.abs(vh - lastDocH) < 100) return;
  lastDocH = vh;

  docW = vw;
  docH = vh - 44;
  canvas.width  = docW;
  canvas.height = docH;

  if (local.x === 0 && local.y === 0){
    local.x = docW / 2;
    local.y = docH / 2;
  }
  draw();
}
addEventListener("resize", resize);
resize();

// 3 draw
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(0,canvas.height);
  ctx.scale(1,-1);

  // axes
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(docW,0);
  ctx.moveTo(0,0); ctx.lineTo(0,docH);
  ctx.stroke();

  // local origin
  ctx.fillStyle="#ff0";
  ctx.beginPath();
  ctx.arc(local.x,local.y,4,0,Math.PI*2);
  ctx.fill();

  // lines
  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  // cursor
  const cx = local.x + cursor.x;
  const cy = local.y + cursor.y;
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// 4 help
function showHelp(){
  alert(
`DRAW
 r n   draw right
 l n   draw left
 u n   draw up
 d n   draw down
 a n d draw at angle

MOVE
 m x y   move cursor absolute
 mr n    move cursor right
 ml n    move cursor left
 mu n    move cursor up
 md n    move cursor down

LOCAL MOVE
 g m x y   move local absolute
 g mr n    move local right
 g ml n    move local left
 g mu n    move local up
 g md n    move local down

OFFSET
 o r n   centered offset draw

REFERENCE
 g l     global -> local
 g c     global -> cursor
 l c     local  -> cursor

UTILITY
 ?        cursor position
 cls      clear lines
 undo     undo last line
 reset    full reset`
  );
}

// 5 command executor
function execCommand(cmd){
  cmd = cmd.trim();
  if (!cmd) return;

  let p = cmd.split(/\s+/);

  // 5.1 prefixes
  let useLocal = false;
  let offset   = false;

  if (p[0] === "o"){
    offset = true;
    p.shift();
  }
  if (p[0] === "g"){
    useLocal = true;
    p.shift();
  }

  // 5.2 utility
  if (p[0] === "?" && p.length === 1){
    alert(`X=${cursor.x} Y=${cursor.y}`);
    return;
  }
  if (p[0] === "help"){
    showHelp(); return;
  }
  if (p[0] === "cls"){
    lines = []; draw(); return;
  }
  if (p[0] === "undo"){
    lines.pop(); draw(); return;
  }
  if (p[0] === "reset"){
    lines = [];
    cursor = { x:0, y:0 };
    local.x = docW/2;
    local.y = docH/2;
    draw(); return;
  }

  // 5.3 reference
  if (useLocal && p[0] === "l" && p.length === 1){
    lines.push({ x1:0,y1:0,x2:local.x,y2:local.y });
    draw(); return;
  }
  if (useLocal && p[0] === "c" && p.length === 1){
    lines.push({
      x1:0,y1:0,
      x2:local.x+cursor.x,
      y2:local.y+cursor.y
    });
    draw(); return;
  }
  if (p[0] === "l" && p[1] === "c"){
    lines.push({
      x1:local.x,y1:local.y,
      x2:local.x+cursor.x,
      y2:local.y+cursor.y
    });
    draw(); return;
  }

  // 5.4 move absolute
  if (useLocal && p[0] === "m" && p.length === 3){
    local.x = +p[1];
    local.y = +p[2];
    cursor = { x:0,y:0 };
    draw(); return;
  }
  if (!useLocal && p[0] === "m" && p.length === 3){
    cursor.x = +p[1];
    cursor.y = +p[2];
    draw(); return;
  }

  // 5.5 move relative
  if (useLocal){
    if (p[0] === "mr"){ local.x += +p[1]; cursor={x:0,y:0}; draw(); return; }
    if (p[0] === "ml"){ local.x -= +p[1]; cursor={x:0,y:0}; draw(); return; }
    if (p[0] === "mu"){ local.y += +p[1]; cursor={x:0,y:0}; draw(); return; }
    if (p[0] === "md"){ local.y -= +p[1]; cursor={x:0,y:0}; draw(); return; }
  } else {
    if (p[0] === "mr"){ cursor.x += +p[1]; draw(); return; }
    if (p[0] === "ml"){ cursor.x -= +p[1]; draw(); return; }
    if (p[0] === "mu"){ cursor.y += +p[1]; draw(); return; }
    if (p[0] === "md"){ cursor.y -= +p[1]; draw(); return; }
  }

  // 5.6 draw
  const baseX = useLocal ? local.x : local.x + cursor.x;
  const baseY = useLocal ? local.y : local.y + cursor.y;

  function drawLine(dx,dy){
    if (offset){
      lines.push({
        x1: baseX-dx, y1: baseY-dy,
        x2: baseX+dx, y2: baseY+dy
      });
    } else {
      lines.push({
        x1: baseX, y1: baseY,
        x2: baseX+dx, y2: baseY+dy
      });
      if (!useLocal){
        cursor.x += dx;
        cursor.y += dy;
      }
    }
    draw();
  }

  switch(p[0]){
    case "r": return drawLine(+p[1],0);
    case "l": return drawLine(-p[1],0);
    case "u": return drawLine(0,+p[1]);
    case "d": return drawLine(0,-p[1]);
    case "a":{
      const len=+p[1], deg=+p[2];
      const rad=deg*Math.PI/180;
      return drawLine(len*Math.cos(rad), len*Math.sin(rad));
    }
  }

  alert("Unknown command");
}

// 6 ui
const input = document.getElementById("cmd");
run.onclick = ()=>{
  execCommand(input.value);
  input.value="";
  input.focus();
};
input.focus();
</script>

</body>
</html>
