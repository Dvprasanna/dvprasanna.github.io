<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DOS CAD – LOG MODE</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
  overflow:hidden;
}
#canvas{ background:#000; display:block; }

#console{
  position:fixed;
  bottom:0; left:0; right:0;
  background:#111;
  border-top:1px solid #222;
}

#log{
  height:120px;
  overflow:auto;
  font-size:12px;
  padding:4px 6px;
  border-bottom:1px solid #222;
}

#bar{
  display:flex;
  align-items:center;
  height:44px;
  padding:0 8px;
}

#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
}

#btn{
  margin-left:6px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="console">
  <div id="log"></div>
  <form id="bar">
    <span>&gt;</span>
    <input id="cmd" autocomplete="off">
    <button id="btn" type="submit">⏎</button>
  </form>
</div>

<script>
/* =========================
   LOG SYSTEM (TEXT FILE)
========================= */
const logBox = document.getElementById("log");
let logCount = 0;

function LOG(type, msg){
  logCount++;
  const t = new Date().toLocaleTimeString();
  logBox.innerHTML += `[${logCount}] ${t} ${type}: ${msg}<br>`;
  logBox.scrollTop = logBox.scrollHeight;
}

const DBG = msg => LOG("DBG", msg);
const OK  = msg => LOG("OK ", msg);
const ERR = msg => LOG("ERR", msg);

/* =========================
   SCRIPT START
========================= */
DBG("script loaded");

/* =========================
   CANVAS SETUP
========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  DBG("resize()");
  canvas.width = innerWidth;
  canvas.height = innerHeight - 164;
  draw();
}
addEventListener("resize", resize);
resize();

/* =========================
   STATE
========================= */
let cursor = {x:0,y:0};
let lines = [];

/* =========================
   DRAW
========================= */
function draw(){
  DBG("draw()");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(1,-1);

  // axes
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(-9999,0); ctx.lineTo(9999,0);
  ctx.moveTo(0,-9999); ctx.lineTo(0,9999);
  ctx.stroke();

  // lines
  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  // cursor
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================
   COMMAND EXECUTION
========================= */
function exec(cmd){
  DBG(`exec("${cmd}")`);

  cmd = cmd.trim();
  if(!cmd){
    DBG("empty command");
    return;
  }

  const p = cmd.split(/\s+/);

  if(cmd === "?"){
    OK(`X=${cursor.x} Y=${cursor.y}`);
    return;
  }

  if(p[0] === "r"){
    const n = Number(p[1]);
    if(isNaN(n)) return ERR("invalid number");

    lines.push({
      x1:cursor.x, y1:cursor.y,
      x2:cursor.x+n, y2:cursor.y
    });

    cursor.x += n;
    draw();
    OK(`line drawn (${n})`);
    return;
  }

  ERR("unknown command");
}

/* =========================
   INPUT HANDLING
========================= */
const form = document.getElementById("bar");
const input = document.getElementById("cmd");

function handleExecute(e){
  e.preventDefault();
  DBG("handleExecute()");
  const v = input.value;
  DBG(`input="${v}"`);
  input.value="";
  input.focus();
  exec(v);
}

form.addEventListener("submit", handleExecute);
DBG("input handler attached");
input.focus();
</script>

</body>
</html>
