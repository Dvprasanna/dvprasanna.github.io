<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMD Canvas – g l clean</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
}
#canvas{ display:block; background:#000; }
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:44px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 8px;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#run{
  margin-left:8px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <span>&gt;</span>
  <input id="cmd" autocomplete="off">
  <button id="run">RUN</button>
</div>

<script>
/* =========================
   STATE
========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let docW=0, docH=0, lastDocH=0;
let local={x:0,y:0};      // local origin
let cursor={x:0,y:0};     // cursor relative to local
let lines=[];

/* =========================
   RESIZE
========================= */
function resize(){
  const vh=innerHeight, vw=innerWidth;
  if(Math.abs(vh-lastDocH)<100) return;
  lastDocH=vh;

  docW=vw;
  docH=vh-44;
  canvas.width=docW;
  canvas.height=docH;

  if(local.x===0 && local.y===0){
    local.x=docW/2;
    local.y=docH/2;
  }
  draw();
}
addEventListener("resize",resize);
resize();

/* =========================
   DRAW
========================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(0,canvas.height);
  ctx.scale(1,-1);

  // global axes
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(docW,0);
  ctx.moveTo(0,0); ctx.lineTo(0,docH);
  ctx.stroke();

  // local origin
  ctx.fillStyle="#ff0";
  ctx.beginPath();
  ctx.arc(local.x,local.y,4,0,Math.PI*2);
  ctx.fill();

  // lines
  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  // cursor
  const cx=local.x+cursor.x;
  const cy=local.y+cursor.y;
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================
   COMMAND EXECUTION
========================= */
function execCommand(t){
  t=t.trim(); if(!t) return;
  const p=t.split(/\s+/);

  /* reference commands (EXACT) */
  if(p[0]==="g" && p[1]==="l" && p.length===2){
    lines.push({x1:0,y1:0,x2:local.x,y2:local.y});
    draw(); return;
  }
  if(p[0]==="g" && p[1]==="c" && p.length===2){
    lines.push({
      x1:0,y1:0,
      x2:local.x+cursor.x,
      y2:local.y+cursor.y
    });
    draw(); return;
  }
  if(p[0]==="l" && p[1]==="c" && p.length===2){
    lines.push({
      x1:local.x,y1:local.y,
      x2:local.x+cursor.x,
      y2:local.y+cursor.y
    });
    draw(); return;
  }

  /* movement */
  if(p[0]==="m" && p.length===3){
    cursor.x=+p[1];
    cursor.y=+p[2];
    draw(); return;
  }

  alert("Unknown command");
}

/* =========================
   UI
========================= */
const input=document.getElementById("cmd");
run.onclick=()=>{
  execCommand(input.value);
  input.value="";
  input.focus();
};
input.focus();
</script>

</body>
</html>
