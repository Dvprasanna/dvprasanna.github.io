<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DOS CAD – DEBUG</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
  overflow:hidden;
}
#canvas{ background:#000; display:block; }
#console{
  position:fixed; bottom:0; left:0; right:0;
  background:#111;
}
#out{
  padding:4px 8px;
  border-bottom:1px solid #222;
}
#bar{
  display:flex; align-items:center;
  height:44px; padding:0 8px;
}
#cmd{
  flex:1;
  background:#000; color:#0f0;
  border:none; outline:none;
}
#btn{
  margin-left:6px;
  background:#000; color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="console">
  <div id="out">READY</div>
  <form id="bar">
    <span>&gt;</span>
    <input id="cmd" autocomplete="off">
    <button id="btn" type="submit">⏎</button>
  </form>
</div>

<script>
/* =========================
   DBG-01 : SCRIPT LOADED
========================= */
console.log("DBG-01 script loaded");

/* =========================
   CANVAS SETUP
========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  console.log("DBG-02 resize()");
  canvas.width = innerWidth;
  canvas.height = innerHeight - 88;
  draw();
}
addEventListener("resize", resize);
resize();

/* =========================
   STATE
========================= */
let cursor = {x:0,y:0};
let lines = [];

/* =========================
   DRAW
========================= */
function draw(){
  console.log("DBG-03 draw()");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(1,-1);

  // axes
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(-9999,0); ctx.lineTo(9999,0);
  ctx.moveTo(0,-9999); ctx.lineTo(0,9999);
  ctx.stroke();

  // lines
  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  // cursor
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================
   OUTPUT
========================= */
const out = document.getElementById("out");
function ok(t){ out.textContent="OK: "+t; }
function err(t){ out.textContent="ERR: "+t; }

/* =========================
   COMMAND EXECUTION
========================= */
function exec(cmd){
  console.log("DBG-04 exec() called with:", cmd);

  cmd = cmd.trim();
  if(!cmd){
    console.log("DBG-05 empty command");
    return;
  }

  const p = cmd.split(/\s+/);

  // QUERY
  if(cmd === "?"){
    console.log("DBG-06 query cursor");
    return ok(`X=${cursor.x} Y=${cursor.y}`);
  }

  // DRAW RIGHT
  if(p[0] === "r"){
    console.log("DBG-07 draw right", p[1]);
    const n = Number(p[1]);
    if(isNaN(n)) return err("invalid number");
    lines.push({
      x1:cursor.x, y1:cursor.y,
      x2:cursor.x+n, y2:cursor.y
    });
    cursor.x += n;
    draw();
    return ok("line drawn");
  }

  err("unknown command");
}

/* =========================
   INPUT HANDLING (CRITICAL)
========================= */
const form = document.getElementById("bar");
const input = document.getElementById("cmd");
const btn = document.getElementById("btn");

function handleExecute(e){
  console.log("DBG-08 handleExecute()");
  e.preventDefault();

  const value = input.value;   // IMPORTANT: capture first
  console.log("DBG-09 captured value:", value);

  input.value="";
  input.focus();

  exec(value);
}

form.addEventListener("submit", handleExecute);
btn.addEventListener("click", handleExecute);

console.log("DBG-10 handlers attached");
input.focus();
</script>

</body>
</html>
