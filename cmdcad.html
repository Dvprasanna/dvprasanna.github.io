<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas CMD – g Prefix Final</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
}
#canvas{ display:block; background:#000; }
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:44px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 8px;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#run{
  margin-left:8px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <span>&gt;</span>
  <input id="cmd" type="text" autocomplete="off">
  <button id="run">RUN</button>
</div>

<script>
/* =========================
   STATE
========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let docW = 0;
let docH = 0;

/* local origin (relative to document/global 0,0) */
let local = { x:0, y:0 };

/* cursor (relative to local) */
let cursor = { x:0, y:0 };

let lines = [];

/* =========================
   RESIZE / INIT
========================= */
function resize(){
  docW = window.innerWidth;
  docH = window.innerHeight - 44;

  canvas.width = docW;
  canvas.height = docH;

  /* initial local origin = center (only once) */
  if (local.x === 0 && local.y === 0){
    local.x = docW / 2;
    local.y = docH / 2;
  }

  draw();
}
window.addEventListener("resize", resize);
resize();

/* =========================
   DRAW
========================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  /* document coordinates: left-bottom */
  ctx.translate(0, canvas.height);
  ctx.scale(1,-1);

  /* document axes */
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(docW,0);
  ctx.moveTo(0,0); ctx.lineTo(0,docH);
  ctx.stroke();

  /* local origin marker */
  ctx.fillStyle="#ff0";
  ctx.beginPath();
  ctx.arc(local.x, local.y, 4, 0, Math.PI*2);
  ctx.fill();

  /* lines */
  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  /* cursor */
  const cx = local.x + cursor.x;
  const cy = local.y + cursor.y;
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================
   GEOMETRY HELPERS
========================= */

/* cursor-based drawing (chained) */
function drawFromCursor(dx,dy){
  const x1 = local.x + cursor.x;
  const y1 = local.y + cursor.y;

  cursor.x += dx;
  cursor.y += dy;

  const x2 = local.x + cursor.x;
  const y2 = local.y + cursor.y;

  lines.push({x1,y1,x2,y2});
  draw();
}

/* origin-based drawing (g prefix, one-shot) */
function drawFromLocal(dx,dy){
  const x1 = local.x;
  const y1 = local.y;
  const x2 = local.x + dx;
  const y2 = local.y + dy;

  lines.push({x1,y1,x2,y2});
  draw();
}

/* =========================
   COMMAND EXECUTION
========================= */
function execCommand(text){
  text = text.trim();
  if(!text) return;

  const p = text.split(/\s+/);

  /* detect g prefix */
  let useLocalOrigin = false;
  if(p[0] === "g"){
    useLocalOrigin = true;
    p.shift();
  }

  /* ? → cursor position */
  if(p[0] === "?"){
    alert(`X=${cursor.x} Y=${cursor.y}`);
    return;
  }

  /* d → document size */
  if(p[0] === "d" && p.length === 1){
    alert(`WIDTH=${docW} HEIGHT=${docH}`);
    return;
  }

  /* drawing commands */
  const drawFn = useLocalOrigin ? drawFromLocal : drawFromCursor;

  switch(p[0]){
    case "r": return drawFn(Number(p[1]),0);
    case "l": return drawFn(-Number(p[1]),0);
    case "u": return drawFn(0,Number(p[1]));
    case "d": return drawFn(0,-Number(p[1]));

    case "a":{
      const len = Number(p[1]);
      const deg = Number(p[2]);
      const rad = deg * Math.PI / 180;
      return drawFn(len*Math.cos(rad), len*Math.sin(rad));
    }

    case "m":
      if(useLocalOrigin){
        /* g m x y → move local origin */
        local.x = Number(p[1]);
        local.y = Number(p[2]);
        cursor = {x:0,y:0};
        draw();
        return;
      }else{
        /* m x y → move cursor */
        cursor.x = Number(p[1]);
        cursor.y = Number(p[2]);
        draw();
        return;
      }
  }

  alert("Unknown command");
}

/* =========================
   EVENT HANDLER
========================= */
const input = document.getElementById("cmd");
const run = document.getElementById("run");

run.addEventListener("click", ()=>{
  execCommand(input.value);
  input.value="";
  input.focus();
});

input.focus();
</script>

</body>
</html>
