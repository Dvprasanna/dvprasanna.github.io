<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DOS CAD – MOBILE SAFE</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
  overflow:hidden;
}

#canvas{
  display:block;
  background:#000;
}

/* ===== CONSOLE ===== */
#console{
  position:fixed;
  bottom:0; left:0; right:0;
  background:#111;
  border-top:1px solid #222;
}

#log{
  height:120px;
  overflow:auto;
  padding:6px;
  font-size:12px;
  border-bottom:1px solid #222;
}

#bar{
  display:flex;
  align-items:center;
  height:48px;
  padding:0 8px;
}

#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}

#btn{
  margin-left:8px;
  padding:6px 12px;
  background:#000;
  color:#0f0;
  border:2px solid #0f0;
  font-size:16px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="console">
  <div id="log"></div>
  <div id="bar">
    <span>&gt;</span>
    <input id="cmd" type="text" autocomplete="off" spellcheck="false">
    <button id="btn">RUN</button>
  </div>
</div>

<script>
/* =========================
   LOG SYSTEM
========================= */
const logBox = document.getElementById("log");
let logId = 0;

function LOG(type,msg){
  logId++;
  const t = new Date().toLocaleTimeString();
  logBox.innerHTML += `[${logId}] ${t} ${type}: ${msg}<br>`;
  logBox.scrollTop = logBox.scrollHeight;
}

const DBG = m=>LOG("DBG",m);
const OK  = m=>LOG("OK ",m);
const ERR = m=>LOG("ERR",m);

/* =========================
   START
========================= */
DBG("script loaded");

/* =========================
   CANVAS SETUP
========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  DBG("resize()");
  canvas.width = innerWidth;
  canvas.height = innerHeight - 168;
  draw();
}
addEventListener("resize", resize);
resize();

/* =========================
   STATE
========================= */
let cursor = {x:0,y:0};
let lines = [];

/* =========================
   DRAW
========================= */
function draw(){
  DBG("draw()");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.scale(1,-1);

  // axes
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(-9999,0); ctx.lineTo(9999,0);
  ctx.moveTo(0,-9999); ctx.lineTo(0,9999);
  ctx.stroke();

  // lines
  ctx.strokeStyle="#fff";
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  // cursor
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================
   COMMAND EXECUTION
========================= */
function exec(cmd){
  DBG(`exec("${cmd}")`);

  cmd = cmd.trim();
  if(!cmd){
    DBG("empty command");
    return;
  }

  const p = cmd.split(/\s+/);

  if(cmd === "?"){
    OK(`X=${cursor.x} Y=${cursor.y}`);
    return;
  }

  if(p[0] === "r"){
    const n = Number(p[1]);
    if(isNaN(n)) return ERR("invalid number");

    lines.push({
      x1:cursor.x, y1:cursor.y,
      x2:cursor.x+n, y2:cursor.y
    });

    cursor.x += n;
    draw();
    OK(`line drawn ${n}`);
    return;
  }

  ERR("unknown command");
}

/* =========================
   INPUT (TOUCH SAFE)
========================= */
const input = document.getElementById("cmd");
const btn = document.getElementById("btn");

function run(){
  DBG("RUN pressed");
  const v = input.value;
  DBG(`input="${v}"`);
  input.value="";
  input.focus();
  exec(v);
}

// ✅ ONLY reliable mobile trigger
btn.addEventListener("pointerup", e=>{
  e.preventDefault();
  run();
});

input.focus();
DBG("ready");
</script>

</body>
</html>
