<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Drag World Drawing</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f5f5f5;
  }
  canvas {
    display: block;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Fixed pen position (center)
const pen = {
  x: () => canvas.width / 2,
  y: () => canvas.height / 2
};

let dragging = false;
let lastX = 0;
let lastY = 0;

// World offset
let worldX = 0;
let worldY = 0;

// Store lines in world space
const lines = [];

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw all lines
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";

  for (const l of lines) {
    ctx.beginPath();
    ctx.moveTo(l.x1 + worldX, l.y1 + worldY);
    ctx.lineTo(l.x2 + worldX, l.y2 + worldY);
    ctx.stroke();
  }

  // Draw pen marker
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(pen.x(), pen.y(), 4, 0, Math.PI * 2);
  ctx.fill();
}

function start(e) {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
}

function move(e) {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  // Draw line in opposite direction of world movement
  const px = pen.x() - worldX;
  const py = pen.y() - worldY;

  lines.push({
    x1: px,
    y1: py,
    x2: px - dx,
    y2: py - dy
  });

  // Move world
  worldX += dx;
  worldY += dy;

  lastX = e.clientX;
  lastY = e.clientY;

  draw();
}

function end() {
  dragging = false;
}

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("mouseup", end);

draw();
</script>

</body>
</html>
