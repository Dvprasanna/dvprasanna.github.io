<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden">

<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const x = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let camX = 0, camY = 0;
let drag = false, lx = 0, ly = 0;

// fixed pen (screen)
const px = () => c.width / 2;
const py = () => c.height / 2;

// smoothed pen (world)
let sx = 0, sy = 0;
const SMOOTH = 0.25;

const lines = [];

function draw() {
  x.clearRect(0,0,c.width,c.height);

  x.lineWidth = 2;
  x.lineCap = "round";

  for (let l of lines) {
    x.beginPath();
    x.moveTo(l.x1 + camX, l.y1 + camY);
    x.lineTo(l.x2 + camX, l.y2 + camY);
    x.stroke();
  }

  // pen
  x.fillStyle = "red";
  x.beginPath();
  x.arc(px(), py(), 4, 0, Math.PI*2);
  x.fill();
}

c.onmousedown = e => {
  drag = true;
  lx = e.clientX;
  ly = e.clientY;

  // init smooth position
  sx = px() - camX;
  sy = py() - camY;
};

c.onmousemove = e => {
  if (!drag) return;

  const dx = e.clientX - lx;
  const dy = e.clientY - ly;

  const wx = px() - camX;
  const wy = py() - camY;

  // 🔹 smoothing (THE MAGIC)
  sx += (wx - sx) * SMOOTH;
  sy += (wy - sy) * SMOOTH;

  lines.push({
    x1: sx,
    y1: sy,
    x2: sx - dx,
    y2: sy - dy
  });

  camX += dx;
  camY += dy;

  lx = e.clientX;
  ly = e.clientY;

  draw();
};

c.onmouseup = () => drag = false;
c.onmouseleave = () => drag = false;

draw();
</script>
</body>
</html>
