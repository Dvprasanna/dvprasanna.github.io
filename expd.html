<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden;background:#ddd">

<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;
onresize = () => {
  c.width = innerWidth;
  c.height = innerHeight;
};

let camX = 0, camY = 0;
let dragging = false;
let lastX = 0, lastY = 0;
let drawMode = true;
let blocked = false;

// fixed pen (screen)
const penSX = () => c.width / 2;
const penSY = () => c.height / 2;

// smoothed pen (world)
let sx = 0, sy = 0;
const SMOOTH = 0.25;

// stored lines (world coords)
const lines = [];
const HIT = 5; // collision tolerance

// point → segment distance
function hitLine(px, py, l) {
  const dx = l.x2 - l.x1;
  const dy = l.y2 - l.y1;
  const len2 = dx*dx + dy*dy;
  if (!len2) return false;

  let t = ((px - l.x1)*dx + (py - l.y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));

  const hx = l.x1 + t*dx;
  const hy = l.y1 + t*dy;

  return Math.hypot(px - hx, py - hy) < HIT;
}

// 🔒 collision check (IGNORE last segment)
function penHitsOldLine() {
  const wx = penSX() - camX;
  const wy = penSY() - camY;

  for (let i = 0; i < lines.length - 1; i++) {
    if (hitLine(wx, wy, lines[i])) return true;
  }
  return false;
}

function draw() {
  ctx.clearRect(0,0,c.width,c.height);

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for (const l of lines) {
    ctx.beginPath();
    ctx.moveTo(l.x1 + camX, l.y1 + camY);
    ctx.lineTo(l.x2 + camX, l.y2 + camY);
    ctx.stroke();
  }

  // pen indicator
  ctx.fillStyle = blocked ? "orange" : "red";
  ctx.beginPath();
  ctx.arc(penSX(), penSY(), 4, 0, Math.PI*2);
  ctx.fill();
}

// disable right-click menu
c.oncontextmenu = e => e.preventDefault();

c.onmousedown = e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;

  drawMode = (e.button === 0);

  // right-drag resets block
  if (!drawMode) blocked = false;

  // init smooth pen
  sx = penSX() - camX;
  sy = penSY() - camY;
};

c.onmousemove = e => {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  if (drawMode && !blocked) {

    if (penHitsOldLine()) {
      blocked = true;
    } else {
      const wx = penSX() - camX;
      const wy = penSY() - camY;

      sx += (wx - sx) * SMOOTH;
      sy += (wy - sy) * SMOOTH;

      lines.push({
        x1: sx,
        y1: sy,
        x2: sx - dx,
        y2: sy - dy
      });
    }
  }

  // canvas always moves
  camX += dx;
  camY += dy;

  lastX = e.clientX;
  lastY = e.clientY;

  draw();
};

c.onmouseup = () => dragging = false;
c.onmouseleave = () => dragging = false;

draw();
</script>

</body>
</html>
