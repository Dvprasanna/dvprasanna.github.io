<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fixed Pen – Moving Canvas Drawing</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #ddd;
  }
  canvas {
    display: block;
    background: #fff;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Camera offset (world → screen)
let camX = 0;
let camY = 0;

// Fixed pen on screen
function penScreenX() { return canvas.width / 2; }
function penScreenY() { return canvas.height / 2; }

// Convert pen to world coords
function penWorldX() { return penScreenX() - camX; }
function penWorldY() { return penScreenY() - camY; }

let dragging = false;
let lastX = 0;
let lastY = 0;

// Store lines in WORLD coordinates
const lines = [];

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw lines
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";

  for (const l of lines) {
    ctx.beginPath();
    ctx.moveTo(l.x1 + camX, l.y1 + camY);
    ctx.lineTo(l.x2 + camX, l.y2 + camY);
    ctx.stroke();
  }

  // Draw fixed pen
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(penScreenX(), penScreenY(), 4, 0, Math.PI * 2);
  ctx.fill();
}

canvas.addEventListener("mousedown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener("mousemove", e => {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  // Line is drawn at current pen WORLD position
  const px = penWorldX();
  const py = penWorldY();

  lines.push({
    x1: px,
    y1: py,
    x2: px - dx,
    y2: py - dy
  });

  // Move camera
  camX += dx;
  camY += dy;

  lastX = e.clientX;
  lastY = e.clientY;

  draw();
});

canvas.addEventListener("mouseup", () => dragging = false);
canvas.addEventListener("mouseleave", () => dragging = false);

draw();
</script>

</body>
</html>
