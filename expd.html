<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Drag-to-Draw Canvas</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #eee;
  }
  canvas {
    display: block;
    background: #fff;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Pen starts at center
let penX = canvas.width / 2;
let penY = canvas.height / 2;

let dragging = false;
let lastX = 0;
let lastY = 0;

// Draw pen marker
function drawPen() {
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(penX, penY, 4, 0, Math.PI * 2);
  ctx.fill();
}

drawPen();

canvas.addEventListener("mousedown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener("mousemove", e => {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(penX, penY);
  ctx.lineTo(penX - dx, penY - dy);
  ctx.stroke();

  // Move pen opposite to drag
  penX -= dx;
  penY -= dy;

  lastX = e.clientX;
  lastY = e.clientY;

  drawPen();
});

canvas.addEventListener("mouseup", () => dragging = false);
canvas.addEventListener("mouseleave", () => dragging = false);
</script>

</body>
</html>
