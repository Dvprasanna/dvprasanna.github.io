<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden">

<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const x = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let camX = 0, camY = 0;
let drag = false, lx = 0, ly = 0;
let drawMode = true;
let blocked = false; // 🔒 stops drawing on collision

// fixed pen
const px = () => c.width / 2;
const py = () => c.height / 2;

// smoothed pen (world)
let sx = 0, sy = 0;
const SMOOTH = 0.25;

const lines = [];
const HIT = 5; // collision tolerance (px)

// distance point → segment
function hitLine(px, py, l) {
  const dx = l.x2 - l.x1;
  const dy = l.y2 - l.y1;
  const len2 = dx*dx + dy*dy;
  let t = ((px - l.x1)*dx + (py - l.y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const hx = l.x1 + t*dx;
  const hy = l.y1 + t*dy;
  return Math.hypot(px - hx, py - hy) < HIT;
}

function penHitsLine() {
  const wx = px() - camX;
  const wy = py() - camY;
  return lines.some(l => hitLine(wx, wy, l));
}

function draw() {
  x.clearRect(0,0,c.width,c.height);

  x.strokeStyle = "#000";
  x.lineWidth = 6;
  x.lineCap = "round";
  x.lineJoin = "round";

  for (let l of lines) {
    x.beginPath();
    x.moveTo(l.x1 + camX, l.y1 + camY);
    x.lineTo(l.x2 + camX, l.y2 + camY);
    x.stroke();
  }

  // pen indicator
  x.fillStyle = blocked ? "orange" : "red";
  x.beginPath();
  x.arc(px(), py(), 4, 0, Math.PI*2);
  x.fill();
}

c.oncontextmenu = e => e.preventDefault();

c.onmousedown = e => {
  drag = true;
  lx = e.clientX;
  ly = e.clientY;

  drawMode = (e.button === 0);

  // right-drag resets block
  if (!drawMode) blocked = false;

  sx = px() - camX;
  sy = py() - camY;
};

c.onmousemove = e => {
  if (!drag) return;

  const dx = e.clientX - lx;
  const dy = e.clientY - ly;

  if (drawMode && !blocked) {

    // stop drawing if pen touches a line
    if (penHitsLine()) {
      blocked = true;
    } else {
      const wx = px() - camX;
      const wy = py() - camY;

      sx += (wx - sx) * SMOOTH;
      sy += (wy - sy) * SMOOTH;

      lines.push({
        x1: sx,
        y1: sy,
        x2: sx - dx,
        y2: sy - dy
      });
    }
  }

  // canvas always moves
  camX += dx;
  camY += dy;

  lx = e.clientX;
  ly = e.clientY;

  draw();
};

c.onmouseup = () => drag = false;
c.onmouseleave = () => drag = false;

draw();
</script>
</body>
</html>
