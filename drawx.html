<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lines & Arcs - Draw + Undo + Export</title>
<style>
  :root { --bg:#0f1720; --fg:#e6eef6; --muted:#7f9bb0; --accent:#6ee7b7; --btn:#112233;}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg);color:var(--fg)}
  #toolbar{position:fixed;left:12px;top:12px;z-index:20;background:rgba(10,14,20,0.8);padding:8px;border-radius:8px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px)}
  .btn{background:var(--btn);color:var(--fg);border:1px solid rgba(255,255,255,0.04);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
  .btn.active{outline:2px solid var(--accent)}
  #modeLabel{font-size:13px;color:var(--muted);margin-left:6px}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
  .hint{font-size:12px;color:var(--muted)}
  #exportOptions{display:flex;gap:6px}
</style>
</head>
<body>
<div id="toolbar">
  <button id="xBtn" class="btn">X Line</button>
  <button id="yBtn" class="btn">Y Line</button>
  <button id="arcBtn" class="btn">Arc</button>
  <div id="modeLabel" class="hint">Mode: <span id="mode">idle</span></div>
  <div style="width:12px"></div>
  <button id="undoBtn" class="btn">Undo</button>
  <button id="clearBtn" class="btn">Clear</button>
  <div id="exportOptions">
    <button id="jpegBtn" class="btn">Export JPEG</button>
    <button id="svgBtn" class="btn">Export SVG</button>
  </div>
</div>

<canvas id="c"></canvas>

<script>
// ----------------- Setup -----------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = window.devicePixelRatio || 1;
function resize(){ DPR = window.devicePixelRatio || 1; canvas.width = Math.floor(innerWidth * DPR); canvas.height = Math.floor(innerHeight * DPR); canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px'; ctx.setTransform(DPR,0,0,DPR,0,0); draw(); }
addEventListener('resize', resize);
resize();

// UI
const xBtn = document.getElementById('xBtn'), yBtn = document.getElementById('yBtn'), arcBtn = document.getElementById('arcBtn');
const modeLabel = document.getElementById('mode');
const undoBtn = document.getElementById('undoBtn'), clearBtn = document.getElementById('clearBtn');
const jpegBtn = document.getElementById('jpegBtn'), svgBtn = document.getElementById('svgBtn');

let mode = 'idle'; // 'x','y','arc','idle'
function setMode(m){
  mode = m;
  modeLabel.textContent = m === 'idle' ? 'idle' : (m === 'x' ? 'X Line' : m === 'y' ? 'Y Line' : 'Arc');
  [xBtn,yBtn,arcBtn].forEach(b=>b.classList.remove('active'));
  if(m==='x') xBtn.classList.add('active');
  if(m==='y') yBtn.classList.add('active');
  if(m==='arc') arcBtn.classList.add('active');
}
xBtn.onclick = ()=> setMode(mode==='x' ? 'idle' : 'x');
yBtn.onclick = ()=> setMode(mode==='y' ? 'idle' : 'y');
arcBtn.onclick = ()=> setMode(mode==='arc' ? 'idle' : 'arc');

undoBtn.onclick = undo;
clearBtn.onclick = ()=>{ shapes=[]; history=[]; draw(); }

jpegBtn.onclick = exportJPEG;
svgBtn.onclick = exportSVG;

// ------------- State & Data structures -------------
/*
shapes[] elements:
  {type:'line', orientation:'x'|'y', x1,y1,x2,y2}
  {type:'arc', p1:{x,y}, p2:{x,y}, center:{x,y}, r, startAngle, endAngle, cw}
*/
let shapes = [];
let history = []; // for undo - copy of shapes arrays snapshots (store shallow copies)

// Save snapshot for undo
function pushHistory(){
  history.push(JSON.parse(JSON.stringify(shapes)));
  if(history.length > 100) history.shift();
}
function undo(){
  if(history.length>0){
    shapes = history.pop();
  } else {
    shapes.pop();
  }
  draw();
}

// ------------- Drawing helpers -------------
function clearCanvas(){ ctx.clearRect(0,0,innerWidth,innerHeight); }
function drawGrid(){
  ctx.save(); ctx.globalAlpha = 0.06; ctx.fillStyle = '#fff';
  for(let x=0;x<innerWidth;x+=24) ctx.fillRect(x,0,1,innerHeight);
  for(let y=0;y<innerHeight;y+=24) ctx.fillRect(0,y,innerWidth,1);
  ctx.restore();
}
function draw(){
  clearCanvas();
  drawGrid();

  // draw finalized shapes
  for(const s of shapes){
    if(s.type==='line'){
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#6ee7b7';
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    } else if(s.type==='arc'){
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffd166';
      ctx.beginPath();
      // use cw stored: canvas.arc uses anticlockwise boolean last param
      ctx.arc(s.center.x, s.center.y, s.r, s.startAngle, s.endAngle, s.cw===false);
      ctx.stroke();
      // draw small handle for center
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.center.x, s.center.y, 5,0,Math.PI*2); ctx.fill();
    }
  }

  // draw preview if any
  if(preview){
    if(preview.type==='line'){
      ctx.save(); ctx.globalAlpha = 0.7; ctx.lineWidth = 2; ctx.setLineDash([6,6]); ctx.strokeStyle='#7dd3fc';
      ctx.beginPath(); ctx.moveTo(preview.x1,preview.y1); ctx.lineTo(preview.x2,preview.y2); ctx.stroke(); ctx.restore();
    } else if(preview.type==='arcPhase1'){
      // show chord
      ctx.save(); ctx.globalAlpha = 0.7; ctx.lineWidth = 2; ctx.setLineDash([6,6]); ctx.strokeStyle='#f472b6';
      ctx.beginPath(); ctx.moveTo(preview.p1.x,preview.p1.y); ctx.lineTo(preview.p2.x,preview.p2.y); ctx.stroke();
      ctx.restore();
    } else if(preview.type==='arcAdjust'){
      ctx.lineWidth = 2; ctx.strokeStyle='#f59e0b'; ctx.beginPath();
      ctx.arc(preview.center.x, preview.center.y, preview.r, preview.startAngle, preview.endAngle, preview.cw===false); ctx.stroke();
      // center handle
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(preview.center.x, preview.center.y, 6,0,Math.PI*2); ctx.fill();
    }
  }
}

// ------------- Interaction & Pointer logic -------------
let pointerId = null;
let startPt = null;
let preview = null;
let arcTemp = null; // temporary storage for arc between phases
let lastTap = 0;

// pointer helpers
function pt(e){ return {x: e.clientX, y: e.clientY}; }

canvas.addEventListener('pointerdown', (ev)=>{
  ev.preventDefault();
  if(pointerId !== null) return;
  pointerId = ev.pointerId; canvas.setPointerCapture(pointerId);

  const p = pt(ev);

  // double tap detection (undo)
  const now = performance.now();
  if(now - lastTap < 400){
    // double tap - undo
    undo();
    lastTap = 0;
    pointerId = null;
    try{ canvas.releasePointerCapture(ev.pointerId); }catch(e){}
    return;
  }
  lastTap = now;

  if(mode==='x' || mode==='y'){
    startPt = p;
    preview = {type:'line', x1:startPt.x, y1:startPt.y, x2:startPt.x, y2:startPt.y, orientation: mode};
  } else if(mode==='arc'){
    // two-phase arc creation:
    // Phase 1: drag to set chord (p1->p2). Release to go to Phase 2.
    startPt = p;
    preview = {type:'arcPhase1', p1:startPt, p2:startPt};
  } else {
    // If idle, test whether clicking on an arc center handle to start moving it
    const hit = hitTestCenter(p);
    if(hit){
      // begin dragging center of hit.arc
      preview = {type:'arcAdjust', arcIndex: hit.index, center: {...shapes[hit.index].center}, startOffset: {x: p.x - shapes[hit.index].center.x, y: p.y - shapes[hit.index].center.y}};
    } else {
      preview = null;
    }
  }
  draw();
});

canvas.addEventListener('pointermove', (ev)=>{
  if(pointerId === null || ev.pointerId !== pointerId) return;
  const p = pt(ev);
  if(!preview) return;
  if(preview.type==='line'){
    if(preview.orientation==='x'){
      preview.x2 = p.x; preview.y2 = preview.y1; // horizontal
    } else {
      preview.x2 = preview.x1; preview.y2 = p.y; // vertical
    }
  } else if(preview.type==='arcPhase1'){
    preview.p2 = p;
  } else if(preview.type==='arcAdjust'){
    // move center while adjusting
    const idx = preview.arcIndex;
    if(typeof idx === 'number'){
      // update center by pointer position minus offset
      preview.center = {x: p.x - preview.startOffset.x, y: p.y - preview.startOffset.y};
      // recompute r and angles based on original p1/p2
      const s = shapes[idx];
      const p1 = s.p1, p2 = s.p2;
      const r = Math.hypot(preview.center.x - p1.x, preview.center.y - p1.y);
      const a1 = Math.atan2(p1.y - preview.center.y, p1.x - preview.center.x);
      const a2 = Math.atan2(p2.y - preview.center.y, p2.x - preview.center.x);
      preview.r = r; preview.startAngle = a1; preview.endAngle = a2; preview.cw = s.cw;
    }
  }
  draw();
});

canvas.addEventListener('pointerup', (ev)=>{
  if(pointerId === null || ev.pointerId !== pointerId) return;
  const p = pt(ev);
  // finalize behavior depends on preview type
  if(preview && preview.type==='line'){
    // finalize horizontal/vertical line
    pushHistory();
    const s = {
      type:'line',
      orientation: preview.orientation,
      x1: preview.x1, y1: preview.y1, x2: preview.x2, y2: preview.y2
    };
    shapes.push(s);
    preview = null;
    startPt = null;
  } else if(preview && preview.type==='arcPhase1'){
    // end chord, move to adjustment phase
    // if chord too small, cancel
    const p1 = preview.p1, p2 = preview.p2;
    if(Math.hypot(p2.x-p1.x, p2.y-p1.y) < 6){
      preview = null;
      startPt = null;
    } else {
      // compute default center: midpoint offset perpendicular by default distance
      const mid = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      // perpendicular unit
      const len = Math.hypot(dx,dy);
      const ux = -dy/len, uy = dx/len;
      const defaultOffset = Math.min(200, Math.max(20, len/3));
      const center = {x: mid.x + ux*defaultOffset, y: mid.y + uy*defaultOffset};
      const r = Math.hypot(center.x - p1.x, center.y - p1.y);
      const a1 = Math.atan2(p1.y - center.y, p1.x - center.x);
      const a2 = Math.atan2(p2.y - center.y, p2.x - center.x);
      const cw = false;
      // store temp in arcTemp and enter adjust mode
      arcTemp = {p1: {...p1}, p2: {...p2}, center, r, startAngle: a1, endAngle: a2, cw};
      preview = {type:'arcAdjust', center: {...center}, r, startAngle: a1, endAngle: a2, cw, arcIndex: null};
      // set mode idle so moving center doesn't start new shapes
      setMode('idle');
      // let user move center by dragging the center handle; To begin dragging center handle, user can pointerdown near handle - we allow pointerdown on handle to set arcIndex below
    }
  } else if(preview && preview.type==='arcAdjust'){
    // If preview has arcIndex (we were moving an existing arc) -> commit center move to shape
    if(preview.arcIndex !== undefined && preview.arcIndex !== null){
      pushHistory();
      const idx = preview.arcIndex;
      shapes[idx].center = {...preview.center};
      shapes[idx].r = preview.r;
      shapes[idx].startAngle = preview.startAngle;
      shapes[idx].endAngle = preview.endAngle;
      preview = null;
    } else if(arcTemp){
      // finalize new arc (from arcTemp) using preview center
      pushHistory();
      const newArc = {
        type:'arc',
        p1: {...arcTemp.p1},
        p2: {...arcTemp.p2},
        center: {...preview.center},
        r: preview.r,
        startAngle: preview.startAngle,
        endAngle: preview.endAngle,
        cw: preview.cw
      };
      shapes.push(newArc);
      arcTemp = null;
      preview = null;
    }
  } else if(preview && preview.type==='arcAdjust' && preview.arcIndex===null){
    // finalization fallback
    if(arcTemp){
      pushHistory();
      shapes.push({
        type:'arc',
        p1: {...arcTemp.p1},
        p2: {...arcTemp.p2},
        center: {...preview.center},
        r: preview.r,
        startAngle: preview.startAngle,
        endAngle: preview.endAngle,
        cw: preview.cw
      });
      arcTemp = null; preview = null;
    }
  } else {
    // maybe we were in idle and moving an existing center -> commit
    if(preview && preview.type==='arcAdjust' && preview.arcIndex!==null){
      pushHistory();
      const idx = preview.arcIndex;
      shapes[idx].center = {...preview.center};
      shapes[idx].r = preview.r;
      shapes[idx].startAngle = preview.startAngle;
      shapes[idx].endAngle = preview.endAngle;
      preview = null;
    } else {
      preview = null;
    }
  }

  // release pointer
  try{ canvas.releasePointerCapture(ev.pointerId); }catch(e){}
  pointerId = null;
  draw();
});

// - allow pointerdown on center handle of existing arcs to start moving center
canvas.addEventListener('pointerdown', (ev)=>{
  // this event is already handled above (first pointerdown listener), but we check if user clicked an existing center to move
  const p = pt(ev);
  const h = hitTestCenter(p);
  if(h){
    // begin moving this arc center immediately
    pointerId = ev.pointerId; canvas.setPointerCapture(pointerId);
    preview = {type:'arcAdjust', arcIndex: h.index, center: {...shapes[h.index].center}, startOffset: {x: p.x - shapes[h.index].center.x, y: p.y - shapes[h.index].center.y}, r: shapes[h.index].r, startAngle: shapes[h.index].startAngle, endAngle: shapes[h.index].endAngle, cw: shapes[h.index].cw};
    draw();
  }
});

// hit test centers
function hitTestCenter(p){
  for(let i=shapes.length-1;i>=0;i--){
    const s = shapes[i];
    if(s.type==='arc'){
      const d = Math.hypot(p.x - s.center.x, p.y - s.center.y);
      if(d <= 10) return {index:i};
    }
  }
  return null;
}

// double tap via dblclick fallback
canvas.addEventListener('dblclick', (ev)=>{ undo(); });

// ------------- Export functions -------------
function exportJPEG(){
  // rasterize canvas to JPEG
  const link = document.createElement('a');
  link.download = 'drawing.jpg';
  link.href = canvas.toDataURL('image/jpeg', 0.95);
  link.click();
}

// build SVG string
function exportSVG(){
  const w = innerWidth, h = innerHeight;
  const xmlns = "http://www.w3.org/2000/svg";
  const svgParts = [];
  svgParts.push(`<svg xmlns="${xmlns}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`);
  // background
  svgParts.push(`<rect width="100%" height="100%" fill="#0f1720"/>`);
  // shapes
  for(const s of shapes){
    if(s.type==='line'){
      svgParts.push(`<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>`);
    } else if(s.type==='arc'){
      // convert arc (center,r,start,end,cw) to SVG path using arc command
      const x1 = s.center.x + s.r * Math.cos(s.startAngle);
      const y1 = s.center.y + s.r * Math.sin(s.startAngle);
      const x2 = s.center.x + s.r * Math.cos(s.endAngle);
      const y2 = s.center.y + s.r * Math.sin(s.endAngle);
      // determine large-arc-flag
      let delta = s.endAngle - s.startAngle;
      if(!s.cw && delta < 0) delta += Math.PI*2;
      if(s.cw && delta > 0) delta -= Math.PI*2;
      const large = Math.abs(delta) > Math.PI ? 1 : 0;
      const sweep = s.cw ? 1 : 0;
      svgParts.push(`<path d="M ${x1} ${y1} A ${s.r} ${s.r} 0 ${large} ${s.cw?1:0} ${x2} ${y2}" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>`);
    }
  }
  svgParts.push('</svg>');
  const svgStr = svgParts.join('\n');
  const blob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'drawing.svg'; a.click();
  URL.revokeObjectURL(url);
}

// ------------- Utility: finalize arc if user clicks center handle after creating arcTemp -------------
canvas.addEventListener('click', (ev)=>{
  // if arcTemp exists and user clicks near center handle, finalize arc
  if(arcTemp){
    const p = pt(ev);
    const dx = p.x - arcTemp.center.x, dy = p.y - arcTemp.center.y;
    if(Math.hypot(dx,dy) < 14){
      // commit with current arcTemp center (use arcTemp.center)
      pushHistory();
      const p1 = arcTemp.p1, p2 = arcTemp.p2, c = arcTemp.center;
      const r = Math.hypot(p1.x - c.x, p1.y - c.y);
      const a1 = Math.atan2(p1.y - c.y, p1.x - c.x);
      const a2 = Math.atan2(p2.y - c.y, p2.x - c.x);
      shapes.push({type:'arc', p1:{...p1}, p2:{...p2}, center:{...c}, r, startAngle:a1, endAngle:a2, cw:false});
      arcTemp = null; preview = null; draw();
    }
  }
});

// ----------------- Initialize draw -----------------
draw();

</script>
</body>
</html>
