<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lines & Arcs — Fixed Buttons + Undo + Export</title>
<style>
  :root{--bg:#0b1220;--fg:#e6eef6;--muted:#8aa0b8;--accent:#44d7b6}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto}
  #toolbar{position:fixed;left:12px;top:12px;z-index:30;background:rgba(10,14,20,0.86);padding:8px;border-radius:10px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px)}
  .btn{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,0.04);padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}
  .btn.active{box-shadow:0 0 0 2px rgba(68,215,182,0.14);border-color:rgba(68,215,182,0.28)}
  #modeLabel{font-size:13px;color:var(--muted);margin-left:6px}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
  .hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="toolbar">
  <button id="xBtn" class="btn">X Line</button>
  <button id="yBtn" class="btn">Y Line</button>
  <button id="arcBtn" class="btn">Arc</button>
  <div id="modeLabel" class="hint">Mode: <strong id="mode">idle</strong></div>
  <div style="width:8px"></div>
  <button id="undoBtn" class="btn">Undo</button>
  <button id="clearBtn" class="btn">Clear</button>
  <button id="jpegBtn" class="btn">Export JPEG</button>
  <button id="svgBtn" class="btn">Export SVG</button>
</div>

<canvas id="c"></canvas>

<script>
/* =========================
   Lines & Arcs — working
   - X Line / Y Line / Arc modes
   - Arc center movable before finalize
   - double-tap / dblclick undo
   - Export JPEG / SVG
   ========================= */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = window.devicePixelRatio || 1;

function resize(){
  DPR = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * DPR);
  canvas.height = Math.round(innerHeight * DPR);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
addEventListener('resize', resize);
resize();

// UI elements
const xBtn = document.getElementById('xBtn');
const yBtn = document.getElementById('yBtn');
const arcBtn = document.getElementById('arcBtn');
const modeLabel = document.getElementById('mode');
const undoBtn = document.getElementById('undoBtn');
const clearBtn = document.getElementById('clearBtn');
const jpegBtn = document.getElementById('jpegBtn');
const svgBtn = document.getElementById('svgBtn');

// state
let mode = 'idle'; // 'idle' | 'x' | 'y' | 'arc'
let shapes = [];   // finalized shapes
let history = [];  // undo snapshots (store clones)
let pointerDown = false;
let activePointerId = null;
let startPt = null;
let preview = null; // preview object varies by mode
let arcTemp = null; // holds chord during arc creation
let lastTapTime = 0;

// helpers
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ptFromEvent(e){ return {x: e.clientX, y: e.clientY}; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function copy(obj){ return JSON.parse(JSON.stringify(obj)); }
function pushHistory(){ history.push(copy(shapes)); if(history.length>60) history.shift(); }
function undo(){ if(history.length) shapes = history.pop(); else shapes.pop(); draw(); }

// mode setter (fixed bug: ensure UI updates)
function setMode(m){
  mode = m;
  modeLabel.textContent = m==='idle' ? 'idle' : (m==='x' ? 'X Line' : (m==='y' ? 'Y Line' : 'Arc'));
  [xBtn,yBtn,arcBtn].forEach(b=>b.classList.remove('active'));
  if(m==='x') xBtn.classList.add('active');
  if(m==='y') yBtn.classList.add('active');
  if(m==='arc') arcBtn.classList.add('active');
  // clear previews when switching
  preview = null; arcTemp = null; draw();
}
xBtn.addEventListener('click', ()=> setMode(mode==='x' ? 'idle' : 'x'));
yBtn.addEventListener('click', ()=> setMode(mode==='y' ? 'idle' : 'y'));
arcBtn.addEventListener('click', ()=> setMode(mode==='arc' ? 'idle' : 'arc'));
undoBtn.addEventListener('click', undo);
clearBtn.addEventListener('click', ()=>{ shapes=[]; history=[]; draw(); });

// Export JPEG
jpegBtn.addEventListener('click', ()=>{
  // draw full final view into a temp canvas at DPR=1 for good JPEG
  const tmp = document.createElement('canvas');
  tmp.width = innerWidth; tmp.height = innerHeight;
  const tctx = tmp.getContext('2d');
  // background
  tctx.fillStyle = '#0b1220'; tctx.fillRect(0,0,tmp.width,tmp.height);
  // draw shapes (same style)
  drawShapesToContext(tctx);
  const link = document.createElement('a');
  link.download = 'drawing.jpg';
  link.href = tmp.toDataURL('image/jpeg', 0.95);
  link.click();
});

// Export SVG
svgBtn.addEventListener('click', ()=>{
  const w = innerWidth, h = innerHeight;
  const parts = [];
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`);
  parts.push(`<rect width="100%" height="100%" fill="#0b1220"/>`);
  for(const s of shapes){
    if(s.type==='line'){
      parts.push(`<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>`);
    } else if(s.type==='arc'){
      const x1 = s.center.x + s.r * Math.cos(s.startAngle);
      const y1 = s.center.y + s.r * Math.sin(s.startAngle);
      const x2 = s.center.x + s.r * Math.cos(s.endAngle);
      const y2 = s.center.y + s.r * Math.sin(s.endAngle);
      let delta = s.endAngle - s.startAngle;
      if(!s.cw && delta < 0) delta += Math.PI*2;
      if(s.cw && delta > 0) delta -= Math.PI*2;
      const large = Math.abs(delta) > Math.PI ? 1 : 0;
      const sweep = s.cw ? 1 : 0;
      parts.push(`<path d="M ${x1} ${y1} A ${s.r} ${s.r} 0 ${large} ${s.cw?1:0} ${x2} ${y2}" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>`);
    }
  }
  parts.push('</svg>');
  const blob = new Blob([parts.join('\n')], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'drawing.svg'; a.click();
  URL.revokeObjectURL(url);
});

// drawing utils
function drawGridToContext(c){
  c.save();
  c.globalAlpha = 0.06;
  c.fillStyle = '#fff';
  for(let x=0;x<innerWidth;x+=24) c.fillRect(x,0,1,innerHeight);
  for(let y=0;y<innerHeight;y+=24) c.fillRect(0,y,innerWidth,1);
  c.restore();
}
function drawShapesToContext(c){
  // shapes on provided context
  for(const s of shapes){
    if(s.type==='line'){
      c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(s.x2,s.y2); c.lineWidth = 3; c.strokeStyle = '#6ee7b7'; c.stroke();
    } else if(s.type==='arc'){
      c.beginPath(); c.arc(s.center.x,s.center.y,s.r,s.startAngle,s.endAngle, s.cw===false); c.lineWidth=3; c.strokeStyle='#ffd166'; c.stroke();
      // center handle
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s.center.x, s.center.y, 5,0,Math.PI*2); c.fill();
    }
  }
}

function draw(){
  // final canvas
  ctx.clearRect(0,0,innerWidth,innerHeight);
  drawGridToContext(ctx);
  drawShapesToContext(ctx);

  // preview rendering
  if(preview){
    ctx.save();
    if(preview.type==='linePreview'){
      ctx.setLineDash([8,6]); ctx.lineWidth = 2; ctx.strokeStyle = '#7dd3fc';
      ctx.beginPath(); ctx.moveTo(preview.x1, preview.y1); ctx.lineTo(preview.x2, preview.y2); ctx.stroke();
    } else if(preview.type==='arcChord'){
      ctx.setLineDash([8,6]); ctx.lineWidth = 2; ctx.strokeStyle = '#f472b6';
      ctx.beginPath(); ctx.moveTo(preview.p1.x, preview.p1.y); ctx.lineTo(preview.p2.x, preview.p2.y); ctx.stroke();
    } else if(preview.type==='arcAdjust'){
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(preview.center.x, preview.center.y, preview.r, preview.startAngle, preview.endAngle, preview.cw===false); ctx.stroke();
      // center handle
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(preview.center.x, preview.center.y, 6,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// pointer logic: single handler for pointerdown/move/up
canvas.addEventListener('pointerdown', (ev)=>{
  ev.preventDefault();
  // ignore if another pointer owns it
  if(pointerDown) return;
  pointerDown = true; activePointerId = ev.pointerId;
  canvas.setPointerCapture(activePointerId);
  const p = ptFromEvent(ev);

  // double-tap detection (touch) and dblclick fallback
  const now = performance.now();
  if(now - lastTapTime < 350){
    undo(); lastTapTime = 0;
    // consume event
    pointerDown = false;
    try{ canvas.releasePointerCapture(activePointerId); }catch(e){}
    activePointerId = null;
    return;
  }
  lastTapTime = now;

  if(mode === 'x' || mode === 'y'){
    startPt = p;
    if(mode === 'x'){
      preview = {type:'linePreview', orientation:'x', x1:p.x, y1:p.y, x2:p.x, y2:p.y};
    } else {
      preview = {type:'linePreview', orientation:'y', x1:p.x, y1:p.y, x2:p.x, y2:p.y};
    }
  } else if(mode === 'arc'){
    // begin chord (phase 1)
    startPt = p;
    preview = {type:'arcChord', p1: p, p2: p};
  } else { // idle: maybe begin moving an existing arc center
    const hit = hitTestCenter(p);
    if(hit !== null){
      // start moving center of shape index=hit
      startPt = p;
      const s = shapes[hit];
      preview = {type:'arcAdjust', movingIndex: hit, center: {...s.center}, startOffset: {x: p.x - s.center.x, y: p.y - s.center.y}, r: s.r, startAngle: s.startAngle, endAngle: s.endAngle, cw: s.cw};
    } else {
      preview = null;
    }
  }
  draw();
});

canvas.addEventListener('pointermove', (ev)=>{
  if(!pointerDown || ev.pointerId !== activePointerId) return;
  const p = ptFromEvent(ev);

  if(!preview) return;
  if(preview.type === 'linePreview'){
    if(preview.orientation === 'x'){
      preview.x2 = p.x; preview.y2 = preview.y1;
    } else {
      preview.x2 = preview.x1; preview.y2 = p.y;
    }
  } else if(preview.type === 'arcChord'){
    preview.p2 = p;
  } else if(preview.type === 'arcAdjust'){
    // move the center while keeping chord endpoints same; if moving existing arc: recompute r/angles
    if(preview.movingIndex !== undefined && preview.movingIndex !== null){
      const s = shapes[preview.movingIndex];
      preview.center.x = p.x - preview.startOffset.x;
      preview.center.y = p.y - preview.startOffset.y;
      // recompute r and angles from stored s.p1 / s.p2
      const p1 = s.p1, p2 = s.p2;
      preview.r = Math.hypot(preview.center.x - p1.x, preview.center.y - p1.y);
      preview.startAngle = Math.atan2(p1.y - preview.center.y, p1.x - preview.center.x);
      preview.endAngle   = Math.atan2(p2.y - preview.center.y, p2.x - preview.center.x);
    } else if(arcTemp){
      // adjusting newly created arc center before finalize
      preview.center.x = p.x; preview.center.y = p.y;
      // recompute r/angles based on arcTemp.p1/ p2
      preview.r = Math.hypot(preview.center.x - arcTemp.p1.x, preview.center.y - arcTemp.p1.y);
      preview.startAngle = Math.atan2(arcTemp.p1.y - preview.center.y, arcTemp.p1.x - preview.center.x);
      preview.endAngle   = Math.atan2(arcTemp.p2.y - preview.center.y, arcTemp.p2.x - preview.center.x);
    }
  }
  draw();
});

canvas.addEventListener('pointerup', (ev)=>{
  if(!pointerDown || ev.pointerId !== activePointerId) return;
  pointerDown = false;
  try{ canvas.releasePointerCapture(activePointerId); }catch(e){}
  activePointerId = null;
  const p = ptFromEvent(ev);

  if(preview && preview.type === 'linePreview'){
    // finalize the horizontal/vertical line
    pushHistory();
    const s = { type:'line', orientation: preview.orientation, x1: preview.x1, y1: preview.y1, x2: preview.x2, y2: preview.y2 };
    shapes.push(s);
    preview = null; startPt = null;
  } else if(preview && preview.type === 'arcChord'){
    // finish chord; if too tiny, cancel. Otherwise go to arc adjust phase
    const p1 = preview.p1, p2 = preview.p2;
    if(dist(p1,p2) < 6){ preview = null; startPt = null; draw(); return; }
    // compute a nice default center (midpoint + perpendicular offset)
    const mid = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.max(1, Math.hypot(dx,dy));
    const ux = -dy/len, uy = dx/len;
    const defaultOffset = Math.min(200, Math.max(24, len/3));
    const center = {x: mid.x + ux*defaultOffset, y: mid.y + uy*defaultOffset};
    const r = Math.hypot(center.x - p1.x, center.y - p1.y);
    const a1 = Math.atan2(p1.y - center.y, p1.x - center.x);
    const a2 = Math.atan2(p2.y - center.y, p2.x - center.x);
    arcTemp = {p1: {...p1}, p2: {...p2}, center: {...center}, r, startAngle: a1, endAngle: a2, cw:false};
    // enter adjust mode (user can drag the center handle to reposition)
    preview = { type:'arcAdjust', center: {...center}, r, startAngle: a1, endAngle: a2, cw:false, movingIndex: null };
    // set mode idle to avoid starting new shapes
    setMode('idle');
  } else if(preview && preview.type === 'arcAdjust'){
    // finalize either a move of an existing arc center OR creation of a new arc (if arcTemp exists)
    if(preview.movingIndex !== null && preview.movingIndex !== undefined){
      // commit move for existing arc
      pushHistory();
      const idx = preview.movingIndex;
      shapes[idx].center = {x: preview.center.x, y: preview.center.y};
      shapes[idx].r = preview.r;
      shapes[idx].startAngle = preview.startAngle;
      shapes[idx].endAngle = preview.endAngle;
      preview = null;
    } else if(arcTemp){
      // finalize the new arc using preview.center
      pushHistory();
      const newArc = {
        type:'arc',
        p1: {...arcTemp.p1},
        p2: {...arcTemp.p2},
        center: {...preview.center},
        r: preview.r,
        startAngle: preview.startAngle,
        endAngle: preview.endAngle,
        cw: preview.cw
      };
      shapes.push(newArc);
      arcTemp = null;
      preview = null;
    } else {
      preview = null;
    }
  } else {
    // nothing to finalize
    preview = null;
  }

  draw();
});

// dblclick fallback (desktop) and touch handled above by double-tap detection
canvas.addEventListener('dblclick', (ev)=> { undo(); });

// clicking near center handle finalizes a pending arc center quickly (optional convenience)
canvas.addEventListener('click', (ev)=>{
  if(arcTemp && preview && preview.type === 'arcAdjust'){
    const p = ptFromEvent(ev);
    const d = Math.hypot(p.x - preview.center.x, p.y - preview.center.y);
    if(d < 14){
      // commit arc
      pushHistory();
      const a = {
        type:'arc',
        p1: {...arcTemp.p1},
        p2: {...arcTemp.p2},
        center: {...preview.center},
        r: preview.r,
        startAngle: preview.startAngle,
        endAngle: preview.endAngle,
        cw: preview.cw
      };
      shapes.push(a);
      arcTemp = null; preview = null; draw();
    }
  }
});

// hit test for arc centers (returns index or null)
function hitTestCenter(p){
  for(let i = shapes.length-1; i>=0; i--){
    const s = shapes[i];
    if(s.type === 'arc'){
      if(Math.hypot(p.x - s.center.x, p.y - s.center.y) <= 10) return i;
    }
  }
  return null;
}

// draw on a temp context for exports
function drawShapesToContext(c){
  c.save();
  c.lineCap = 'round';
  for(const s of shapes){
    if(s.type === 'line'){
      c.beginPath(); c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2); c.lineWidth = 3; c.strokeStyle = '#6ee7b7'; c.stroke();
    } else if(s.type === 'arc'){
      c.beginPath(); c.arc(s.center.x, s.center.y, s.r, s.startAngle, s.endAngle, s.cw===false); c.lineWidth = 3; c.strokeStyle = '#ffd166'; c.stroke();
      // center handle
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s.center.x, s.center.y, 5, 0, Math.PI*2); c.fill();
    }
  }
  c.restore();
}

// initial draw
draw();
</script>
</body>
</html>
