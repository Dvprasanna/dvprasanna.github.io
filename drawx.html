<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Draw: X / Y / Arc — Working Build</title>
<style>
  :root{
    --bg:#0b1220;
    --panel: rgba(12,18,28,0.95);
    --fg:#e6eef6;
    --muted:#9fb3c9;
    --accent:#44d7b6;
    --xline:#6ee7b7;
    --arc:#ffd166;
  }
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg);color:var(--fg)}
  #toolbar{
    position:fixed; left:12px; top:12px; z-index:50;
    background:var(--panel); padding:8px; border-radius:10px; display:flex; gap:8px; align-items:center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }
  button.btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--fg);padding:8px 10px;border-radius:8px;cursor:pointer}
  button.btn.active{background:linear-gradient(90deg, rgba(68,215,182,0.12), rgba(68,215,182,0.06));outline:2px solid rgba(68,215,182,0.12)}
  .label{font-size:13px;color:var(--muted)}
  canvas{display:block; width:100vw; height:100vh; touch-action:none; cursor:crosshair}
  /* ensure toolbar doesn't let clicks fall through to canvas */
  #toolbar *{pointer-events:auto}
</style>
</head>
<body>
  <div id="toolbar">
    <button id="xBtn" class="btn">X Line</button>
    <button id="yBtn" class="btn">Y Line</button>
    <button id="arcBtn" class="btn">Arc</button>
    <div class="label">Mode: <strong id="modeText">idle</strong></div>
    <div style="width:10px"></div>
    <button id="undoBtn" class="btn">Undo</button>
    <button id="clearBtn" class="btn">Clear</button>
    <button id="jpegBtn" class="btn">Export JPEG</button>
    <button id="svgBtn" class="btn">Export SVG</button>
  </div>

  <canvas id="c" aria-label="drawing canvas"></canvas>

<script>
/* Working single-file drawing app
   - Buttons reliably switch mode
   - X Line (horizontal), Y Line (vertical), Arc (two-step: chord then move center)
   - Move arc center by grabbing white handle
   - Double-tap / dblclick = undo
   - Export JPEG / SVG
*/

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false }); // opaque canvas for stable JPEG
let DPR = window.devicePixelRatio || 1;

function resizeCanvas(){
  DPR = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * DPR);
  canvas.height = Math.round(innerHeight * DPR);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
addEventListener('resize', resizeCanvas, { passive: true });
resizeCanvas();

// UI elements
const xBtn = document.getElementById('xBtn');
const yBtn = document.getElementById('yBtn');
const arcBtn = document.getElementById('arcBtn');
const modeText = document.getElementById('modeText');
const undoBtn = document.getElementById('undoBtn');
const clearBtn = document.getElementById('clearBtn');
const jpegBtn = document.getElementById('jpegBtn');
const svgBtn = document.getElementById('svgBtn');

let mode = 'idle'; // 'idle' | 'x' | 'y' | 'arc'
function setMode(m){
  mode = m;
  modeText.textContent = m === 'idle' ? 'idle' : (m==='x'?'X Line':(m==='y'?'Y Line':'Arc'));
  [xBtn,yBtn,arcBtn].forEach(b=>b.classList.remove('active'));
  if(m==='x') xBtn.classList.add('active');
  if(m==='y') yBtn.classList.add('active');
  if(m==='arc') arcBtn.classList.add('active');
  // cancel active previews when switching
  preview = null; arcStage = null; draw();
}
xBtn.addEventListener('click', ()=> setMode(mode==='x' ? 'idle' : 'x'));
yBtn.addEventListener('click', ()=> setMode(mode==='y' ? 'idle' : 'y'));
arcBtn.addEventListener('click', ()=> setMode(mode==='arc' ? 'idle' : 'arc'));

undoBtn.addEventListener('click', undo);
clearBtn.addEventListener('click', ()=>{ shapes=[]; history=[]; preview=null; arcStage=null; draw(); });

// DATA
let shapes = []; // finalized shapes
/*
 shape formats:
  - {type:'line', x1,y1,x2,y2, orientation:'x'|'y'}
  - {type:'arc', p1:{x,y}, p2:{x,y}, center:{x,y}, r, startAngle, endAngle, cw}
*/
let history = []; // snapshots for undo (deep clones), limited

function pushHistory(){
  history.push(JSON.parse(JSON.stringify(shapes)));
  if(history.length>80) history.shift();
}
function undo(){
  if(history.length>0){
    shapes = history.pop();
  } else {
    shapes.pop();
  }
  preview = null; arcStage = null; draw();
}

// PREVIEW state during drawing
let preview = null; // object varies by type
let arcStage = null; // null or {phase:1|2, chord:{p1,p2}, tempCenter?}

// POINTER state
let activePointerId = null;
let isPointerDown = false;
let lastTap = 0;

// helpers
function p(e){ return {x: e.clientX, y: e.clientY}; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function angleBetween(c, p){ return Math.atan2(p.y-c.y, p.x-c.x); }

// DRAWING
function drawBackground(context){
  // fill background (not black) so JPEG visible
  context.fillStyle = '#0b1220';
  context.fillRect(0,0,innerWidth,innerHeight);
  // faint grid
  context.save();
  context.globalAlpha = 0.06;
  context.fillStyle = '#fff';
  for(let x=0;x<innerWidth;x+=24) context.fillRect(x,0,1,innerHeight);
  for(let y=0;y<innerHeight;y+=24) context.fillRect(0,y,innerWidth,1);
  context.restore();
}

function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  drawBackground(ctx);

  // draw shapes
  for(const s of shapes){
    if(s.type === 'line'){
      ctx.strokeStyle = '#6ee7b7';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
    } else if(s.type === 'arc'){
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.center.x, s.center.y, s.r, s.startAngle, s.endAngle, s.cw===false);
      ctx.stroke();
      // center handle
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.center.x, s.center.y, 5, 0, Math.PI*2); ctx.fill();
    }
  }

  // preview
  if(preview){
    ctx.save();
    if(preview.type === 'linePreview'){
      ctx.setLineDash([8,6]); ctx.lineWidth = 2; ctx.strokeStyle = '#7dd3fc';
      ctx.beginPath(); ctx.moveTo(preview.x1, preview.y1); ctx.lineTo(preview.x2, preview.y2); ctx.stroke();
    } else if(preview.type === 'arcChord'){
      ctx.setLineDash([8,6]); ctx.lineWidth = 2; ctx.strokeStyle = '#f472b6';
      ctx.beginPath(); ctx.moveTo(preview.p1.x, preview.p1.y); ctx.lineTo(preview.p2.x, preview.p2.y); ctx.stroke();
    } else if(preview.type === 'arcAdjust'){
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(preview.center.x, preview.center.y, preview.r, preview.startAngle, preview.endAngle, preview.cw===false);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(preview.center.x, preview.center.y, 6, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// HIT TEST for arc center handle
function hitCenter(p){
  for(let i=shapes.length-1;i>=0;i--){
    const s = shapes[i];
    if(s.type === 'arc'){
      if(Math.hypot(p.x - s.center.x, p.y - s.center.y) <= 10) return i;
    }
  }
  return -1;
}

// POINTER EVENTS (single set)
canvas.addEventListener('pointerdown', (ev)=>{
  ev.preventDefault();
  // if toolbar button clicked, don't start drawing (toolbar is separate element so this shouldn't fire)
  if(activePointerId !== null) return; // ignore multi-finger
  activePointerId = ev.pointerId;
  canvas.setPointerCapture(activePointerId);
  isPointerDown = true;

  const pos = p(ev);

  // double-tap detection for touch (or fast clicks)
  const now = performance.now();
  if(now - lastTap < 350){
    undo();
    lastTap = 0;
    // consume
    isPointerDown = false;
    try{ canvas.releasePointerCapture(activePointerId); }catch(e){}
    activePointerId = null;
    return;
  }
  lastTap = now;

  if(mode === 'x' || mode === 'y'){
    // start preview line
    preview = { type:'linePreview', x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y, orientation: mode };
  } else if(mode === 'arc'){
    // start chord (phase 1)
    arcStage = { phase:1, chord:{ p1: pos, p2: pos } };
    preview = { type:'arcChord', p1: arcStage.chord.p1, p2: arcStage.chord.p2 };
  } else { // idle - maybe begin moving arc center
    const hit = hitCenter(pos);
    if(hit >= 0){
      // start moving arc center for shape index = hit
      preview = { type:'arcAdjust', movingIndex: hit, center: { ...shapes[hit].center }, startOffset: { x: pos.x - shapes[hit].center.x, y: pos.y - shapes[hit].center.y }, r: shapes[hit].r, startAngle: shapes[hit].startAngle, endAngle: shapes[hit].endAngle, cw: shapes[hit].cw };
    } else {
      preview = null;
    }
  }
  draw();
});

canvas.addEventListener('pointermove', (ev)=>{
  if(!isPointerDown || ev.pointerId !== activePointerId) return;
  const pos = p(ev);

  if(preview && preview.type === 'linePreview'){
    if(preview.orientation === 'x'){
      preview.x2 = pos.x; preview.y2 = preview.y1;
    } else {
      preview.x2 = preview.x1; preview.y2 = pos.y;
    }
  } else if(preview && preview.type === 'arcChord' && arcStage && arcStage.phase === 1){
    arcStage.chord.p2 = pos;
    preview.p2 = pos;
  } else if(preview && preview.type === 'arcAdjust'){
    if(preview.movingIndex !== undefined && preview.movingIndex !== null){
      // moving existing arc center
      preview.center.x = pos.x - preview.startOffset.x;
      preview.center.y = pos.y - preview.startOffset.y;
      const s = shapes[preview.movingIndex];
      // recompute r and angles
      preview.r = Math.hypot(preview.center.x - s.p1.x, preview.center.y - s.p1.y);
      preview.startAngle = Math.atan2(s.p1.y - preview.center.y, s.p1.x - preview.center.x);
      preview.endAngle   = Math.atan2(s.p2.y - preview.center.y, s.p2.x - preview.center.x);
    } else if(arcStage && arcStage.phase === 2 && arcStage.chord){
      // adjusting center for new arc
      preview.center.x = pos.x;
      preview.center.y = pos.y;
      preview.r = Math.hypot(preview.center.x - arcStage.chord.p1.x, preview.center.y - arcStage.chord.p1.y);
      preview.startAngle = Math.atan2(arcStage.chord.p1.y - preview.center.y, arcStage.chord.p1.x - preview.center.x);
      preview.endAngle   = Math.atan2(arcStage.chord.p2.y - preview.center.y, arcStage.chord.p2.x - preview.center.x);
    }
  }
  draw();
});

canvas.addEventListener('pointerup', (ev)=>{
  if(ev.pointerId !== activePointerId) return;
  const pos = p(ev);
  // finalize behavior depends on preview state
  if(preview && preview.type === 'linePreview'){
    // finalize line
    pushHistory();
    const s = { type:'line', orientation: preview.orientation, x1: preview.x1, y1: preview.y1, x2: preview.x2, y2: preview.y2 };
    shapes.push(s);
    preview = null;
  } else if(preview && preview.type === 'arcChord' && arcStage && arcStage.phase === 1){
    // move to phase 2: create default center and allow adjust
    const p1 = arcStage.chord.p1, p2 = arcStage.chord.p2;
    if(dist(p1,p2) < 6){
      // ignore tiny chord
      preview = null; arcStage = null;
    } else {
      // default center: midpoint + perpendicular offset
      const mid = { x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 };
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.max(1, Math.hypot(dx,dy));
      const ux = -dy/len, uy = dx/len;
      const offset = Math.min(200, Math.max(24, len/3));
      const center = { x: mid.x + ux*offset, y: mid.y + uy*offset };
      const r = Math.hypot(center.x - p1.x, center.y - p1.y);
      const a1 = angleBetween(center, p1);
      const a2 = angleBetween(center, p2);
      // set up stage 2
      arcStage.phase = 2;
      arcStage.center = center;
      preview = { type:'arcAdjust', center: { ...center }, r, startAngle: a1, endAngle: a2, cw: false, movingIndex:null };
      // set mode to idle so further clicks don't start new shapes accidentally
      setMode('idle');
    }
  } else if(preview && preview.type === 'arcAdjust'){
    if(preview.movingIndex !== undefined && preview.movingIndex !== null){
      // commit moving existing arc center
      pushHistory();
      const idx = preview.movingIndex;
      shapes[idx].center = { x: preview.center.x, y: preview.center.y };
      shapes[idx].r = preview.r;
      shapes[idx].startAngle = preview.startAngle;
      shapes[idx].endAngle = preview.endAngle;
      preview = null;
    } else if(arcStage && arcStage.phase === 2){
      // finalize new arc
      pushHistory();
      const newArc = {
        type: 'arc',
        p1: { ...arcStage.chord.p1 },
        p2: { ...arcStage.chord.p2 },
        center: { ...preview.center },
        r: preview.r,
        startAngle: preview.startAngle,
        endAngle: preview.endAngle,
        cw: preview.cw
      };
      shapes.push(newArc);
      preview = null; arcStage = null;
    } else {
      preview = null;
    }
  } else {
    // nothing finalized
    preview = null;
  }

  // reset pointer state
  isPointerDown = false;
  try{ canvas.releasePointerCapture(activePointerId); }catch(e){}
  activePointerId = null;
  draw();
});

canvas.addEventListener('pointercancel', ()=>{
  isPointerDown = false; activePointerId = null; preview = null; arcStage = null; draw();
});

// dblclick fallback
canvas.addEventListener('dblclick', (ev)=> { undo(); });

// click to finalize arc quickly if clicking near center handle while arcStage active
canvas.addEventListener('click', (ev)=>{
  if(arcStage && arcStage.phase === 2 && preview && preview.type === 'arcAdjust'){
    const pos = p(ev);
    const d = Math.hypot(pos.x - preview.center.x, pos.y - preview.center.y);
    if(d < 14){
      // commit
      pushHistory();
      const newArc = {
        type: 'arc',
        p1: { ...arcStage.chord.p1 },
        p2: { ...arcStage.chord.p2 },
        center: { ...preview.center },
        r: preview.r,
        startAngle: preview.startAngle,
        endAngle: preview.endAngle,
        cw: preview.cw
      };
      shapes.push(newArc);
      preview = null; arcStage = null; draw();
    }
  }
});

// Export JPEG (raster) and SVG (vector)
jpegBtn.addEventListener('click', ()=>{
  // render into temporary canvas at device CSS pixels (not DPR scaled) for portable JPEG
  const t = document.createElement('canvas'); t.width = innerWidth; t.height = innerHeight;
  const tc = t.getContext('2d', { alpha: false });
  // background
  tc.fillStyle = '#0b1220'; tc.fillRect(0,0,t.width,t.height);
  // faint grid (same as main)
  tc.globalAlpha = 0.06; tc.fillStyle = '#fff';
  for(let x=0;x<t.width;x+=24) tc.fillRect(x,0,1,t.height);
  for(let y=0;y<t.height;y+=24) tc.fillRect(0,y,t.width,1);
  tc.globalAlpha = 1;
  // draw shapes
  for(const s of shapes){
    if(s.type === 'line'){
      tc.beginPath(); tc.moveTo(s.x1,s.y1); tc.lineTo(s.x2,s.y2); tc.lineWidth = 3; tc.strokeStyle = '#6ee7b7'; tc.stroke();
    } else if(s.type === 'arc'){
      tc.beginPath(); tc.arc(s.center.x,s.center.y,s.r,s.startAngle,s.endAngle,s.cw===false); tc.lineWidth=3; tc.strokeStyle='#ffd166'; tc.stroke();
      tc.fillStyle = '#fff'; tc.beginPath(); tc.arc(s.center.x, s.center.y, 5, 0, Math.PI*2); tc.fill();
    }
  }
  const link = document.createElement('a'); link.download = 'drawing.jpg';
  link.href = t.toDataURL('image/jpeg', 0.95); link.click();
});

svgBtn.addEventListener('click', ()=>{
  const w = innerWidth, h = innerHeight;
  const ns = 'http://www.w3.org/2000/svg';
  const parts = [];
  parts.push(`<svg xmlns="${ns}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`);
  parts.push(`<rect width="100%" height="100%" fill="#0b1220"/>`);
  for(const s of shapes){
    if(s.type === 'line'){
      parts.push(`<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>`);
    } else if(s.type === 'arc'){
      const x1 = s.center.x + s.r * Math.cos(s.startAngle);
      const y1 = s.center.y + s.r * Math.sin(s.startAngle);
      const x2 = s.center.x + s.r * Math.cos(s.endAngle);
      const y2 = s.center.y + s.r * Math.sin(s.endAngle);
      let delta = s.endAngle - s.startAngle;
      if(!s.cw && delta < 0) delta += Math.PI*2;
      if(s.cw && delta > 0) delta -= Math.PI*2;
      const large = Math.abs(delta) > Math.PI ? 1 : 0;
      parts.push(`<path d="M ${x1} ${y1} A ${s.r} ${s.r} 0 ${large} ${s.cw?1:0} ${x2} ${y2}" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>`);
    }
  }
  parts.push('</svg>');
  const blob = new Blob([parts.join('\n')], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'drawing.svg'; a.click();
  URL.revokeObjectURL(url);
});

// initial draw
draw();

</script>
</body>
</html>
