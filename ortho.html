<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minimal Web CAD – Double Line</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
  touch-action: none;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}
#menu {
  position: absolute;
  background: #111;
  border: 1px solid #0f0;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  display: none;
  z-index: 100;
}
#menu div {
  padding: 6px 14px;
  cursor: pointer;
}
#menu div:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>

<script>
/* ========= SETUP ========= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;
ctx.lineCap = "round";

/* ========= STATE ========= */
let lines = [];

let baseOrigin = null;
let currentPoint = null;
let previewEnd = null;
let drawing = false;

let ORTHO = true;
let LENGTH = null;
let LOCKED_ANGLE = null;

/* DOUBLE LINE */
let DOUBLE = false;
let DOUBLE_OFFSET = 0;

/* ========= UTILS ========= */
function getPos(e) {
  if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  lines.forEach(l => {
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  });

  if (currentPoint && previewEnd) {
    ctx.beginPath();
    ctx.moveTo(currentPoint.x, currentPoint.y);
    ctx.lineTo(previewEnd.x, previewEnd.y);
    ctx.stroke();
  }

  if (baseOrigin) {
    ctx.fillStyle = "#00ff00";
    ctx.beginPath();
    ctx.arc(baseOrigin.x, baseOrigin.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function computeAngle(p1, cursor) {
  let dx = cursor.x - p1.x;
  let dy = cursor.y - p1.y;

  if (ORTHO) {
    if (Math.abs(dx) > Math.abs(dy)) return dx >= 0 ? 0 : Math.PI;
    return dy >= 0 ? Math.PI / 2 : -Math.PI / 2;
  }

  if (LOCKED_ANGLE === null) {
    const a = prompt("Angle (deg):", "0");
    if (a === null) return null;
    LOCKED_ANGLE = parseFloat(a) * Math.PI / 180;
  }

  let ang = LOCKED_ANGLE;
  if (dx * Math.cos(ang) + dy * Math.sin(ang) < 0) ang += Math.PI;
  return ang;
}

/* ========= DRAW ========= */
canvas.addEventListener("mousedown", e => {
  if (!LENGTH) return;
  const p = getPos(e);

  if (!baseOrigin) {
    baseOrigin = p;
    currentPoint = p;
  }
  drawing = true;
});

canvas.addEventListener("mousemove", e => {
  if (!drawing || !currentPoint) return;

  const ang = computeAngle(currentPoint, getPos(e));
  if (ang === null) return;

  previewEnd = {
    x: currentPoint.x + Math.cos(ang) * LENGTH,
    y: currentPoint.y + Math.sin(ang) * LENGTH
  };
  redraw();
});

canvas.addEventListener("mouseup", () => {
  if (!drawing || !currentPoint || !previewEnd) return;
  drawing = false;

  const dx = previewEnd.x - currentPoint.x;
  const dy = previewEnd.y - currentPoint.y;
  const len = Math.hypot(dx, dy);
  const nx = -dy / len;
  const ny = dx / len;

  if (DOUBLE) {
    // invisible middle line → two real lines
    lines.push(
      {
        x1: currentPoint.x + nx * DOUBLE_OFFSET,
        y1: currentPoint.y + ny * DOUBLE_OFFSET,
        x2: previewEnd.x + nx * DOUBLE_OFFSET,
        y2: previewEnd.y + ny * DOUBLE_OFFSET
      },
      {
        x1: currentPoint.x - nx * DOUBLE_OFFSET,
        y1: currentPoint.y - ny * DOUBLE_OFFSET,
        x2: previewEnd.x - nx * DOUBLE_OFFSET,
        y2: previewEnd.y - ny * DOUBLE_OFFSET
      }
    );
  } else {
    lines.push({
      x1: currentPoint.x,
      y1: currentPoint.y,
      x2: previewEnd.x,
      y2: previewEnd.y
    });
  }

  currentPoint = previewEnd;
  previewEnd = null;
  LOCKED_ANGLE = null;
  redraw();
});

/* ========= MENU ========= */
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.style.display = "block";
  menu.innerHTML = `
    <div onclick="ORTHO=!ORTHO">Ortho</div>
    <div onclick="setLength()">Length</div>
    <div onclick="toggleDouble()">Double Line</div>
    <div onclick="offsetFromOrigin()">Offset (Origin)</div>
    <div onclick="undo()">Undo</div>
    <div onclick="clearAll()">Clear</div>
    <div onclick="endDraw()">End</div>
  `;
});
document.addEventListener("click", () => menu.style.display = "none");

/* ========= ACTIONS ========= */
function setLength() {
  const l = prompt("Length:", LENGTH || "");
  if (l !== null) LENGTH = parseFloat(l);
}

function toggleDouble() {
  DOUBLE = !DOUBLE;
  if (DOUBLE) {
    const d = prompt("Double line offset:", "5");
    if (d === null) { DOUBLE = false; return; }
    DOUBLE_OFFSET = parseFloat(d);
  }
}

function offsetFromOrigin() {
  if (!baseOrigin) return alert("Base origin not set");
  const ox = prompt("X offset:", "0");
  if (ox === null) return;
  const oy = prompt("Y offset:", "0");
  if (oy === null) return;

  currentPoint = {
    x: baseOrigin.x + parseFloat(ox),
    y: baseOrigin.y + parseFloat(oy)
  };
  redraw();
}

function undo() {
  lines.pop();
  redraw();
}

function clearAll() {
  lines = [];
  baseOrigin = null;
  currentPoint = null;
  previewEnd = null;
  redraw();
}

function endDraw() {
  currentPoint = null;
  previewEnd = null;
  redraw();
}
</script>
</body>
</html>
