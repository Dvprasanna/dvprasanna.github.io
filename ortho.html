<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L Shape Room – Ask Side</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}
#menu {
  position: absolute;
  background: #111;
  border: 1px solid #0f0;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  display: none;
  z-index: 1000;
}
#menu div {
  padding: 6px 12px;
  cursor: pointer;
}
#menu div:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;
ctx.lineCap = "round";

/* ================= STATE ================= */
let lines = [];
let drawing = false;

let startPoint = null;
let lastEndPoint = null;
let tempLine = null;

let OFFSET = 10; // wall thickness

/* ================= UTILS ================= */
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  lines.forEach(l => {
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  });

  if (tempLine) {
    ctx.beginPath();
    ctx.moveTo(tempLine.x1, tempLine.y1);
    ctx.lineTo(tempLine.x2, tempLine.y2);
    ctx.stroke();
  }
}

function askSide() {
  const s = prompt("Wall side? (L / R)", "L");
  if (!s) return null;
  return s.toUpperCase().startsWith("R") ? "R" : "L";
}

/* ================= DRAW ================= */
canvas.addEventListener("mousedown", e => {
  if (e.button !== 0) return;

  drawing = true;
  startPoint = lastEndPoint
    ? { ...lastEndPoint }
    : { x: e.clientX, y: e.clientY };
});

canvas.addEventListener("mousemove", e => {
  if (!drawing) return;

  tempLine = {
    x1: startPoint.x,
    y1: startPoint.y,
    x2: e.clientX,
    y2: e.clientY
  };
  redraw();
});

canvas.addEventListener("mouseup", e => {
  if (!drawing) return;
  drawing = false;

  const baseLine = {
    x1: startPoint.x,
    y1: startPoint.y,
    x2: e.clientX,
    y2: e.clientY
  };

  lines.push(baseLine); // visible reference line

  const side = askSide();
  if (side) {
    const dx = baseLine.x2 - baseLine.x1;
    const dy = baseLine.y2 - baseLine.y1;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      const nx = -dy / len;
      const ny = dx / len;
      const sign = side === "L" ? 1 : -1;

      lines.push({
        x1: baseLine.x1 + nx * OFFSET * sign,
        y1: baseLine.y1 + ny * OFFSET * sign,
        x2: baseLine.x2 + nx * OFFSET * sign,
        y2: baseLine.y2 + ny * OFFSET * sign
      });
    }
  }

  lastEndPoint = { x: baseLine.x2, y: baseLine.y2 };
  tempLine = null;
  redraw();
});

/* ================= RIGHT CLICK MENU ================= */
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.style.display = "block";
  menu.innerHTML = `
    <div onclick="setOffset()">Set Wall Thickness</div>
    <div onclick="undo()">Undo</div>
    <div onclick="clearAll()">Clear</div>
  `;
});

document.addEventListener("click", () => {
  menu.style.display = "none";
});

/* ================= MENU ACTIONS ================= */
function setOffset() {
  const v = prompt("Wall thickness:", OFFSET);
  if (v !== null && !isNaN(v)) OFFSET = parseFloat(v);
  menu.style.display = "none";
}

function undo() {
  lines.pop();
  redraw();
  menu.style.display = "none";
}

function clearAll() {
  lines = [];
  lastEndPoint = null;
  tempLine = null;
  redraw();
  menu.style.display = "none";
}
</script>
</body>
</html>
