<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wall CAD – Side Pick</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;
ctx.lineCap = "round";

/* ===== STATE ===== */
let lines = [];          // final geometry
let tempLine = null;     // last single line
let drawing = false;
let start = null;

let OFFSET = 15;         // wall thickness

/* ===== UTILS ===== */
function redraw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });
  if (tempLine) {
    ctx.beginPath();
    ctx.moveTo(tempLine.x1,tempLine.y1);
    ctx.lineTo(tempLine.x2,tempLine.y2);
    ctx.stroke();
  }
}

function distPointToLine(p, l) {
  const A = p.x - l.x1;
  const B = p.y - l.y1;
  const C = l.x2 - l.x1;
  const D = l.y2 - l.y1;
  return (A * D - B * C);
}

/* ===== DRAW SINGLE LINE ===== */
canvas.addEventListener("mousedown", e=>{
  drawing = true;
  start = {x:e.clientX,y:e.clientY};
});

canvas.addEventListener("mousemove", e=>{
  if(!drawing) return;
  tempLine = {
    x1:start.x, y1:start.y,
    x2:e.clientX, y2:e.clientY
  };
  redraw();
});

canvas.addEventListener("mouseup", e=>{
  drawing = false;
  tempLine = {
    x1:start.x, y1:start.y,
    x2:e.clientX, y2:e.clientY
  };
  lines.push(tempLine);     // visible single line
  redraw();
});

/* ===== DOUBLE CLICK = PICK SIDE ===== */
canvas.addEventListener("dblclick", e=>{
  if(!tempLine) return;

  const dx = tempLine.x2 - tempLine.x1;
  const dy = tempLine.y2 - tempLine.y1;
  const len = Math.hypot(dx,dy);

  const nx = -dy / len;
  const ny = dx / len;

  // which side user clicked
  const side = distPointToLine({x:e.clientX,y:e.clientY}, tempLine);

  const sign = side > 0 ? 1 : -1;

  const offsetLine = {
    x1: tempLine.x1 + nx * OFFSET * sign,
    y1: tempLine.y1 + ny * OFFSET * sign,
    x2: tempLine.x2 + nx * OFFSET * sign,
    y2: tempLine.y2 + ny * OFFSET * sign
  };

  lines.push(offsetLine);
  tempLine = null;
  redraw();
});
</script>
</body>
</html>
