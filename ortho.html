<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minimal CAD Polyline</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
  touch-action: none;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}
#menu {
  position: absolute;
  background: #111;
  border: 1px solid #0f0;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  display: none;
  z-index: 10;
}
#menu div {
  padding: 6px 12px;
  cursor: pointer;
}
#menu div:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;
ctx.lineCap = "round";

let lines = [];
let drawing = false;
let origin = null;
let previewEnd = null;

let ORTHO = true;
let LENGTH = null;

/* utils */
function getPos(e){
  if(e.touches) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  return {x:e.clientX,y:e.clientY};
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });
  if(origin && previewEnd){
    ctx.beginPath();
    ctx.moveTo(origin.x,origin.y);
    ctx.lineTo(previewEnd.x,previewEnd.y);
    ctx.stroke();
  }
}

function computeEnd(p1, cursor){
  let dx = cursor.x - p1.x;
  let dy = cursor.y - p1.y;

  if(ORTHO){
    if(Math.abs(dx) > Math.abs(dy)) dy = 0;
    else dx = 0;
  }

  const ang = Math.atan2(dy, dx);
  return {
    x: p1.x + Math.cos(ang) * LENGTH,
    y: p1.y + Math.sin(ang) * LENGTH
  };
}

/* drawing */
canvas.addEventListener("mousedown", e=>{
  if(!LENGTH) return;
  const p = getPos(e);
  if(!origin) origin = p;
  drawing = true;
});

canvas.addEventListener("mousemove", e=>{
  if(!drawing || !origin) return;
  previewEnd = computeEnd(origin, getPos(e));
  redraw();
});

canvas.addEventListener("mouseup", e=>{
  if(!drawing || !origin) return;
  drawing = false;
  const end = computeEnd(origin, getPos(e));
  lines.push({x1:origin.x,y1:origin.y,x2:end.x,y2:end.y});
  origin = end;        // CONTINUOUS
  previewEnd = null;
  redraw();
});

/* touch */
canvas.addEventListener("touchstart", e=>{
  if(!LENGTH) return;
  const p = getPos(e);
  if(!origin) origin = p;
  drawing = true;
});
canvas.addEventListener("touchmove", e=>{
  if(!drawing || !origin) return;
  previewEnd = computeEnd(origin, getPos(e));
  redraw();
});
canvas.addEventListener("touchend", ()=>{
  if(!drawing || !origin) return;
  drawing = false;
  lines.push({x1:origin.x,y1:origin.y,x2:previewEnd.x,y2:previewEnd.y});
  origin = previewEnd;
  previewEnd = null;
  redraw();
});

/* right click menu */
canvas.addEventListener("contextmenu", e=>{
  e.preventDefault();
  menu.style.left = e.clientX+"px";
  menu.style.top = e.clientY+"px";
  menu.style.display = "block";
  menu.innerHTML = `
    <div onclick="toggleOrtho()">Ortho</div>
    <div onclick="setLength()">Length</div>
    <div onclick="undo()">Undo</div>
    <div onclick="clearAll()">Clear</div>
    <div>Curve C</div>
    <div>Curve D</div>
    <div onclick="endDraw()">End</div>
  `;
});

document.addEventListener("click",()=>menu.style.display="none");

/* menu actions */
function toggleOrtho(){ ORTHO=!ORTHO; menu.style.display="none"; }
function setLength(){
  const l = prompt("Length:", LENGTH||"");
  if(l!==null) LENGTH=parseFloat(l);
  menu.style.display="none";
}
function undo(){ lines.pop(); redraw(); menu.style.display="none"; }
function clearAll(){ lines=[]; origin=null; redraw(); menu.style.display="none"; }
function endDraw(){ origin=null; previewEnd=null; redraw(); menu.style.display="none"; }
</script>
</body>
</html>
