<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L Shape Room – Corner Fixed</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}
#menu {
  position: absolute;
  background: #111;
  border: 1px solid #0f0;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  display: none;
  z-index: 1000;
}
#menu div {
  padding: 6px 12px;
  cursor: pointer;
}
#menu div:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;
ctx.lineCap = "round";

/* ================= STATE ================= */
let baseLines = [];     // user drawn reference lines
let wallLines = [];     // offset wall lines (joined)
let lastOffsetLine = null;

let drawing = false;
let startPoint = null;
let lastEndPoint = null;

let OFFSET = 12;

/* ================= UTILS ================= */
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  baseLines.forEach(l => drawLine(l));
  wallLines.forEach(l => drawLine(l));
}

function drawLine(l) {
  ctx.beginPath();
  ctx.moveTo(l.x1, l.y1);
  ctx.lineTo(l.x2, l.y2);
  ctx.stroke();
}

function intersect(l1, l2) {
  const x1=l1.x1,y1=l1.y1,x2=l1.x2,y2=l1.y2;
  const x3=l2.x1,y3=l2.y1,x4=l2.x2,y4=l2.y2;

  const d = (x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if (Math.abs(d) < 0.0001) return null;

  const px = (
    (x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4)
  ) / d;

  const py = (
    (x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4)
  ) / d;

  return { x: px, y: py };
}

function askSide() {
  const s = prompt("Wall side? (L / R)", "L");
  if (!s) return null;
  return s.toUpperCase().startsWith("R") ? -1 : 1;
}

/* ================= DRAW ================= */
canvas.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  drawing = true;
  startPoint = lastEndPoint
    ? { ...lastEndPoint }
    : { x: e.clientX, y: e.clientY };
});

canvas.addEventListener("mouseup", e => {
  if (!drawing) return;
  drawing = false;

  const base = {
    x1: startPoint.x,
    y1: startPoint.y,
    x2: e.clientX,
    y2: e.clientY
  };
  baseLines.push(base);

  const side = askSide();
  if (side !== null) {
    const dx = base.x2 - base.x1;
    const dy = base.y2 - base.y1;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      const nx = -dy / len;
      const ny = dx / len;

      let offset = {
        x1: base.x1 + nx * OFFSET * side,
        y1: base.y1 + ny * OFFSET * side,
        x2: base.x2 + nx * OFFSET * side,
        y2: base.y2 + ny * OFFSET * side
      };

      // 🔴 CORNER JOIN FIX
      if (lastOffsetLine) {
        const p = intersect(lastOffsetLine, offset);
        if (p) {
          lastOffsetLine.x2 = p.x;
          lastOffsetLine.y2 = p.y;
          offset.x1 = p.x;
          offset.y1 = p.y;
        }
      }

      wallLines.push(offset);
      lastOffsetLine = offset;
    }
  }

  lastEndPoint = { x: base.x2, y: base.y2 };
  redraw();
});

/* ================= RIGHT CLICK MENU ================= */
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.style.display = "block";
  menu.innerHTML = `
    <div onclick="setOffset()">Set Wall Thickness</div>
    <div onclick="undo()">Undo</div>
    <div onclick="clearAll()">Clear</div>
  `;
});

document.addEventListener("click", () => {
  menu.style.display = "none";
});

/* ================= MENU ACTIONS ================= */
function setOffset() {
  const v = prompt("Wall thickness:", OFFSET);
  if (v !== null && !isNaN(v)) OFFSET = parseFloat(v);
  menu.style.display = "none";
}

function undo() {
  baseLines.pop();
  wallLines.pop();
  lastOffsetLine = wallLines[wallLines.length - 1] || null;
  redraw();
  menu.style.display = "none";
}

function clearAll() {
  baseLines = [];
  wallLines = [];
  lastOffsetLine = null;
  lastEndPoint = null;
  redraw();
  menu.style.display = "none";
}
</script>
</body>
</html>
