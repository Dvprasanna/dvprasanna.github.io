<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room CAD – Inner Wall Logic</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}
#menu {
  position: absolute;
  background: #111;
  border: 1px solid #0f0;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  display: none;
  z-index: 1000;
}
#menu div {
  padding: 6px 12px;
  cursor: pointer;
}
#menu div:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>

<script>
/* ========== SETUP ========== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;

/* ========== STATE ========== */
let innerPts = [];     // user drawn inner wall polyline
let outerPts = [];     // generated outer wall
let drawing = false;

let WALL_THICKNESS = 12;

/* ========== UTILS ========== */
function redraw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawPolyline(innerPts);
  drawPolyline(outerPts);
}

function drawPolyline(pts) {
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.stroke();
}

function normalize(x,y) {
  const l = Math.hypot(x,y);
  return { x:x/l, y:y/l };
}

/* ========== GEOMETRY CORE ========== */
function rebuildOuterWall() {
  outerPts = [];
  if (innerPts.length < 2) return;

  const n = innerPts.length;
  const half = WALL_THICKNESS;

  // determine winding (shoelace)
  let area = 0;
  for (let i=0;i<n;i++) {
    const p = innerPts[i];
    const q = innerPts[(i+1)%n];
    area += (q.x-p.x)*(q.y+p.y);
  }
  const clockwise = area > 0;

  const offsetSegs = [];

  // offset each segment
  for (let i=0;i<n-1;i++) {
    const p1 = innerPts[i];
    const p2 = innerPts[i+1];
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const v = normalize(dx,dy);

    // outward normal
    const nx = clockwise ? v.y : -v.y;
    const ny = clockwise ? -v.x : v.x;

    offsetSegs.push({
      x1: p1.x + nx*half,
      y1: p1.y + ny*half,
      x2: p2.x + nx*half,
      y2: p2.y + ny*half
    });
  }

  // intersect adjacent offset segments
  for (let i=0;i<offsetSegs.length-1;i++) {
    const a = offsetSegs[i];
    const b = offsetSegs[i+1];
    const p = intersect(a,b);
    if (p) {
      a.x2 = p.x; a.y2 = p.y;
      b.x1 = p.x; b.y1 = p.y;
    }
  }

  // build outer polyline
  outerPts.push({x:offsetSegs[0].x1, y:offsetSegs[0].y1});
  offsetSegs.forEach(s=>{
    outerPts.push({x:s.x2, y:s.y2});
  });
}

function intersect(l1,l2) {
  const {x1,y1,x2,y2} = l1;
  const {x1:x3,y1:y3,x2:x4,y2:y4} = l2;
  const d = (x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if (Math.abs(d)<0.0001) return null;

  return {
    x: ((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/d,
    y: ((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/d
  };
}

/* ========== DRAWING ========== */
canvas.addEventListener("mousedown", e=>{
  if (!drawing) {
    innerPts.push({x:e.clientX,y:e.clientY});
    drawing = true;
  } else {
    innerPts.push({x:e.clientX,y:e.clientY});
    rebuildOuterWall();
  }
  redraw();
});

/* ========== MENU ========== */
canvas.addEventListener("contextmenu", e=>{
  e.preventDefault();
  menu.style.left = e.clientX+"px";
  menu.style.top = e.clientY+"px";
  menu.style.display = "block";
  menu.innerHTML = `
    <div onclick="setThickness()">Set Thickness</div>
    <div onclick="closeRoom()">Close Polyline</div>
    <div onclick="clearAll()">Clear</div>
  `;
});

document.addEventListener("click",()=>menu.style.display="none");

/* ========== ACTIONS ========== */
function setThickness() {
  const v = prompt("Wall thickness:", WALL_THICKNESS);
  if (v!==null) WALL_THICKNESS=parseFloat(v);
  rebuildOuterWall();
  redraw();
}

function closeRoom() {
  if (innerPts.length<3) return;
  innerPts.push({...innerPts[0]});
  rebuildOuterWall();
  redraw();
}

function clearAll() {
  innerPts=[];
  outerPts=[];
  drawing=false;
  redraw();
}
</script>
</body>
</html>
