<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room CAD – Ortho & Angle</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}
#menu {
  position: absolute;
  background: #111;
  border: 1px solid #0f0;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  display: none;
  z-index: 1000;
}
#menu div {
  padding: 6px 12px;
  cursor: pointer;
}
#menu div:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>

<script>
/* ===== SETUP ===== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;

/* ===== STATE ===== */
let innerPts = [];
let outerPts = [];
let drawing = false;
let preview = null;

let ORTHO = true;
let ANGLE = 0;              // degrees
let WALL = 12;
let innerClosed = false;

/* ===== UTILS ===== */
function redraw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawPoly(innerPts);
  drawPoly(outerPts);
  if (preview) drawLine(preview);
}

function drawPoly(pts) {
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

function drawLine(l) {
  ctx.beginPath();
  ctx.moveTo(l.x1,l.y1);
  ctx.lineTo(l.x2,l.y2);
  ctx.stroke();
}

function norm(dx,dy){
  const l=Math.hypot(dx,dy);
  return {x:dx/l,y:dy/l};
}

/* ===== GEOMETRY ===== */
function intersect(a,b){
  const d=(a.x1-a.x2)*(b.y1-b.y2)-(a.y1-a.y2)*(b.x1-b.x2);
  if(Math.abs(d)<1e-6) return null;
  return {
    x:((a.x1*a.y2-a.y1*a.x2)*(b.x1-b.x2)-(a.x1-a.x2)*(b.x1*b.y2-b.y1*b.x2))/d,
    y:((a.x1*a.y2-a.y1*a.x2)*(b.y1-b.y2)-(a.y1-a.y2)*(b.x1*b.y2-b.y1*b.x2))/d
  };
}

/* ===== OUTER WALL BUILD ===== */
function rebuildOuter(){
  outerPts=[];
  if(innerPts.length<2) return;

  const segs=[];
  const n=innerPts.length;

  // winding
  let area=0;
  for(let i=0;i<n-1;i++){
    const p=innerPts[i],q=innerPts[i+1];
    area+=(q.x-p.x)*(q.y+p.y);
  }
  const cw=area>0;

  for(let i=0;i<n-1;i++){
    const p1=innerPts[i],p2=innerPts[i+1];
    const v=norm(p2.x-p1.x,p2.y-p1.y);
    const nx=cw?v.y:-v.y;
    const ny=cw?-v.x:v.x;
    segs.push({
      x1:p1.x+nx*WALL,y1:p1.y+ny*WALL,
      x2:p2.x+nx*WALL,y2:p2.y+ny*WALL
    });
  }

  // join corners
  for(let i=0;i<segs.length-1;i++){
    const p=intersect(segs[i],segs[i+1]);
    if(p){
      segs[i].x2=p.x;segs[i].y2=p.y;
      segs[i+1].x1=p.x;segs[i+1].y1=p.y;
    }
  }

  // close outer if inner closed
  if(innerClosed && segs.length>2){
    const p=intersect(segs[segs.length-1],segs[0]);
    if(p){
      segs[segs.length-1].x2=p.x;
      segs[segs.length-1].y2=p.y;
      segs[0].x1=p.x;
      segs[0].y1=p.y;
    }
  }

  outerPts.push({x:segs[0].x1,y:segs[0].y1});
  segs.forEach(s=>outerPts.push({x:s.x2,y:s.y2}));
}

/* ===== DRAW INPUT ===== */
canvas.addEventListener("mousedown",e=>{
  if(innerClosed) return;
  if(!drawing){
    innerPts.push({x:e.clientX,y:e.clientY});
    drawing=true;
  }
});

canvas.addEventListener("mousemove",e=>{
  if(!drawing||innerPts.length===0) return;
  const p=innerPts[innerPts.length-1];
  let dx=e.clientX-p.x, dy=e.clientY-p.y;

  if(ORTHO){
    if(Math.abs(dx)>Math.abs(dy)) dy=0;
    else dx=0;
  }else{
    const a=ANGLE*Math.PI/180;
    const l=Math.hypot(dx,dy);
    dx=Math.cos(a)*l;
    dy=Math.sin(a)*l;
  }

  preview={x1:p.x,y1:p.y,x2:p.x+dx,y2:p.y+dy};
  redraw();
});

canvas.addEventListener("mouseup",()=>{
  if(!preview) return;
  innerPts.push({x:preview.x2,y:preview.y2});
  preview=null;
  rebuildOuter();
  redraw();
});

/* ===== MENU ===== */
canvas.addEventListener("contextmenu",e=>{
  e.preventDefault();
  menu.style.left=e.clientX+"px";
  menu.style.top=e.clientY+"px";
  menu.style.display="block";
  menu.innerHTML=`
    <div onclick="toggleOrtho()">Toggle Ortho</div>
    <div onclick="setAngle()">Set Angle</div>
    <div onclick="setWall()">Wall Thickness</div>
    <div onclick="closeRoom()">Close Room</div>
    <div onclick="clearAll()">Clear</div>
  `;
});

document.addEventListener("click",()=>menu.style.display="none");

/* ===== ACTIONS ===== */
function toggleOrtho(){ORTHO=!ORTHO;}
function setAngle(){
  const v=prompt("Angle (deg):",ANGLE);
  if(v!==null) ANGLE=parseFloat(v);
}
function setWall(){
  const v=prompt("Wall thickness:",WALL);
  if(v!==null) WALL=parseFloat(v);
  rebuildOuter(); redraw();
}
function closeRoom(){
  if(innerPts.length<3) return;
  innerPts.push({...innerPts[0]});
  innerClosed=true;
  rebuildOuter();
  redraw();
}
function clearAll(){
  innerPts=[]; outerPts=[];
  drawing=false; innerClosed=false;
  redraw();
}
</script>
</body>
</html>
