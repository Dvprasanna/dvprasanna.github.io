<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L Shape Room CAD</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}

/* Right click menu */
#menu {
  position: absolute;
  background: #111;
  border: 1px solid #0f0;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  display: none;
  z-index: 1000;
}
#menu div {
  padding: 6px 12px;
  cursor: pointer;
}
#menu div:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;
ctx.lineCap = "round";

/* ================= STATE ================= */
let lines = [];        // all permanent lines (walls)
let tempLine = null;   // current visible single line
let drawing = false;

let startPoint = null;
let lastEndPoint = null;

let OFFSET = 10;       // wall thickness

/* ================= UTILS ================= */
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  lines.forEach(l => {
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  });

  if (tempLine) {
    ctx.beginPath();
    ctx.moveTo(tempLine.x1, tempLine.y1);
    ctx.lineTo(tempLine.x2, tempLine.y2);
    ctx.stroke();
  }
}

function sideOfLine(p, l) {
  // cross product sign
  return (p.x - l.x1) * (l.y2 - l.y1) -
         (p.y - l.y1) * (l.x2 - l.x1);
}

/* ================= DRAW SINGLE LINE ================= */
canvas.addEventListener("mousedown", e => {
  if (e.button !== 0) return; // left mouse only

  drawing = true;

  // start from last endpoint if exists
  startPoint = lastEndPoint
    ? { ...lastEndPoint }
    : { x: e.clientX, y: e.clientY };
});

canvas.addEventListener("mousemove", e => {
  if (!drawing) return;

  tempLine = {
    x1: startPoint.x,
    y1: startPoint.y,
    x2: e.clientX,
    y2: e.clientY
  };
  redraw();
});

canvas.addEventListener("mouseup", e => {
  if (!drawing) return;
  drawing = false;

  tempLine = {
    x1: startPoint.x,
    y1: startPoint.y,
    x2: e.clientX,
    y2: e.clientY
  };

  lines.push(tempLine);          // visible reference line
  lastEndPoint = {               // chain next wall
    x: tempLine.x2,
    y: tempLine.y2
  };

  redraw();
});

/* ================= DOUBLE CLICK = PICK WALL SIDE ================= */
canvas.addEventListener("dblclick", e => {
  if (!tempLine) return;

  const dx = tempLine.x2 - tempLine.x1;
  const dy = tempLine.y2 - tempLine.y1;
  const len = Math.hypot(dx, dy);
  if (len === 0) return;

  const nx = -dy / len;
  const ny = dx / len;

  const side = sideOfLine(
    { x: e.clientX, y: e.clientY },
    tempLine
  );

  const sign = side > 0 ? 1 : -1;

  const offsetLine = {
    x1: tempLine.x1 + nx * OFFSET * sign,
    y1: tempLine.y1 + ny * OFFSET * sign,
    x2: tempLine.x2 + nx * OFFSET * sign,
    y2: tempLine.y2 + ny * OFFSET * sign
  };

  lines.push(offsetLine);
  tempLine = null;

  redraw();
});

/* ================= RIGHT CLICK MENU ================= */
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  showMenu(e.clientX, e.clientY);
});

function showMenu(x, y) {
  menu.style.left = x + "px";
  menu.style.top = y + "px";
  menu.style.display = "block";
  menu.innerHTML = `
    <div onclick="setOffset()">Set Wall Thickness</div>
    <div onclick="undo()">Undo</div>
    <div onclick="clearAll()">Clear</div>
  `;
}

document.addEventListener("click", () => {
  menu.style.display = "none";
});

/* ================= MENU ACTIONS ================= */
function setOffset() {
  const v = prompt("Wall thickness:", OFFSET);
  if (v !== null && !isNaN(v)) OFFSET = parseFloat(v);
  menu.style.display = "none";
}

function undo() {
  lines.pop();
  redraw();
  menu.style.display = "none";
}

function clearAll() {
  lines = [];
  tempLine = null;
  lastEndPoint = null;
  redraw();
  menu.style.display = "none";
}
</script>
</body>
</html>
