<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minimal CAD Polyline</title>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
  touch-action: none;
}
canvas {
  display: block;
  background: #000;
  border: 3px solid #00ff00;
}
#menu {
  position: absolute;
  background: #111;
  border: 1px solid #0f0;
  color: #0f0;
  font-family: monospace;
  font-size: 14px;
  display: none;
  z-index: 10;
}
#menu div {
  padding: 6px 12px;
  cursor: pointer;
}
#menu div:hover {
  background: #0f0;
  color: #000;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>

  <script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.strokeStyle = "#00ff00";
ctx.lineWidth = 2;
ctx.lineCap = "round";

let lines = [];
let drawing = false;
let origin = null;
let previewEnd = null;

let ORTHO = true;
let LENGTH = null;
let LOCKED_ANGLE = null;

/* utils */
function getPos(e){
  if(e.touches) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  return {x:e.clientX,y:e.clientY};
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });
  if(origin && previewEnd){
    ctx.beginPath();
    ctx.moveTo(origin.x,origin.y);
    ctx.lineTo(previewEnd.x,previewEnd.y);
    ctx.stroke();
  }
}

function computeEnd(p1, cursor){
  let dx = cursor.x - p1.x;
  let dy = cursor.y - p1.y;
  let ang;

  if (ORTHO) {
    if (Math.abs(dx) > Math.abs(dy)) {
      ang = dx >= 0 ? 0 : Math.PI;
    } else {
      ang = dy >= 0 ? Math.PI/2 : -Math.PI/2;
    }
  } else {
    if (LOCKED_ANGLE === null) {
      const a = prompt("Angle (deg):", "0");
      if (a === null) return null;
      LOCKED_ANGLE = parseFloat(a) * Math.PI / 180;
    }
    ang = LOCKED_ANGLE;

    // flip direction if dragging opposite
    if ((dx * Math.cos(ang) + dy * Math.sin(ang)) < 0) {
      ang += Math.PI;
    }
  }

  return {
    x: p1.x + Math.cos(ang) * LENGTH,
    y: p1.y + Math.sin(ang) * LENGTH
  };
}

/* drawing */
canvas.addEventListener("mousedown", e=>{
  if(!LENGTH) return;
  if(!origin) origin = getPos(e);
  drawing = true;
});

canvas.addEventListener("mousemove", e=>{
  if(!drawing || !origin) return;
  const end = computeEnd(origin, getPos(e));
  if(!end) return;
  previewEnd = end;
  redraw();
});

canvas.addEventListener("mouseup", e=>{
  if(!drawing || !origin) return;
  drawing = false;
  if(!previewEnd) return;
  lines.push({x1:origin.x,y1:origin.y,x2:previewEnd.x,y2:previewEnd.y});
  origin = previewEnd;        // continuous
  previewEnd = null;
  LOCKED_ANGLE = null;        // reset for next segment
  redraw();
});

/* touch */
canvas.addEventListener("touchstart", e=>{
  if(!LENGTH) return;
  if(!origin) origin = getPos(e);
  drawing = true;
});
canvas.addEventListener("touchmove", e=>{
  if(!drawing || !origin) return;
  const end = computeEnd(origin, getPos(e));
  if(!end) return;
  previewEnd = end;
  redraw();
});
canvas.addEventListener("touchend", ()=>{
  if(!drawing || !origin || !previewEnd) return;
  drawing = false;
  lines.push({x1:origin.x,y1:origin.y,x2:previewEnd.x,y2:previewEnd.y});
  origin = previewEnd;
  previewEnd = null;
  LOCKED_ANGLE = null;
  redraw();
});

/* menu */
canvas.addEventListener("contextmenu", e=>{
  e.preventDefault();
  menu.style.left = e.clientX+"px";
  menu.style.top = e.clientY+"px";
  menu.style.display = "block";
  menu.innerHTML = `
    <div onclick="ORTHO=!ORTHO">Ortho</div>
    <div onclick="setLength()">Length</div>
    <div onclick="undo()">Undo</div>
    <div onclick="clearAll()">Clear</div>
    <div onclick="endDraw()">End</div>
  `;
});
document.addEventListener("click",()=>menu.style.display="none");

/* actions */
function setLength(){
  const l = prompt("Length:", LENGTH||"");
  if(l!==null) LENGTH=parseFloat(l);
}
function undo(){ lines.pop(); redraw(); }
function clearAll(){ lines=[]; origin=null; redraw(); }
function endDraw(){ origin=null; previewEnd=null; redraw(); }
</script>
</body>
</html>
