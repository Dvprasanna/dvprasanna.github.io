<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Draw and Guess Game - Remembers Your Training!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 10px; touch-action: none; }
        h1 { color: #333; }
        canvas { border: 2px solid #333; background: white; touch-action: none; max-width: 100%; height: auto; }
        #controls { margin: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        #guesses { margin-top: 20px; font-size: 18px; min-height: 50px; }
        #status { font-style: italic; color: #666; }
    </style>
</head>
<body>
    <h1>Draw and Guess Game</h1>
    <p>Draw with your finger! This version <strong>remembers</strong> your training even if you close the browser.</p>
    
    <canvas id="canvas" width="280" height="280"></canvas>
    
    <div id="controls">
        <select id="classSelect">
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="cat">Cat</option>
            <option value="dog">Dog</option>
            <option value="house">House</option>
            <option value="tree">Tree</option>
            <option value="car">Car</option>
            <option value="sun">Sun</option>
        </select>
        <button id="addExample">Add Example</button>
        <button id="clear">Clear Canvas</button>
        <button id="predict">Guess My Drawing!</button>
        <button id="resetTraining">Reset All Training (Forget Everything)</button>
    </div>
    
    <div id="guesses"></div>
    <div id="status">Status: Loading...</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const guessesDiv = document.getElementById('guesses');
        const statusDiv = document.getElementById('status');
        let classifier = knnClassifier.create();
        let isDrawing = false;

        // LocalStorage key
        const STORAGE_KEY = 'drawGuessKnnData';

        async function init() {
            setupDrawing();
            await loadFromLocalStorage();
            statusDiv.textContent = 'Ready! Training data loaded if any existed.';
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getEventPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            e.preventDefault();
            if (!isDrawing) return;
            const pos = getEventPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            isDrawing = false;
        }

        function setupDrawing() {
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'black';

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            canvas.addEventListener('touchstart', startDrawing);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('touchcancel', stopDrawing);
        }

        document.getElementById('clear').onclick = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            guessesDiv.innerHTML = '';
        };

        document.getElementById('addExample').onclick = async () => {
            const imgData = getImageData();
            const classId = document.getElementById('classSelect').value;
            classifier.addExample(imgData, classId);
            await saveToLocalStorage();
            const num = await classifier.getNumExamples();
            statusDiv.textContent = `Added "${classId}". Total examples: ${num}`;
        };

        document.getElementById('predict').onclick = async () => {
            if (classifier.getNumClasses() === 0) {
                guessesDiv.textContent = 'No training yet! Add examples first.';
                return;
            }
            const imgData = getImageData();
            const result = await classifier.predictClass(imgData);
            guessesDiv.innerHTML = `<strong>Best guess:</strong> ${result.label} (${(result.confidences[result.label] * 100).toFixed(1)}%)<br><br><strong>Top 3:</strong><br>`;
            Object.entries(result.confidences)
                .sort((a, b) => b[1] - a[1])
