<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-Scale Mini Drafter</title>

<style>
body{
  margin:0;
  background:#d0d0d0;
  font-family:system-ui;
  touch-action:none;
}
#toolbar{
  height:48px;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  gap:14px;
  padding:6px 12px;
  font-size:14px;
}
button{
  background:#444;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:4px;
}
button.active{ background:#0aa; }
#info{
  margin-left:auto;
  font-family:monospace;
  opacity:0.9;
}
canvas{
  display:block;
  background:#fff;
}
#hud{
  position:absolute;
  top:60px;
  right:12px;
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:8px 10px;
  border-radius:6px;
  font:12px monospace;
  display:none;
}
</style>
</head>

<body>

<div id="toolbar">
  <button id="drawBtn" class="active">DRAW</button>
  <button id="moveBtn">MOVE DRAFTER</button>
  <button id="clearBtn">CLEAR</button>
  <div id="info"></div>
</div>

<div id="hud"></div>
<canvas id="c"></canvas>

<script>
/* =============================
   CONFIG
============================= */
const SNAP_UNIT = 10; // px snapping

/* =============================
   SETUP
============================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const info = document.getElementById("info");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight - 48;
  info.textContent = `DOC: ${canvas.width} × ${canvas.height} px`;
}
resize();
window.onresize = resize;

/* =============================
   MODE
============================= */
let MODE = "draw"; // draw | move

/* =============================
   L-SCALE STATE
============================= */
const L = {
  x: 260,
  y: 300,
  angle: 0,
  arm: 380,
  snapAngles: [0,30,45,60,90].map(a=>a*Math.PI/180)
};

/* =============================
   STATE
============================= */
let action = null;
let start = null;
let preview = null;
let dragStart = null;
let basePos = null;
let drawDir = null; // angle used for drawing

const lines = [];

/* =============================
   MATH
============================= */
function rot(x,y){
  const c=Math.cos(L.angle), s=Math.sin(L.angle);
  return { x:L.x+x*c-y*s, y:L.y+x*s+y*c };
}

function snapLen(v){
  return Math.round(v / SNAP_UNIT) * SNAP_UNIT;
}

function project(px,py,dir){
  const dx = px - L.x;
  const dy = py - L.y;
  let t = dx*Math.cos(dir) + dy*Math.sin(dir);
  t = snapLen(t);
  t = Math.max(0, Math.min(L.arm, t));
  return {
    x: L.x + Math.cos(dir)*t,
    y: L.y + Math.sin(dir)*t,
    t
  };
}

function dist(a,b){
  return Math.hypot(b.x-a.x,b.y-a.y);
}

/* =============================
   DRAW
============================= */
function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* Draw final lines */
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  /* Preview */
  if(preview){
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Drafter */
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = "#0077ff";
  ctx.lineWidth = 4;

  const o = rot(0,0);
  const h = rot(L.arm,0);
  const v = rot(0,-L.arm);

  ctx.beginPath();
  ctx.moveTo(o.x,o.y); ctx.lineTo(h.x,h.y);
  ctx.moveTo(o.x,o.y); ctx.lineTo(v.x,v.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(o.x,o.y,12,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

/* =============================
   POINTER
============================= */
canvas.addEventListener("pointerdown",e=>{
  const x=e.offsetX, y=e.offsetY;
  const o=rot(0,0);

  if(MODE==="move"){
    action = Math.abs(x-o.x)>Math.abs(y-o.y) ? "moveX" : "moveY";
    dragStart = {x,y};
    basePos = {x:L.x,y:L.y};
    return;
  }

  // DRAW MODE — choose nearest arm automatically
  const ph = project(x,y,L.angle);
  const pv = project(x,y,L.angle+Math.PI/2);

  const dh = Math.hypot(ph.x-x,ph.y-y);
  const dv = Math.hypot(pv.x-x,pv.y-y);

  drawDir = dh < dv ? L.angle : L.angle+Math.PI/2;
  start = project(x,y,drawDir);

  hud.style.display="block";
  action="draw";
});

canvas.addEventListener("pointermove",e=>{
  if(!action) return;
  const x=e.offsetX, y=e.offsetY;

  if(action==="moveX") L.x = basePos.x + (x - dragStart.x);
  if(action==="moveY") L.y = basePos.y + (y - dragStart.y);

  if(action==="draw"){
    const p = project(x,y,drawDir);
    preview = {x1:start.x,y1:start.y,x2:p.x,y2:p.y};
    hud.innerHTML =
      `Length: ${dist(start,p).toFixed(0)} px<br>`+
      `Angle: ${(drawDir*180/Math.PI).toFixed(0)}°`;
  }

  redraw();
});

canvas.addEventListener("pointerup",()=>{
  if(preview){
    lines.push(preview);
    preview=null;
    hud.style.display="none";
  }
  action=null;
  redraw();
});

/* =============================
   ROTATE (dbl click pivot)
============================= */
canvas.addEventListener("dblclick",e=>{
  if(MODE!=="move") return;
  const o=rot(0,0);
  if(Math.hypot(e.offsetX-o.x,e.offsetY-o.y)<15){
    const i=L.snapAngles.indexOf(L.angle);
    L.angle=L.snapAngles[(i+1)%L.snapAngles.length];
    redraw();
  }
});

/* =============================
   BUTTONS
============================= */
drawBtn.onclick=()=>{
  MODE="draw";
  drawBtn.classList.add("active");
  moveBtn.classList.remove("active");
};
moveBtn.onclick=()=>{
  MODE="move";
  moveBtn.classList.add("active");
  drawBtn.classList.remove("active");
};
clearBtn.onclick=()=>{
  lines.length=0;
  redraw();
};

redraw();

/* version: 8.0.0 */
</script>

</body>
</html>
