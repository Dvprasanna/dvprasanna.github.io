<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L-Scale Mini Drafter</title>

<style>
body{margin:0;background:#ccc;touch-action:none;font-family:system-ui}
#toolbar{
  height:42px;background:#222;color:#fff;
  display:flex;gap:6px;padding:6px
}
button,select{
  background:#444;color:#fff;border:none;
  padding:6px 10px;border-radius:4px
}
canvas{display:block;background:#fff}
</style>
</head>

<body>

<div id="toolbar">
  <button id="rotL">⟲</button>
  <button id="rotR">⟳</button>
  <select id="unit">
    <option value="px">px</option>
    <option value="mm">mm</option>
    <option value="in">inch</option>
  </select>
  <button id="clear">CLEAR</button>
</div>

<canvas id="c"></canvas>

<script>
/* =========================
   SETUP
========================= */
const c=document.getElementById("c");
const ctx=c.getContext("2d");

function resize(){
  c.width=window.innerWidth;
  c.height=window.innerHeight-42;
}
resize(); onresize=resize;

/* =========================
   L-SCALE STATE
========================= */
const L={
  x:150,
  y:150,
  angle:0,
  arm:300
};

let draggingScale=false;
let dragAxis=null;
let drawing=false;
let start=null;
const lines=[];

/* =========================
   SCALE CONFIG
========================= */
const DPI=96;
function unitScale(u){
  if(u==="mm") return DPI/25.4;
  if(u==="in") return DPI;
  return 10;
}

/* =========================
   MATH
========================= */
function rot(x,y){
  const cA=Math.cos(L.angle), sA=Math.sin(L.angle);
  return {
    x:L.x + x*cA - y*sA,
    y:L.y + x*sA + y*cA
  };
}

/* =========================
   DRAW L-SCALE
========================= */
function drawScale(){
  const s=unitScale(unit.value);

  ctx.lineWidth=2;
  ctx.strokeStyle="#000";

  // arms
  ctx.beginPath();
  ctx.moveTo(...Object.values(rot(0,0)));
  ctx.lineTo(...Object.values(rot(L.arm,0)));
  ctx.lineTo(...Object.values(rot(0,0)));
  ctx.lineTo(...Object.values(rot(0,L.arm)));
  ctx.stroke();

  // ticks
  ctx.font="10px monospace";
  for(let i=0;i<L.arm;i+=s){
    const p1=rot(i,0);
    const p2=rot(0,i);
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p1.x,p1.y-5);
    ctx.moveTo(p2.x,p2.y);
    ctx.lineTo(p2.x-5,p2.y);
    ctx.stroke();
    if(i%(s*10)===0){
      ctx.fillText(i/s, p1.x+2,p1.y-8);
      ctx.fillText(i/s, p2.x-18,p2.y+4);
    }
  }
}

/* =========================
   REDRAW
========================= */
function redraw(preview){
  ctx.clearRect(0,0,c.width,c.height);

  // lines
  for(let l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // preview
  if(preview){
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawScale();
}

/* =========================
   POINTER
========================= */
c.addEventListener("pointerdown",e=>{
  const dx=Math.abs(e.offsetX-L.x);
  const dy=Math.abs(e.offsetY-L.y);

  if(dx<15 && dy<15){
    draggingScale=true;
    dragAxis=dx>dy?"x":"y";
  }else{
    drawing=true;
    start={x:L.x,y:L.y};
  }
});

c.addEventListener("pointermove",e=>{
  if(draggingScale){
    if(dragAxis==="x") L.x=e.offsetX;
    else L.y=e.offsetY;
    redraw();
  }
  if(drawing){
    redraw({
      x1:start.x,y1:start.y,
      x2:e.offsetX,y2:e.offsetY
    });
  }
});

c.addEventListener("pointerup",e=>{
  if(drawing){
    lines.push({
      x1:start.x,y1:start.y,
      x2:e.offsetX,y2:e.offsetY
    });
  }
  draggingScale=false;
  drawing=false;
  redraw();
});

/* =========================
   CONTROLS
========================= */
rotL.onclick=()=>{L.angle-=Math.PI/12;redraw()};
rotR.onclick=()=>{L.angle+=Math.PI/12;redraw()};
unit.onchange=redraw;
clear.onclick=()=>{lines.length=0;redraw()};

redraw();

/* version: 3.0.0 */
</script>
</body>
</html>
