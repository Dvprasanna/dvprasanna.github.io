<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-Scale Mini Drafter</title>

<style>
body{
  margin:0;
  background:#d0d0d0;
  font-family:system-ui;
  touch-action:none;
}
#toolbar{
  height:48px;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  gap:14px;
  padding:6px 12px;
  font-size:14px;
}
#mode{
  font-weight:bold;
  color:#0ff;
}
#info{
  margin-left:auto;
  font-family:monospace;
}
canvas{
  display:block;
  background:#fff;
}
#hud{
  position:absolute;
  top:60px;
  right:12px;
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:8px 10px;
  border-radius:6px;
  font:12px monospace;
  display:none;
}
</style>
</head>

<body>

<div id="toolbar">
  MODE: <span id="mode">DRAW</span>
  <div id="info"></div>
</div>

<div id="hud"></div>
<canvas id="c"></canvas>

<script>
/* =============================
   CONFIG
============================= */
const SNAP_UNIT = 10; // px

/* =============================
   SETUP
============================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const info = document.getElementById("info");
const modeLabel = document.getElementById("mode");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight - 48;
  info.textContent = `DOC: ${canvas.width} × ${canvas.height} px`;
}
resize();
window.onresize = resize;

/* =============================
   MODE
============================= */
let MODE = "draw"; // draw | move
function toggleMode(){
  MODE = MODE === "draw" ? "move" : "draw";
  modeLabel.textContent = MODE.toUpperCase();
}

/* =============================
   L-SCALE STATE
============================= */
const L = {
  x: 260,
  y: 300,
  angle: 0,
  arm: 380,
  snapAngles: [0,30,45,60,90].map(a=>a*Math.PI/180)
};

/* =============================
   STATE
============================= */
let action = null;
let start = null;
let preview = null;
let dragStart = null;
let basePos = null;
let drawDir = null;
const lines = [];

/* =============================
   MATH
============================= */
function snap(v){
  return Math.round(v / SNAP_UNIT) * SNAP_UNIT;
}

function project(px,py,dir){
  const dx = px - L.x;
  const dy = py - L.y;
  let t = dx*Math.cos(dir) + dy*Math.sin(dir);
  t = snap(t);
  t = Math.max(0, Math.min(L.arm, t));
  return {
    x: L.x + Math.cos(dir)*t,
    y: L.y + Math.sin(dir)*t,
    t
  };
}

function dist(a,b){
  return Math.hypot(b.x-a.x,b.y-a.y);
}

/* =============================
   DRAW
============================= */
function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Final lines
  ctx.strokeStyle="#000";
  ctx.lineWidth=2;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // Preview
  if(preview){
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Drafter (both arms positive)
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.strokeStyle="#0077ff";
  ctx.lineWidth=4;

  const ox=L.x, oy=L.y;
  const hx=ox+Math.cos(L.angle)*L.arm;
  const hy=oy+Math.sin(L.angle)*L.arm;
  const vx=ox+Math.cos(L.angle+Math.PI/2)*L.arm;
  const vy=oy+Math.sin(L.angle+Math.PI/2)*L.arm;

  ctx.beginPath();
  ctx.moveTo(ox,oy); ctx.lineTo(hx,hy);
  ctx.moveTo(ox,oy); ctx.lineTo(vx,vy);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(ox,oy,12,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

/* =============================
   POINTER
============================= */
canvas.addEventListener("pointerdown",e=>{
  const x=e.offsetX, y=e.offsetY;

  if(MODE==="move"){
    action = Math.abs(x-L.x) > Math.abs(y-L.y) ? "moveX" : "moveY";
    dragStart={x,y};
    basePos={x:L.x,y:L.y};
    return;
  }

  // DRAW MODE — auto choose nearest arm
  const ph = project(x,y,L.angle);
  const pv = project(x,y,L.angle+Math.PI/2);
  const dh = Math.hypot(ph.x-x,ph.y-y);
  const dv = Math.hypot(pv.x-x,pv.y-y);

  drawDir = dh < dv ? L.angle : L.angle+Math.PI/2;
  start = project(x,y,drawDir);
  action="draw";
  hud.style.display="block";
});

canvas.addEventListener("pointermove",e=>{
  if(!action) return;
  const x=e.offsetX, y=e.offsetY;

  if(action==="moveX") L.x = basePos.x + (x-dragStart.x);
  if(action==="moveY") L.y = basePos.y + (y-dragStart.y);

  if(action==="draw"){
    const p = project(x,y,drawDir);
    preview={x1:start.x,y1:start.y,x2:p.x,y2:p.y};
    hud.innerHTML=
      `Length: ${dist(start,p).toFixed(0)} px<br>`+
      `Angle: ${(drawDir*180/Math.PI).toFixed(0)}°`;
  }

  redraw();
});

canvas.addEventListener("pointerup",()=>{
  if(preview){
    lines.push(preview);
    preview=null;
    hud.style.display="none";
  }
  action=null;
  redraw();
});

/* =============================
   DOUBLE CLICK = MODE SWITCH
============================= */
canvas.addEventListener("dblclick",()=>{
  toggleMode();
});

/* =============================
   INIT
============================= */
redraw();

/* version: 9.0.0 */
</script>

</body>
</html>
