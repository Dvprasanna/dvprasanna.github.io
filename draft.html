<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JS Mini Drafter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f4f4f4;
    font-family: system-ui, sans-serif;
    touch-action: none;
  }
  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #222;
    color: #fff;
    display: flex;
    gap: 6px;
    padding: 6px;
    z-index: 10;
  }
  button {
    background: #444;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
  }
  button.active {
    background: #0aa;
  }
  canvas {
    display: block;
    margin-top: 44px;
    background: #fff;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="orthoBtn">ORTHO</button>
  <button id="angleBtn">ANGLE</button>
  <button id="parallelBtn">PARALLEL</button>
  <button id="thickBtn">THICK</button>
  <button id="clearBtn">CLEAR</button>
</div>

<canvas id="c"></canvas>

<script>
/* =========================
   CANVAS SETUP
========================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 44;
}
resize();
window.addEventListener("resize", resize);

/* =========================
   STATE
========================= */
let start = null;
let current = null;
let drawing = false;

let ortho = false;
let angleLock = true;
let parallel = false;
let thick = false;

let lastAngle = 0;
const lines = [];
const snapPoints = [];

/* =========================
   ENGINEERING ANGLES
========================= */
const ANGLES = [0,30,45,60,90,120,135,150,180].map(
  a => a * Math.PI / 180
);

/* =========================
   VECTOR CONSTRAINTS
========================= */
function orthoVector(dx, dy) {
  return Math.abs(dx) > Math.abs(dy)
    ? { dx, dy: 0 }
    : { dx: 0, dy };
}

function snapVector(dx, dy) {
  const len = Math.hypot(dx, dy);
  if (!len) return { dx: 0, dy: 0, angle: 0 };

  const a = Math.atan2(dy, dx);
  let best = ANGLES[0];
  let min = Infinity;

  for (let ang of ANGLES) {
    const d = Math.abs(Math.atan2(Math.sin(a-ang), Math.cos(a-ang)));
    if (d < min) {
      min = d;
      best = ang;
    }
  }
  return {
    dx: Math.cos(best) * len,
    dy: Math.sin(best) * len,
    angle: best
  };
}

function parallelVector(dx, dy) {
  const len = Math.hypot(dx, dy);
  return {
    dx: Math.cos(lastAngle) * len,
    dy: Math.sin(lastAngle) * len,
    angle: lastAngle
  };
}

/* =========================
   SNAP POINTS
========================= */
function snapPoint(x, y) {
  for (let p of snapPoints) {
    if (Math.hypot(p.x - x, p.y - y) < 12) {
      return { x: p.x, y: p.y };
    }
  }
  return { x, y };
}

/* =========================
   DRAWING
========================= */
function redraw(preview) {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // existing lines
  for (let l of lines) {
    ctx.lineWidth = l.thick ? 4 : 2;
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  }

  // preview line
  if (preview) {
    ctx.setLineDash([6,4]);
    ctx.lineWidth = thick ? 4 : 2;
    ctx.beginPath();
    ctx.moveTo(preview.x1, preview.y1);
    ctx.lineTo(preview.x2, preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* =========================
   POINTER EVENTS
========================= */
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.touches ? e.touches[0].clientX : e.clientX) - r.left,
    y: (e.touches ? e.touches[0].clientY : e.clientY) - r.top
  };
}

canvas.addEventListener("pointerdown", e => {
  const p = snapPoint(...Object.values(pos(e)));
  start = p;
  drawing = true;
});

canvas.addEventListener("pointermove", e => {
  if (!drawing) return;
  let p = pos(e);
  let dx = p.x - start.x;
  let dy = p.y - start.y;

  let v = { dx, dy };

  if (ortho) v = orthoVector(v.dx, v.dy);
  if (angleLock) v = snapVector(v.dx, v.dy);
  if (parallel) v = parallelVector(v.dx, v.dy);

  current = {
    x1: start.x,
    y1: start.y,
    x2: start.x + v.dx,
    y2: start.y + v.dy,
    angle: v.angle ?? lastAngle
  };
  redraw(current);
});

canvas.addEventListener("pointerup", () => {
  if (!current) return;

  lines.push({
    ...current,
    thick
  });

  snapPoints.push(
    { x: current.x1, y: current.y1 },
    { x: current.x2, y: current.y2 }
  );

  lastAngle = current.angle;
  start = current = null;
  drawing = false;
  redraw();
});

/* =========================
   TOOLBAR
========================= */
function toggle(btn, cb) {
  btn.classList.toggle("active");
  cb();
}

document.getElementById("orthoBtn").onclick =
  e => toggle(e.target, () => ortho = !ortho);

document.getElementById("angleBtn").onclick =
  e => toggle(e.target, () => angleLock = !angleLock);

document.getElementById("parallelBtn").onclick =
  e => toggle(e.target, () => parallel = !parallel);

document.getElementById("thickBtn").onclick =
  e => toggle(e.target, () => thick = !thick);

document.getElementById("clearBtn").onclick = () => {
  lines.length = 0;
  snapPoints.length = 0;
  redraw();
};

redraw();

/* version: 1.0.0 */
</script>
</body>
</html>
