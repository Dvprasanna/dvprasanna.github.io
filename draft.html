<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-Scale Mini Drafter</title>

<style>
body{
  margin:0;
  background:#d0d0d0;
  font-family:system-ui;
  touch-action:none;
}
#toolbar{
  height:48px;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  gap:14px;
  padding:6px 12px;
  font-size:14px;
}
#mode{ color:#0ff; font-weight:bold; }
#info{ margin-left:auto; font-family:monospace; }
canvas{ display:block; background:#fff; }
#hud{
  position:absolute;
  top:60px;
  right:12px;
  background:rgba(0,0,0,0.8);
  color:#fff;
  padding:8px 10px;
  border-radius:6px;
  font:12px monospace;
  display:none;
}
</style>
</head>

<body>

<div id="toolbar">
  MODE: <span id="mode">DRAW</span>
  <div id="info"></div>
</div>

<div id="hud"></div>
<canvas id="c"></canvas>

<script>
/* ================= CONFIG ================= */
const SNAP_UNIT = 10;
const DOUBLE_TAP_TIME = 300;
const LONG_PRESS_TIME = 500;
const ARM_WIDTH = 18;   // visual thickness of L-scale

/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const info = document.getElementById("info");
const modeLabel = document.getElementById("mode");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight - 48;
  info.textContent = `DOC: ${canvas.width} × ${canvas.height} px`;
}
resize(); onresize = resize;

/* ================= MODE ================= */
let MODE = "draw";
function toggleMode(){
  MODE = MODE === "draw" ? "move" : "draw";
  modeLabel.textContent = MODE.toUpperCase();
}

/* ================= L-SCALE ================= */
const ANGLES = [0,30,45,60,90].map(a=>a*Math.PI/180);
const L = {
  x: 240,
  y: 300,
  angleIndex: 0,
  arm: 380
};

/* ================= STATE ================= */
let action=null;
let preview=null;
let dragStart=null;
let basePos=null;
let drawDir=null;
let pressTimer=null;
let longPress=false;
let lastTapTime=0;
let lastTapPos=null;

const lines=[];

/* ================= MATH ================= */
function snap(v){
  return Math.round(v / SNAP_UNIT) * SNAP_UNIT;
}

function projectFromOrigin(px,py,dir){
  const dx=px-L.x, dy=py-L.y;
  let t = dx*Math.cos(dir)+dy*Math.sin(dir);
  t = snap(t);
  t = Math.max(0,Math.min(L.arm,t));
  return {
    x: L.x + Math.cos(dir)*t,
    y: L.y + Math.sin(dir)*t,
    len: t
  };
}

/* ================= DRAW L-SCALE (REAL SHAPE) ================= */
function drawArm(x,y,dir){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(dir);
  ctx.beginPath();
  ctx.rect(0,-ARM_WIDTH/2,L.arm,ARM_WIDTH);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // drawn lines
  ctx.strokeStyle="#000";
  ctx.lineWidth=2;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // preview
  if(preview){
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // L-scale (solid shape)
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle="#4da3ff";
  ctx.strokeStyle="#1e6fd9";
  ctx.lineWidth=2;

  const a=ANGLES[L.angleIndex];
  drawArm(L.x,L.y,a);
  drawArm(L.x,L.y,a+Math.PI/2);

  // pivot
  ctx.beginPath();
  ctx.arc(L.x,L.y,12,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

/* ================= POINTER ================= */
canvas.addEventListener("pointerdown",e=>{
  const x=e.offsetX, y=e.offsetY;
  const now=Date.now();

  // double tap → mode switch
  if(
    lastTapPos &&
    now-lastTapTime<DOUBLE_TAP_TIME &&
    Math.hypot(x-lastTapPos.x,y-lastTapPos.y)<20
  ){
    toggleMode();
    lastTapTime=0;
    lastTapPos=null;
    redraw();
    return;
  }
  lastTapTime=now;
  lastTapPos={x,y};

  // long press on pivot → angle
  longPress=false;
  if(Math.hypot(x-L.x,y-L.y)<15){
    pressTimer=setTimeout(()=>{
      longPress=true;
      L.angleIndex=(L.angleIndex+1)%ANGLES.length;
      redraw();
    },LONG_PRESS_TIME);
  }

  if(MODE==="move"){
    action = Math.abs(x-L.x)>Math.abs(y-L.y)?"moveX":"moveY";
    dragStart={x,y};
    basePos={x:L.x,y:L.y};
    hud.style.display="block";
    return;
  }

  // DRAW MODE (origin only)
  const a=ANGLES[L.angleIndex];
  const p1=projectFromOrigin(x,y,a);
  const p2=projectFromOrigin(x,y,a+Math.PI/2);
  drawDir = Math.abs(p1.len)>Math.abs(p2.len)?a:a+Math.PI/2;
  action="draw";
  hud.style.display="block";
});

canvas.addEventListener("pointermove",e=>{
  if(!action) return;
  const x=e.offsetX, y=e.offsetY;

  if(action==="moveX"){
    L.x = basePos.x + (x-dragStart.x);
    hud.innerHTML=`Move X: ${(L.x-basePos.x)|0} px`;
  }
  if(action==="moveY"){
    L.y = basePos.y + (y-dragStart.y);
    hud.innerHTML=`Move Y: ${(L.y-basePos.y)|0} px`;
  }

  if(action==="draw"){
    const p=projectFromOrigin(x,y,drawDir);
    preview={x1:L.x,y1:L.y,x2:p.x,y2:p.y};
    hud.innerHTML=`Length: ${p.len}px<br>Angle: ${(drawDir*180/Math.PI)|0}°`;
  }

  redraw();
});

canvas.addEventListener("pointerup",()=>{
  clearTimeout(pressTimer);
  if(action==="draw" && preview && !longPress){
    lines.push(preview);
  }
  preview=null;
  action=null;
  hud.style.display="none";
  redraw();
});

/* ================= INIT ================= */
redraw();

/* version: 11.0.0 */
</script>

</body>
</html>
