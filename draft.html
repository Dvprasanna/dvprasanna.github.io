<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-Scale Mini Drafter</title>

<style>
body{
  margin:0;
  background:#cfcfcf;
  font-family:system-ui;
  touch-action:none;
}
#toolbar{
  height:44px;
  background:#222;
  color:#fff;
  display:flex;
  gap:8px;
  padding:6px;
}
button{
  background:#444;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:4px;
}
button.active{ background:#0aa; }
canvas{
  display:block;
  background:#fff;
}
#hud{
  position:absolute;
  top:54px;
  right:10px;
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:8px 10px;
  border-radius:6px;
  font:12px monospace;
  display:none;
}
</style>
</head>

<body>

<div id="toolbar">
  <button id="drawBtn" class="active">DRAW MODE</button>
  <button id="moveBtn">MOVE SCALE</button>
  <button id="clearBtn">CLEAR</button>
</div>

<div id="hud"></div>
<canvas id="c"></canvas>

<script>
/* =============================
   SETUP
============================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight - 44;
}
resize();
window.onresize = resize;

/* =============================
   MODE
============================= */
let MODE = "draw"; // draw | move

/* =============================
   L-SCALE STATE
============================= */
const L = {
  x: 260,
  y: 340,
  angle: 0,
  arm: 360,
  snapAngles: [0,30,45,60,90].map(a=>a*Math.PI/180)
};

/* =============================
   STATE
============================= */
let action = null;      // drawH | drawV | moveX | moveY
let start = null;
let preview = null;
let dragStart = null;
let basePos = null;

const lines = [];

/* =============================
   MATH HELPERS
============================= */
function rot(x,y){
  const c=Math.cos(L.angle), s=Math.sin(L.angle);
  return { x:L.x+x*c-y*s, y:L.y+x*s+y*c };
}

function project(px,py,dir){
  const dx = px - L.x;
  const dy = py - L.y;
  let t = dx*Math.cos(dir) + dy*Math.sin(dir);

  // CLAMP TO ARM LENGTH
  t = Math.max(0, Math.min(L.arm, t));

  return {
    x: L.x + Math.cos(dir)*t,
    y: L.y + Math.sin(dir)*t,
    t
  };
}

function dist(a,b){
  return Math.hypot(b.x-a.x,b.y-a.y);
}

/* =============================
   DRAW
============================= */
function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* Final lines */
  ctx.lineWidth = 2;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  /* Preview */
  if(preview){
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Semi-transparent drafter */
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 3;

  const o = rot(0,0);
  const h = rot(L.arm,0);
  const v = rot(0,-L.arm);

  ctx.beginPath();
  ctx.moveTo(o.x,o.y); ctx.lineTo(h.x,h.y);
  ctx.moveTo(o.x,o.y); ctx.lineTo(v.x,v.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(o.x,o.y,12,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

/* =============================
   POINTER EVENTS
============================= */
canvas.addEventListener("pointerdown",e=>{
  const x=e.offsetX, y=e.offsetY;
  const o=rot(0,0);

  /* MOVE MODE */
  if(MODE==="move"){
    action = Math.abs(x-o.x) > Math.abs(y-o.y) ? "moveX" : "moveY";
    dragStart = {x,y};
    basePos = {x:L.x, y:L.y};
    return;
  }

  /* DRAW MODE */
  const ph = project(x,y,L.angle);
  if(Math.hypot(ph.x-x,ph.y-y)<10){
    action="drawH";
    start=ph;
    hud.style.display="block";
    return;
  }

  const pv = project(x,y,L.angle+Math.PI/2);
  if(Math.hypot(pv.x-x,pv.y-y)<10){
    action="drawV";
    start=pv;
    hud.style.display="block";
    return;
  }
});

canvas.addEventListener("pointermove",e=>{
  if(!action) return;
  const x=e.offsetX, y=e.offsetY;

  /* Smooth scale movement */
  if(action==="moveX") L.x = basePos.x + (x - dragStart.x);
  if(action==="moveY") L.y = basePos.y + (y - dragStart.y);

  /* Drawing */
  if(action==="drawH"){
    const p=project(x,y,L.angle);
    preview={x1:start.x,y1:start.y,x2:p.x,y2:p.y};
    hud.innerHTML=`Length: ${dist(start,p).toFixed(1)} px<br>Angle: ${(L.angle*180/Math.PI).toFixed(0)}°`;
  }

  if(action==="drawV"){
    const p=project(x,y,L.angle+Math.PI/2);
    preview={x1:start.x,y1:start.y,x2:p.x,y2:p.y};
    hud.innerHTML=`Length: ${dist(start,p).toFixed(1)} px<br>Angle: ${((L.angle+Math.PI/2)*180/Math.PI).toFixed(0)}°`;
  }

  redraw();
});

canvas.addEventListener("pointerup",()=>{
  if(preview){
    lines.push(preview);
    preview=null;
    hud.style.display="none";
  }
  action=null;
  redraw();
});

/* =============================
   ROTATE SCALE (double click)
============================= */
canvas.addEventListener("dblclick",e=>{
  if(MODE!=="move") return;
  const o=rot(0,0);
  if(Math.hypot(e.offsetX-o.x,e.offsetY-o.y)<15){
    const i=L.snapAngles.indexOf(L.angle);
    L.angle=L.snapAngles[(i+1)%L.snapAngles.length];
    redraw();
  }
});

/* =============================
   BUTTONS
============================= */
drawBtn.onclick=()=>{
  MODE="draw";
  drawBtn.classList.add("active");
  moveBtn.classList.remove("active");
};

moveBtn.onclick=()=>{
  MODE="move";
  moveBtn.classList.add("active");
  drawBtn.classList.remove("active");
};

clearBtn.onclick=()=>{
  lines.length=0;
  redraw();
};

redraw();

/* version: 7.1.0 */
</script>

</body>
</html>
