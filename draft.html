<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JS Movable Ruler (Mini Drafter)</title>

<style>
body{margin:0;background:#ccc;touch-action:none;font-family:system-ui}
#toolbar{
  height:40px;background:#222;color:#fff;
  display:flex;gap:6px;padding:6px
}
button{background:#444;color:#fff;border:none;padding:6px 10px}
button.active{background:#0aa}
canvas{display:block;background:#fff}
</style>
</head>

<body>

<div id="toolbar">
  <button id="rotateL">⟲</button>
  <button id="rotateR">⟳</button>
  <button id="thick">THICK</button>
  <button id="clear">CLEAR</button>
</div>

<canvas id="c"></canvas>

<script>
/* =====================
   SETUP
===================== */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
  c.width=window.innerWidth;
  c.height=window.innerHeight-40;
}
resize();
onresize=resize;

/* =====================
   RULER STATE
===================== */
let ruler = {
  x: c.width/2,
  y: c.height/2,
  angle: 0
};

let draggingRuler=false;
let drawing=false;
let start=null;
let thick=false;

const lines=[];

/* =====================
   MATH
===================== */
function projectToRuler(px,py){
  const dx=px-ruler.x;
  const dy=py-ruler.y;
  const t = dx*Math.cos(ruler.angle)+dy*Math.sin(ruler.angle);
  return {
    x: ruler.x + Math.cos(ruler.angle)*t,
    y: ruler.y + Math.sin(ruler.angle)*t,
    t
  };
}

/* =====================
   DRAW
===================== */
function redraw(preview){
  ctx.clearRect(0,0,c.width,c.height);

  // drawn lines
  for(let l of lines){
    ctx.lineWidth=l.thick?4:2;
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // ruler
  ctx.lineWidth=1;
  ctx.setLineDash([8,6]);
  ctx.beginPath();
  ctx.moveTo(
    ruler.x - Math.cos(ruler.angle)*2000,
    ruler.y - Math.sin(ruler.angle)*2000
  );
  ctx.lineTo(
    ruler.x + Math.cos(ruler.angle)*2000,
    ruler.y + Math.sin(ruler.angle)*2000
  );
  ctx.stroke();
  ctx.setLineDash([]);

  // preview line
  if(preview){
    ctx.lineWidth=thick?4:2;
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* =====================
   POINTER
===================== */
c.addEventListener("pointerdown",e=>{
  const p={x:e.offsetX,y:e.offsetY};
  const d=Math.abs(
    (p.x-ruler.x)*Math.sin(ruler.angle) -
    (p.y-ruler.y)*Math.cos(ruler.angle)
  );

  if(d<10){
    draggingRuler=true;
  }else{
    drawing=true;
    start=projectToRuler(p.x,p.y);
  }
});

c.addEventListener("pointermove",e=>{
  const p={x:e.offsetX,y:e.offsetY};

  if(draggingRuler){
    ruler.x=p.x;
    ruler.y=p.y;
    redraw();
  }

  if(drawing){
    const end=projectToRuler(p.x,p.y);
    redraw({
      x1:start.x,y1:start.y,
      x2:end.x,y2:end.y
    });
  }
});

c.addEventListener("pointerup",e=>{
  if(drawing){
    const p={x:e.offsetX,y:e.offsetY};
    const end=projectToRuler(p.x,p.y);
    lines.push({
      x1:start.x,y1:start.y,
      x2:end.x,y2:end.y,
      thick
    });
  }
  draggingRuler=false;
  drawing=false;
  redraw();
});

/* =====================
   CONTROLS
===================== */
rotateL.onclick=()=>{ruler.angle-=Math.PI/180*5;redraw();}
rotateR.onclick=()=>{ruler.angle+=Math.PI/180*5;redraw();}
thick.onclick=e=>{thick=!thick;e.target.classList.toggle("active")}
clear.onclick=()=>{lines.length=0;redraw()}

redraw();

/* version: 2.0.0 */
</script>
</body>
</html>
