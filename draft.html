<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JS Mini Drafter with Ruler</title>

<style>
body {
  margin: 0;
  background: #ddd;
  font-family: system-ui;
  overflow: hidden;
}

#toolbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 40px;
  background: #222;
  color: #fff;
  display: flex;
  gap: 6px;
  padding: 5px;
  z-index: 10;
}

button {
  background: #444;
  color: #fff;
  border: none;
  padding: 5px 10px;
  border-radius: 4px;
}
button.active { background: #0aa; }

#board {
  position: absolute;
  top: 40px;
  left: 0;
  right: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: 40px 1fr;
  grid-template-rows: 40px 1fr;
}

#corner {
  background: #bbb;
}

canvas {
  display: block;
}

#rulerX {
  background: #f8f8f8;
}

#rulerY {
  background: #f8f8f8;
}

#draw {
  background: #fff;
}
</style>
</head>

<body>

<div id="toolbar">
  <button id="ortho">ORTHO</button>
  <button id="angle">ANGLE</button>
  <button id="parallel">PARALLEL</button>
  <button id="thick">THICK</button>
  <button id="clear">CLEAR</button>
</div>

<div id="board">
  <div id="corner"></div>
  <canvas id="rulerX"></canvas>
  <canvas id="rulerY"></canvas>
  <canvas id="draw"></canvas>
</div>

<script>
/* =======================
   SETUP
======================= */
const rX = rulerX.getContext("2d");
const rY = rulerY.getContext("2d");
const ctx = draw.getContext("2d");

function resize() {
  rulerX.width = draw.width = window.innerWidth - 40;
  rulerX.height = 40;
  rulerY.width = 40;
  rulerY.height = draw.height = window.innerHeight - 80;
}
resize();
window.onresize = resize;

/* =======================
   RULER DRAWING
======================= */
const scale = 10; // pixels per mm (visual scale)

function drawRulers() {
  rX.clearRect(0,0,rulerX.width,rulerX.height);
  rY.clearRect(0,0,rulerY.width,rulerY.height);

  rX.strokeStyle = rY.strokeStyle = "#000";
  rX.fillStyle = rY.fillStyle = "#000";
  rX.font = rY.font = "10px monospace";

  // horizontal ruler
  for (let x=0; x<rulerX.width; x+=scale) {
    let mm = x/scale;
    let h = mm%10===0 ? 18 : 10;
    rX.beginPath();
    rX.moveTo(x,40);
    rX.lineTo(x,40-h);
    rX.stroke();
    if (mm%10===0) rX.fillText(mm, x+2, 12);
  }

  // vertical ruler
  for (let y=0; y<rulerY.height; y+=scale) {
    let mm = y/scale;
    let w = mm%10===0 ? 18 : 10;
    rY.beginPath();
    rY.moveTo(40, y);
    rY.lineTo(40-w, y);
    rY.stroke();
    if (mm%10===0) rY.fillText(mm, 2, y-2);
  }
}
drawRulers();

/* =======================
   MINI DRAFTER ENGINE
======================= */
let ortho=false, angleLock=true, parallel=false, thick=false;
let start=null, current=null, lastAngle=0;
const lines=[], snaps=[];

const ANGLES=[0,30,45,60,90,120,135,150,180].map(a=>a*Math.PI/180);

function snapAngle(dx,dy){
  let len=Math.hypot(dx,dy);
  let a=Math.atan2(dy,dx);
  let best=ANGLES[0], min=1e9;
  for(let ang of ANGLES){
    let d=Math.abs(Math.atan2(Math.sin(a-ang),Math.cos(a-ang)));
    if(d<min){min=d;best=ang;}
  }
  return {dx:Math.cos(best)*len,dy:Math.sin(best)*len,angle:best};
}

function orthoVec(dx,dy){
  return Math.abs(dx)>Math.abs(dy)?{dx,dy:0}:{dx:0,dy};
}

/* =======================
   DRAWING
======================= */
function redraw(preview){
  ctx.clearRect(0,0,draw.width,draw.height);
  for(let l of lines){
    ctx.lineWidth=l.thick?4:2;
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }
  if(preview){
    ctx.setLineDash([5,4]);
    ctx.lineWidth=thick?4:2;
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

draw.addEventListener("pointerdown",e=>{
  start={x:e.offsetX,y:e.offsetY};
});

draw.addEventListener("pointermove",e=>{
  if(!start)return;
  let dx=e.offsetX-start.x;
  let dy=e.offsetY-start.y;
  let v={dx,dy};

  if(ortho)v=orthoVec(v.dx,v.dy);
  if(angleLock)v=snapAngle(v.dx,v.dy);

  current={
    x1:start.x,y1:start.y,
    x2:start.x+v.dx,y2:start.y+v.dy,
    angle:v.angle
  };
  redraw(current);
});

draw.addEventListener("pointerup",()=>{
  if(!current)return;
  lines.push({...current,thick});
  lastAngle=current.angle;
  start=current=null;
  redraw();
});

/* =======================
   TOOLBAR
======================= */
function toggle(id,ref){
  document.getElementById(id).onclick=e=>{
    ref.value=!ref.value;
    e.target.classList.toggle("active");
  };
}
toggle("ortho",{value:ortho});
toggle("angle",{value:angleLock});
toggle("parallel",{value:parallel});
toggle("thick",{value:thick});

clear.onclick=()=>{lines.length=0;redraw();};

/* version: 1.1.0 */
</script>

</body>
</html>
