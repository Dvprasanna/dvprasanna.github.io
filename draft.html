<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L-Scale Mini Drafter (Modes)</title>

<style>
body{
  margin:0;
  background:#ccc;
  font-family:system-ui;
  touch-action:none;
}
#toolbar{
  height:44px;
  background:#222;
  color:#fff;
  display:flex;
  gap:8px;
  padding:6px;
}
button{
  background:#444;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:4px;
}
button.active{
  background:#0aa;
}
canvas{
  display:block;
  background:#fff;
}
</style>
</head>

<body>

<div id="toolbar">
  <button id="drawBtn" class="active">DRAW MODE</button>
  <button id="moveBtn">MOVE SCALE</button>
  <button id="clearBtn">CLEAR</button>
</div>

<canvas id="c"></canvas>

<script>
/* =========================
   SETUP
========================= */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
  c.width = innerWidth;
  c.height = innerHeight - 44;
}
resize();
onresize = resize;

/* =========================
   MODE STATE
========================= */
let MODE = "draw"; // "draw" | "move"

/* =========================
   L-SCALE STATE
========================= */
const L = {
  x: 220,
  y: 300,
  angle: 0,
  arm: 360,
  snapAngles: [0,30,45,60,90].map(a=>a*Math.PI/180)
};

let action = null; // drawH | drawV | moveX | moveY
let start = null;
const lines = [];

/* =========================
   MATH
========================= */
function rot(x,y){
  const cA=Math.cos(L.angle), sA=Math.sin(L.angle);
  return {
    x: L.x + x*cA - y*sA,
    y: L.y + x*sA + y*cA
  };
}

function project(px,py,dir){
  const dx = px - L.x;
  const dy = py - L.y;
  const t = dx*Math.cos(dir) + dy*Math.sin(dir);
  return {
    x: L.x + Math.cos(dir)*t,
    y: L.y + Math.sin(dir)*t
  };
}

/* =========================
   DRAW
========================= */
function redraw(preview){
  ctx.clearRect(0,0,c.width,c.height);

  // drawn lines
  ctx.lineWidth = 2;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // preview
  if(preview){
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // scale arms
  ctx.lineWidth = 3;
  const o = rot(0,0);
  const h = rot(L.arm,0);
  const v = rot(0,-L.arm);

  ctx.beginPath();
  ctx.moveTo(o.x,o.y); ctx.lineTo(h.x,h.y);
  ctx.moveTo(o.x,o.y); ctx.lineTo(v.x,v.y);
  ctx.stroke();

  // pivot
  ctx.beginPath();
  ctx.arc(o.x,o.y,12,0,Math.PI*2);
  ctx.stroke();
}

/* =========================
   POINTER HANDLING
========================= */
c.addEventListener("pointerdown",e=>{
  const x=e.offsetX, y=e.offsetY;
  const o=rot(0,0);

  /* -------- MOVE MODE -------- */
  if(MODE==="move"){
    if(Math.hypot(x-o.x,y-o.y)<15){
      action="pivot";
      return;
    }
    action = Math.abs(x-o.x) > Math.abs(y-o.y) ? "moveX" : "moveY";
    return;
  }

  /* -------- DRAW MODE -------- */
  if(MODE==="draw"){
    const ph = project(x,y,L.angle);
    if(Math.hypot(ph.x-x,ph.y-y)<10){
      action="drawH";
      start=ph;
      return;
    }

    const pv = project(x,y,L.angle+Math.PI/2);
    if(Math.hypot(pv.x-x,pv.y-y)<10){
      action="drawV";
      start=pv;
      return;
    }
  }
});

c.addEventListener("pointermove",e=>{
  if(!action) return;
  const x=e.offsetX, y=e.offsetY;

  if(action==="moveX") L.x = x;
  if(action==="moveY") L.y = y;

  if(action==="drawH"){
    const p = project(x,y,L.angle);
    redraw({x1:start.x,y1:start.y,x2:p.x,y2:p.y});
    return;
  }

  if(action==="drawV"){
    const p = project(x,y,L.angle+Math.PI/2);
    redraw({x1:start.x,y1:start.y,x2:p.x,y2:p.y});
    return;
  }

  redraw();
});

c.addEventListener("pointerup",e=>{
  if(action==="drawH"){
    const p = project(e.offsetX,e.offsetY,L.angle);
    lines.push({x1:start.x,y1:start.y,x2:p.x,y2:p.y});
  }
  if(action==="drawV"){
    const p = project(e.offsetX,e.offsetY,L.angle+Math.PI/2);
    lines.push({x1:start.x,y1:start.y,x2:p.x,y2:p.y});
  }
  action=null;
  redraw();
});

/* =========================
   DOUBLE CLICK = ROTATE
========================= */
c.addEventListener("dblclick",e=>{
  if(MODE!=="move") return;
  const o=rot(0,0);
  if(Math.hypot(e.offsetX-o.x,e.offsetY-o.y)<15){
    const i=L.snapAngles.indexOf(L.angle);
    L.angle=L.snapAngles[(i+1)%L.snapAngles.length];
    redraw();
  }
});

/* =========================
   BUTTONS
========================= */
drawBtn.onclick=()=>{
  MODE="draw";
  drawBtn.classList.add("active");
  moveBtn.classList.remove("active");
};

moveBtn.onclick=()=>{
  MODE="move";
  moveBtn.classList.add("active");
  drawBtn.classList.remove("active");
};

clearBtn.onclick=()=>{
  lines.length=0;
  redraw();
};

redraw();

/* version: 5.0.0 */
</script>
</body>
</html>
