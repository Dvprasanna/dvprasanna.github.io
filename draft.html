<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L Scale – Parallel Only Drafter</title>

<style>
body{margin:0;background:#ccc;touch-action:none;font-family:system-ui}
#bar{height:40px;background:#222;color:#fff;padding:6px}
canvas{display:block;background:#fff}
</style>
</head>

<body>
<div id="bar">Double-tap circle → set angle snap</div>
<canvas id="c"></canvas>

<script>
/* =========================
   SETUP
========================= */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
  c.width = innerWidth;
  c.height = innerHeight - 40;
}
resize(); onresize = resize;

/* =========================
   L-SCALE STATE
========================= */
const L = {
  x: 200,
  y: 300,
  angle: 0,
  arm: 350,
  snapAngles: [0,30,45,60,90].map(a=>a*Math.PI/180)
};

let mode = null; // "moveX" | "moveY" | "drawH" | "drawV"
let start = null;
const lines = [];

/* =========================
   MATH HELPERS
========================= */
function rot(x,y){
  const cA=Math.cos(L.angle), sA=Math.sin(L.angle);
  return {
    x: L.x + x*cA - y*sA,
    y: L.y + x*sA + y*cA
  };
}

function proj(px,py,dir){
  const dx = px - L.x;
  const dy = py - L.y;
  const t = dx*Math.cos(dir) + dy*Math.sin(dir);
  return {
    x: L.x + Math.cos(dir)*t,
    y: L.y + Math.sin(dir)*t
  };
}

/* =========================
   DRAW
========================= */
function redraw(preview){
  ctx.clearRect(0,0,c.width,c.height);

  // drawn lines
  ctx.lineWidth = 2;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // preview
  if(preview){
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(preview.x1,preview.y1);
    ctx.lineTo(preview.x2,preview.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // L arms
  ctx.lineWidth = 3;
  ctx.beginPath();
  const o = rot(0,0);
  const h = rot(L.arm,0);
  const v = rot(0,-L.arm);
  ctx.moveTo(o.x,o.y); ctx.lineTo(h.x,h.y);
  ctx.moveTo(o.x,o.y); ctx.lineTo(v.x,v.y);
  ctx.stroke();

  // pivot circle
  ctx.beginPath();
  ctx.arc(o.x,o.y,12,0,Math.PI*2);
  ctx.stroke();
}

/* =========================
   POINTER
========================= */
c.addEventListener("pointerdown",e=>{
  const x=e.offsetX, y=e.offsetY;
  const o=rot(0,0);

  // pivot hit
  if(Math.hypot(x-o.x,y-o.y)<15){
    mode="pivot";
    return;
  }

  // near horizontal arm → draw parallel
  const ph = proj(x,y,L.angle);
  if(Math.hypot(ph.x-x,ph.y-y)<10){
    mode="drawH";
    start=ph;
    return;
  }

  // near vertical arm → draw parallel
  const pv = proj(x,y,L.angle+Math.PI/2);
  if(Math.hypot(pv.x-x,pv.y-y)<10){
    mode="drawV";
    start=pv;
    return;
  }

  // move scale (orthogonal only)
  mode = Math.abs(x-o.x) > Math.abs(y-o.y) ? "moveX" : "moveY";
});

c.addEventListener("pointermove",e=>{
  if(!mode) return;
  const x=e.offsetX, y=e.offsetY;

  if(mode==="moveX") L.x = x;
  if(mode==="moveY") L.y = y;

  if(mode==="drawH"){
    const p = proj(x,y,L.angle);
    redraw({x1:start.x,y1:start.y,x2:p.x,y2:p.y});
    return;
  }

  if(mode==="drawV"){
    const p = proj(x,y,L.angle+Math.PI/2);
    redraw({x1:start.x,y1:start.y,x2:p.x,y2:p.y});
    return;
  }

  redraw();
});

c.addEventListener("pointerup",e=>{
  if(mode==="drawH"){
    const p=proj(e.offsetX,e.offsetY,L.angle);
    lines.push({x1:start.x,y1:start.y,x2:p.x,y2:p.y});
  }
  if(mode==="drawV"){
    const p=proj(e.offsetX,e.offsetY,L.angle+Math.PI/2);
    lines.push({x1:start.x,y1:start.y,x2:p.x,y2:p.y});
  }
  mode=null;
  redraw();
});

/* =========================
   DOUBLE CLICK = ANGLE SNAP
========================= */
c.addEventListener("dblclick",e=>{
  const o=rot(0,0);
  if(Math.hypot(e.offsetX-o.x,e.offsetY-o.y)<15){
    const i=L.snapAngles.indexOf(L.angle);
    L.angle=L.snapAngles[(i+1)%L.snapAngles.length];
    redraw();
  }
});

redraw();

/* version: 4.0.0 */
</script>
</body>
</html>
