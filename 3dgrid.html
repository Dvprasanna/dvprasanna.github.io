<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Grid Test</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}
canvas { display: block; }
</style>
</head>
<body>
  v2.1
  
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
let radius = 35;
let theta = Math.PI / 4;
let phi = Math.PI / 4;

function updateCamera() {
  camera.position.set(
    radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
  camera.lookAt(0,0,0);
}
updateCamera();

/* RENDERER */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* GRID + AXES */
scene.add(new THREE.GridHelper(50, 50, 0x00ff00, 0x444444));
scene.add(new THREE.AxesHelper(10));

/* TEST CUBE */
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(2,2,2),
  new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
cube.position.y = 1;
scene.add(cube);

/* RENDER LOOP */
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

/* -------- INPUT -------- */
let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown", e=>{
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

renderer.domElement.addEventListener("pointerup", ()=> dragging=false);
renderer.domElement.addEventListener("pointerleave", ()=> dragging=false);

renderer.domElement.addEventListener("pointermove", e=>{
  if(!dragging) return;
  theta -= (e.clientX - lastX) * 0.005;
  phi   -= (e.clientY - lastY) * 0.005;
  phi = Math.max(0.1, Math.min(Math.PI-0.1, phi));
  lastX = e.clientX;
  lastY = e.clientY;
  updateCamera();
});

renderer.domElement.addEventListener("wheel", e=>{
  radius += e.deltaY * 0.02;
  radius = Math.max(5, Math.min(100, radius));
  updateCamera();
});

/* RESIZE */
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
