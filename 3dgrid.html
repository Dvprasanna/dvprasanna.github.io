<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Grid – Center Locked</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}
canvas { display: block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================
   SCENE
========================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

/* =========================
   CAMERA STATE (CAD)
========================= */
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);

let target = new THREE.Vector3(0,0,0);
let radius = 35;
let theta  = Math.PI / 4;
let phi    = Math.PI / 4;

function updateCamera(reset=false) {
  if (reset) {
    target.set(0,0,0);
    radius = 35;
    theta  = Math.PI / 4;
    phi    = Math.PI / 4;
  }

  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.cos(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.sin(theta)
  );
  camera.lookAt(target);
}

/* =========================
   RENDERER (IMPORTANT)
========================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* =========================
   GRID + AXES
========================= */
scene.add(new THREE.GridHelper(50, 50, 0x00ff00, 0x444444));
scene.add(new THREE.AxesHelper(10));

/* =========================
   TEST OBJECT
========================= */
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(2,2,2),
  new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
cube.position.y = 1;
scene.add(cube);

/* =========================
   RESIZE (CENTER LOCK)
========================= */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  updateCamera(false);
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();
updateCamera(true);

/* =========================
   INPUT SYSTEM (CHOOSY)
========================= */
let mode = null;
let lastX = 0;
let lastY = 0;

const ROTATE_SPEED = 0.004;
const PAN_SPEED    = 0.02;
const ZOOM_SPEED   = 0.08;
const DEAD_ZONE    = 2;

renderer.domElement.addEventListener("pointerdown", e=>{
  renderer.domElement.setPointerCapture(e.pointerId);
  lastX = e.clientX;
  lastY = e.clientY;

  if (e.button === 0) mode = "rotate";
  if (e.button === 2) mode = "pan";
});

renderer.domElement.addEventListener("pointerup", ()=> mode=null);
renderer.domElement.addEventListener("pointerleave", ()=> mode=null);

renderer.domElement.addEventListener("pointermove", e=>{
  if (!mode) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  if (Math.abs(dx) < DEAD_ZONE && Math.abs(dy) < DEAD_ZONE) return;

  if (mode === "rotate") {
    theta -= dx * ROTATE_SPEED;
    phi   -= dy * ROTATE_SPEED;
    phi = Math.max(0.15, Math.min(Math.PI - 0.15, phi));
  }

  if (mode === "pan") {
    const panX = -dx * PAN_SPEED;
    const panZ =  dy * PAN_SPEED;

    const right = new THREE.Vector3(Math.cos(theta), 0, -Math.sin(theta));
    const forward = new THREE.Vector3(Math.sin(theta), 0, Math.cos(theta));

    target.addScaledVector(right, panX);
    target.addScaledVector(forward, panZ);
  }

  lastX = e.clientX;
  lastY = e.clientY;
  updateCamera(false);
});

renderer.domElement.addEventListener("wheel", e=>{
  e.preventDefault();
  radius += e.deltaY * ZOOM_SPEED;
  radius = Math.max(5, Math.min(120, radius));
  updateCamera(false);
},{ passive:false });

renderer.domElement.oncontextmenu = e => e.preventDefault();

/* =========================
   HOME KEY (RE-CENTER)
========================= */
window.addEventListener("keydown", e=>{
  if (e.key === "h") updateCamera(true);
});

/* =========================
   RENDER LOOP
========================= */
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
