<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interaction Engine v1.6 (Stable)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#111;
  color:#eee;
  font-family:system-ui;
  overflow:hidden;
}

/* ===== TOP BAR ===== */
#topbar{
  position:fixed;
  top:0;left:0;right:0;
  height:40px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px;
  background:#1a1a1a;
  border-bottom:1px solid #333;
  z-index:10;
}
#topbar button, select{
  padding:6px 10px;
  background:#222;
  color:#eee;
  border:1px solid #333;
}
#topbar button.active{
  background:#0a0;
  color:#000;
}

/* ===== STAGE ===== */
#stageWrap{
  position:absolute;
  top:40px;left:0;right:0;bottom:0;
  overflow:hidden;
}
#stage{
  width:3000px;
  height:3000px;
  background:#000;
  position:absolute;
  touch-action:none;
}
.dot{
  position:absolute;
  width:6px;height:6px;
  background:#0f0;
  border-radius:50%;
  transform:translate(-50%,-50%);
}
.shape{
  position:absolute;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<div id="topbar">
  <button id="drawBtn">Draw</button>
  <button id="panBtn">Pan</button>
  <button id="clearBtn">Clear</button>

  <select id="helper">
    <option value="dot">Dot</option>
    <option value="free">Freehand</option>
    <option value="line">Line</option>
    <option value="circle">Circle</option>
    <option value="rect">Rectangle</option>
  </select>
</div>

<div id="stageWrap">
  <div id="stage"></div>
</div>

<script>
/* ===== STATE ===== */
let tool="draw";
let helper="dot";
let dragging=false;
let panX=0, panY=0;
let lastX=0, lastY=0;
let sx=0, sy=0;
let temp=null;

const stage=document.getElementById("stage");

/* ===== UI ===== */
const drawBtn=document.getElementById("drawBtn");
const panBtn=document.getElementById("panBtn");
const clearBtn=document.getElementById("clearBtn");
const helperSel=document.getElementById("helper");

function updateUI(){
  drawBtn.classList.toggle("active",tool==="draw");
  panBtn.classList.toggle("active",tool==="pan");
}
drawBtn.onclick=()=>{tool="draw";updateUI();}
panBtn.onclick=()=>{tool="pan";updateUI();}
clearBtn.onclick=()=>stage.innerHTML="";
helperSel.onchange=e=>helper=e.target.value;

/* ===== POINTER ===== */
stage.addEventListener("pointerdown",e=>{
  dragging=true;
  lastX=e.clientX; lastY=e.clientY;
  sx=e.offsetX; sy=e.offsetY;

  if(tool==="draw"){
    if(helper==="dot" || helper==="free"){
      drawDot(sx,sy);
    }else{
      temp=createTemp();
    }
  }
});

stage.addEventListener("pointermove",e=>{
  if(!dragging) return;

  if(tool==="pan"){
    panX+=e.clientX-lastX;
    panY+=e.clientY-lastY;
    stage.style.transform=`translate(${panX}px,${panY}px)`;
    lastX=e.clientX; lastY=e.clientY;
    return;
  }

  const x=e.offsetX, y=e.offsetY;

  if(helper==="free"){
    drawDot(x,y);
  }

  if(temp){
    updateTemp(sx,sy,x,y);
  }
});

stage.addEventListener("pointerup",e=>{
  dragging=false;
  if(temp){
    stage.appendChild(temp);
    temp=null;
  }
});

/* ===== DRAW HELPERS ===== */
function drawDot(x,y){
  const d=document.createElement("div");
  d.className="dot";
  d.style.left=x+"px";
  d.style.top=y+"px";
  stage.appendChild(d);
}

function createTemp(){
  const t=document.createElement("div");
  t.className="shape";
  t.style.position="absolute";
  return t;
}

function updateTemp(x1,y1,x2,y2){
  if(helper==="line"){
    const len=Math.hypot(x2-x1,y2-y1);
    temp.style.left=x1+"px";
    temp.style.top=y1+"px";
    temp.style.width=len+"px";
    temp.style.height="1px";
    temp.style.transformOrigin="0 0";
    temp.style.transform=`rotate(${Math.atan2(y2-y1,x2-x1)}rad)`;
  }

  if(helper==="circle"){
    const r=Math.hypot(x2-x1,y2-y1);
    temp.style.left=(x1-r)+"px";
    temp.style.top=(y1-r)+"px";
    temp.style.width=(r*2)+"px";
    temp.style.height=(r*2)+"px";
    temp.style.borderRadius="50%";
  }

  if(helper==="rect"){
    temp.style.left=Math.min(x1,x2)+"px";
    temp.style.top=Math.min(y1,y2)+"px";
    temp.style.width=Math.abs(x2-x1)+"px";
    temp.style.height=Math.abs(y2-y1)+"px";
  }
}

/* ===== INIT ===== */
updateUI();
</script>

</body>
</html>
