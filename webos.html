<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interaction Engine v1.2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    height: 100vh;
  }

  /* ================= PANEL ================= */
  #panel {
    width: 260px;
    background: #1a1a1a;
    border-right: 1px solid #333;
    padding: 10px;
    box-sizing: border-box;
  }

  h3 {
    font-size: 14px;
    margin: 10px 0 6px;
  }

  button {
    width: 100%;
    margin-bottom: 6px;
    padding: 6px;
    background: #222;
    color: #eee;
    border: 1px solid #333;
    cursor: pointer;
  }

  button.active {
    background: #0a0;
    color: #000;
  }

  label {
    font-size: 12px;
    display: block;
    margin-top: 8px;
  }

  input, select, textarea {
    width: 100%;
    margin-top: 4px;
    background: #000;
    color: #0f0;
    border: 1px solid #333;
    padding: 4px;
    box-sizing: border-box;
    font-family: monospace;
    font-size: 12px;
  }

  textarea {
    height: 120px;
  }

  /* ================= STAGE ================= */
  #stageWrapper {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  #stage {
    width: 2000px;
    height: 2000px;
    background: #000;
    position: absolute;
    top: 0;
    left: 0;
    touch-action: none;
  }

  .dot {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #0f0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>

<body>
v 1.3
<!-- ================= PANEL ================= -->
<div id="panel">
  <h3>Tool</h3>
  <button id="drawBtn">Draw</button>
  <button id="panBtn">Pan</button>

  <h3>Rule</h3>

  <label>Event</label>
  <select id="eventInput">
    <option value="drag">drag</option>
  </select>

  <label>Code (editable)</label>
  <textarea id="codeInput"></textarea>

  <button id="applyBtn">Apply Code</button>
</div>

<!-- ================= STAGE ================= -->
<div id="stageWrapper">
  <div id="stage"></div>
</div>

<script>
/* ================= STATE ================= */

let currentTool = "draw";
let dragging = false;

let panX = 0, panY = 0;
let lastX = 0, lastY = 0;

/* ================= RULE ================= */

const rule = {
  event: "drag",
  code: "drawDot(e.x, e.y);"
};

/* ================= UI ================= */

const drawBtn = document.getElementById("drawBtn");
const panBtn = document.getElementById("panBtn");
const codeInput = document.getElementById("codeInput");

function updateToolUI() {
  drawBtn.classList.toggle("active", currentTool === "draw");
  panBtn.classList.toggle("active", currentTool === "pan");
}

drawBtn.onclick = () => {
  currentTool = "draw";
  updateToolUI();
};

panBtn.onclick = () => {
  currentTool = "pan";
  updateToolUI();
};

codeInput.value = rule.code;

document.getElementById("applyBtn").onclick = () => {
  rule.code = codeInput.value;
};

/* ================= ENGINE ================= */

const stage = document.getElementById("stage");

function execute(code, event) {
  const ctx = {
    e: event,
    drawDot,
    drawSquare,
    log: console.log
  };
  new Function("ctx", `with(ctx){${code}}`)(ctx);
}

stage.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

stage.addEventListener("pointermove", e => {
  if (!dragging) return;

  if (currentTool === "draw") {
    execute(rule.code, {
      x: e.offsetX,
      y: e.offsetY,
      shiftKey: e.shiftKey
    });
  }

  if (currentTool === "pan") {
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    panX += dx;
    panY += dy;
    stage.style.transform = `translate(${panX}px, ${panY}px)`;
    lastX = e.clientX;
    lastY = e.clientY;
  }
});

stage.addEventListener("pointerup", () => dragging = false);
stage.addEventListener("pointerleave", () => dragging = false);

/* ================= DRAW API ================= */

function drawDot(x, y) {
  const d = document.createElement("div");
  d.className = "dot";
  d.style.left = x + "px";
  d.style.top = y + "px";
  stage.appendChild(d);
}

function drawSquare(x, y) {
  const s = document.createElement("div");
  s.style.position = "absolute";
  s.style.width = "8px";
  s.style.height = "8px";
  s.style.left = x + "px";
  s.style.top = y + "px";
  s.style.background = "#0f0";
  stage.appendChild(s);
}

/* ================= INIT ================= */

updateToolUI();
</script>

</body>
</html>
