<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interaction Engine v1.3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  /* ============ TOP BAR ============ */
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    padding: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 10;
  }

  #topbar button {
    padding: 6px 10px;
    background: #222;
    color: #eee;
    border: 1px solid #333;
    cursor: pointer;
  }

  #topbar button.active {
    background: #0a0;
    color: #000;
  }

  #toggleEditor {
    margin-left: auto;
    background: #333;
  }

  /* ============ EDITOR ============ */
  #editor {
    position: fixed;
    top: 40px;
    left: 0;
    right: 0;
    background: #000;
    border-bottom: 1px solid #333;
    padding: 8px;
    display: none;
    z-index: 9;
  }

  #editor textarea {
    width: 100%;
    height: 120px;
    background: #000;
    color: #0f0;
    border: 1px solid #333;
    font-family: monospace;
    font-size: 12px;
  }

  #editor button {
    margin-top: 6px;
    padding: 6px 12px;
    background: #0a0;
    color: #000;
    border: none;
    cursor: pointer;
  }

  /* ============ STAGE ============ */
  #stageWrapper {
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
  }

  #stage {
    width: 2000px;
    height: 2000px;
    background: #000;
    position: absolute;
    touch-action: none;
  }

  .dot {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #0f0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>

<body>
v 1.4
<!-- ============ TOP BAR ============ -->
<div id="topbar">
  <button id="clearBtn">Clear</button>
  <button id="drawBtn">Draw</button>
  <button id="panBtn">Pan</button>
  <button id="toggleEditor">Editor</button>
</div>

<!-- ============ EDITOR PANEL ============ -->
<div id="editor">
  <div>Drag Rule Code</div>
  <textarea id="codeInput"></textarea>
  <button id="applyBtn">Apply</button>
</div>

<!-- ============ STAGE ============ -->
<div id="stageWrapper">
  <div id="stage"></div>
</div>

<script>
/* ============ STATE ============ */
const clearBtn = document.getElementById("clearBtn");

clearBtn.onclick = () => {
  stage.innerHTML = "";
};
let currentTool = "draw";
let dragging = false;
let editorOpen = false;

let panX = 0, panY = 0;
let lastX = 0, lastY = 0;

/* ============ RULE ============ */

const rule = {
  event: "drag",
  code: "drawDot(e.x, e.y);"
};

/* ============ UI ============ */

const drawBtn = document.getElementById("drawBtn");
const panBtn = document.getElementById("panBtn");
const toggleEditor = document.getElementById("toggleEditor");
const editor = document.getElementById("editor");
const codeInput = document.getElementById("codeInput");

function updateToolUI() {
  drawBtn.classList.toggle("active", currentTool === "draw");
  panBtn.classList.toggle("active", currentTool === "pan");
}

drawBtn.onclick = () => {
  currentTool = "draw";
  updateToolUI();
};

panBtn.onclick = () => {
  currentTool = "pan";
  updateToolUI();
};

toggleEditor.onclick = () => {
  editorOpen = !editorOpen;
  editor.style.display = editorOpen ? "block" : "none";
};

codeInput.value = rule.code;

document.getElementById("applyBtn").onclick = () => {
  rule.code = codeInput.value;
};

/* ============ ENGINE ============ */

const stage = document.getElementById("stage");

stage.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

stage.addEventListener("pointermove", e => {
  if (!dragging) return;

  if (currentTool === "draw") {
    new Function("e","drawDot","drawSquare","log", rule.code)(
      { x: e.offsetX, y: e.offsetY, shiftKey: e.shiftKey },
      drawDot,
      drawSquare,
      console.log
    );
  }

  if (currentTool === "pan") {
    panX += e.clientX - lastX;
    panY += e.clientY - lastY;
    stage.style.transform = `translate(${panX}px, ${panY}px)`;
    lastX = e.clientX;
    lastY = e.clientY;
  }
});

stage.addEventListener("pointerup", () => dragging = false);
stage.addEventListener("pointerleave", () => dragging = false);

/* ============ DRAW API ============ */

function drawDot(x, y) {
  const d = document.createElement("div");
  d.className = "dot";
  d.style.left = x + "px";
  d.style.top = y + "px";
  stage.appendChild(d);
}

function drawSquare(x, y) {
  const s = document.createElement("div");
  s.style.position = "absolute";
  s.style.width = "8px";
  s.style.height = "8px";
  s.style.left = x + "px";
  s.style.top = y + "px";
  s.style.background = "#0f0";
  stage.appendChild(s);
}

/* ============ INIT ============ */

updateToolUI();
</script>

</body>
</html>
