<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pixel Balance Gauge — v0.6.0</title>

<!--
  App Version: v0.6.0
  Line Engine: v1.0.0
  Brush Engine: v1.0.0
  Balance Logic: v2.0.0 (Center-based red gauge)
-->

<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* vertical text */
  #status {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 12px;
    color: #aaa;
    margin: 12px 0;
  }

  canvas {
    background: #000;
    display: block;
    cursor: crosshair;
  }

  /* gauge container */
  #gauge {
    position: relative;
    width: 600px;
    height: 14px;
    background: #000;
    margin-top: 10px;
  }

  /* center marker */
  #centerLine {
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 100%;
    background: #444;
  }

  /* red fill */
  #fill {
    position: absolute;
    top: 0;
    height: 100%;
    background: #e74c3c;
    width: 0;
    left: 50%;
  }

  #counts {
    margin-top: 6px;
    font-size: 12px;
    color: #888;
  }

  button {
    margin-top: 6px;
    padding: 4px 10px;
  }
</style>
</head>

<body>

<div id="status">PIXEL BALANCE</div>

<canvas id="c" width="600" height="400"></canvas>

<!-- GAUGE BELOW CANVAS -->
<div id="gauge">
  <div id="centerLine"></div>
  <div id="fill"></div>
</div>

<div id="counts">Left: 0 | Center: 0 | Right: 0</div>

<button onclick="resetAll()">Reset</button>

<script>
/* ================= VERSION ================= */
const APP_VERSION = "0.6.0";

/* ================= BRUSH ================= */
const BRUSH_RADIUS = 1;

/* ================= SETUP ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.fillStyle = "#fff";

let drawing = false;
let prevX = 0, prevY = 0;
const midX = Math.floor(canvas.width / 2);

let left = 0, right = 0, center = 0;

/* ================= LINE LOGIC ================= */
function getLinePixels(x1, y1, x2, y2) {
  const pts = [];
  let dx = Math.abs(x2 - x1);
  let dy = Math.abs(y2 - y1);
  let sx = x1 < x2 ? 1 : -1;
  let sy = y1 < y2 ? 1 : -1;
  let err = dx - dy;

  while (true) {
    pts.push([x1, y1]);
    if (x1 === x2 && y1 === y2) break;
    let e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x1 += sx; }
    if (e2 <  dx) { err += dx; y1 += sy; }
  }
  return pts;
}

/* ================= PIXEL BRUSH ================= */
function putPixel(x, y) {
  for (let dy = -BRUSH_RADIUS; dy <= BRUSH_RADIUS; dy++) {
    for (let dx = -BRUSH_RADIUS; dx <= BRUSH_RADIUS; dx++) {
      const px = x + dx;
      const py = y + dy;

      ctx.fillRect(px, py, 1, 1);

      if (px < midX) left++;
      else if (px > midX) right++;
      else center++;
    }
  }
}

/* ================= GAUGE UPDATE ================= */
function updateGauge() {
  const total = left + right || 1;
  const diff = right - left; // +ve → right heavy
  const ratio = Math.min(1, Math.abs(diff) / total);

  const gaugeWidth = 600;
  const fill = document.getElementById("fill");

  const px = ratio * (gaugeWidth / 2);

  if (diff > 0) {
    // right heavy → grow right
    fill.style.left = "50%";
    fill.style.width = px + "px";
  } else if (diff < 0) {
    // left heavy → grow left
    fill.style.left = (gaugeWidth / 2 - px) + "px";
    fill.style.width = px + "px";
  } else {
    // equal
    fill.style.width = "0px";
    fill.style.left = "50%";
  }

  document.getElementById("counts").innerText =
    `Left: ${left} | Center: ${center} | Right: ${right}`;
}

/* ================= INPUT ================= */
canvas.onmousedown = e => {
  drawing = true;
  prevX = e.offsetX | 0;
  prevY = e.offsetY | 0;
};

canvas.onmousemove = e => {
  if (!drawing) return;
  const x = e.offsetX | 0;
  const y = e.offsetY | 0;

  getLinePixels(prevX, prevY, x, y).forEach(p => putPixel(p[0], p[1]));

  prevX = x;
  prevY = y;
  updateGauge();
};

window.onmouseup = () => drawing = false;

/* ================= RESET ================= */
function resetAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  left = right = center = 0;
  updateGauge();
}

/* ================= CENTER GUIDE ================= */
ctx.fillStyle = "#333";
for (let y = 0; y < canvas.height; y++) {
  ctx.fillRect(midX, y, 1, 1);
}
ctx.fillStyle = "#fff";

console.log("Pixel Balance Gauge v" + APP_VERSION);
</script>

</body>
</html>
