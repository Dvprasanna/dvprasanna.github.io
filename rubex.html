<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Rubex Game</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#111;
    color:#fff;
    text-align:center;
}

#game {
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:6px;
    justify-content:center;
    margin:20px auto;
}

.tile {
    width:80px;
    height:80px;
    border-radius:8px;
}

button {
    margin:4px;
    padding:10px 14px;
    border-radius:6px;
    border:none;
    cursor:pointer;
}

pre {
    background:#000;
    padding:10px;
    margin:10px auto;
    width:90%;
    max-width:420px;
    text-align:left;
}
</style>
</head>

<body>

<h2>2D Rubex Game</h2>

<div id="game"></div>

<div>
    <button onclick="rotateRow(0)">Row 1</button>
    <button onclick="rotateRow(1)">Row 2</button>
    <button onclick="rotateRow(2)">Row 3</button>
    <br>
    <button onclick="rotateCol(0)">Col 1</button>
    <button onclick="rotateCol(1)">Col 2</button>
    <button onclick="rotateCol(2)">Col 3</button>
    <br><br>
    <button onclick="showHint()">Hint</button>
</div>

<pre id="hintBox" style="display:none;color:#0f0;"></pre>
<pre id="stepsBox" style="color:#ffd700;">Minimum rotations: calculating...</pre>

<script>
const colors = ["red","blue","green","yellow","orange"];
let grid = [];

/* ---------- INIT ---------- */
function init() {
    grid = Array.from({length:9}, () =>
        colors[Math.floor(Math.random()*colors.length)]
    );
    draw();
}

/* ---------- DRAW ---------- */
function draw() {
    const game = document.getElementById("game");
    game.innerHTML = "";

    grid.forEach(c => {
        const d = document.createElement("div");
        d.className = "tile";
        d.style.background = c;
        game.appendChild(d);
    });

    clearHint();              // IMPORTANT
    updateMinSteps();         // ALWAYS updates
}

/* ---------- ROTATIONS ---------- */
function rotateRow(r) {
    const i = r*3;
    [grid[i],grid[i+1],grid[i+2]] = [grid[i+1],grid[i+2],grid[i]];
    draw();
}

function rotateCol(c) {
    [grid[c],grid[c+3],grid[c+6]] = [grid[c+3],grid[c+6],grid[c]];
    draw();
}

/* ---------- HINT ---------- */
function showHint() {
    const box = document.getElementById("hintBox");
    let hint = "";

    for (let r=0;r<3;r++) {
        const i=r*3;
        if (!(grid[i]===grid[i+1] && grid[i+1]===grid[i+2])) {
            hint = `Hint: Rotate Row ${r+1}`;
            break;
        }
    }

    if (!hint) {
        for (let c=0;c<3;c++) {
            if (!(grid[c]===grid[c+3] && grid[c+3]===grid[c+6])) {
                hint = `Hint: Rotate Column ${c+1}`;
                break;
            }
        }
    }

    if (!hint) hint = "Hint: One move away";

    box.style.display="block";
    box.textContent = hint;
}

function clearHint() {
    const box = document.getElementById("hintBox");
    box.style.display="none";
    box.textContent="";
}

/* ---------- MIN MOVES (BFS) ---------- */
function serialize(g){ return g.join(","); }
function solved(g){ return g.every(x=>x===g[0]); }

function moves(g){
    let out=[];
    for(let r=0;r<3;r++){
        let n=[...g];
        let i=r*3;
        [n[i],n[i+1],n[i+2]]=[n[i+1],n[i+2],n[i]];
        out.push(n);
    }
    for(let c=0;c<3;c++){
        let n=[...g];
        [n[c],n[c+3],n[c+6]]=[n[c+3],n[c+6],n[c]];
        out.push(n);
    }
    return out;
}

function minRotations(start){
    const seen=new Set();
    const q=[{g:start,d:0}];
    seen.add(serialize(start));

    while(q.length){
        const {g,d}=q.shift();
        if(solved(g)) return d;
        if(d>=6) continue;

        for(const ng of moves(g)){
            const k=serialize(ng);
            if(!seen.has(k)){
                seen.add(k);
                q.push({g:ng,d:d+1});
            }
        }
    }
    return "≥7";
}

function updateMinSteps(){
    const steps = minRotations([...grid]); // CLONE FIX
    document.getElementById("stepsBox").textContent =
        "Minimum rotations: " + steps;
}

init();
</script>
