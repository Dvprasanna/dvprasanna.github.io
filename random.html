<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Closed Random Shape – Gradient Fill</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: system-ui, sans-serif;
  }
  #toolbar {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: #1a1a1a;
    align-items: center;
  }
  input, button {
    padding: 6px 10px;
    font-size: 14px;
  }
  canvas {
    display: block;
    background: #fff;
    touch-action: manipulation;
  }
</style>
</head>
<body>

<div id="toolbar">
  Dots:
  <input type="number" id="dotCount" value="10" min="3" max="50">
  <button id="exportBtn">Export</button>
  <button id="clearBtn">Clear</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const dotInput = document.getElementById("dotCount");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 50;
}
resize();
window.addEventListener("resize", resize);

let points = [];

// ---------- RANDOM HELPERS ----------
function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function randomGradient() {
  const g = ctx.createLinearGradient(
    rand(0, canvas.width),
    rand(0, canvas.height),
    rand(0, canvas.width),
    rand(0, canvas.height)
  );

  g.addColorStop(0, `hsl(${Math.random()*360},70%,55%)`);
  g.addColorStop(1, `hsl(${Math.random()*360},70%,45%)`);
  return g;
}

// ---------- INTERACTION ----------
canvas.addEventListener("pointerdown", generateShape);

function generateShape() {
  const n = parseInt(dotInput.value, 10);
  points = [];

  for (let i = 0; i < n; i++) {
    points.push({
      x: rand(50, canvas.width - 50),
      y: rand(50, canvas.height - 50)
    });
  }

  draw();
}

// ---------- DRAW ----------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (points.length < 3) return;

  // closed-loop point duplication
  const pts = [
    points[points.length - 1],
    ...points,
    points[0],
    points[1]
  ];

  ctx.beginPath();
  ctx.moveTo(pts[1].x, pts[1].y);

  for (let i = 1; i < pts.length - 2; i++) {
    const p0 = pts[i - 1];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2];

    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;

    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
  }

  ctx.closePath();

  // fill + stroke
  ctx.fillStyle = randomGradient();
  ctx.fill();

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.stroke();

  // optional: draw control dots
  ctx.fillStyle = "#000";
  for (const p of points) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- CONTROLS ----------
document.getElementById("clearBtn").onclick = () => {
  points = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
};

document.getElementById("exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.download = "gradient-shape.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
};
</script>

</body>
</html>
