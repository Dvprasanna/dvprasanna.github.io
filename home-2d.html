<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2D Flat Layout – Canvas</title>

<style>
body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:#f4f4f4;
}
header{
  background:#111;
  color:#fff;
  padding:12px 20px;
  font-size:18px;
}
#app{
  display:flex;
  height:calc(100vh - 48px);
}
#sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid #ddd;
  padding:16px;
}
button{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border:1px solid #ccc;
  background:#fafafa;
  cursor:pointer;
}
button:hover{ background:#eee; }
#canvasWrap{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eaeaea;
}
canvas{
  background:#fff;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<header>Minimalist 2D Flat Layout – Canvas Draft</header>

<div id="app">

<div id="sidebar">
  <button onclick="draw()">Redraw</button>
  <button onclick="exportJPEG()">Export JPEG</button>
  <button onclick="exportPDF()">Export PDF</button>

  <div style="font-size:12px;color:#777;margin-top:10px;">
    v1 · DWG-style raster output
  </div>
</div>

<div id="canvasWrap">
  <canvas id="plan" width="900" height="550"></canvas>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const canvas = document.getElementById("plan");
const ctx = canvas.getContext("2d");

/* -------- BASIC CAD STYLES -------- */
function setup(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#000";
  ctx.fillStyle = "#000";
}

/* -------- DRAWING -------- */
function draw(){
  setup();

  // Walls
  ctx.lineWidth = 6;
  line(60,60,840,60);
  line(840,60,840,480);
  line(840,480,60,480);
  line(60,480,60,60);
  line(420,60,420,480);

  // Window
  ctx.lineWidth = 4;
  line(200,60,320,60);

  // Door (arc)
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(420,300,60,Math.PI*1.5,Math.PI*2);
  ctx.stroke();

  // Furniture
  ctx.lineWidth = 2;
  rect(120,320,160,80);
  rect(520,120,180,70);
  rect(560,300,120,120);

  // Electrical
  ctx.fillStyle="#000";
  dot(150,290);
  dot(650,180);
  dot(700,360);

  // Dimensions
  ctx.lineWidth = 1;
  dimension(60,60,840,60,"7800 mm");
  dimension(60,60,60,480,"4200 mm");
}

/* -------- HELPERS -------- */
function line(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}
function rect(x,y,w,h){
  ctx.strokeRect(x,y,w,h);
}
function dot(x,y){
  ctx.beginPath();
  ctx.arc(x,y,4,0,Math.PI*2);
  ctx.fill();
}
function dimension(x1,y1,x2,y2,label){
  const o=20;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x1,y1+o);
  ctx.lineTo(x2,y2+o);
  ctx.lineTo(x2,y2);
  ctx.stroke();
  ctx.font="12px system-ui";
  ctx.fillText(label,(x1+x2)/2-20,y1+o-4);
}

/* -------- EXPORTS -------- */
function exportJPEG(){
  const link=document.createElement("a");
  link.download="2D-Flat-Layout.jpg";
  link.href=canvas.toDataURL("image/jpeg",1.0);
  link.click();
}

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF("landscape","pt","a4");
  const img=canvas.toDataURL("image/jpeg",1.0);
  pdf.text("Minimalist 2D Flat Layout",40,40);
  pdf.addImage(img,"JPEG",40,60,760,440);
  pdf.save("2D-Flat-Layout.pdf");
}

/* INIT */
draw();
</script>

</body>
</html>
