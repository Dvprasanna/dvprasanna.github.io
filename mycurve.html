<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Canvas – Draw + Balance</title>

<style>
html,body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:system-ui, sans-serif;
  text-align:center;
}
#topbar{
  padding:10px;
  background:#000;
  border-bottom:1px solid #333;
}
button{
  margin:4px;
  padding:6px 12px;
}
canvas{
  background:#000;
  border:1px solid #444;
  touch-action:none;
}
.meter{
  width:300px;
  height:14px;
  background:#333;
  margin:10px auto;
  position:relative;
}
.center{
  position:absolute;
  left:50%;
  width:2px;
  height:100%;
  background:#888;
}
.fill{
  position:absolute;
  top:0;
  height:100%;
}
.leftFill{
  right:50%;
  background:#00c8ff;
}
.rightFill{
  left:50%;
  background:#ff5050;
}
.readout{
  font-size:13px;
  opacity:.85;
}
</style>
</head>

<body>

<div id="topbar">
  <button onclick="mode='draw'">DRAW</button>
  <button onclick="clearCanvas()">CLS</button>
</div>

<canvas id="canvas" width="300" height="300"></canvas>

<div class="meter">
  <div class="center"></div>
  <div id="leftFill" class="fill leftFill"></div>
  <div id="rightFill" class="fill rightFill"></div>
</div>
<div id="readout" class="readout">Balanced</div>

<script>
/* ================= CANVAS ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.strokeStyle = "#fff";
ctx.lineWidth = 1;
ctx.lineCap = "round";

/* ================= STATE ================= */
let mode = "draw";
let drawing = false;
let lastX = 0, lastY = 0;

/* ================= POSITION ================= */
function pos(e){
  const r = canvas.getBoundingClientRect();
  const x = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
  const y = (e.touches?e.touches[0].clientY:e.clientY) - r.top;
  return { x: Math.floor(x), y: Math.floor(y) };
}

/* ================= DRAW ================= */
function start(e){
  drawing = true;
  const p = pos(e);
  lastX = p.x;
  lastY = p.y;
}

function move(e){
  if(!drawing) return;
  const p = pos(e);

  ctx.beginPath();
  ctx.moveTo(lastX+.5, lastY+.5);
  ctx.lineTo(p.x+.5, p.y+.5);
  ctx.stroke();

  lastX = p.x;
  lastY = p.y;

  updateBalance(); // 🔥 SAME CANVAS
}

function stop(){
  drawing = false;
}

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("mouseup", stop);
canvas.addEventListener("mouseleave", stop);

canvas.addEventListener("touchstart", start, {passive:false});
canvas.addEventListener("touchmove", move, {passive:false});
canvas.addEventListener("touchend", stop);

/* ================= CLEAR ================= */
function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  updateBalance();
}

/* ================= BALANCE ================= */
const leftFill = document.getElementById("leftFill");
const rightFill = document.getElementById("rightFill");
const readout = document.getElementById("readout");

function updateBalance(){
  const img = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let left = 0, right = 0;
  const mid = canvas.width/2;

  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const i = (y*canvas.width+x)*4;
      if(img[i]>0){
        x<mid ? left++ : right++;
      }
    }
  }

  const diff = left-right;
  const max = Math.max(left,right,1);
  const pct = Math.min(Math.abs(diff)/max*50,50);

  leftFill.style.width = diff>0 ? pct+"%" : "0";
  rightFill.style.width = diff<0 ? pct+"%" : "0";

  readout.textContent =
    diff===0 ? "Perfectly Balanced"
    : diff>0 ? `Left heavier by ${diff}px`
    : `Right heavier by ${Math.abs(diff)}px`;
}
</script>

</body>
</html>
