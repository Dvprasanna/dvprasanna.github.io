<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Financial View</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system;
  background: #111;
  color: #eee;
}
header {
  padding: 10px;
  text-align: center;
  font-size: 16px;
  border-bottom: 1px solid #222;
}
.container { padding: 10px; }

.card {
  background: #151515;
  border: 1px solid #222;
  border-radius: 6px;
  margin-bottom: 8px;
}

.card-header {
  padding: 8px;
  font-size: 14px;
  font-weight: 600;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}

.card-body {
  padding: 8px;
}

.hidden {
  display: none;
}

input, select, textarea, button {
  width: 100%;
  padding: 6px;
  margin: 4px 0;
  background: #222;
  color: #fff;
  border: 1px solid #333;
  border-radius: 5px;
  font-size: 13px;
}

textarea {
  min-height: 100px;
  font-family: monospace;
}

.row { display: flex; gap: 6px; }
.row > * { flex: 1; }

.filters { display: flex; gap: 6px; }

.entry {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #222;
  font-size: 13px;
}

small { color: #888; }
.rec { color: #34a853; }
.pay { color: #ea4335; }
.none { color: #9aa0a6; }

.actions button {
  font-size: 11px;
  padding: 3px 6px;
}
</style>
</head>

<body>
<header>My Financial View</header>

<div class="container">

<!-- ENTRY SECTION -->
<div class="card">
  <div class="card-header" onclick="toggle('entryBody','entryArrow')">
    Entry
    <span id="entryArrow">▼</span>
  </div>
  <div class="card-body" id="entryBody">

    <select id="type">
      <option value="">Select Type</option>
      <option>Investment</option>
      <option>Loan</option>
      <option>Income</option>
      <option>Other</option>
    </select>

    <input id="name" placeholder="Name">
    <input id="amt" type="number" placeholder="Principal / Invested Amount">

    <div class="row">
      <select id="flow">
        <option value="None">No Pay / Rec</option>
        <option value="Rec">Receive</option>
        <option value="Pay">Pay</option>
      </select>
      <input id="flowAmt" type="number" placeholder="Pay / Receive Amount">
    </div>

    <div class="row">
      <select id="monthly">
        <option value="No">Monthly: No</option>
        <option value="Yes">Monthly: Yes</option>
      </select>
      <input id="date" type="date">
    </div>

    <button id="saveBtn">Add Entry</button>
  </div>
</div>

<!-- FILTERS -->
<div class="card">
  <div class="card-body filters">
    <select id="typeFilter">
      <option value="All">All Types</option>
      <option>Investment</option>
      <option>Loan</option>
      <option>Income</option>
      <option>Other</option>
    </select>

    <select id="flowFilter">
      <option value="All">All Cash Flow</option>
      <option value="Rec">Receive</option>
      <option value="Pay">Pay</option>
      <option value="None">No Cash Flow</option>
    </select>
  </div>
</div>

<!-- TOTALS -->
<div class="card">
  <div class="card-body">
    <small>
      Received: ₹<span id="tRec">0</span> |
      Paid: ₹<span id="tPay">0</span> |
      <b>Net: ₹<span id="tNet">0</span></b>
    </small>
  </div>
</div>

<!-- LIST SECTION -->
<div class="card">
  <div class="card-header" onclick="toggle('listBody','listArrow')">
    Entries
    <span id="listArrow">▼</span>
  </div>
  <div class="card-body" id="listBody">
    <div id="list"></div>
  </div>
</div>

<!-- EXPORT / IMPORT SECTION -->
<div class="card">
  <div class="card-header" onclick="toggle('exportBody','exportArrow')">
    Export / Import
    <span id="exportArrow">▼</span>
  </div>
  <div class="card-body" id="exportBody">
    <button onclick="exportText()">Export TEXT</button>
    <textarea id="textBox" placeholder="Paste text here to import"></textarea>
    <button onclick="importText()">Import TEXT</button>
  </div>
</div>

</div>

<script>
/* ---------- COLLAPSE ---------- */
function toggle(bodyId, arrowId) {
  const body = document.getElementById(bodyId);
  const arrow = document.getElementById(arrowId);
  const hidden = body.classList.toggle("hidden");
  arrow.textContent = hidden ? "▶" : "▼";
  localStorage.setItem(bodyId + "_hidden", hidden);
}

["entryBody","listBody","exportBody"].forEach(id => {
  if (localStorage.getItem(id + "_hidden") === "true") {
    document.getElementById(id).classList.add("hidden");
    document.getElementById(id.replace("Body","Arrow")).textContent = "▶";
  }
});

/* ---------- DATA ---------- */
let data = JSON.parse(localStorage.getItem("financeData") || "[]");
let editIndex = null;

const typeEl = type;
const nameEl = name;
const amtEl = amt;
const flowEl = flow;
const flowAmtEl = flowAmt;
const monthlyEl = monthly;
const dateEl = date;
const saveBtn = saveBtn;

const typeFilter = document.getElementById("typeFilter");
const flowFilter = document.getElementById("flowFilter");

const list = document.getElementById("list");
const tRec = document.getElementById("tRec");
const tPay = document.getElementById("tPay");
const tNet = document.getElementById("tNet");
const textBox = document.getElementById("textBox");

saveBtn.onclick = saveEntry;
typeFilter.onchange = render;
flowFilter.onchange = render;

/* ---------- SAVE ---------- */
function saveEntry() {
  const flow = flowEl.value;
  const flowAmt = Number(flowAmtEl.value);

  if ((flow === "Pay" || flow === "Rec") && !flowAmt) {
    alert("Enter Pay / Receive amount");
    return;
  }

  const entry = {
    type: typeEl.value,
    name: nameEl.value.trim(),
    amt: Number(amtEl.value) || 0,
    flow,
    flowAmt: flow === "None" ? 0 : flowAmt,
    monthly: monthlyEl.value,
    date: dateEl.value
  };

  if (!entry.type || !entry.name || !entry.date) {
    alert("Fill required fields");
    return;
  }

  if (editIndex !== null) {
    data[editIndex] = entry;
    editIndex = null;
    saveBtn.textContent = "Add Entry";
  } else {
    data.push(entry);
  }

  localStorage.setItem("financeData", JSON.stringify(data));
  clearForm();
  render();
}

function clearForm() {
  typeEl.value = "";
  nameEl.value = "";
  amtEl.value = "";
  flowAmtEl.value = "";
  dateEl.value = "";
}

/* ---------- TEXT EXPORT / IMPORT ---------- */
function exportText() {
  textBox.value = data.map(e =>
    `${e.type}|${e.name}|${e.amt}|${e.flow}|${e.flowAmt}|${e.monthly}|${e.date}`
  ).join("\n");
}

function importText() {
  const lines = textBox.value.split("\n");
  const imported = [];

  lines.forEach(l => {
    const p = l.split("|");
    if (p.length !== 7) return;
    imported.push({
      type: p[0],
      name: p[1],
      amt: Number(p[2]) || 0,
      flow: p[3],
      flowAmt: Number(p[4]) || 0,
      monthly: p[5],
      date: p[6]
    });
  });

  if (!imported.length) return alert("No valid data");

  if (!confirm("Replace current data?")) return;
  data = imported;
  localStorage.setItem("financeData", JSON.stringify(data));
  render();
}

/* ---------- RENDER ---------- */
function render() {
  list.innerHTML = "";
  let totalRec = 0, totalPay = 0;

  const filtered = data.filter(e =>
    (typeFilter.value === "All" || e.type === typeFilter.value) &&
    (flowFilter.value === "All" || e.flow === flowFilter.value)
  );

  filtered.forEach((e, i) => {
    if (e.flow === "Rec") totalRec += e.flowAmt;
    if (e.flow === "Pay") totalPay += e.flowAmt;

    const cls = e.flow === "Rec" ? "rec" : e.flow === "Pay" ? "pay" : "none";
    const label = e.flow === "None" ? "No cash flow" : `${e.flow} ₹${e.flowAmt}`;

    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `
      <div>
        <b>${e.name}</b><br>
        <small>${e.type} | Principal ₹${e.amt} | <span class="${cls}">${label}</span> | ${e.monthly} | ${e.date}</small>
      </div>
      <div class="actions">
        <button onclick="editEntry(${data.indexOf(e)})">✏️</button>
        <button onclick="deleteEntry(${data.indexOf(e)})">🗑</button>
      </div>
    `;
    list.appendChild(div);
  });

  tRec.textContent = totalRec;
  tPay.textContent = totalPay;
  tNet.textContent = totalRec - totalPay;
}

function editEntry(i) {
  const e = data[i];
  typeEl.value = e.type;
  nameEl.value = e.name;
  amtEl.value = e.amt;
  flowEl.value = e.flow;
  flowAmtEl.value = e.flowAmt || "";
  monthlyEl.value = e.monthly;
  dateEl.value = e.date;
  editIndex = i;
  saveBtn.textContent = "Save";
}

function deleteEntry(i) {
  if (!confirm("Delete entry?")) return;
  data.splice(i, 1);
  localStorage.setItem("financeData", JSON.stringify(data));
  render();
}

render();
</script>

<!-- Version: 2.6 -->
</body>
</html>
