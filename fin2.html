<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Financial View</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system;
  background: #111;
  color: #eee;
}
header {
  padding: 10px;
  text-align: center;
  font-size: 16px;
  border-bottom: 1px solid #222;
}
.container { padding: 10px; }

.card {
  background: #151515;
  border: 1px solid #222;
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 8px;
}

input, select, button {
  width: 100%;
  padding: 6px;
  margin: 4px 0;
  background: #222;
  color: #fff;
  border: 1px solid #333;
  border-radius: 5px;
  font-size: 13px;
}

.row { display: flex; gap: 6px; }
.row > * { flex: 1; }

.filters {
  display: flex;
  gap: 6px;
}

.entry {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #222;
  font-size: 13px;
}

small { color: #888; }
.rec { color: #34a853; }
.pay { color: #ea4335; }
.none { color: #9aa0a6; }

.actions button {
  font-size: 11px;
  padding: 3px 6px;
}
</style>
</head>

<body>
<header>My Financial View</header>

<div class="container">

<!-- ADD / EDIT -->
<div class="card">
  <select id="type">
    <option value="">Select Type</option>
    <option>Investment</option>
    <option>Loan</option>
    <option>Income</option>
    <option>Other</option>
  </select>

  <input id="name" placeholder="Name">

  <input id="amt" type="number" placeholder="Principal / Invested Amount">

  <div class="row">
    <select id="flow">
      <option value="None">No Pay / Rec</option>
      <option value="Rec">Receive</option>
      <option value="Pay">Pay</option>
    </select>
    <input id="flowAmt" type="number" placeholder="Pay / Receive Amount (optional)">
  </div>

  <div class="row">
    <select id="monthly">
      <option value="No">Monthly: No</option>
      <option value="Yes">Monthly: Yes</option>
    </select>
    <input id="date" type="date">
  </div>

  <button id="saveBtn">Add Entry</button>
</div>

<!-- FILTERS (RESTORED) -->
<div class="card filters">
  <select id="typeFilter">
    <option value="All">All Types</option>
    <option>Investment</option>
    <option>Loan</option>
    <option>Income</option>
    <option>Other</option>
  </select>

  <select id="flowFilter">
    <option value="All">All Cash Flow</option>
    <option value="Rec">Receive</option>
    <option value="Pay">Pay</option>
    <option value="None">No Cash Flow</option>
  </select>
</div>

<!-- TOTALS -->
<div class="card">
  <small>
    Received: ₹<span id="tRec">0</span> |
    Paid: ₹<span id="tPay">0</span> |
    <b>Net: ₹<span id="tNet">0</span></b>
  </small>
</div>

<!-- LIST -->
<div class="card">
  <div id="list"></div>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("financeData") || "[]");
let editIndex = null;

/* ELEMENTS */
const typeEl = document.getElementById("type");
const nameEl = document.getElementById("name");
const amtEl = document.getElementById("amt");
const flowEl = document.getElementById("flow");
const flowAmtEl = document.getElementById("flowAmt");
const monthlyEl = document.getElementById("monthly");
const dateEl = document.getElementById("date");
const saveBtn = document.getElementById("saveBtn");

const typeFilter = document.getElementById("typeFilter");
const flowFilter = document.getElementById("flowFilter");

const list = document.getElementById("list");
const tRec = document.getElementById("tRec");
const tPay = document.getElementById("tPay");
const tNet = document.getElementById("tNet");

/* EVENTS */
saveBtn.onclick = saveEntry;
typeFilter.onchange = render;
flowFilter.onchange = render;

/* LOGIC */
function saveEntry() {
  const flow = flowEl.value;
  const flowAmt = Number(flowAmtEl.value);

  if ((flow === "Pay" || flow === "Rec") && !flowAmt) {
    alert("Enter Pay / Receive amount");
    return;
  }

  const entry = {
    type: typeEl.value,
    name: nameEl.value.trim(),
    amt: Number(amtEl.value) || 0,
    flow,
    flowAmt: flow === "None" ? 0 : flowAmt,
    monthly: monthlyEl.value,
    date: dateEl.value
  };

  if (!entry.type || !entry.name || !entry.date) {
    alert("Fill required fields");
    return;
  }

  if (editIndex !== null) {
    data[editIndex] = entry;
    editIndex = null;
    saveBtn.innerText = "Add Entry";
  } else {
    data.push(entry);
  }

  localStorage.setItem("financeData", JSON.stringify(data));
  clearForm();
  render();
}

function clearForm() {
  typeEl.value = "";
  nameEl.value = "";
  amtEl.value = "";
  flowAmtEl.value = "";
  dateEl.value = "";
}

function editEntry(i) {
  const e = data[i];
  typeEl.value = e.type;
  nameEl.value = e.name;
  amtEl.value = e.amt;
  flowEl.value = e.flow;
  flowAmtEl.value = e.flowAmt || "";
  monthlyEl.value = e.monthly;
  dateEl.value = e.date;
  editIndex = i;
  saveBtn.innerText = "Save";
}

function deleteEntry(i) {
  if (!confirm("Delete entry?")) return;
  data.splice(i, 1);
  localStorage.setItem("financeData", JSON.stringify(data));
  render();
}

function render() {
  list.innerHTML = "";
  let totalRec = 0, totalPay = 0;

  const filtered = data.filter(e => {
    if (typeFilter.value !== "All" && e.type !== typeFilter.value) return false;
    if (flowFilter.value !== "All" && e.flow !== flowFilter.value) return false;
    return true;
  });

  filtered.forEach((e, i) => {
    if (e.flow === "Rec") totalRec += e.flowAmt;
    if (e.flow === "Pay") totalPay += e.flowAmt;

    const cls =
      e.flow === "Rec" ? "rec" :
      e.flow === "Pay" ? "pay" : "none";

    const label =
      e.flow === "Rec" ? `Rec ₹${e.flowAmt}` :
      e.flow === "Pay" ? `Pay ₹${e.flowAmt}` :
      "No cash flow";

    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `
      <div>
        <b>${e.name}</b><br>
        <small>
          ${e.type} |
          Principal ₹${e.amt} |
          <span class="${cls}">${label}</span> |
          ${e.monthly} | ${e.date}
        </small>
      </div>
      <div class="actions">
        <button onclick="editEntry(${data.indexOf(e)})">✏️</button>
        <button onclick="deleteEntry(${data.indexOf(e)})">🗑</button>
      </div>
    `;
    list.appendChild(div);
  });

  tRec.textContent = totalRec;
  tPay.textContent = totalPay;
  tNet.textContent = totalRec - totalPay;
}

render();
</script>

<!-- Version: 2.4 -->
</body>
</html>
