<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rangoli Grid Drawer</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0f0f0f;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  padding: 12px;
  font-size: 18px;
  font-weight: 600;
}

canvas {
  background: #111;
  border: 1px solid #333;
  touch-action: none;
}

.controls {
  display: flex;
  gap: 10px;
  padding: 12px;
}

button {
  background: #222;
  color: #fff;
  border: 1px solid #444;
  padding: 8px 14px;
  border-radius: 6px;
}
button:active {
  background: #444;
}
</style>
</head>

<body>

<header>Rangoli Designer (7 × 7)</header>

<canvas id="canvas" width="360" height="360"></canvas>

<div class="controls">
  <button id="undo">Undo</button>
  <button id="clear">Clear</button>
  <button id="export">Export PNG</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

/* 🔴 ONLY THESE VALUES CHANGED */
const GRID = 7;
const FULL = 7;
/* 🔴 END */

const PADDING = 40;
const SIZE = canvas.width - PADDING * 2;
const STEP = SIZE / (FULL - 1);
const DOT_RADIUS = 4;

let drawing = false;
let startDot = null;
let lines = [];

function dotPos(x, y) {
  return {
    x: PADDING + x * STEP,
    y: PADDING + y * STEP
  };
}

function nearestDot(px, py) {
  let best = null;
  let dist = 9999;
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const p = dotPos(x, y);
      const d = Math.hypot(px - p.x, py - p.y);
      if (d < 12 && d < dist) {
        best = { x, y };
        dist = d;
      }
    }
  }
  return best;
}

function mirrorLine(a, b) {
  const mx = FULL - 1;
  const my = FULL - 1;
  return [
    [a, b],
    [{ x: mx - a.x, y: a.y }, { x: mx - b.x, y: b.y }],
    [{ x: a.x, y: my - a.y }, { x: b.x, y: my - b.y }],
    [{ x: mx - a.x, y: my - a.y }, { x: mx - b.x, y: my - b.y }]
  ];
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // dots
  ctx.fillStyle = "#666";
  for (let y = 0; y < FULL; y++) {
    for (let x = 0; x < FULL; x++) {
      const p = dotPos(x, y);
      ctx.beginPath();
      ctx.arc(p.x, p.y, DOT_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // lines
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  lines.forEach(l => {
    mirrorLine(l.a, l.b).forEach(([p1, p2]) => {
      const A = dotPos(p1.x, p1.y);
      const B = dotPos(p2.x, p2.y);
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();
    });
  });
}

canvas.addEventListener("pointerdown", e => {
  const r = canvas.getBoundingClientRect();
  startDot = nearestDot(e.clientX - r.left, e.clientY - r.top);
  drawing = !!startDot;
});

canvas.addEventListener("pointerup", e => {
  if (!drawing) return;
  const r = canvas.getBoundingClientRect();
  const endDot = nearestDot(e.clientX - r.left, e.clientY - r.top);
  if (endDot) {
    lines.push({ a: startDot, b: endDot });
  }
  drawing = false;
  startDot = null;
  draw();
});

document.getElementById("undo").onclick = () => {
  lines.pop();
  draw();
};

document.getElementById("clear").onclick = () => {
  lines = [];
  draw();
};

document.getElementById("export").onclick = () => {
  const link = document.createElement("a");
  link.download = "rangoli-7x7.png";
  link.href = canvas.toDataURL();
  link.click();
};

draw();
</script>
