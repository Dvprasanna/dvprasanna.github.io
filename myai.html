<!DOCTYPE html>
<html>
<head>
    <title>PHP API Test</title>
</head>
<body>

<input id="txt" placeholder="Type here">
<button onclick="send()">Send</button>

<p id="result"></p>

<script>
async function send() {
    try {
        const r = await fetch("https://mydpweb.42web.io/reply.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: document.getElementById("txt").value
            })
        });

        alert("HTTP Status: " + r.status);

        const t = await r.text();

        alert(t);

    } catch(e) {
        alert(e.toString());
    }
}
</script>

</body>
</html>
