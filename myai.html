<!DOCTYPE html>
<html>
<head>
    <title>PHP API Test</title>
</head>
<body>

<input id="txt" placeholder="Type here">
<button onclick="send()">Send</button>

<p id="result"></p>
<div id="result"></div>
<script>

async function send() {
    try {
        const r = await fetch("https://mydpweb.42web.io/reply.php?text=hi");
        const t = await r.text();
        alert(t);
    } catch(e) {
        alert(e);
    }
}
   
</script>

</body>
</html>
