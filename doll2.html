<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppet Shape Editor</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
}
canvas{
  background:#eee;
  display:block;
  margin:10px auto;
  touch-action:none;
}
</style>
</head>
<body>

<h3>Drag puppet • Edit glove points (blue)</h3>

<canvas id="stage" width="360" height="420"></canvas>

<script>
/* ================= CANVAS ================= */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

/* ================= PUPPET ================= */
const puppet = {
  barX: 180,
  barY: 0,
  baseY: 200,
  parts:{
    head:{x:0,y:-40},
    lh:{x:-40,y:30},   // LEFT HAND (glove attached here)
    rh:{x:40,y:30},
    ll:{x:-20,y:120},
    rl:{x:20,y:120}
  }
};

/* ================= SHAPE (GLOVE) ================= */
let gloveShape = {
  points:[
    {x:-10,y:-6},
    {x:6,y:-8},
    {x:12,y:0},
    {x:6,y:10},
    {x:-8,y:8},
    {x:-12,y:0}
  ]
};

/* ================= STATE ================= */
let drag = null;
let draggedPoint = null;

/* ================= HELPERS ================= */
const L=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
const D=(x,y,r=5,color="#d00")=>{
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
};

/* ================= SMOOTH SHAPE ================= */
function drawSmoothShape(points, ox, oy){
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.moveTo(points[0].x+ox, points[0].y+oy);

  for(let i=1;i<points.length-1;i++){
    const cx=(points[i].x+points[i+1].x)/2;
    const cy=(points[i].y+points[i+1].y)/2;
    ctx.quadraticCurveTo(
      points[i].x+ox,
      points[i].y+oy,
      cx+ox,
      cy+oy
    );
  }

  ctx.closePath();
  ctx.fill();
}

/* ================= POINT EDITOR ================= */
function drawPoints(points, ox, oy){
  points.forEach(p=>{
    D(p.x+ox, p.y+oy, 4, "#00f");
  });
}

function hitPoint(px,py,x,y){
  return Math.hypot(px-x, py-y) < 10;
}

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth=3;
  ctx.strokeStyle="#000";

  const cx=puppet.barX;
  const cy=puppet.baseY+puppet.barY;

  /* BODY */
  L(cx,cy,cx,cy+70);

  /* HEAD */
  const hx=cx+puppet.parts.head.x;
  const hy=cy+puppet.parts.head.y;
  L(cx,cy,hx,hy);
  ctx.beginPath();ctx.arc(hx,hy,16,0,Math.PI*2);ctx.stroke();

  /* HANDS */
  ["lh","rh"].forEach(k=>{
    const p=puppet.parts[k];
    L(cx,cy+15,cx+p.x,cy+p.y);
    D(cx+p.x,cy+p.y);
  });

  /* LEGS */
  ["ll","rl"].forEach(k=>{
    const p=puppet.parts[k];
    L(cx,cy+70,cx+p.x,cy+p.y);
    D(cx+p.x,cy+p.y);
  });

  /* CONTROL BARS */
  L(cx-50,40,cx+50,40); D(cx,40);
  L(330,90+puppet.barY,330,150+puppet.barY); D(330,120+puppet.barY);

  /* GLOVE SHAPE (LEFT HAND) */
  const gx=cx+puppet.parts.lh.x;
  const gy=cy+puppet.parts.lh.y;

  drawSmoothShape(gloveShape.points, gx, gy);
  drawPoints(gloveShape.points, gx, gy);
}

/* ================= INPUT ================= */
function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}

canvas.onmousedown=canvas.ontouchstart=e=>{
  const p=pos(e);
  const cx=puppet.barX;
  const cy=puppet.baseY+puppet.barY;

  /* POINT EDIT FIRST */
  const gx=cx+puppet.parts.lh.x;
  const gy=cy+puppet.parts.lh.y;

  gloveShape.points.forEach(pt=>{
    if(hitPoint(p.x,p.y,pt.x+gx,pt.y+gy)){
      draggedPoint=pt;
    }
  });
  if(draggedPoint) return;

  /* PUPPET MOVE */
  if(Math.abs(p.y-40)<12&&Math.abs(p.x-cx)<50){drag={type:"x"};return;}
  if(Math.abs(p.x-330)<12&&Math.abs(p.y-(120+puppet.barY))<30){drag={type:"y"};return;}

  for(const k in puppet.parts){
    const px=cx+puppet.parts[k].x;
    const py=cy+puppet.parts[k].y;
    if(hitPoint(p.x,p.y,px,py)){drag={type:"part",key:k};return;}
  }
};

canvas.onmousemove=canvas.ontouchmove=e=>{
  const p=pos(e);
  const cx=puppet.barX;
  const cy=puppet.baseY+puppet.barY;

  if(draggedPoint){
    const gx=cx+puppet.parts.lh.x;
    const gy=cy+puppet.parts.lh.y;
    draggedPoint.x=p.x-gx;
    draggedPoint.y=p.y-gy;
    draw();
    return;
  }

  if(!drag) return;

  if(drag.type==="x") puppet.barX=p.x;
  if(drag.type==="y") puppet.barY=p.y-120;
  if(drag.type==="part"){
    puppet.parts[drag.key].x=p.x-cx;
    puppet.parts[drag.key].y=p.y-cy;
  }
  draw();
};

canvas.onmouseup=canvas.ontouchend=()=>{
  drag=null;
  draggedPoint=null;
};

/* ================= START ================= */
draw();
</script>

</body>
</html>
