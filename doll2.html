<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Puppet Animator – Full Controls</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
  padding-bottom:90px;
}
canvas{
  background:#eee;
  display:block;
  margin:10px auto;
  touch-action:none;
}
#anim-ui{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#222;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
#anim-ui button,
#anim-ui input{
  padding:8px 12px;
  font-size:14px;
  border:none;
  border-radius:6px;
}
#anim-ui button{
  background:#444;
  color:#fff;
}
#anim-ui input{
  width:70px;
  text-align:center;
}
</style>
</head>

<body>

<h3>Simple Puppet Animator (All Control Points)</h3>

<canvas id="stage" width="360" height="360"></canvas>

<div id="anim-ui">
  <button id="play">▶ Play</button>
  <button id="restart">⟲ Restart</button>
  Frame:
  <input id="curFrame" type="number" value="0" min="0">
  Max:
  <input id="maxFrame" type="number" value="40" min="1">
</div>

<script>
/* ===== CONFIG ===== */
const FPS = 10;
const AUTO_THRESHOLD = 8;

/* ===== CANVAS ===== */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

/* ===== STATE ===== */
let currentFrame = 0;
let playing = false;
let frames = {};
let lastAutoPose = null;
let drag = null;

/* ===== PUPPET ===== */
const puppet = {
  x: 180,
  y: 160,
  parts:{
    head:{x:0,y:-40},
    lh:{x:-40,y:20},
    rh:{x:40,y:20},
    ll:{x:-20,y:120},
    rl:{x:20,y:120}
  }
};

/* ===== HELPERS ===== */
const clone=o=>JSON.parse(JSON.stringify(o));

const line=(x1,y1,x2,y2)=>{
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
};

const dot=(x,y,color="#d00",r=5)=>{
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
};

function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}

function hit(px,py,x,y,r=10){
  return Math.hypot(px-x,py-y)<=r;
}

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth=3;
  ctx.strokeStyle="#000";

  const cx=puppet.x, cy=puppet.y;

  // bones
  line(cx,cy,cx,cy+70);
  line(cx,cy,cx+puppet.parts.head.x,cy+puppet.parts.head.y);

  line(cx,cy+10,cx+puppet.parts.lh.x,cy+puppet.parts.lh.y);
  line(cx,cy+10,cx+puppet.parts.rh.x,cy+puppet.parts.rh.y);

  line(cx,cy+70,cx+puppet.parts.ll.x,cy+puppet.parts.ll.y);
  line(cx,cy+70,cx+puppet.parts.rl.x,cy+puppet.parts.rl.y);

  // head
  const hx=cx+puppet.parts.head.x;
  const hy=cy+puppet.parts.head.y;
  ctx.beginPath();
  ctx.arc(hx,hy,16,0,Math.PI*2);
  ctx.stroke();

  // ===== CONTROL POINTS =====

  // body center
  dot(cx,cy,"#000");

  // head center + ears
  dot(hx,hy,"#00a");
  dot(hx-16,hy,"#00a");
  dot(hx+16,hy,"#00a");

  // arm mids + ends
  const sy=cy+10;
  dot(cx+puppet.parts.lh.x/2, sy+(puppet.parts.lh.y-10)/2, "#0a0");
  dot(cx+puppet.parts.lh.x, cy+puppet.parts.lh.y, "#0a0");

  dot(cx+puppet.parts.rh.x/2, sy+(puppet.parts.rh.y-10)/2, "#0a0");
  dot(cx+puppet.parts.rh.x, cy+puppet.parts.rh.y, "#0a0");

  // leg mids + ends
  const hy2=cy+70;
  dot(cx+puppet.parts.ll.x/2, hy2+(puppet.parts.ll.y-70)/2, "#a00");
  dot(cx+puppet.parts.ll.x, cy+puppet.parts.ll.y, "#a00");

  dot(cx+puppet.parts.rl.x/2, hy2+(puppet.parts.rl.y-70)/2, "#a00");
  dot(cx+puppet.parts.rl.x, cy+puppet.parts.rl.y, "#a00");
}

/* ===== AUTO KEY ===== */
function poseMovedEnough(curr,last){
  if(!last) return true;
  for(const k in curr.parts){
    const dx=curr.parts[k].x-last.parts[k].x;
    const dy=curr.parts[k].y-last.parts[k].y;
    if(Math.hypot(dx,dy)>=AUTO_THRESHOLD) return true;
  }
  return false;
}

function autoAddFrame(){
  if(poseMovedEnough(puppet,lastAutoPose)){
    frames[currentFrame]=clone(puppet);
    lastAutoPose=clone(puppet);
  }
}

/* ===== INPUT ===== */
canvas.onmousedown=canvas.ontouchstart=e=>{
  if(playing) return;
  const p=pos(e);
  const cx=puppet.x, cy=puppet.y;

  // body center
  if(hit(p.x,p.y,cx,cy)){ drag={type:"root"}; return; }

  // head center & ears
  const hx=cx+puppet.parts.head.x;
  const hy=cy+puppet.parts.head.y;
  if(hit(p.x,p.y,hx,hy)||hit(p.x,p.y,hx-16,hy)||hit(p.x,p.y,hx+16,hy)){
    drag={type:"part",k:"head"}; return;
  }

  // arm mid & end
  const sy=cy+10;
  if(hit(p.x,p.y,cx+puppet.parts.lh.x/2, sy+(puppet.parts.lh.y-10)/2) ||
     hit(p.x,p.y,cx+puppet.parts.lh.x, cy+puppet.parts.lh.y)){
    drag={type:"part",k:"lh"}; return;
  }
  if(hit(p.x,p.y,cx+puppet.parts.rh.x/2, sy+(puppet.parts.rh.y-10)/2) ||
     hit(p.x,p.y,cx+puppet.parts.rh.x, cy+puppet.parts.rh.y)){
    drag={type:"part",k:"rh"}; return;
  }

  // leg mid & end
  const hy2=cy+70;
  if(hit(p.x,p.y,cx+puppet.parts.ll.x/2, hy2+(puppet.parts.ll.y-70)/2) ||
     hit(p.x,p.y,cx+puppet.parts.ll.x, cy+puppet.parts.ll.y)){
    drag={type:"part",k:"ll"}; return;
  }
  if(hit(p.x,p.y,cx+puppet.parts.rl.x/2, hy2+(puppet.parts.rl.y-70)/2) ||
     hit(p.x,p.y,cx+puppet.parts.rl.x, cy+puppet.parts.rl.y)){
    drag={type:"part",k:"rl"}; return;
  }
};

canvas.onmousemove=canvas.ontouchmove=e=>{
  if(!drag||playing) return;
  const p=pos(e);

  if(drag.type==="root"){
    puppet.x=p.x;
    puppet.y=p.y;
  }else{
    puppet.parts[drag.k].x=p.x-puppet.x;
    puppet.parts[drag.k].y=p.y-puppet.y;
  }

  autoAddFrame();
  draw();
};

canvas.onmouseup=canvas.ontouchend=()=>drag=null;

/* ===== ANIMATION ===== */
function applyFrame(f){
  if(frames[f]){
    Object.assign(puppet,clone(frames[f]));
    lastAutoPose=clone(puppet);
  }
  document.getElementById("curFrame").value=f;
  draw();
}

document.getElementById("curFrame").onchange=e=>{
  const max=parseInt(document.getElementById("maxFrame").value);
  currentFrame=Math.max(0,Math.min(max,parseInt(e.target.value)||0));
  applyFrame(currentFrame);
};

document.getElementById("play").onclick=e=>{
  playing=!playing;
  e.target.innerText=playing?"⏸ Stop":"▶ Play";
};

document.getElementById("restart").onclick=()=>{
  currentFrame=0;
  applyFrame(0);
};

setInterval(()=>{
  if(!playing) return;
  const max=parseInt(document.getElementById("maxFrame").value);
  currentFrame++;
  if(currentFrame>max) currentFrame=0;
  applyFrame(currentFrame);
},1000/FPS);

/* ===== START ===== */
draw();
</script>

</body>
</html>
