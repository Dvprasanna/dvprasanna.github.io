<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Puppet Animator (Auto Key + Frame Box)</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
  padding-bottom:90px;
}
canvas{
  background:#eee;
  display:block;
  margin:10px auto;
  touch-action:none;
}
#anim-ui{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#222;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
#anim-ui button,
#anim-ui input{
  padding:8px 12px;
  font-size:14px;
  border:none;
  border-radius:6px;
}
#anim-ui button{
  background:#444;
  color:#fff;
}
#anim-ui input{
  width:70px;
  text-align:center;
}
</style>
</head>

<body>

<h3>Simple Puppet Animator</h3>

<canvas id="stage" width="360" height="360"></canvas>

<div id="anim-ui">
  <button id="play">▶ Play</button>
  <button id="restart">⟲ Restart</button>

  Frame:
  <input id="curFrame" type="number" value="0" min="0">

  Max:
  <input id="maxFrame" type="number" value="40" min="1">

  <button id="add">＋ Add Frame</button>
</div>

<script>
/* ===== CONFIG ===== */
const FPS = 10;
const AUTO_THRESHOLD = 8;

/* ===== CANVAS ===== */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

/* ===== STATE ===== */
let currentFrame = 0;
let playing = false;
let frames = {};
let lastAutoPose = null;

/* ===== PUPPET ===== */
const puppet = {
  x: 180,
  y: 160,
  parts:{
    head:{x:0,y:-40},
    lh:{x:-40,y:20},
    rh:{x:40,y:20},
    ll:{x:-20,y:120},
    rl:{x:20,y:120}
  }
};

let drag=null;

/* ===== HELPERS ===== */
const line=(x1,y1,x2,y2)=>{
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
};
const dot=(x,y)=>{
  ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth=3;
  ctx.strokeStyle="#000";
  ctx.fillStyle="#d00";

  const cx=puppet.x, cy=puppet.y;

  line(cx,cy,cx,cy+70);

  line(cx,cy,cx+puppet.parts.head.x,cy+puppet.parts.head.y);
  ctx.beginPath(); ctx.arc(cx,cy-40,16,0,Math.PI*2); ctx.stroke();

  ["lh","rh"].forEach(k=>{
    const p=puppet.parts[k];
    line(cx,cy+10,cx+p.x,cy+p.y); dot(cx+p.x,cy+p.y);
  });

  ["ll","rl"].forEach(k=>{
    const p=puppet.parts[k];
    line(cx,cy+70,cx+p.x,cy+p.y); dot(cx+p.x,cy+p.y);
  });
}

/* ===== INPUT ===== */
function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function hit(px,py,x,y){
  return Math.hypot(px-x,py-y)<12;
}

canvas.onmousedown=canvas.ontouchstart=e=>{
  if(playing) return;
  const p=pos(e);
  const cx=puppet.x, cy=puppet.y;

  for(const k in puppet.parts){
    const px=cx+puppet.parts[k].x;
    const py=cy+puppet.parts[k].y;
    if(hit(p.x,p.y,px,py)){ drag={k}; return; }
  }
};

canvas.onmousemove=canvas.ontouchmove=e=>{
  if(!drag||playing) return;
  const p=pos(e);
  puppet.parts[drag.k].x=p.x-puppet.x;
  puppet.parts[drag.k].y=p.y-puppet.y;
  autoAddFrame();
  draw();
};

canvas.onmouseup=canvas.ontouchend=()=>drag=null;

/* ===== AUTO KEY ===== */
function poseMovedEnough(curr,last){
  if(!last) return true;
  for(const k in curr.parts){
    const dx=curr.parts[k].x-last.parts[k].x;
    const dy=curr.parts[k].y-last.parts[k].y;
    if(Math.hypot(dx,dy)>=AUTO_THRESHOLD) return true;
  }
  return false;
}

function autoAddFrame(){
  if(poseMovedEnough(puppet,lastAutoPose)){
    frames[currentFrame]=clone(puppet);
    lastAutoPose=clone(puppet);
  }
}

/* ===== ANIMATION ===== */
function applyFrame(f){
  if(frames[f]){
    Object.assign(puppet,clone(frames[f]));
    lastAutoPose=clone(puppet);
  }
  document.getElementById("curFrame").value=f;
  draw();
}

document.getElementById("curFrame").onchange=e=>{
  const max=parseInt(document.getElementById("maxFrame").value);
  currentFrame=Math.max(0,Math.min(max,parseInt(e.target.value)||0));
  applyFrame(currentFrame);
};

document.getElementById("add").onclick=()=>{
  frames[currentFrame]=clone(puppet);
  lastAutoPose=clone(puppet);
};

document.getElementById("play").onclick=e=>{
  playing=!playing;
  e.target.innerText=playing?"⏸ Stop":"▶ Play";
};

document.getElementById("restart").onclick=()=>{
  currentFrame=0;
  applyFrame(0);
};

setInterval(()=>{
  if(!playing) return;
  const max=parseInt(document.getElementById("maxFrame").value);
  currentFrame++;
  if(currentFrame>max) currentFrame=0;
  applyFrame(currentFrame);
},1000/FPS);

/* ===== START ===== */
draw();
</script>

</body>
</html>
