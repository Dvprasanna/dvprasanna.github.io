<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minimalist 2D Flat Layout</title>

<style>
body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:#f2f2f2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
button{
  padding:14px 22px;
  font-size:16px;
  border:1px solid #ccc;
  background:#fff;
  cursor:pointer;
}
button:hover{
  background:#eee;
}
</style>
</head>

<body>

<button onclick="generatePDF()">Generate PDF</button>

<!-- Hidden SVG (internal use only) -->
<svg id="plan" width="900" height="550" style="display:none"></svg>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvg@3.0.10/lib/umd.js"></script>

<script>
const svg = document.getElementById("plan");

function el(type, attrs){
  const e = document.createElementNS("http://www.w3.org/2000/svg", type);
  for(let k in attrs) e.setAttribute(k, attrs[k]);
  svg.appendChild(e);
}

/* ---------------- DRAW PLAN ---------------- */
function drawPlan(){
  svg.innerHTML = "";

  // OUTER WALLS
  el("line",{x1:60,y1:60,x2:840,y2:60,stroke:"#000","stroke-width":6});
  el("line",{x1:840,y1:60,x2:840,y2:480,stroke:"#000","stroke-width":6});
  el("line",{x1:840,y1:480,x2:60,y2:480,stroke:"#000","stroke-width":6});
  el("line",{x1:60,y1:480,x2:60,y2:60,stroke:"#000","stroke-width":6});

  // INTERNAL WALL
  el("line",{x1:420,y1:60,x2:420,y2:480,stroke:"#000","stroke-width":6});

  // WINDOW
  el("line",{x1:200,y1:60,x2:320,y2:60,stroke:"#2b8cff","stroke-width":4});

  // DOOR (arc)
  el("path",{
    d:"M420 300 A60 60 0 0 1 480 360",
    stroke:"#b36a3c",
    fill:"none",
    "stroke-width":3
  });

  // FURNITURE
  el("rect",{x:120,y:320,width:160,height:80,fill:"none",stroke:"#444","stroke-width":2});
  el("rect",{x:520,y:120,width:180,height:70,fill:"none",stroke:"#444","stroke-width":2});
  el("rect",{x:560,y:300,width:120,height:120,fill:"none",stroke:"#444","stroke-width":2});

  // ELECTRICAL POINTS
  el("circle",{cx:150,cy:290,r:5,fill:"#d40000"});
  el("circle",{cx:650,cy:180,r:5,fill:"#d40000"});
  el("circle",{cx:700,cy:360,r:5,fill:"#d40000"});

  // DIMENSIONS
  dimension(60,60,840,60,"7800 mm");
  dimension(60,60,60,480,"4200 mm");
}

/* -------- DIMENSION FUNCTION -------- */
function dimension(x1,y1,x2,y2,label){
  const offset = 20;
  const dx = y1===y2 ? 0 : offset;
  const dy = x1===x2 ? 0 : offset;

  el("line",{x1:x1,y1:y1,x2:x1+dx,y2:y1+dy,stroke:"#666","stroke-width":1});
  el("line",{x1:x2,y1:y2,x2:x2+dx,y2:y2+dy,stroke:"#666","stroke-width":1});
  el("line",{x1:x1+dx,y1:y1+dy,x2:x2+dx,y2:y2+dy,stroke:"#666","stroke-width":1});

  el("text",{
    x:(x1+x2)/2+dx,
    y:(y1+y2)/2+dy-4,
    fill:"#333",
    "font-size":"12"
  }).textContent = label;
}

/* ---------------- PDF FIRST ---------------- */
async function generatePDF(){
  drawPlan();

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("landscape","pt","a4");

  const svgData = new XMLSerializer().serializeToString(svg);

  const canvas = document.createElement("canvas");
  canvas.width = 1200;
  canvas.height = 700;
  const ctx = canvas.getContext("2d");

  const v = await canvg.Canvg.fromString(ctx, svgData);
  await v.render();

  const img = canvas.toDataURL("image/png");

  pdf.setFontSize(16);
  pdf.text("Minimalist 2D Flat Layout",40,40);
  pdf.setFontSize(10);
  pdf.text("2D floor plan | furniture | electrical | dimensions",40,56);

  pdf.addImage(img,"PNG",40,70,760,440);
  pdf.save("Minimalist-2D-Flat-Layout.pdf");
}
</script>

</body>
</html>
