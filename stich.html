<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tailoring Measurement Preview</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 16px;
  }
  h2 {
    margin-top: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  label {
    display: block;
    margin-top: 12px;
    font-size: 14px;
  }
  input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    font-size: 16px;
  }
  textarea {
    resize: vertical;
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div {
    flex: 1;
  }
  .btn {
    background: #007aff;
    color: white;
    border: none;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    width: 100%;
    margin-top: 16px;
  }
  pre {
    background: #1e1e1e;
    color: #00ff90;
    padding: 12px;
    overflow-x: auto;
    font-size: 13px;
    border-radius: 8px;
  }
</style>
</head>

<body>

<h2>Men’s Stitching Measurement Preview</h2>

<div class="card">
  <label>Garment</label>
  <select id="garment">
    <option value="shirt">Shirt</option>
    <option value="pant">Pant</option>
    <option value="kurta">Kurta</option>
  </select>

  <label>Fit</label>
  <select id="fit">
    <option>Regular</option>
    <option>Slim</option>
    <option>Loose</option>
  </select>

  <label>Posture</label>
  <select id="posture" multiple>
    <option value="forward_shoulder">Forward Shoulder</option>
    <option value="sloped_shoulder">Sloped Shoulder</option>
    <option value="prominent_belly">Prominent Belly</option>
    <option value="one_shoulder_low">One Shoulder Low</option>
  </select>
</div>

<div class="card">
  <h3>Measurements (Inches)</h3>
  <div class="row">
    <div>
      <label>Chest</label>
      <input type="number" id="chest">
    </div>
    <div>
      <label>Waist</label>
      <input type="number" id="waist">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Shoulder</label>
      <input type="number" id="shoulder">
    </div>
    <div>
      <label>Sleeve Length</label>
      <input type="number" id="sleeve">
    </div>
  </div>

  <label>Garment Length</label>
  <input type="number" id="length">
</div>

<div class="card">
  <label>Remarks</label>
  <textarea id="remarks" rows="3"></textarea>

  <label>Stitching Instructions</label>
  <textarea id="instructions" rows="2"></textarea>

  <button class="btn" onclick="generate()">Preview JSON</button>
</div>

<div class="card">
  <h3>Export Preview (JSON)</h3>
  <pre id="output">{}</pre>
</div>

<script>
function generate() {
  const postureSelect = document.getElementById("posture");
  const postureValues = Array.from(postureSelect.selectedOptions).map(o => o.value);

  const data = {
    garment: document.getElementById("garment").value,
    unit: "inch",
    measurements: {
      chest: Number(chest.value),
      waist: Number(waist.value),
      shoulder: Number(shoulder.value),
      sleeve: Number(sleeve.value),
      length: Number(length.value)
    },
    fit: fit.value,
    posture: postureValues,
    remarks: remarks.value,
    stitching_instructions: instructions.value
  };

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
