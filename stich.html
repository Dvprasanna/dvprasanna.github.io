<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tailoring Entry</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f7;
  padding: 16px;
  margin: 0;
}
h2 { margin-bottom: 12px; }

.accordion {
  background: #fff;
  border-radius: 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  overflow: hidden;
}
.accordion-header {
  padding: 14px 16px;
  font-weight: 600;
  background: #f0f0f3;
  cursor: pointer;
}
.accordion-body {
  padding: 16px;
  display: none;
}
.accordion.open .accordion-body { display: block; }

label {
  display: block;
  margin-top: 10px;
  font-size: 14px;
}
input, select, textarea {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-top: 4px;
}
textarea { resize: vertical; }

.row {
  display: flex;
  gap: 12px;
}
.row > div { flex: 1; }

.btn {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  background: #007aff;
  color: #fff;
  border: none;
  font-size: 16px;
  border-radius: 10px;
}

pre {
  background: #1e1e1e;
  color: #00ff90;
  padding: 12px;
  font-size: 13px;
  border-radius: 8px;
  overflow-x: auto;
}
.hidden { display: none; }
</style>
</head>

<body>

<h2>Men’s Stitching Entry</h2>

<!-- BILL INFO -->
<div class="accordion open">
  <div class="accordion-header" onclick="toggle(this)">Bill / Token Info</div>
  <div class="accordion-body">
    <label>Customer Name</label>
    <input id="custName">

    <label>Token Number</label>
    <input id="token">

    <label>Date</label>
    <input type="date" id="billDate">

    <div class="row">
      <div>
        <label>Total Amount</label>
        <input type="number" id="totalAmt" oninput="calcDue()">
      </div>
      <div>
        <label>Amount Received</label>
        <input type="number" id="amtRec" oninput="calcDue()">
      </div>
    </div>

    <label>Amount Due</label>
    <input type="number" id="amtDue" readonly>

    <label>Due Date</label>
    <input type="date" id="dueDate">
  </div>
</div>

<!-- GARMENT -->
<div class="accordion open">
  <div class="accordion-header" onclick="toggle(this)">Garment & Fit</div>
  <div class="accordion-body">
    <label>Garment</label>
    <select id="garment" onchange="switchGarment()">
      <option value="shirt">Shirt</option>
      <option value="pant">Pant</option>
      <option value="kurta">Kurta</option>
    </select>

    <label>Fit</label>
    <select id="fit">
      <option>Regular</option>
      <option>Slim</option>
      <option>Loose</option>
    </select>

    <label>Posture</label>
    <select id="posture" multiple>
      <option value="forward_shoulder">Forward Shoulder</option>
      <option value="sloped_shoulder">Sloped Shoulder</option>
      <option value="prominent_belly">Prominent Belly</option>
      <option value="one_shoulder_low">One Shoulder Low</option>
    </select>
  </div>
</div>

<!-- SHIRT -->
<div class="accordion open garment" id="shirt">
  <div class="accordion-header" onclick="toggle(this)">Shirt Measurements (Inches)</div>
  <div class="accordion-body">
    <div class="row">
      <div><label>Chest</label><input id="s_chest"></div>
      <div><label>Waist</label><input id="s_waist"></div>
    </div>
    <div class="row">
      <div><label>Shoulder</label><input id="s_shoulder"></div>
      <div><label>Sleeve</label><input id="s_sleeve"></div>
    </div>
    <label>Shirt Length</label>
    <input id="s_length">
  </div>
</div>

<!-- PANT -->
<div class="accordion garment hidden" id="pant">
  <div class="accordion-header" onclick="toggle(this)">Pant Measurements (Inches)</div>
  <div class="accordion-body">
    <div class="row">
      <div><label>Waist</label><input id="p_waist"></div>
      <div><label>Seat</label><input id="p_seat"></div>
    </div>
    <div class="row">
      <div><label>Thigh</label><input id="p_thigh"></div>
      <div><label>Knee</label><input id="p_knee"></div>
    </div>
    <div class="row">
      <div><label>Bottom</label><input id="p_bottom"></div>
      <div><label>Outseam</label><input id="p_outseam"></div>
    </div>
    <label>Inseam</label>
    <input id="p_inseam">
  </div>
</div>

<!-- KURTA -->
<div class="accordion garment hidden" id="kurta">
  <div class="accordion-header" onclick="toggle(this)">Kurta Measurements (Inches)</div>
  <div class="accordion-body">
    <div class="row">
      <div><label>Chest</label><input id="k_chest"></div>
      <div><label>Waist</label><input id="k_waist"></div>
    </div>
    <div class="row">
      <div><label>Shoulder</label><input id="k_shoulder"></div>
      <div><label>Sleeve</label><input id="k_sleeve"></div>
    </div>
    <label>Kurta Length</label>
    <input id="k_length">
  </div>
</div>

<!-- NOTES -->
<div class="accordion">
  <div class="accordion-header" onclick="toggle(this)">Notes & Instructions</div>
  <div class="accordion-body">
    <label>Remarks</label>
    <textarea id="remarks"></textarea>

    <label>Stitching Instructions</label>
    <textarea id="instructions"></textarea>

    <button class="btn" onclick="generate()">Preview JSON</button>
  </div>
</div>

<!-- OUTPUT -->
<div class="accordion">
  <div class="accordion-header" onclick="toggle(this)">Export Preview</div>
  <div class="accordion-body">
    <pre id="output">{}</pre>
  </div>
</div>

<script>
function toggle(el){ el.parentElement.classList.toggle("open"); }

function calcDue(){
  amtDue.value = (Number(totalAmt.value||0) - Number(amtRec.value||0));
}

function switchGarment(){
  document.querySelectorAll(".garment").forEach(g=>g.classList.add("hidden"));
  document.getElementById(garment.value).classList.remove("hidden");
}

function generate(){
  const postureVals=[...posture.selectedOptions].map(o=>o.value);
  let measurements={};

  if(garment.value==="shirt"){
    measurements={ chest:+s_chest.value, waist:+s_waist.value, shoulder:+s_shoulder.value, sleeve:+s_sleeve.value, length:+s_length.value };
  }
  if(garment.value==="pant"){
    measurements={ waist:+p_waist.value, seat:+p_seat.value, thigh:+p_thigh.value, knee:+p_knee.value, bottom:+p_bottom.value, outseam:+p_outseam.value, inseam:+p_inseam.value };
  }
  if(garment.value==="kurta"){
    measurements={ chest:+k_chest.value, waist:+k_waist.value, shoulder:+k_shoulder.value, sleeve:+k_sleeve.value, length:+k_length.value };
  }

  output.textContent = JSON.stringify({
    token: token.value,
    customer: custName.value,
    bill_date: billDate.value,
    due_date: dueDate.value,
    amount:{ total:+totalAmt.value, received:+amtRec.value, due:+amtDue.value },
    garment: garment.value,
    unit:"inch",
    fit: fit.value,
    posture: postureVals,
    measurements,
    remarks: remarks.value,
    stitching_instructions: instructions.value
  },null,2);
}
</script>

</body>
</html>
