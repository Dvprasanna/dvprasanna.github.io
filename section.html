<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Custom Section Rectangle</title>
<style>
  body { font-family: Arial; padding: 15px; }
  input, button { width: 100%; margin: 6px 0; padding: 6px; }
  canvas { border: 1px solid black; margin-top: 15px; max-width: 100%; }
</style>
</head>
<body>

<h3>Rectangle with Custom Section Lengths</h3>

<label>Width (W)</label>
<input type="number" id="width" value="120">

<label>Section Lengths (comma separated)</label>
<input type="text" id="sections" value="40,60,30,70">

<button onclick="draw()">Draw</button>
<button onclick="downloadPNG()">Download PNG</button>

<canvas id="canvas" width="700" height="400"></canvas>

<script>
function draw() {
  const W = Number(document.getElementById("width").value);
  const sectionInput = document.getElementById("sections").value;

  const sections = sectionInput.split(",").map(n => Number(n.trim()));
  if (sections.some(isNaN)) {
    alert("Invalid section lengths");
    return;
  }

  const totalLength = sections.reduce((a,b)=>a+b,0);

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const scale = Math.min(
    (canvas.width - 40) / totalLength,
    (canvas.height - 40) / W
  );

  const x = 20;
  const y = 20;
  const rectW = W * scale;
  const rectL = totalLength * scale;

  // outer rectangle
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, rectL, rectW);

  // sections
  let cursor = 0;
  ctx.lineWidth = 1;

  sections.forEach((len, i) => {
    cursor += len * scale;
    if (i < sections.length - 1) {
      ctx.beginPath();
      ctx.moveTo(x + cursor, y);
      ctx.lineTo(x + cursor, y + rectW);
      ctx.stroke();
    }
  });
}

function downloadPNG() {
  const canvas = document.getElementById("canvas");
  const a = document.createElement("a");
  a.download = "custom-rectangle.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
}
</script>

</body>
</html>
