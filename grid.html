<style>

  margin: 0;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
}

  display: flex;
  gap: 8px;

  border-bottom: 1px solid #333;
}

<body>
by prasanna
v 1.03
<div id="toolbar">
  <button id="undoBtn">Undo</button>
  <button id="redoBtn">Redo</button>
  <button id="clearBtn">Clear</button>
</div>

<canvas id="cad"></canvas>

<script>
/* =====================================
   Canvas CAD Engine
   Version: 1.0.3
   ===================================== */

const canvas = document.getElementById("cad");
const ctx = canvas.getContext("2d");

// ---------- CONFIG ----------
const RECT_GRID = 20;
const RADIAL_STEP = 20;
const ANGLE_STEP = Math.PI / 12; // 15°

let drawing = false;
let startPoint = null;
let previewPoint = null;

// geometry stacks
const lines = [];
const redoStack = [];

// ---------- RESIZE ----------
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.6;
  redraw();
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ---------- GRID CENTER ----------
function gridCenter() {
  return {
    x: canvas.width / 2,
    y: canvas.width / 2
  };
}

// ---------- GRID ----------
function drawRectGrid() {
  ctx.strokeStyle = "#2a2a2a";
  ctx.lineWidth = 1;

  for (let x = 0; x <= canvas.width; x += RECT_GRID) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }

  for (let y = 0; y <= canvas.height; y += RECT_GRID) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawCircularGrid() {
  const { x, y } = gridCenter();
  ctx.strokeStyle = "#444";

  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(canvas.width, y);
  ctx.moveTo(x, 0);
  ctx.lineTo(x, canvas.height);
  ctx.stroke();

  for (let r = RADIAL_STEP; r < canvas.width; r += RADIAL_STEP) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (let a = 0; a < Math.PI * 2; a += ANGLE_STEP) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(
      x + Math.cos(a) * canvas.width,
      y + Math.sin(a) * canvas.width
    );
    ctx.stroke();
  }
}

function drawGrid() {
  drawRectGrid();
  drawCircularGrid();
}

// ---------- SNAP ----------
function snapRect(px, py) {
  return {
    x: Math.round(px / RECT_GRID) * RECT_GRID,
    y: Math.round(py / RECT_GRID) * RECT_GRID
  };
}

function snapRadial(px, py) {
  const { x: cx, y: cy } = gridCenter();
  const dx = px - cx;
  const dy = py - cy;

  const angle =
    Math.round(Math.atan2(dy, dx) / ANGLE_STEP) * ANGLE_STEP;
  const radius =
    Math.round(Math.hypot(dx, dy) / RADIAL_STEP) * RADIAL_STEP;

  return {
    x: cx + Math.cos(angle) * radius,
    y: cy + Math.sin(angle) * radius
  };
}

// decide which grid dominates → sets color
function snapPoint(px, py) {
  const r = snapRect(px, py);
  const c = snapRadial(px, py);

  const dr = Math.hypot(px - r.x, py - r.y);
  const dc = Math.hypot(px - c.x, py - c.y);

  if (dr <= dc) {
    return { ...r, mode: "rect" };
  } else {
    return { ...c, mode: "radial" };
  }
}

// ---------- REDRAW ----------
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();

  for (const l of lines) {
    ctx.strokeStyle = l.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.a.x, l.a.y);
    ctx.lineTo(l.b.x, l.b.y);
    ctx.stroke();
  }
}

// ---------- INPUT ----------
function getPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return {
    x: p.clientX - rect.left,
    y: p.clientY - rect.top
  };
}

function startDraw(e) {
  drawing = true;
  redoStack.length = 0;

  const p = getPoint(e);
  startPoint = snapPoint(p.x, p.y);
  previewPoint = startPoint;
}

function moveDraw(e) {
  if (!drawing) return;

  const p = getPoint(e);
  previewPoint = snapPoint(p.x, p.y);

  redraw();

  ctx.setLineDash([6, 6]);
  ctx.strokeStyle =
    previewPoint.mode === "rect" ? "#000" : "#ff3333";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(startPoint.x, startPoint.y);
  ctx.lineTo(previewPoint.x, previewPoint.y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function stopDraw() {
  if (!drawing) return;
  drawing = false;

  const color =
    previewPoint.mode === "rect" ? "#000000" : "#ff3333";

  lines.push({
    a: startPoint,
    b: previewPoint,
    color
  });

  redraw();
  startPoint = null;
  previewPoint = null;
}

// ---------- UI ACTIONS ----------
document.getElementById("undoBtn").onclick = () => {
  if (lines.length) redoStack.push(lines.pop());
  redraw();
};

document.getElementById("redoBtn").onclick = () => {
  if (redoStack.length) lines.push(redoStack.pop());
  redraw();
};

document.getElementById("clearBtn").onclick = () => {
  lines.length = 0;
  redoStack.length = 0;
  redraw();
};

// ---------- EVENTS ----------
canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", moveDraw);
canvas.addEventListener("mouseup", stopDraw);
canvas.addEventListener("mouseleave", stopDraw);

canvas.addEventListener("touchstart", startDraw, { passive: false });
canvas.addEventListener("touchmove", moveDraw, { passive: false });
canvas.addEventListener("touchend", stopDraw);

</script>

</body>
</html>
