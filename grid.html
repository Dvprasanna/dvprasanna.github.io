<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Canvas CAD Engine – v1.0.6</title>

<style>
html, body {
  margin: 0;
  font-family: system-ui, sans-serif;
}

/* ---------- TOP BAR ---------- */
#topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid;
}

#topbar button {
  padding: 4px 10px;
  cursor: pointer;
  border: 1px solid;
  background: transparent;
}

/* ---------- BALANCE ---------- */
#balanceBar {
  flex: 1;
  height: 6px;
  position: relative;
}

#balanceNeedle {
  position: absolute;
  top: -3px;
  width: 2px;
  height: 12px;
}

/* ---------- META ---------- */
#meta {
  font-size: 11px;
  font-family: monospace;
}

/* ---------- CANVAS ---------- */
canvas {
  display: block;
  touch-action: none;
}
</style>
</head>

<body>

<div id="topbar">
  <button id="undoBtn">Undo</button>
  <button id="redoBtn">Redo</button>
  <button id="clearBtn">Clear</button>
  <button id="themeBtn">Theme</button>

  <div id="balanceBar">
    <div id="balanceNeedle"></div>
  </div>

  <div id="meta"></div>
</div>

<canvas id="cad"></canvas>

<script>
/* ==================================================
   Canvas CAD Engine
   Version : 1.0.6
   Author  : dvprasanna
   ================================================== */

const APP_VERSION = "1.0.6";
const AUTHOR = "dvprasanna";

/* ---------- THEMES ---------- */
const THEMES = {
  dark: {
    bodyBg: "#111",
    canvasBg: "#0b0b0b",
    uiBg: "#000",
    uiBorder: "#333",
    uiText: "#fff",
    rectGrid: "#242424",
    circGrid: "#3a3a3a",
    lineRect: "#e6e6e6",
    lineRadial: "#ff4d4d",
    previewRect: "#cccccc",
    previewRadial: "#ff8080",
    balanceBg: "#222",
    balanceNeedle: "#00ff66"
  },
  light: {
    bodyBg: "#f5f5f5",
    canvasBg: "#ffffff",
    uiBg: "#f0f0f0",
    uiBorder: "#ccc",
    uiText: "#000",
    rectGrid: "#dddddd",
    circGrid: "#bbbbbb",
    lineRect: "#000000",
    lineRadial: "#cc0000",
    previewRect: "#666666",
    previewRadial: "#ff6666",
    balanceBg: "#ddd",
    balanceNeedle: "#008800"
  }
};

let THEME = "dark";

/* ---------- SET META ---------- */
const meta = document.getElementById("meta");
meta.textContent = `v${APP_VERSION} | ${AUTHOR}`;

/* ---------- CANVAS ---------- */
const canvas = document.getElementById("cad");
const ctx = canvas.getContext("2d");

/* ---------- CONFIG ---------- */
const RECT_GRID = 20;
const RADIAL_STEP = 20;
const ANGLE_STEP = Math.PI / 12;

let drawing = false;
let startPoint = null;
let previewPoint = null;

const lines = [];
const redoStack = [];

/* ---------- RESIZE ---------- */
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.6;
  redraw();
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ---------- THEME APPLY ---------- */
function applyTheme() {
  const t = THEMES[THEME];
  document.body.style.background = t.bodyBg;
  canvas.style.background = t.canvasBg;

  const bar = document.getElementById("topbar");
  bar.style.background = t.uiBg;
  bar.style.borderBottomColor = t.uiBorder;
  bar.style.color = t.uiText;

  document.querySelectorAll("#topbar button").forEach(b => {
    b.style.color = t.uiText;
    b.style.borderColor = t.uiBorder;
  });

  const bb = document.getElementById("balanceBar");
  const bn = document.getElementById("balanceNeedle");
  bb.style.background = t.balanceBg;
  bn.style.background = t.balanceNeedle;

  redraw();
}

/* ---------- GRID CENTER ---------- */
function gridCenter() {
  return { x: canvas.width / 2, y: canvas.width / 2 };
}

/* ---------- GRID ---------- */
function drawRectGrid() {
  ctx.strokeStyle = THEMES[THEME].rectGrid;
  for (let x = 0; x <= canvas.width; x += RECT_GRID) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += RECT_GRID) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawCircularGrid() {
  const { x, y } = gridCenter();
  ctx.strokeStyle = THEMES[THEME].circGrid;

  ctx.beginPath();
  ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
  ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
  ctx.stroke();

  for (let r = RADIAL_STEP; r < canvas.width; r += RADIAL_STEP) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawGrid() {
  drawRectGrid();
  drawCircularGrid();
}

/* ---------- SNAP ---------- */
function snapRect(px, py) {
  return {
    x: Math.round(px / RECT_GRID) * RECT_GRID,
    y: Math.round(py / RECT_GRID) * RECT_GRID
  };
}

function snapRadial(px, py) {
  const { x: cx, y: cy } = gridCenter();
  const dx = px - cx;
  const dy = py - cy;
  const a = Math.round(Math.atan2(dy, dx) / ANGLE_STEP) * ANGLE_STEP;
  const r = Math.round(Math.hypot(dx, dy) / RADIAL_STEP) * RADIAL_STEP;
  return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
}

function snapPoint(px, py) {
  const r = snapRect(px, py);
  const c = snapRadial(px, py);
  const dr = Math.hypot(px - r.x, py - r.y);
  const dc = Math.hypot(px - c.x, py - c.y);
  return dr <= dc ? { ...r, mode: "rect" } : { ...c, mode: "radial" };
}

/* ---------- REDRAW ---------- */
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();

  for (const l of lines) {
    ctx.strokeStyle = l.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.a.x, l.a.y);
    ctx.lineTo(l.b.x, l.b.y);
    ctx.stroke();
  }
  updateBalance();
}

/* ---------- BALANCE ---------- */
function updateBalance() {
  const cx = canvas.width / 2;
  let L = 0, R = 0;

  for (const l of lines) {
    const mid = (l.a.x + l.b.x) / 2;
    const len = Math.hypot(l.b.x - l.a.x, l.b.y - l.a.y);
    mid < cx ? L += len : R += len;
  }

  const t = L + R || 1;
  const b = (R - L) / t;
  document.getElementById("balanceNeedle").style.left =
    (50 + b * 50) + "%";
}

/* ---------- INPUT ---------- */
function getPoint(e) {
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: p.clientX - r.left, y: p.clientY - r.top };
}

function startDraw(e) {
  drawing = true;
  redoStack.length = 0;
  const p = getPoint(e);
  startPoint = snapPoint(p.x, p.y);
  previewPoint = startPoint;
}

function moveDraw(e) {
  if (!drawing) return;
  const p = getPoint(e);
  previewPoint = snapPoint(p.x, p.y);

  redraw();
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle =
    previewPoint.mode === "rect"
      ? THEMES[THEME].previewRect
      : THEMES[THEME].previewRadial;

  ctx.beginPath();
  ctx.moveTo(startPoint.x, startPoint.y);
  ctx.lineTo(previewPoint.x, previewPoint.y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function stopDraw() {
  if (!drawing) return;
  drawing = false;

  lines.push({
    a: startPoint,
    b: previewPoint,
    color:
      previewPoint.mode === "rect"
        ? THEMES[THEME].lineRect
        : THEMES[THEME].lineRadial
  });

  redraw();
}

/* ---------- UI ---------- */
undoBtn.onclick = () => { if (lines.length) redoStack.push(lines.pop()); redraw(); };
redoBtn.onclick = () => { if (redoStack.length) lines.push(redoStack.pop()); redraw(); };
clearBtn.onclick = () => { lines.length = redoStack.length = 0; redraw(); };

themeBtn.onclick = () => {
  THEME = THEME === "dark" ? "light" : "dark";
  applyTheme();
};

/* ---------- EVENTS ---------- */
canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", moveDraw);
canvas.addEventListener("mouseup", stopDraw);
canvas.addEventListener("mouseleave", stopDraw);

canvas.addEventListener("touchstart", startDraw, { passive: false });
canvas.addEventListener("touchmove", moveDraw, { passive: false });
canvas.addEventListener("touchend", stopDraw);

/* ---------- INIT ---------- */
applyTheme();
</script>

</body>
</html>
