<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Canvas CAD Engine – v1.0.2</title>

<style>
html, body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
}

#topbar {
  padding: 8px;
  text-align: center;
  border-bottom: 1px solid #333;
  font-size: 14px;
}

canvas {
  display: block;
  background: #000;
  touch-action: none;
}
</style>
</head>

<body>

<div id="topbar">
  Canvas CAD Engine — v1.0.2 | dvprasanna
</div>

<canvas id="cad"></canvas>

<script>
/* =====================================
   Canvas CAD Engine
   Version : 1.0.2
   Author  : dvprasanna
   ===================================== */

const canvas = document.getElementById("cad");
const ctx = canvas.getContext("2d");

/* ===== RESIZE ===== */
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.6;
  drawGrid();
}
window.addEventListener("resize", resize);
resize();

/* ===== GRID ===== */
const GRID = 20;

function center() {
  return {
    x: canvas.width / 2,
    y: canvas.height / 2
  };
}

function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* square grid */
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 1;

  for (let x = 0; x <= canvas.width; x += GRID) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }

  for (let y = 0; y <= canvas.height; y += GRID) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  /* circular reference grid */
  const c = center();
  ctx.strokeStyle = "#333";

  ctx.beginPath();
  ctx.moveTo(0, c.y);
  ctx.lineTo(canvas.width, c.y);
  ctx.moveTo(c.x, 0);
  ctx.lineTo(c.x, canvas.height);
  ctx.stroke();

  for (let r = GRID; r < canvas.width; r += GRID) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/* ===== DRAWING ===== */
let drawing = false;
let last = null;

function snap(p) {
  return {
    x: Math.round(p.x / GRID) * GRID,
    y: Math.round(p.y / GRID) * GRID
  };
}

function getPoint(e) {
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return {
    x: p.clientX - r.left,
    y: p.clientY - r.top
  };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  last = snap(getPoint(e));
}

function move(e) {
  if (!drawing) return;
  e.preventDefault();

  const p = snap(getPoint(e));

  ctx.strokeStyle = "#e6e6e6";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();

  last = p;
}

function stop() {
  drawing = false;
  last = null;
}

/* ===== EVENTS ===== */
canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("mouseup", stop);
canvas.addEventListener("mouseleave", stop);

canvas.addEventListener("touchstart", start, { passive: false });
canvas.addEventListener("touchmove", move, { passive: false });
canvas.addEventListener("touchend", stop);
</script>

</body>
</html>
