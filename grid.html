<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Canvas CAD Engine – v1.0.5-fixed</title>

<style>
html, body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
}

#topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: #000;
  border-bottom: 1px solid #333;
}

#topbar button {
  padding: 4px 10px;
  background: #222;
  color: #fff;
  border: 1px solid #444;
  cursor: pointer;
}

#balanceBar {
  flex: 1;
  height: 6px;
  background: #222;
  position: relative;
  margin-left: 10px;
}

#balanceNeedle {
  position: absolute;
  top: -3px;
  width: 2px;
  height: 12px;
  background: #00ff66;
  left: 50%;
}

canvas {
  display: block;
  background: #000;
  touch-action: none;
}

#meta {
  font-size: 11px;
  color: #888;
  font-family: monospace;
}
</style>
</head>

<body>
v 1.05
<div id="topbar">
  <button id="undoBtn">Undo</button>
  <button id="redoBtn">Redo</button>
  <button id="clearBtn">Clear</button>
  <div id="balanceBar"><div id="balanceNeedle"></div></div>
  <div id="meta">v1.0.5-fixed | dvprasanna</div>
</div>

<canvas id="cad"></canvas>

<script>
/* ================================
   Canvas CAD Engine
   Version : 1.0.5-fixed
   Author  : dvprasanna
   ================================ */

const canvas = document.getElementById("cad");
const ctx = canvas.getContext("2d");

const GRID = 20;
let drawing = false;
let startPoint = null;
let previewPoint = null;

const lines = [];
const redoStack = [];

/* ---------- RESIZE ---------- */
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.6;
  redraw();
}
window.addEventListener("resize", resize);
resize();

/* ---------- GRID ---------- */
function center() {
  return { x: canvas.width / 2, y: canvas.height / 2 };
}

function drawGrid() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = "#222";
  for(let x=0;x<=canvas.width;x+=GRID){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for(let y=0;y<=canvas.height;y+=GRID){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }

  const c=center();
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,c.y); ctx.lineTo(canvas.width,c.y);
  ctx.moveTo(c.x,0); ctx.lineTo(c.x,canvas.height);
  ctx.stroke();
}

/* ---------- SNAP ---------- */
function snap(p){
  return {
    x: Math.round(p.x/GRID)*GRID,
    y: Math.round(p.y/GRID)*GRID
  };
}

/* ---------- DRAW ---------- */
function redraw(){
  drawGrid();
  for(const l of lines){
    ctx.strokeStyle=l.color;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(l.a.x,l.a.y);
    ctx.lineTo(l.b.x,l.b.y);
    ctx.stroke();
  }
  updateBalance();
}

/* ---------- BALANCE ---------- */
function updateBalance(){
  const cx=canvas.width/2;
  let L=0,R=0;
  for(const l of lines){
    const mid=(l.a.x+l.b.x)/2;
    const len=Math.hypot(l.b.x-l.a.x,l.b.y-l.a.y);
    mid<cx?L+=len:R+=len;
  }
  balanceNeedle.style.left=(50+(R-L)/(L+R||1)*50)+"%";
}

/* ---------- INPUT ---------- */
function getPoint(e){
  const r=canvas.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return { x:p.clientX-r.left, y:p.clientY-r.top };
}

function startDraw(e){
  e.preventDefault();
  drawing=true;
  redoStack.length=0;
  startPoint=snap(getPoint(e));
  previewPoint=startPoint;   // CRITICAL FIX
}

function moveDraw(e){
  if(!drawing) return;
  e.preventDefault();

  previewPoint=snap(getPoint(e));
  redraw();

  ctx.setLineDash([6,6]);
  ctx.strokeStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(startPoint.x,startPoint.y);
  ctx.lineTo(previewPoint.x,previewPoint.y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function stopDraw(e){
  if(!drawing) return;
  e.preventDefault();
  drawing=false;

  if(!previewPoint) return;

  lines.push({
    a:startPoint,
    b:previewPoint,
    color:"#e6e6e6"
  });

  startPoint=previewPoint=null;
  redraw();
}

/* ---------- UI ---------- */
undoBtn.onclick=()=>{ if(lines.length) redoStack.push(lines.pop()); redraw(); };
redoBtn.onclick=()=>{ if(redoStack.length) lines.push(redoStack.pop()); redraw(); };
clearBtn.onclick=()=>{ lines.length=redoStack.length=0; redraw(); };

/* ---------- EVENTS ---------- */
canvas.addEventListener("mousedown",startDraw);
canvas.addEventListener("mousemove",moveDraw);
canvas.addEventListener("mouseup",stopDraw);
canvas.addEventListener("mouseleave",stopDraw);

canvas.addEventListener("touchstart",startDraw,{passive:false});
canvas.addEventListener("touchmove",moveDraw,{passive:false});
canvas.addEventListener("touchend",stopDraw);
</script>

</body>
</html>
