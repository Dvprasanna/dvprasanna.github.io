<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Image Measure Tool</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:system-ui,sans-serif;
}

#bar{
  position:fixed;
  top:0;left:0;right:0;
  height:48px;
  background:#1c1c1c;
  display:flex;
  align-items:center;
  gap:12px;
  padding:6px 10px;
  z-index:10;
}

#dist{
  width:120px;
  background:#000;
  color:#0f0;
  border:1px solid #444;
  padding:4px;
}

canvas{
  position:absolute;
  top:48px;
  left:0;
}
</style>
</head>
<body>

<div id="bar">
  <input type="file" id="loader" accept="image/*">
  Distance:
  <input id="dist" readonly> px
</div>

<canvas id="c"></canvas>

<script>
/* =====================
   SETUP
===================== */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
  c.width = innerWidth;
  c.height = innerHeight - 48;
}
resize();
addEventListener("resize",resize);

let img = new Image();
let loaded = false;

/* transform */
let scale = 1;
let ox = 0, oy = 0;

/* measure points (image space) */
let p1 = {x:100,y:100};
let p2 = {x:200,y:150};
let dragPoint = null;

/* pan */
let panning = false;
let lx=0, ly=0;

/* touch */
let lastDist = null;

/* =====================
   IMAGE LOAD
===================== */
loader.onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    img.src = ev.target.result;
    img.onload = ()=>{
      loaded = true;
      scale = 1;
      ox = c.width/2 - img.width/2;
      oy = c.height/2 - img.height/2;
      draw();
    };
  };
  r.readAsDataURL(f);
};

/* =====================
   DRAW
===================== */
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  if(!loaded) return;

  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(scale,scale);
  ctx.drawImage(img,0,0);

  // line
  ctx.strokeStyle="lime";
  ctx.lineWidth=1/scale;
  ctx.beginPath();
  ctx.moveTo(p1.x,p1.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.stroke();

  drawPt(p1);
  drawPt(p2);

  ctx.restore();
  updateDist();
}

function drawPt(p){
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(p.x,p.y,4/scale,0,Math.PI*2);
  ctx.fill();
}

function updateDist(){
  const dx=p2.x-p1.x, dy=p2.y-p1.y;
  dist.value=Math.hypot(dx,dy).toFixed(2);
}

/* =====================
   HELPERS
===================== */
function scrToImg(x,y){
  return {x:(x-ox)/scale,y:(y-oy)/scale};
}

function hit(p,x,y){
  return Math.hypot(p.x-x,p.y-y)<12/scale;
}

/* =====================
   MOUSE
===================== */
c.onmousedown=e=>{
  const p=scrToImg(e.offsetX,e.offsetY);
  if(hit(p1,p.x,p.y)) dragPoint=p1;
  else if(hit(p2,p.x,p.y)) dragPoint=p2;
  else panning=true;
  lx=e.clientX; ly=e.clientY;
};

c.onmousemove=e=>{
  if(dragPoint){
    const p=scrToImg(e.offsetX,e.offsetY);
    dragPoint.x=p.x; dragPoint.y=p.y;
    draw();
  }else if(panning){
    ox+=e.clientX-lx;
    oy+=e.clientY-ly;
    lx=e.clientX; ly=e.clientY;
    draw();
  }
};

c.onmouseup=()=>{dragPoint=null;panning=false;};

/* =====================
   WHEEL ZOOM (SMOOTH)
===================== */
c.onwheel=e=>{
  e.preventDefault();
  const z=e.deltaY<0?1.15:0.87;
  const mx=e.offsetX,my=e.offsetY;
  ox=mx-(mx-ox)*z;
  oy=my-(my-oy)*z;
  scale*=z;
  draw();
};

/* =====================
   TOUCH (PAN + PINCH)
===================== */
c.ontouchstart=e=>{
  if(e.touches.length===1){
    const t=e.touches[0];
    const p=scrToImg(t.clientX,t.clientY-48);
    if(hit(p1,p.x,p.y)) dragPoint=p1;
    else if(hit(p2,p.x,p.y)) dragPoint=p2;
    else panning=true;
    lx=t.clientX; ly=t.clientY;
  }
  if(e.touches.length===2){
    lastDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
  }
};

c.ontouchmove=e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    if(dragPoint){
      const p=scrToImg(t.clientX,t.clientY-48);
      dragPoint.x=p.x; dragPoint.y=p.y;
    }else if(panning){
      ox+=t.clientX-lx;
      oy+=t.clientY-ly;
      lx=t.clientX; ly=t.clientY;
    }
    draw();
  }
  if(e.touches.length===2){
    const d=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    const z=d/lastDist;
    scale*=z;
    lastDist=d;
    draw();
  }
};

c.ontouchend=()=>{dragPoint=null;panning=false;lastDist=null;};
</script>
</body>
</html>
