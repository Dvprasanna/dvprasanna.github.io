<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Playground</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 10px;
  background: #f5f5f5;
}

textarea {
  width: 100%;
  height: 120px;
  font-family: monospace;
  margin-bottom: 8px;
}

button {
  padding: 10px 14px;
  margin: 5px 5px 10px 0;
  font-size: 14px;
}

iframe {
  width: 100%;
  height: 300px;
  border: 1px solid #ccc;
  background: #fff;
}

@media (min-width: 768px) {
  textarea { height: 150px; }
  iframe { height: 400px; }
}
</style>
</head>

<body>

<h3>HTML</h3>
<textarea id="html">
<h1>Hello Playground</h1>
<p>Edit HTML, CSS, JS</p>
</textarea>

<h3>CSS</h3>
<textarea id="css">
body { background: #eef; }
h1 { color: darkblue; }
</textarea>

<h3>JavaScript</h3>
<textarea id="js">
document.querySelector("p").onclick = () => {
  alert("Clicked!");
};
</textarea>

<button onclick="run()">Run</button>
<button onclick="download()">Download HTML</button>

<iframe id="preview"></iframe>

<script>
function run() {
  const html = document.getElementById("html").value;
  const css = document.getElementById("css").value;
  const js  = document.getElementById("js").value;

  const result = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>${css}</style>
</head>
<body>
${html}
<script>${js}<\/script>
</body>
</html>
`;

  document.getElementById("preview").srcdoc = result;
}

function download() {
  const html = document.getElementById("html").value;
  const css = document.getElementById("css").value;
  const js  = document.getElementById("js").value;

  const content = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>${css}</style>
</head>
<body>
${html}
<script>${js}<\/script>
</body>
</html>
`;

  const blob = new Blob([content], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
}
</script>

</body>
</html>
