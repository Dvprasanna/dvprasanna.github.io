<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curve Editor (Bezier + Sine + Cos)</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #111;
}
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;
}
button {
  margin-right: 6px;
  padding: 6px 12px;
  font-size: 14px;
}
canvas {
  display: block;
  background: #000;
  touch-action: none;
}
</style>
</head>

<body>

<div id="ui">
  <button id="bezier">BEZIER</button>
  <button id="sine">SINE</button>
  <button id="cos">COS</button>
  <button id="clear">CLS</button>
  <button id="export">EXPORT</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* ---------- Resize ---------- */
function resize(){
  const dpr = devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth+"px";
  canvas.style.height = innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener("resize", resize);

/* ---------- Mode ---------- */
let mode = "bezier";

/* ---------- UI ---------- */
document.getElementById("bezier").onclick = () => mode = "bezier";
document.getElementById("sine").onclick   = () => mode = "sine";
document.getElementById("cos").onclick    = () => mode = "cos";

document.getElementById("clear").onclick = () => {
  curves = [];
  redrawAll();
};

document.getElementById("export").onclick = () => {
  const a = document.createElement("a");
  a.download = "canvas.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
};

/* ---------- State ---------- */
let curves = [];
let current = null;
let dragging = false;

/* ---------- Pointer ---------- */
function getPos(e){
  if (e.touches) e = e.touches[0];
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/* ---------- Events ---------- */
canvas.addEventListener("mousedown", start);
canvas.addEventListener("touchstart", start);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("touchmove", move);
canvas.addEventListener("mouseup", end);
canvas.addEventListener("touchend", end);

/* ---------- Start ---------- */
function start(e){
  e.preventDefault();
  const p = getPos(e);
  dragging = true;
  current = { type: mode, x0:p.x, y0:p.y };
}

/* ---------- Move ---------- */
function move(e){
  if (!dragging) return;
  const p = getPos(e);
  current.x1 = p.x;
  current.y1 = p.y;

  redrawAll();
  preview(current);
}

/* ---------- End ---------- */
function end(){
  if (!dragging) return;
  dragging = false;
  curves.push(current);
  current = null;
  redrawAll();
}

/* ---------- Drawing ---------- */
function pixel(x,y){
  ctx.fillStyle="#0f0";
  ctx.fillRect(Math.round(x),Math.round(y),1,1);
}

function preview(c){
  if (c.type === "bezier") drawLine(c.x0,c.y0,c.x1,c.y1);
  if (c.type === "sine") drawSine(c);
  if (c.type === "cos")  drawCos(c);
}

function redrawAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  curves.forEach(c => {
    if (c.type === "bezier") drawBezier(c);
    if (c.type === "sine")   drawSine(c);
    if (c.type === "cos")    drawCos(c);
  });
}

function drawLine(x0,y0,x1,y1){
  const s = Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
  for(let i=0;i<=s;i++){
    const t=i/s;
    pixel(x0+t*(x1-x0),y0+t*(y1-y0));
  }
}

/* ---------- Bézier (two-max S-curve) ---------- */
function drawBezier(c){
  const dx = c.x1-c.x0;
  const dy = c.y1-c.y0;

  let nx = -dy, ny = dx;
  const l = Math.hypot(nx,ny);
  nx/=l; ny/=l;

  let D = Math.min(Math.abs(dx),Math.abs(dy))/3;
  if (D<10) D=10;

  const C1 = {
    x: c.x0 + dx*0.33 + nx*D,
    y: c.y0 + dy*0.33 + ny*D
  };
  const C2 = {
    x: c.x0 + dx*0.66 - nx*D,
    y: c.y0 + dy*0.66 - ny*D
  };

  const s = Math.max(Math.abs(dx),Math.abs(dy))*4;
  for(let i=0;i<=s;i++){
    const t=i/s, mt=1-t;
    pixel(
      mt*mt*mt*c.x0 + 3*mt*mt*t*C1.x + 3*mt*t*t*C2.x + t*t*t*c.x1,
      mt*mt*mt*c.y0 + 3*mt*mt*t*C1.y + 3*mt*t*t*C2.y + t*t*t*c.y1
    );
  }
}

/* ---------- Shared wave math ---------- */
function waveBase(c, fn){
  const dx = c.x1-c.x0;
  const dy = c.y1-c.y0;
  const len = Math.hypot(dx,dy);
  if (len===0) return;

  const ux = dx/len;
  const uy = dy/len;
  const nx = -uy;
  const ny = ux;

  const amplitude = Math.min(len/6, 40);
  const cycles = 1;

  const steps = len*2;
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    const phase = t * Math.PI * 2 * cycles;
    const offset = fn(phase) * amplitude;

    pixel(
      c.x0 + ux*len*t + nx*offset,
      c.y0 + uy*len*t + ny*offset
    );
  }
}

/* ---------- SINE ---------- */
function drawSine(c){
  waveBase(c, Math.sin);
}

/* ---------- COS ---------- */
function drawCos(c){
  waveBase(c, Math.cos);
}
</script>

</body>
</html>
