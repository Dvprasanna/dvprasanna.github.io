<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Max Deviation Curve</title>
<style>
  body { margin: 0; background: #111; }
  canvas { display: block; background: #000; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

ctx.fillStyle = "#0f0";

let dragging = false;
let x0, y0, x1, y1;

// ---------- Mouse Events ----------
canvas.addEventListener("mousedown", e => {
  dragging = true;
  x0 = e.offsetX;
  y0 = e.offsetY;
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

canvas.addEventListener("mousemove", e => {
  if (!dragging) return;
  x1 = e.offsetX;
  y1 = e.offsetY;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawLine(x0,y0,x1,y1); // preview straight line
});

canvas.addEventListener("mouseup", e => {
  dragging = false;
  x1 = e.offsetX;
  y1 = e.offsetY;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMaxDeviationCurve(x0,y0,x1,y1);
});

// ---------- Helpers ----------
function drawPixel(x,y){
  ctx.fillRect(Math.round(x),Math.round(y),1,1);
}

function drawLine(x0,y0,x1,y1){
  const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
  for(let i=0;i<=steps;i++){
    let t = i/steps;
    drawPixel(
      x0 + t*(x1-x0),
      y0 + t*(y1-y0)
    );
  }
}

// ---------- Core Algorithm ----------
function drawMaxDeviationCurve(x0,y0,x1,y1){
  let dx = x1 - x0;
  let dy = y1 - y0;

  // perpendicular normal
  let nx = -dy;
  let ny = dx;
  let len = Math.hypot(nx,ny);
  if(len === 0) return;

  nx /= len;
  ny /= len;

  // maximum deviation (pixel-safe)
  let Dmax = Math.floor(Math.min(Math.abs(dx), Math.abs(dy)) / 3);
  if (Dmax < 2) Dmax = 2;

  // midpoint
  let xm = (x0 + x1) / 2;
  let ym = (y0 + y1) / 2;

  // control point at max deviation
  let cx = xm + nx * Dmax;
  let cy = ym + ny * Dmax;

  // rasterize quadratic bezier
  const steps = Math.max(Math.abs(dx), Math.abs(dy)) * 2;

  for(let i=0;i<=steps;i++){
    let t = i/steps;
    let x =
      (1-t)*(1-t)*x0 +
      2*(1-t)*t*cx +
      t*t*x1;

    let y =
      (1-t)*(1-t)*y0 +
      2*(1-t)*t*cy +
      t*t*y1;

    drawPixel(x,y);
  }
}
</script>

</body>
</html>
