<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curve Drawing App</title>

<style>
html,body{
  margin:0;
  background:#111;
  overflow:hidden;
}
#ui{
  position:fixed;
  top:10px; left:10px;
}
button{
  margin-right:6px;
  padding:6px 12px;
}
canvas{
  display:block;
  background:#000;
  touch-action:none;
}
</style>
</head>

<body>
<div id="ui">
  <button onclick="setMode('bezier')">BEZIER</button>
  <button onclick="setMode('sine')">SINE</button>
  <button onclick="setMode('cos')">COS</button>
  <button onclick="clearAll()">CLS</button>
  <button onclick="exportPNG()">EXPORT</button>
</div>

<canvas id="c"></canvas>

<script>
/* ================= CORE ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const DPR = devicePixelRatio || 1;
const HANDLE_R = 7;

function resize(){
  canvas.width = innerWidth * DPR;
  canvas.height = innerHeight * DPR;
  canvas.style.width = innerWidth+"px";
  canvas.style.height = innerHeight+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize(); addEventListener("resize",resize);

const App = {
  mode:"bezier",
  curves:[],
  activeCurve:null,
  activeHandle:null,
  dragging:false
};

function setMode(m){ App.mode=m; }
function clearAll(){ App.curves=[]; redraw(); }
function exportPNG(){
  const a=document.createElement("a");
  a.download="drawing.png";
  a.href=canvas.toDataURL();
  a.click();
}

/* ================= UTIL ================= */
function pos(e){
  if(e.touches) e=e.touches[0];
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function pixel(x,y){
  ctx.fillStyle="#0f0";
  ctx.fillRect(Math.round(x),Math.round(y),1,1);
}
function drawHandle(h){
  ctx.fillStyle="#ff4444";
  ctx.beginPath();
  ctx.arc(h.x,h.y,HANDLE_R,0,Math.PI*2);
  ctx.fill();
}
function hit(h,p){
  return Math.hypot(h.x-p.x,h.y-p.y)<HANDLE_R;
}

/* ================= CURVE FACTORY ================= */
function createCurve(type,p0,p1){
  if(type==="bezier") return createBezier(p0,p1);
  if(type==="sine")   return createWave(p0,p1,Math.sin);
  if(type==="cos")    return createWave(p0,p1,Math.cos);
}

/* -------- Bezier (S-curve, 2 handles) -------- */
function createBezier(p0,p1){
  const dx=p1.x-p0.x, dy=p1.y-p0.y;
  const len=Math.hypot(dx,dy);
  const nx=-dy/len, ny=dx/len;
  const D=len/3;

  const curve={
    type:"bezier",
    p0,p1,
    handles:[
      {x:p0.x+dx*0.33+nx*D,y:p0.y+dy*0.33+ny*D,role:"c1"},
      {x:p0.x+dx*0.66-nx*D,y:p0.y+dy*0.66-ny*D,role:"c2"}
    ],
    draw(){
      const h=this.handles;
      for(let i=0;i<=200;i++){
        const t=i/200, mt=1-t;
        pixel(
          mt*mt*mt*p0.x+3*mt*mt*t*h[0].x+3*mt*t*t*h[1].x+t*t*t*p1.x,
          mt*mt*mt*p0.y+3*mt*mt*t*h[0].y+3*mt*t*t*h[1].y+t*t*t*p1.y
        );
      }
    }
  };
  return curve;
}

/* -------- Wave (Sine / Cos) -------- */
function createWave(p0,p1,fn){
  const dx=p1.x-p0.x, dy=p1.y-p0.y;
  const len=Math.hypot(dx,dy);
  const ux=dx/len, uy=dy/len;
  const nx=-uy, ny=ux;

  const curve={
    type:"wave",
    p0,p1,
    fn,
    amp:Math.min(len/6,40),
    phase:0,
    handles:[
      {role:"amp"},
      {role:"phase"}
    ],
    update(){
      const mx=(p0.x+p1.x)/2, my=(p0.y+p1.y)/2;
      this.handles[0].x=mx+nx*this.amp;
      this.handles[0].y=my+ny*this.amp;
      this.handles[1].x=mx+ux*this.phase*30;
      this.handles[1].y=my+uy*this.phase*30;
    },
    draw(){
      const steps=len*2;
      for(let i=0;i<=steps;i++){
        const t=i/steps;
        const off=this.fn(t*Math.PI*2+this.phase)*this.amp;
        pixel(
          p0.x+ux*len*t+nx*off,
          p0.y+uy*len*t+ny*off
        );
      }
    }
  };
  curve.update();
  return curve;
}

/* ================= EVENTS ================= */
canvas.addEventListener("mousedown",start);
canvas.addEventListener("touchstart",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("touchmove",move);
canvas.addEventListener("mouseup",end);
canvas.addEventListener("touchend",end);

function start(e){
  const p=pos(e);

  // hit test handles
  for(let i=App.curves.length-1;i>=0;i--){
    const c=App.curves[i];
    for(const h of c.handles){
      if(hit(h,p)){
        App.activeHandle=h;
        App.activeCurve=c;
        return;
      }
    }
  }

  App.dragging=true;
  App.activeCurve={p0:p,p1:p};
}

function move(e){
  const p=pos(e);

  if(App.activeHandle){
    const c=App.activeCurve;
    if(c.type==="wave"){
      const mx=(c.p0.x+c.p1.x)/2;
      const my=(c.p0.y+c.p1.y)/2;
      const dx=p.x-mx, dy=p.y-my;
      if(App.activeHandle.role==="amp") c.amp=dx*(-c.fn?1:1); // safe
      if(App.activeHandle.role==="phase") c.phase=dx/30;
      c.update();
    }else{
      App.activeHandle.x=p.x;
      App.activeHandle.y=p.y;
    }
    redraw(); return;
  }

  if(!App.dragging) return;
  App.activeCurve.p1=p;
  redraw();
}

function end(){
  if(App.dragging){
    const c=createCurve(App.mode,App.activeCurve.p0,App.activeCurve.p1);
    App.curves.push(c);
  }
  App.dragging=false;
  App.activeHandle=null;
  redraw();
}

/* ================= DRAW ================= */
function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  App.curves.forEach(c=>{
    c.draw();
    c.handles.forEach(drawHandle);
  });
}
</script>
</body>
</html>
