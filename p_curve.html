<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curve & Wave Editor</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #111;
}
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;
}
button {
  margin-right: 6px;
  padding: 6px 12px;
  font-size: 14px;
}
canvas {
  display: block;
  background: #000;
  touch-action: none;
}
</style>
</head>

<body>

<div id="ui">
  <button id="bezier">BEZIER</button>
  <button id="sine">SINE</button>
  <button id="cos">COS</button>
  <button id="clear">CLS</button>
  <button id="export">EXPORT</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* ---------- Resize ---------- */
function resize(){
  const dpr = devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth+"px";
  canvas.style.height = innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener("resize", resize);

/* ---------- Mode ---------- */
let mode = "bezier";

/* ---------- UI ---------- */
bezier.onclick = () => mode="bezier";
sine.onclick   = () => mode="sine";
cos.onclick    = () => mode="cos";

clear.onclick = () => { curves=[]; redrawAll(); };

export.onclick = () => {
  const a=document.createElement("a");
  a.download="canvas.png";
  a.href=canvas.toDataURL();
  a.click();
};

/* ---------- State ---------- */
let curves=[];
let current=null;
let dragging=false;
let activeHandle=null;
const HR=8;

/* ---------- Pointer ---------- */
function getPos(e){
  if(e.touches) e=e.touches[0];
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

/* ---------- Events ---------- */
canvas.addEventListener("mousedown",start);
canvas.addEventListener("touchstart",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("touchmove",move);
canvas.addEventListener("mouseup",end);
canvas.addEventListener("touchend",end);

/* ---------- Start ---------- */
function start(e){
  e.preventDefault();
  const p=getPos(e);

  // hit handles
  for(const c of curves){
    if(c.hAmp && hit(c.hAmp,p)){ activeHandle={c,type:"amp"}; return; }
    if(c.hPhase && hit(c.hPhase,p)){ activeHandle={c,type:"phase"}; return; }
  }

  dragging=true;
  current={ type:mode, x0:p.x, y0:p.y };
}

/* ---------- Move ---------- */
function move(e){
  const p=getPos(e);

  if(activeHandle){
    updateWaveHandle(activeHandle,p);
    redrawAll();
    return;
  }

  if(!dragging) return;
  current.x1=p.x; current.y1=p.y;
  redrawAll();
}

/* ---------- End ---------- */
function end(){
  if(dragging){
    dragging=false;
    initWave(current);
    curves.push(current);
    current=null;
    redrawAll();
  }
  activeHandle=null;
}

/* ---------- Drawing ---------- */
function pixel(x,y){
  ctx.fillStyle="#0f0";
  ctx.fillRect(Math.round(x),Math.round(y),1,1);
}

function drawHandle(p,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,HR,0,Math.PI*2);
  ctx.fill();
}

function hit(p,m){
  return Math.hypot(p.x-m.x,p.y-m.y)<HR;
}

/* ---------- Wave Init ---------- */
function initWave(c){
  const dx=c.x1-c.x0, dy=c.y1-c.y0;
  const len=Math.hypot(dx,dy);
  if(!len) return;

  c.ux=dx/len; c.uy=dy/len;
  c.nx=-c.uy;  c.ny=c.ux;

  c.amp=Math.min(len/6,40);
  c.phase=0;

  updateWaveHandles(c);
}

/* ---------- Update Handles ---------- */
function updateWaveHandles(c){
  const mx=(c.x0+c.x1)/2;
  const my=(c.y0+c.y1)/2;

  c.hAmp={
    x: mx + c.nx*c.amp,
    y: my + c.ny*c.amp
  };

  c.hPhase={
    x: mx + c.ux*30,
    y: my + c.uy*30
  };
}

/* ---------- Handle Drag ---------- */
function updateWaveHandle(h,p){
  const c=h.c;
  if(h.type==="amp"){
    const dx=p.x-(c.x0+c.x1)/2;
    const dy=p.y-(c.y0+c.y1)/2;
    c.amp=dx*c.nx+dy*c.ny;
  }
  if(h.type==="phase"){
    const dx=p.x-(c.x0+c.x1)/2;
    const dy=p.y-(c.y0+c.y1)/2;
    c.phase=(dx*c.ux+dy*c.uy)/30;
  }
  updateWaveHandles(c);
}

/* ---------- Draw All ---------- */
function redrawAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  curves.forEach(c=>{
    if(c.type==="sine") drawWave(c,Math.sin);
    if(c.type==="cos")  drawWave(c,Math.cos);
  });
}

/* ---------- Draw Wave ---------- */
function drawWave(c,fn){
  const dx=c.x1-c.x0, dy=c.y1-c.y0;
  const len=Math.hypot(dx,dy);
  const steps=len*2;

  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const phase=t*Math.PI*2 + c.phase;
    const off=fn(phase)*c.amp;

    pixel(
      c.x0 + c.ux*len*t + c.nx*off,
      c.y0 + c.uy*len*t + c.ny*off
    );
  }

  drawHandle(c.hAmp,"#ff4444");   // amplitude
  drawHandle(c.hPhase,"#4488ff"); // phase
}
</script>

</body>
</html>
