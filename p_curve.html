<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two-Max Bézier Curve</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #111;
}
canvas {
  display: block;
  background: #000;
  touch-action: none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* ---------- Canvas resize (critical for iOS) ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width  = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener("resize", resize);

/* ---------- State ---------- */
let dragging = false;
let activeHandle = null;

let x0,y0,x1,y1;        // start / end
let C1 = null, C2 = null; // Max-1 / Max-2

const HANDLE_RADIUS = 8;

/* ---------- Pointer helper ---------- */
function getPos(e){
  if (e.touches) e = e.touches[0];
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/* ---------- Events ---------- */
canvas.addEventListener("mousedown", start);
canvas.addEventListener("touchstart", start);

canvas.addEventListener("mousemove", move);
canvas.addEventListener("touchmove", move);

canvas.addEventListener("mouseup", end);
canvas.addEventListener("touchend", end);

/* ---------- Start ---------- */
function start(e){
  e.preventDefault();
  const p = getPos(e);

  // Handle selection
  if (C1 && hitHandle(C1,p.x,p.y)) { activeHandle = C1; return; }
  if (C2 && hitHandle(C2,p.x,p.y)) { activeHandle = C2; return; }

  // New curve
  dragging = true;
  C1 = C2 = null;
  x0 = p.x; y0 = p.y;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* ---------- Move ---------- */
function move(e){
  const p = getPos(e);

  // Drag handle
  if (activeHandle) {
    activeHandle.x = p.x;
    activeHandle.y = p.y;
    redraw();
    return;
  }

  // Drag endpoint
  if (!dragging) return;
  x1 = p.x; y1 = p.y;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawLine(x0,y0,x1,y1);
}

/* ---------- End ---------- */
function end(){
  if (dragging) {
    dragging = false;
    createInitialHandles();
    redraw();
  }
  activeHandle = null;
}

/* ---------- Drawing helpers ---------- */
function pixel(x,y){
  ctx.fillStyle = "#0f0";
  ctx.fillRect(Math.round(x),Math.round(y),1,1);
}

function drawLine(x0,y0,x1,y1){
  const steps = Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    pixel(x0+t*(x1-x0), y0+t*(y1-y0));
  }
}

function drawHandlePoint(p,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,HANDLE_RADIUS,0,Math.PI*2);
  ctx.fill();
}

function drawHandleLine(a,b){
  ctx.strokeStyle="#444";
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}

function hitHandle(p,x,y){
  return Math.hypot(p.x-x,p.y-y) < HANDLE_RADIUS;
}

/* ---------- Initial Max-1 / Max-2 creation ---------- */
function createInitialHandles(){
  const dx = x1-x0;
  const dy = y1-y0;
  if(dx===0 && dy===0) return;

  let nx = -dy, ny = dx;
  const nl = Math.hypot(nx,ny);
  nx/=nl; ny/=nl;

  let D = Math.min(Math.abs(dx),Math.abs(dy))/3;
  if (D < 10) D = 10;

  const t1 = 0.33, t2 = 0.66;

  C1 = {
    x: x0 + dx*t1 + nx*D,
    y: y0 + dy*t1 + ny*D
  };

  C2 = {
    x: x0 + dx*t2 - nx*D,
    y: y0 + dy*t2 - ny*D
  };
}

/* ---------- Redraw everything ---------- */
function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBezier();
  drawHandleLine({x:x0,y:y0},C1);
  drawHandleLine({x:x1,y:y1},C2);
  drawHandlePoint(C1,"#ff4444"); // Max-1
  drawHandlePoint(C2,"#4488ff"); // Max-2
}

/* ---------- Core: two-max cubic Bézier ---------- */
function drawBezier(){
  const steps = Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*4;

  for(let i=0;i<=steps;i++){
    const t=i/steps, mt=1-t;
    const x =
      mt*mt*mt*x0 +
      3*mt*mt*t*C1.x +
      3*mt*t*t*C2.x +
      t*t*t*x1;

    const y =
      mt*mt*mt*y0 +
      3*mt*mt*t*C1.y +
      3*mt*t*t*C2.y +
      t*t*t*y1;

    pixel(x,y);
  }
}
</script>
</body>
</html>
