<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Auto Stickman Animator – Thick Lines</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
  padding-bottom: calc(140px + env(safe-area-inset-bottom));
}
canvas{
  background:#eee;
  display:block;
  margin:10px auto;
  touch-action:none;
}
#ui{
  position:fixed;
  left:0; right:0;
  bottom: env(safe-area-inset-bottom);
  padding:10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background:#222;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:9999;
}
button{
  padding:8px 16px;
  border:none;
  border-radius:6px;
  background:#444;
  color:#fff;
}
</style>
</head>

<body>

<h3>Auto Stickman Animator</h3>

<canvas id="c" width="360" height="360"></canvas>

<div id="ui">
  <button id="play">▶ Play</button>
</div>

<script>
/* ================= VISUAL CONFIG ================= */
const LINE_TORSO = 6;
const LINE_UPPER = 5;
const LINE_LOWER = 4;
const LINE_HEAD  = 5;
const HEAD_R     = 20;
const FPS        = 10;

/* ================= CANVAS ================= */
const c = document.getElementById("c");
const ctx = c.getContext("2d");
ctx.lineCap  = "round";
ctx.lineJoin = "round";

/* ================= STATE ================= */
let frames = [];
let currentFrame = 0;
let playing = false;
let drag = null;

/* ================= DATA ================= */
function newPuppet(){
  return {
    x:180, y:150,
    head:{ x:0, y:-40, sx:1, sy:1 },

    lh:{ mx:-20,my:15, ex:-40,ey:30 },
    rh:{ mx:20,my:15,  ex:40, ey:30 },

    ll:{ mx:-10,my:60, ex:-20,ey:120 },
    rl:{ mx:10, my:60, ex:20, ey:120 }
  };
}

frames.push({ puppet: newPuppet() });
let puppet = frames[0].puppet;

/* ================= HELPERS ================= */
const clone=o=>JSON.parse(JSON.stringify(o));
const hit=(px,py,x,y,r=10)=>Math.hypot(px-x,py-y)<r;

function pos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}

function dot(x,y,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(x,y,6,0,Math.PI*2);
  ctx.fill();
}

function line(x1,y1,x2,y2,w){
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle="#000";

  const cx=puppet.x, cy=puppet.y;

  /* spine & neck */
  line(cx,cy,cx,cy+70,LINE_TORSO);
  line(cx,cy,cx+puppet.head.x,cy+puppet.head.y,LINE_TORSO);

  /* arms */
  drawLimb(puppet.lh,cy+10);
  drawLimb(puppet.rh,cy+10);

  /* legs */
  drawLimb(puppet.ll,cy+70);
  drawLimb(puppet.rl,cy+70);

  /* head */
  const hx=cx+puppet.head.x;
  const hy=cy+puppet.head.y;
  ctx.save();
  ctx.translate(hx,hy);
  ctx.scale(puppet.head.sx,puppet.head.sy);
  ctx.lineWidth = LINE_HEAD;
  ctx.beginPath();
  ctx.arc(0,0,HEAD_R,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();

  /* control points */
  dot(cx,cy,"#000");        // body
  dot(hx,hy,"#00f");        // head move

  // head scale X
  dot(hx-HEAD_R*puppet.head.sx,hy,"#0ff");
  dot(hx+HEAD_R*puppet.head.sx,hy,"#0ff");

  // arms
  drawControls(puppet.lh,cy+10,"#0a0");
  drawControls(puppet.rh,cy+10,"#0a0");

  // legs
  drawControls(puppet.ll,cy+70,"#a00");
  drawControls(puppet.rl,cy+70,"#a00");
}

function drawLimb(l,sy){
  const cx=puppet.x;
  line(cx,sy,cx+l.mx,sy+l.my,LINE_UPPER);
  line(cx+l.mx,sy+l.my,cx+l.ex,sy+l.ey,LINE_LOWER);
}

function drawControls(l,sy,col){
  const cx=puppet.x;
  dot(cx+l.mx,sy+l.my,col);
  dot(cx+l.ex,sy+l.ey,col);
}

/* ================= AUTO KEY ================= */
function autoKey(){
  frames.push({ puppet: clone(puppet) });
  currentFrame = frames.length-1;
}

/* ================= INPUT ================= */
c.onmousedown=c.ontouchstart=e=>{
  if(playing) return;
  const p=pos(e);
  const cx=puppet.x, cy=puppet.y;
  const hx=cx+puppet.head.x;
  const hy=cy+puppet.head.y;

  if(hit(p.x,p.y,cx,cy)) return drag={t:"root"};
  if(hit(p.x,p.y,hx,hy)) return drag={t:"headMove"};

  if(hit(p.x,p.y,hx-HEAD_R*puppet.head.sx,hy) ||
     hit(p.x,p.y,hx+HEAD_R*puppet.head.sx,hy))
    return drag={t:"headScale"};

  for(const k of ["lh","rh"]){
    const l=puppet[k], sy=cy+10;
    if(hit(p.x,p.y,cx+l.mx,sy+l.my)) return drag={t:"armMid",k};
    if(hit(p.x,p.y,cx+l.ex,sy+l.ey)) return drag={t:"armEnd",k};
  }

  for(const k of ["ll","rl"]){
    const l=puppet[k], sy=cy+70;
    if(hit(p.x,p.y,cx+l.mx,sy+l.my)) return drag={t:"legMid",k};
    if(hit(p.x,p.y,cx+l.ex,sy+l.ey)) return drag={t:"legEnd",k};
  }
};

c.onmousemove=c.ontouchmove=e=>{
  if(!drag) return;
  const p=pos(e);

  if(drag.t==="root"){ puppet.x=p.x; puppet.y=p.y; }
  if(drag.t==="headMove"){
    puppet.head.x=p.x-puppet.x;
    puppet.head.y=p.y-puppet.y;
  }
  if(drag.t==="headScale"){
    const dx=(p.x-(puppet.x+puppet.head.x))/HEAD_R;
    puppet.head.sx=Math.max(0.6,Math.min(2.5,Math.abs(dx)));
  }

  if(drag.t==="armMid"){
    const l=puppet[drag.k];
    l.mx=p.x-puppet.x;
    l.my=p.y-(puppet.y+10);
  }
  if(drag.t==="armEnd"){
    const l=puppet[drag.k];
    l.ex=p.x-puppet.x;
    l.ey=p.y-(puppet.y+10);
  }

  if(drag.t==="legMid"){
    const l=puppet[drag.k];
    l.mx=p.x-puppet.x;
    l.my=p.y-(puppet.y+70);
  }
  if(drag.t==="legEnd"){
    const l=puppet[drag.k];
    l.ex=p.x-puppet.x;
    l.ey=p.y-(puppet.y+70);
  }

  autoKey();
  draw();
};

c.onmouseup=c.ontouchend=()=>drag=null;

/* ================= PLAY ================= */
document.getElementById("play").onclick=e=>{
  playing=!playing;
  e.target.innerText=playing?"⏸ Stop":"▶ Play";
};

setInterval(()=>{
  if(!playing) return;
  currentFrame++;
  if(currentFrame>=frames.length) currentFrame=0;
  puppet = clone(frames[currentFrame].puppet);
  draw();
},1000/FPS);

/* ================= START ================= */
draw();
</script>

</body>
</html>
