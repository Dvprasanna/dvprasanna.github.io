<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Readable Document Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial, sans-serif;
  background:#eee;
  text-align:center;
  padding:10px;
}
canvas {
  max-width:100%;
  border:1px solid #333;
  background:white;
}
input[type=range] {
  width:90%;
}
</style>
</head>
<body>

<h3>Readable Document Scanner</h3>
<input type="file" accept="image/*" id="upload"><br><br>

<label>Readability Strength</label><br>
<input type="range" id="strength" min="0" max="100" value="50"><br><br>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const slider = document.getElementById("strength");

let originalImage = null;

upload.onchange = e => {
  const img = new Image();
  img.onload = () => {
    originalImage = img;
    process();
  };
  img.src = URL.createObjectURL(e.target.files[0]);
};

slider.oninput = process;

function process() {
  if (!originalImage) return;

  const img = originalImage;
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);

  let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let d = imgData.data;
  const w = canvas.width, h = canvas.height;

  /* ---------------- STEP 1: GRAYSCALE ---------------- */
  let gray = new Uint8ClampedArray(w*h);
  for (let i=0;i<d.length;i+=4)
    gray[i/4] = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];

  /* ---------------- STEP 2: PURE B/W ---------------- */
  let bw = new Uint8ClampedArray(w*h);
  const R = 6;
  for (let y=0;y<h;y++) {
    for (let x=0;x<w;x++) {
      let sum=0,count=0;
      for (let dy=-R;dy<=R;dy++)
        for (let dx=-R;dx<=R;dx++) {
          let nx=x+dx, ny=y+dy;
          if(nx>=0&&ny>=0&&nx<w&&ny<h){
            sum+=gray[ny*w+nx]; count++;
          }
        }
      let idx=y*w+x;
      bw[idx] = gray[idx] < (sum/count - 8) ? 1 : 0;
    }
  }

  /* -------- STEP 3: STROKE THICKNESS ESTIMATION -------- */
  let hist = {};
  for (let y=0;y<h;y++) {
    let run=0;
    for (let x=0;x<w;x++) {
      let i=y*w+x;
      if (bw[i]) run++;
      else {
        if (run>0 && run<15) hist[run]=(hist[run]||0)+1;
        run=0;
      }
    }
  }

  let T = Object.keys(hist).sort((a,b)=>hist[b]-hist[a])[0] || 2;
  T = Math.max(2, parseInt(T)); // UI FONT PROTECTION

  /* -------- STEP 4: THICKNESS-CONSISTENT FILTER -------- */
  let filtered = new Uint8ClampedArray(w*h);
  let tol = 1 + slider.value/40;

  for (let y=0;y<h;y++) {
    let run=0;
    for (let x=0;x<w;x++) {
      let i=y*w+x;
      if (bw[i]) run++;
      else {
        if (run>=T-tol && run<=T+tol+2)
          for (let k=1;k<=run;k++) filtered[i-k]=1;
        run=0;
      }
    }
  }

  /* -------- STEP 5: GRID WHITE-SPACE ENFORCEMENT -------- */
  const GRID = 6 + slider.value/8;
  const whiteBias = 0.25 + slider.value/400;

  for (let gy=0;gy<h;gy+=GRID)
    for (let gx=0;gx<w;gx+=GRID) {
      let black=0,total=0;
      for (let y=gy;y<gy+GRID&&y<h;y++)
        for (let x=gx;x<gx+GRID&&x<w;x++) {
          total++;
          if(filtered[y*w+x]) black++;
        }
      if (black < total*whiteBias)
        for (let y=gy;y<gy+GRID&&y<h;y++)
          for (let x=gx;x<gx+GRID&&x<w;x++)
            filtered[y*w+x]=0;
    }

  /* ---------------- RENDER ---------------- */
  for (let i=0;i<d.length;i+=4) {
    let v = filtered[i/4]?0:255;
    d[i]=d[i+1]=d[i+2]=v;
    d[i+3]=255;
  }

  ctx.putImageData(imgData,0,0);
}
</script>

</body>
</html>
