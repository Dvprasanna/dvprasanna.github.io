<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden;background:#ddd">

<canvas id="c"></canvas>

<script>
/* ================== SETUP ================== */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
  c.width = innerWidth;
  c.height = innerHeight;
}
resize();
onresize = resize;

/* ================== STATE ================== */
let camX = 0, camY = 0;
let dragging = false;
let drawMode = true;
let blocked = false;
let warmedUp = false;

let lastX = 0, lastY = 0;

const lines = [];

/* ================== PEN ================== */
const penSX = () => c.width / 2;
const penSY = () => c.height / 2;

let sx = 0, sy = 0;
const SMOOTH = 0.25;
const HIT = 5;
const SPEED_LIMIT = 12;

/* ================== COLLISION ================== */
function hitLine(px, py, l){
  const dx = l.x2 - l.x1;
  const dy = l.y2 - l.y1;
  const len2 = dx*dx + dy*dy;
  if (!len2) return false;

  let t = ((px - l.x1)*dx + (py - l.y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));

  const hx = l.x1 + t*dx;
  const hy = l.y1 + t*dy;

  return Math.hypot(px - hx, py - hy) < HIT;
}

function penHitsOldLine(){
  if (lines.length < 3) return false;

  const wx = penSX() - camX;
  const wy = penSY() - camY;

  for (let i = 0; i < lines.length - 1; i++) {
    if (hitLine(wx, wy, lines[i])) return true;
  }
  return false;
}

/* ================== DRAW ================== */
function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for (const l of lines) {
    ctx.beginPath();
    ctx.moveTo(l.x1 + camX, l.y1 + camY);
    ctx.lineTo(l.x2 + camX, l.y2 + camY);
    ctx.stroke();
  }

  ctx.fillStyle = blocked ? "orange" : "red";
  ctx.beginPath();
  ctx.arc(penSX(), penSY(), 4, 0, Math.PI*2);
  ctx.fill();
}

/* ================== CORE INPUT ================== */
function start(x, y, mode){
  dragging = true;
  drawMode = mode;
  warmedUp = false;

  if (!drawMode) blocked = false;

  lastX = x;
  lastY = y;

  // hard-sync smoothed pen (startup fix)
  sx = penSX() - camX;
  sy = penSY() - camY;
}

function move(x, y){
  if (!dragging) return;

  const dx = x - lastX;
  const dy = y - lastY;

  // one-frame warmup (startup fix)
  if (!warmedUp) {
    warmedUp = true;
    camX += dx;
    camY += dy;
    lastX = x;
    lastY = y;
    draw();
    return;
  }

  const speed = Math.hypot(dx, dy);

  if (drawMode && !blocked) {
    if (speed < SPEED_LIMIT && penHitsOldLine()) {
      blocked = true;
    } else {
      const wx = penSX() - camX;
      const wy = penSY() - camY;

      sx += (wx - sx) * SMOOTH;
      sy += (wy - sy) * SMOOTH;

      lines.push({
        x1: sx,
        y1: sy,
        x2: sx - dx,
        y2: sy - dy
      });
    }
  }

  camX += dx;
  camY += dy;

  lastX = x;
  lastY = y;

  draw();
}

function end(){
  dragging = false;
}

/* ================== MOUSE ================== */
c.oncontextmenu = e => e.preventDefault();

c.onmousedown = e => start(e.clientX, e.clientY, e.button === 0);
c.onmousemove = e => move(e.clientX, e.clientY);
c.onmouseup = end;
c.onmouseleave = end;

/* ================== TOUCH ================== */
c.addEventListener("touchstart", e => {
  e.preventDefault();
  const t = e.touches[0];
  start(t.clientX, t.clientY, e.touches.length === 1);
  requestAnimationFrame(draw);
}, { passive:false });

c.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = e.touches[0];
  move(t.clientX, t.clientY);
}, { passive:false });

c.addEventListener("touchend", end);

/* ================== INIT ================== */
draw();
</script>

</body>
</html>
