<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden;background:#ddd;font-family:sans-serif">

<!-- MENU BAR -->
<div style="
position:fixed;
top:10px;
left:10px;
z-index:10;
display:flex;
gap:10px;
">

<button id="modeBtn" style="
padding:14px 18px;
font-size:16px;
border-radius:10px;
border:none;
background:#222;
color:#fff;">
MODE: FREE
</button>

<button id="gridBtn" style="
padding:14px 18px;
font-size:16px;
border-radius:10px;
border:none;
background:#f2f2f2;
color:#333;">
GRID: OFF
</button>

<button id="snapBtn" style="
padding:14px 18px;
font-size:16px;
border-radius:10px;
border:none;
background:#f2f2f2;
color:#333;">
SNAP: OFF
</button>

</div>

<canvas id="c"></canvas>

<script>
/* ================= SETUP ================= */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
  c.width = innerWidth;
  c.height = innerHeight;
}
resize();
onresize = resize;

/* ================= STATE ================= */
let camX=0, camY=0;
let dragging=false, drawMode=true;
let blocked=false, warmedUp=false;
let lastX=0, lastY=0;

let mode="free";
let strokeMode="free";
let showGrid=false;
let snapGrid=false;

const points=[];
let sx=0, sy=0;

const SMOOTH=0.25;
const SPEED_LIMIT=12;
const HIT=5;
const GRID=40;

/* ================= PEN ================= */
const penSX=()=>c.width/2;
const penSY=()=>c.height/2;

/* ================= UI ================= */
const modeBtn=document.getElementById("modeBtn");
const gridBtn=document.getElementById("gridBtn");
const snapBtn=document.getElementById("snapBtn");

modeBtn.onclick=()=>{
  mode = mode==="free" ? "bezier" : "free";
  modeBtn.textContent="MODE: "+(mode==="free"?"FREE":"BEZIER");
};

gridBtn.onclick=()=>{
  showGrid=!showGrid;
  gridBtn.textContent="GRID: "+(showGrid?"ON":"OFF");
  draw();
};

snapBtn.onclick=()=>{
  snapGrid=!snapGrid;
  snapBtn.textContent="SNAP: "+(snapGrid?"ON":"OFF");
};

/* ================= HELPERS ================= */
function snap(v){
  return Math.round(v / GRID) * GRID;
}

/* ================= COLLISION ================= */
function hitLine(px,py,a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  const len2=dx*dx+dy*dy;
  if(!len2) return false;
  let t=((px-a.x)*dx+(py-a.y)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  const hx=a.x+t*dx, hy=a.y+t*dy;
  return Math.hypot(px-hx,py-hy)<HIT;
}

function penHitsOldStroke(){
  if(points.length<4) return false;
  const wx=penSX()-camX, wy=penSY()-camY;
  for(let i=0;i<points.length-3;i++)
    if(hitLine(wx,wy,points[i],points[i+1])) return true;
  return false;
}

/* ================= GRID ================= */
function drawGrid(){
  ctx.strokeStyle="#e6e6e6";
  ctx.lineWidth=1;

  const startX=(-camX)%GRID;
  const startY=(-camY)%GRID;

  ctx.beginPath();
  for(let x=startX;x<c.width;x+=GRID){
    ctx.moveTo(x,0); ctx.lineTo(x,c.height);
  }
  for(let y=startY;y<c.height;y+=GRID){
    ctx.moveTo(0,y); ctx.lineTo(c.width,y);
  }
  ctx.stroke();
}

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  if(showGrid) drawGrid();

  ctx.strokeStyle="#000";
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  if(points.length>1){
    ctx.beginPath();
    ctx.moveTo(points[0].x+camX,points[0].y+camY);

    if(strokeMode==="free"){
      for(let i=1;i<points.length;i++)
        ctx.lineTo(points[i].x+camX,points[i].y+camY);
    }

    if(strokeMode==="bezier"){
      for(let i=1;i<points.length-1;i++){
        const mx=(points[i].x+points[i+1].x)/2;
        const my=(points[i].y+points[i+1].y)/2;
        ctx.quadraticCurveTo(
          points[i].x+camX,
          points[i].y+camY,
          mx+camX,
          my+camY
        );
      }
    }
    ctx.stroke();
  }

  ctx.fillStyle=blocked?"orange":"red";
  ctx.beginPath();
  ctx.arc(penSX(),penSY(),4,0,Math.PI*2);
  ctx.fill();
}

/* ================= CORE INPUT ================= */
function start(x,y,isDraw){
  dragging=true;
  drawMode=isDraw;
  warmedUp=false;

  if(!drawMode) blocked=false;

  lastX=x; lastY=y;
  sx=penSX()-camX; sy=penSY()-camY;

  if(drawMode){
    points.length=0;
    strokeMode=mode;
  }
}

function move(x,y){
  if(!dragging) return;

  const dx=x-lastX, dy=y-lastY;

  if(!warmedUp){
    warmedUp=true;
    camX+=dx; camY+=dy;
    lastX=x; lastY=y;
    draw();
    return;
  }

  const speed=Math.hypot(dx,dy);

  if(drawMode && !blocked){
    if(speed<SPEED_LIMIT && penHitsOldStroke()){
      blocked=true;
    }else{
      let wx=penSX()-camX;
      let wy=penSY()-camY;

      sx+=(wx-sx)*SMOOTH;
      sy+=(wy-sy)*SMOOTH;

      let px=sx, py=sy;
      if(snapGrid){
        px=snap(px);
        py=snap(py);
      }

      points.push({x:px,y:py});
    }
  }

  camX+=dx; camY+=dy;
  lastX=x; lastY=y;
  draw();
}

function end(){ dragging=false; }

/* ================= INPUT ================= */
c.oncontextmenu=e=>e.preventDefault();

c.onmousedown=e=>start(e.clientX,e.clientY,e.button===0);
c.onmousemove=e=>move(e.clientX,e.clientY);
c.onmouseup=end;
c.onmouseleave=end;

c.addEventListener("touchstart",e=>{
  e.preventDefault();
  const t=e.touches[0];
  start(t.clientX,t.clientY,e.touches.length===1);
  requestAnimationFrame(draw);
},{passive:false});

c.addEventListener("touchmove",e=>{
  e.preventDefault();
  const t=e.touches[0];
  move(t.clientX,t.clientY);
},{passive:false});

c.addEventListener("touchend",end);

/* ================= INIT ================= */
draw();
</script>
</body>
</html>
