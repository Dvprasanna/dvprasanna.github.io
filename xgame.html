<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finger Fishing Game</title>
  
  <!-- Open Graph / Twitter Card so the link looks beautiful when shared on X -->
  <meta property="og:title" content="Finger Fishing Game" />
  <meta property="og:description" content="Move your finger at the top to drop the hook & catch fish! 30-second challenge!" />
  <meta property="og:image" content="https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO-NAME/main/preview.jpg" />
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/YOUR-REPO-NAME/" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    body { margin:0; background:#0088ff; overflow:hidden; touch-action: manipulation; }
    canvas { display:block; }
    #ui {
      position:absolute; top:10px; left:10px; color:white; font:bold 22px Arial; z-index:10;
      text-shadow: 2px 2px 5px #000;
    }
    #startScreen {
      position:absolute; inset:0; background:rgba(0,80,180,0.95); color:white;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      text-align:center; z-index:20; padding:20px; box-sizing:border-box;
    }
    button {
      margin-top:30px; padding:16px 40px; font-size:22px; border:none; border-radius:12px;
      background:#ffeb3b; color:#333; cursor:pointer; font-weight:bold;
    }
  </style>
</head>
<body>

<div id="startScreen">
  <h1>Finger Fishing Game</h1>
  <p>Move your finger (or mouse) in the <strong>top area</strong> to control the hook<br>
     Catch as many fish as possible in 30 seconds!</p>
  <button onclick="startGame()">START FISHING</button>
</div>

<div id="ui">Score: <span id="score">0</span> | Time: <span id="time">30</span>s</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0, timeLeft = 30, gameRunning = false;
let hookX = canvas.width / 2, hookY = 100;
let fishes = [], particles = [];
const hookZoneHeight = canvas.height * 0.25;

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  score = 0; timeLeft = 30; fishes = []; particles = [];
  hookY = 100; hookX = canvas.width / 2;
  gameRunning = true;
  document.getElementById('score').textContent = score;
  document.getElementById('time').textContent = timeLeft;

  for(let i = 0; i < 12; i++) spawnFish();

  const timer = setInterval(() => {
    timeLeft--;
    document.getElementById('time').textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timer);
      gameRunning = false;
      alert(`Time's up! You caught ${score} fish!`);
      document.getElementById('startScreen').style.display = 'flex';
    }
  }, 1000);

  requestAnimationFrame(loop);
}

function spawnFish() {
  fishes.push({
    x: Math.random() * canvas.width,
    y: canvas.height + 100,
    vx: (Math.random() - 0.5) * 2.5,
    size: 40 + Math.random() * 40,
    color: ['#ff5e5e','#ffaa00','#00ffcc','#ff66aa','#66ff66'][Math.floor(Math.random()*5)],
    bob: Math.random() * 360
  });
}

// Controls — only top area moves the hook
canvas.addEventListener('mousemove', e => { if(e.clientY < hookZoneHeight) hookX = e.clientX; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  if(t.clientY < hookZoneHeight) hookX = t.clientX;
});

function createParticles(x,y) {
  for(let i=0;i<18;i++){
    particles.push({x,y,
      vx:(Math.random()-0.5)*10,
      vy:(Math.random()-0.5)*10-4,
      life:30,
      color:'#ffff66'
    });
  }
}

function loop() {
  ctx.fillStyle = '#0088ff';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Gentle waves
  ctx.fillStyle = 'rgba(0,150,255,0.25)';
  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.moveTo(0,120+i*50);
    for(let x=0;x<=canvas.width;x+=30){
      ctx.lineTo(x,120+i*50 + Math.sin(Date.now()*0.001 + x*0.01 + i)*20);
    }
    ctx.lineTo(canvas.width,canvas.height);
    ctx.lineTo(0,canvas.height);
    ctx.fill();
  }

  // Hook line + hook
  ctx.strokeStyle = '#333'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(hookX,0); ctx.lineTo(hookX,hookY); ctx.stroke();
  ctx.font = '48px Arial';
  ctx.fillText('hook', hookX-24, hookY+16);

  if(gameRunning) hookY = Math.min(hookY + 4, canvas.height-80);

  fishes.forEach((f,i) => {
    if(f.caught){
      f.y -= 7;
      f.x += (hookX - f.x)*0.12;
      if(f.y < -100) fishes.splice(i,1);
      ctx.font = f.size+'px Arial';
      ctx.fillText('fish', f.x-f.size/2, f.y);
      return;
    }

    f.x += f.vx;
    f.y += Math.sin(Date.now()*0.001 + f.bob)*0.6 - 0.8;
    if(f.x < -100 || f.x > canvas.width+100) f.vx *= -1;
    if(f.y < 180) f.y = canvas.height + 100;

    // Collision
    if(Math.hypot(f.x-hookX, f.y-hookY) < f.size && hookY > 200){
      f.caught = true;
      score++;
      document.getElementById('score').textContent = score;
      createParticles(f.x,f.y);
      setTimeout(spawnFish, 600);
    }

    // Draw fish (emoji with color tint)
    ctx.font = f.size+'px Arial';
    ctx.fillStyle = f.color;
    ctx.fillText('fish', f.x-f.size/2, f.y);
    ctx.fillStyle = 'white';
    ctx.fillText('fish', f.x-f.size/2+3, f.y-3);
  });

  // Sparkles
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--;
    ctx.globalAlpha = p.life/30;
    ctx.fillStyle = p.color;
    ctx.fillText('sparkle', p.x, p.y);
    return p.life > 0;
  });
  ctx.globalAlpha = 1;

  if(gameRunning) requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});
</script>
</body>
</html>
