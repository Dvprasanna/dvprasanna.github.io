<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flirty Chat</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.chat-container {
  width: 350px;
  background: #1e1e1e;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-box {
  padding: 15px;
  flex: 1;
  overflow-y: auto;
}

.message {
  margin-bottom: 10px;
  padding: 8px 12px;
  border-radius: 15px;
  max-width: 75%;
}

.user {
  background: #ff4d6d;
  align-self: flex-end;
}

.bot {
  background: #333;
  align-self: flex-start;
}

.input-area {
  display: flex;
  border-top: 1px solid #333;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  background: #222;
  color: white;
}

button {
  padding: 10px;
  border: none;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="chat-container">
  <div class="chat-box" id="chatBox"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Say something..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const flirtyReplies = [
  "Oh really? Tell me more 😉",
  "Careful… I might start liking you 😌",
  "You always talk like that?",
  "Hmm… that’s kinda cute.",
  "Is it hot in here or is it just you?",
  "Stop… you’re making me blush 😳",
  "I wasn’t expecting that… but I like it."
];

const flirtyQuestions = [
  "Did I lose your attention already? 😏",
  "Why so quiet… thinking about me?",
  "Are you smiling at your screen right now?",
  "Should I flirt harder or are you shy?",
  "Miss me already?",
  "You typing… or just staring at my messages? 😉"
];

let inactivityTimer;

function addMessage(text, className) {
  const msg = document.createElement("div");
  msg.className = "message " + className;
  msg.innerText = text;
  document.getElementById("chatBox").appendChild(msg);
  msg.scrollIntoView({ behavior: "smooth" });
}

function randomFrom(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function resetInactivityTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    addMessage(randomFrom(flirtyQuestions), "bot");
  }, 5000);
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const userText = input.value.trim();
  if (!userText) return;

  addMessage(userText, "user");
  input.value = "";

  setTimeout(() => {
    addMessage(randomFrom(flirtyReplies), "bot");
  }, 800);

  resetInactivityTimer();
}

document.getElementById("userInput").addEventListener("input", resetInactivityTimer);

// Start timer when page loads
resetInactivityTimer();
</script>

</body>
</html>
