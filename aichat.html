<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flirty Chat</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: #0f0f0f;
  height: 100vh;
  display: flex;
  flex-direction: column;
  color: white;
}

.chat-wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.4;
  word-wrap: break-word;
}

.user {
  align-self: flex-end;
  background: #ff2e63;
}

.bot {
  align-self: flex-start;
  background: #1e1e1e;
}

.input-area {
  display: flex;
  padding: 10px;
  background: #121212;
  border-top: 1px solid #222;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
  font-size: 16px;
  background: #1e1e1e;
  color: white;
}

button {
  margin-left: 8px;
  padding: 12px 16px;
  border-radius: 25px;
  border: none;
  background: #ff2e63;
  color: white;
  font-size: 15px;
}
</style>
</head>

<body>

<div class="chat-wrapper">
  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Say something..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const flirtyReplies = [
  "Oh really? Tell me more 😉",
  "Careful… I might start liking you 😌",
  "You always talk like that?",
  "Hmm… that’s kinda cute.",
  "Is it hot in here or is it just you?",
  "Stop… you’re making me blush 😳",
  "I wasn’t expecting that… but I like it."
];

const flirtyQuestions = [
  "Why so quiet… thinking about me?",
  "Miss me already?",
  "Are you smiling at your screen?",
  "Should I flirt harder or are you shy?",
  "You still there? 😉"
];

let inactivityTimer;

function addMessage(text, type) {
  const msg = document.createElement("div");
  msg.className = "message " + type;
  msg.innerText = text;
  document.getElementById("chatBox").appendChild(msg);
  msg.scrollIntoView({ behavior: "smooth" });
}

function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function resetInactivityTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    addMessage(randomFrom(flirtyQuestions), "bot");
  }, 5000);
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    addMessage(randomFrom(flirtyReplies), "bot");
  }, 600);

  resetInactivityTimer();
}

document.getElementById("userInput").addEventListener("input", resetInactivityTimer);

resetInactivityTimer();
</script>

</body>
</html>
