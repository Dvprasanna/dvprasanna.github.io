<!DOCTYPE html>
<html>
<head>
  <title>4-Corner Crop Tool</title>
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
  <style>
    canvas { border: 1px solid #333; cursor: crosshair; }
    button { margin-top: 10px; }
  </style>
</head>
<body>

<input type="file" id="upload" accept="image/*"><br><br>
<canvas id="canvas"></canvas><br>
<button onclick="crop()">Crop & Download</button>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let img = new Image();
let points = [];

document.getElementById("upload").onchange = e => {
  let file = e.target.files[0];
  img.src = URL.createObjectURL(file);
};

img.onload = () => {
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);
};

canvas.onclick = e => {
  if (points.length >= 4) return;

  let rect = canvas.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  points.push([x, y]);

  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.fill();
};

function crop() {
  if (points.length !== 4) {
    alert("Select exactly 4 corners");
    return;
  }

  let src = cv.imread(canvas);
  let dst = new cv.Mat();

  let srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, points.flat());
  let width = Math.hypot(points[1][0]-points[0][0], points[1][1]-points[0][1]);
  let height = Math.hypot(points[3][0]-points[0][0], points[3][1]-points[0][1]);

  let dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
    0, 0,
    width, 0,
    width, height,
    0, height
  ]);

  let M = cv.getPerspectiveTransform(srcPts, dstPts);
  cv.warpPerspective(src, dst, M, new cv.Size(width, height));

  cv.imshow(canvas, dst);

  let link = document.createElement("a");
  link.download = "cropped.png";
  link.href = canvas.toDataURL();
  link.click();

  src.delete(); dst.delete(); srcPts.delete(); dstPts.delete(); M.delete();
}
</script>

</body>
</html>
