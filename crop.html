<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Document Crop Tool</title>

  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    canvas {
      max-width: 100vw;
      max-height: 80vh;
      touch-action: none;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<input type="file" id="upload" accept="image/*"><br>
<canvas id="canvas"></canvas><br>
<button onclick="crop()">Crop & Download</button>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let img = new Image();
let scale = 1;
let points = [];
let dragging = -1;

document.getElementById("upload").onchange = e => {
  img.src = URL.createObjectURL(e.target.files[0]);
};

img.onload = () => {
  let maxW = window.innerWidth;
  let maxH = window.innerHeight * 0.75;
  scale = Math.min(maxW / img.width, maxH / img.height, 1);

  canvas.width = img.width * scale;
  canvas.height = img.height * scale;

  points = [
    {x: 40, y: 40},
    {x: canvas.width - 40, y: 40},
    {x: canvas.width - 40, y: canvas.height - 40},
    {x: 40, y: canvas.height - 40}
  ];

  draw();
};

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  // Overlay
  ctx.fillStyle = "rgba(0,150,255,0.25)";
  ctx.beginPath();
  points.forEach((p,i)=>{
    if(i===0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  });
  ctx.closePath();
  ctx.fill();

  // Border
  ctx.strokeStyle = "#00bfff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Handles
  points.forEach(p=>{
    ctx.fillStyle = "#00bfff";
    ctx.beginPath();
    ctx.arc(p.x,p.y,8,0,Math.PI*2);
    ctx.fill();
  });
}

canvas.onpointerdown = e => {
  let r = canvas.getBoundingClientRect();
  let x = e.clientX - r.left;
  let y = e.clientY - r.top;

  points.forEach((p,i)=>{
    if(Math.hypot(p.x-x,p.y-y)<12) dragging=i;
  });
};

canvas.onpointermove = e => {
  if(dragging<0) return;
  let r = canvas.getBoundingClientRect();
  points[dragging].x = e.clientX - r.left;
  points[dragging].y = e.clientY - r.top;
  draw();
};

canvas.onpointerup = () => dragging=-1;

function crop() {
  let src = cv.imread(canvas);
  let dst = new cv.Mat();

  let srcPts = cv.matFromArray(4,1,cv.CV_32FC2,
    points.flatMap(p=>[p.x/scale,p.y/scale])
  );

  let w = Math.hypot(points[1].x-points[0].x,points[1].y-points[0].y)/scale;
  let h = Math.hypot(points[3].x-points[0].x,points[3].y-points[0].y)/scale;

  let dstPts = cv.matFromArray(4,1,cv.CV_32FC2,
    [0,0,w,0,w,h,0,h]
  );

  let M = cv.getPerspectiveTransform(srcPts,dstPts);
  cv.warpPerspective(src,dst,M,new cv.Size(w,h));

  let outCanvas = document.createElement("canvas");
  cv.imshow(outCanvas,dst);

  let link = document.createElement("a");
  link.download = "cropped.png";
  link.href = outCanvas.toDataURL();
  link.click();

  src.delete(); dst.delete(); srcPts.delete(); dstPts.delete(); M.delete();
}
</script>

</body>
</html>
