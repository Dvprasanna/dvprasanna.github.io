<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Scanner Crop</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
  :root {
    --accent: #0aaaff;
    --bg: #0f1115;
    --panel: #161a20;
    --text: #eaeaea;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 18px;
    background: var(--panel);
    font-weight: 600;
  }

  .workspace {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  canvas {
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }

  footer {
    padding: 12px;
    background: var(--panel);
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }

  .btn.primary {
    background: var(--accent);
    color: #000;
  }

  .btn.secondary {
    background: #2a2f3a;
    color: var(--text);
  }

  input { display: none; }
</style>
</head>

<body>

<header>Document Crop Tool</header>

<div class="workspace">
  <canvas id="canvas"></canvas>
</div>

<footer>
  <label class="btn secondary">
    Upload
    <input type="file" id="upload" accept="image/*">
  </label>
  <button class="btn primary" onclick="crop()">Crop & Download</button>
</footer>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let points = [];
let dragIndex = -1;
let scale = 1;
let originalMat = null;

// Upload
document.getElementById("upload").onchange = e => {
  img.src = URL.createObjectURL(e.target.files[0]);
};

// Image load
img.onload = () => {
  if (originalMat) originalMat.delete();
  originalMat = cv.imread(img); // FULL resolution

  const maxW = canvas.parentElement.clientWidth;
  const maxH = canvas.parentElement.clientHeight;

  scale = Math.min(maxW / img.width, maxH / img.height);

  canvas.width = img.width * scale;
  canvas.height = img.height * scale;

  points = [
    [40, 40],
    [canvas.width - 40, 40],
    [canvas.width - 40, canvas.height - 40],
    [40, canvas.height - 40]
  ];

  draw();
};

// Draw preview
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "rgba(10,170,255,0.25)";
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  points.forEach(p => ctx.lineTo(...p));
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#0aaaff";
  ctx.lineWidth = 2;
  ctx.stroke();

  points.forEach(p => {
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#0aaaff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p[0], p[1], 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  });
}

// Drag handling
canvas.onmousedown = e => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;

  dragIndex = -1;
  points.forEach((p, i) => {
    if (Math.hypot(p[0] - x, p[1] - y) <= 12) dragIndex = i;
  });
};

canvas.onmousemove = e => {
  if (dragIndex === -1) return;
  const r = canvas.getBoundingClientRect();
  points[dragIndex] = [
    e.clientX - r.left,
    e.clientY - r.top
  ];
  draw();
};

canvas.onmouseup = canvas.onmouseleave = () => dragIndex = -1;

// Crop & export
function crop() {
  if (!originalMat) return;

  let dst = new cv.Mat();

  let realPts = points.map(p => [p[0] / scale, p[1] / scale]);
  let srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, realPts.flat());

  let w = Math.max(
    Math.hypot(realPts[1][0]-realPts[0][0], realPts[1][1]-realPts[0][1]),
    Math.hypot(realPts[2][0]-realPts[3][0], realPts[2][1]-realPts[3][1])
  );

  let h = Math.max(
    Math.hypot(realPts[3][0]-realPts[0][0], realPts[3][1]-realPts[0][1]),
    Math.hypot(realPts[2][0]-realPts[1][0], realPts[2][1]-realPts[1][1])
  );

  let dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
    0,0, w,0, w,h, 0,h
  ]);

  let M = cv.getPerspectiveTransform(srcPts, dstPts);

  cv.warpPerspective(
    originalMat,
    dst,
    M,
    new cv.Size(w, h),
    cv.INTER_LINEAR,
    cv.BORDER_CONSTANT,
    new cv.Scalar(255,255,255,255)
  );

  let out = document.createElement("canvas");
  out.width = w;
  out.height = h;
  let outCtx = out.getContext("2d");
  outCtx.fillStyle = "#fff";
  outCtx.fillRect(0,0,w,h);
  cv.imshow(out, dst);

  let a = document.createElement("a");
  a.download = "document_scan.png";
  a.href = out.toDataURL("image/png");
  a.click();

  dst.delete(); srcPts.delete(); dstPts.delete(); M.delete();
}
</script>

</body>
</html>
