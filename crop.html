<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Mobile Document Scanner</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
  :root {
    --accent: #0aaaff;
    --bg: #0f1115;
    --panel: #161a20;
    --text: #eaeaea;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--panel);
    padding: 14px 16px;
    font-weight: 600;
    text-align: center;
  }

  .workspace {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  canvas {
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }

  footer {
    background: var(--panel);
    padding: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  input[type="file"] {
    display: none;
  }

  .btn {
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn.primary {
    background: var(--accent);
    color: #000;
  }

  .btn.secondary {
    background: #2a2f3a;
    color: var(--text);
  }
</style>
</head>

<body>

<header>Document Scanner</header>

<div class="workspace">
  <canvas id="canvas"></canvas>
</div>

<footer>
  <label class="btn secondary">
    Upload
    <input type="file" id="upload" accept="image/*">
  </label>

  <button class="btn secondary" onclick="undo()">Undo</button>
  <button class="btn secondary" onclick="done()">Done</button>
  <button class="btn primary" onclick="crop()">Crop</button>
</footer>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let originalMat = null;
let scale = 1;

let points = [];
let dragIndex = -1;

let history = [];
let locked = false;

// Upload
document.getElementById("upload").onchange = e => {
  img.src = URL.createObjectURL(e.target.files[0]);
};

// Image loaded
img.onload = () => {
  if (originalMat) originalMat.delete();
  originalMat = cv.imread(img);

  const maxW = canvas.parentElement.clientWidth;
  const maxH = canvas.parentElement.clientHeight;

  scale = Math.min(maxW / img.width, maxH / img.height);

  canvas.width = img.width * scale;
  canvas.height = img.height * scale;

  points = [
    [30, 30],
    [canvas.width - 30, 30],
    [canvas.width - 30, canvas.height - 30],
    [30, canvas.height - 30]
  ];

  history = [];
  locked = false;
  draw();
};

// Draw preview
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  if (!locked) {
    // Blue overlay
    ctx.fillStyle = "rgba(10,170,255,0.25)";
    ctx.beginPath();
    ctx.moveTo(...points[0]);
    points.forEach(p => ctx.lineTo(...p));
    ctx.closePath();
    ctx.fill();

    // Border
    ctx.strokeStyle = "#0aaaff";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Handles (5px visual)
    points.forEach(p => {
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#0aaaff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p[0], p[1], 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
  }
}

// Pointer events
canvas.addEventListener("pointerdown", onPointerDown);
canvas.addEventListener("pointermove", onPointerMove);
canvas.addEventListener("pointerup", onPointerUp);
canvas.addEventListener("pointercancel", onPointerUp);

function getCanvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onPointerDown(e) {
  if (locked) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  // Save state for UNDO
  history.push(JSON.parse(JSON.stringify(points)));

  const { x, y } = getCanvasPoint(e);
  dragIndex = -1;

  points.forEach((p, i) => {
    if (Math.hypot(p[0] - x, p[1] - y) <= 14) {
      dragIndex = i;
    }
  });
}

function onPointerMove(e) {
  if (dragIndex === -1 || locked) return;
  e.preventDefault();

  const { x, y } = getCanvasPoint(e);
  points[dragIndex] = [x, y];
  draw();
}

function onPointerUp(e) {
  dragIndex = -1;
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
}

// DONE
function done() {
  locked = true;
  draw();
}

// UNDO
function undo() {
  if (history.length === 0) return;
  points = history.pop();
  locked = false;
  draw();
}

// Crop & download
function crop() {
  if (!originalMat) return;

  let dst = new cv.Mat();

  let realPts = points.map(p => [p[0] / scale, p[1] / scale]);
  let srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, realPts.flat());

  let w = Math.max(
    Math.hypot(realPts[1][0]-realPts[0][0], realPts[1][1]-realPts[0][1]),
    Math.hypot(realPts[2][0]-realPts[3][0], realPts[2][1]-realPts[3][1])
  );

  let h = Math.max(
    Math.hypot(realPts[3][0]-realPts[0][0], realPts[3][1]-realPts[0][1]),
    Math.hypot(realPts[2][0]-realPts[1][0], realPts[2][1]-realPts[1][1])
  );

  let dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
    0, 0, w, 0, w, h, 0, h
  ]);

  let M = cv.getPerspectiveTransform(srcPts, dstPts);

  cv.warpPerspective(
    originalMat,
    dst,
    M,
    new cv.Size(w, h),
    cv.INTER_LINEAR,
    cv.BORDER_CONSTANT,
    new cv.Scalar(255,255,255,255)
  );

  let out = document.createElement("canvas");
  out.width = w;
  out.height = h;
  let octx = out.getContext("2d");
  octx.fillStyle = "#fff";
  octx.fillRect(0, 0, w, h);
  cv.imshow(out, dst);

  let a = document.createElement("a");
  a.download = "document_scan.png";
  a.href = out.toDataURL("image/png");
  a.click();

  dst.delete();
  srcPts.delete();
  dstPts.delete();
  M.delete();
}
</script>

</body>
</html>
