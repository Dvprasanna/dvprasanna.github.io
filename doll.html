<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppet Animator (Fixed)</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center}
canvas{background:#eee;display:block;margin:10px auto;touch-action:none}
#ui{display:flex;justify-content:center;gap:10px;align-items:center}
#timeline{background:#222}
button{padding:4px 10px}
</style>
</head>
<body>

<canvas id="stage" width="360" height="420"></canvas>

<div id="ui">
  <button id="play">▶</button>
  <button id="stop">■</button>
  Frame: <span id="frame">0</span>
</div>

<canvas id="timeline" width="360" height="60"></canvas>

<script>
const FPS = 12;
const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
const tl = document.getElementById("timeline");
const tctx = tl.getContext("2d");

let currentFrame = 0;
let playing = false;
let drag = null;
let keyframes = [];

/* ---------------- PUPPET MODEL ---------------- */
const puppet = {
  barX: 180,
  barY: 0,
  baseY: 200,
  parts:{
    head:{x:0,y:-40},
    lh:{x:-40,y:30},
    rh:{x:40,y:30},
    ll:{x:-20,y:120},
    rl:{x:20,y:120}
  }
};

/* ---------------- DRAW HELPERS ---------------- */
function L(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function D(x,y){ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();}

/* ---------------- DRAW PUPPET ---------------- */
function drawPuppet(){
  ctx.clearRect(0,0,stage.width,stage.height);
  ctx.lineWidth=3; ctx.strokeStyle="#000"; ctx.fillStyle="#d00";

  const cx=puppet.barX;
  const cy=puppet.baseY+puppet.barY;

  // BODY
  L(cx,cy,cx,cy+70);

  // HEAD
  const hx=cx+puppet.parts.head.x;
  const hy=cy+puppet.parts.head.y;
  L(cx,cy,hx,hy);
  ctx.beginPath();ctx.arc(hx,hy,16,0,Math.PI*2);ctx.stroke();D(hx,hy);

  // HANDS
  ["lh","rh"].forEach(k=>{
    const p=puppet.parts[k];
    L(cx,cy+15,cx+p.x,cy+p.y);
    D(cx+p.x,cy+p.y);
  });

  // LEGS
  ["ll","rl"].forEach(k=>{
    const p=puppet.parts[k];
    L(cx,cy+70,cx+p.x,cy+p.y);
    D(cx+p.x,cy+p.y);
  });

  // X BAR
  L(cx-50,40,cx+50,40);D(cx,40);

  // Y BAR
  L(330,90+puppet.barY,330,150+puppet.barY);D(330,120+puppet.barY);
}

/* ---------------- TIMELINE ---------------- */
function drawTimeline(){
  tctx.clearRect(0,0,tl.width,tl.height);
  for(let i=0;i<60;i++){
    tctx.fillStyle=i===currentFrame?"#0f0":"#555";
    tctx.fillRect(i*6,20,4,20);
  }
  keyframes.forEach(k=>{
    tctx.fillStyle="#f00";
    tctx.fillRect(k.time*6,10,6,40);
  });
}

/* ---------------- INTERACTION ---------------- */
function pos(e){
  const r=stage.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return{x:t.clientX-r.left,y:t.clientY-r.top};
}
function hit(px,py,x,y){return Math.hypot(px-x,py-y)<12;}

stage.onmousedown=stage.ontouchstart=e=>{
  if(playing) return; // 🔒 lock during play
  const p=pos(e);
  const cx=puppet.barX, cy=puppet.baseY+puppet.barY;

  if(Math.abs(p.y-40)<12 && Math.abs(p.x-cx)<50){drag={type:"x"};return;}
  if(Math.abs(p.x-330)<12 && Math.abs(p.y-(120+puppet.barY))<30){drag={type:"y"};return;}

  for(const k in puppet.parts){
    const px=cx+puppet.parts[k].x;
    const py=cy+puppet.parts[k].y;
    if(hit(p.x,p.y,px,py)){drag={type:"part",key:k};return;}
  }
};

stage.onmousemove=stage.ontouchmove=e=>{
  if(!drag||playing) return;
  const p=pos(e);
  const cx=puppet.barX, cy=puppet.baseY+puppet.barY;

  if(drag.type==="x") puppet.barX=Math.max(60,Math.min(300,p.x));
  if(drag.type==="y") puppet.barY=Math.max(-100,Math.min(100,p.y-120));
  if(drag.type==="part"){
    puppet.parts[drag.key].x=p.x-cx;
    puppet.parts[drag.key].y=p.y-cy;
  }
  drawPuppet();
};

stage.onmouseup=stage.ontouchend=()=>drag=null;

/* ---------------- KEYFRAMES ---------------- */
stage.ondblclick=()=>{
  keyframes.push({
    time:currentFrame,
    state:JSON.parse(JSON.stringify(puppet))
  });
  drawTimeline();
};

/* ---------------- PLAYBACK ---------------- */
function lerp(a,b,t){return a+(b-a)*t;}

function applyFrame(f){
  const a=[...keyframes].filter(k=>k.time<=f).pop();
  const b=[...keyframes].filter(k=>k.time>f)[0];
  if(!a||!b) return;
  const t=(f-a.time)/(b.time-a.time);

  puppet.barX=lerp(a.state.barX,b.state.barX,t);
  puppet.barY=lerp(a.state.barY,b.state.barY,t);
  for(const k in puppet.parts){
    puppet.parts[k].x=lerp(a.state.parts[k].x,b.state.parts[k].x,t);
    puppet.parts[k].y=lerp(a.state.parts[k].y,b.state.parts[k].y,t);
  }
}

setInterval(()=>{
  if(!playing) return;
  currentFrame++;
  applyFrame(currentFrame);
  document.getElementById("frame").innerText=currentFrame;
  drawPuppet(); drawTimeline();
},1000/FPS);

/* ---------------- UI ---------------- */
document.getElementById("play").onclick=()=>playing=true;
document.getElementById("stop").onclick=()=>playing=false;

/* ---------------- START ---------------- */
drawPuppet(); drawTimeline();
</script>

</body>
</html>
