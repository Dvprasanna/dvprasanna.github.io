<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Puppet Global Y Offset</title>
<style>
  body{background:#111;display:flex;justify-content:center;}
  canvas{background:#fff;margin-top:20px;touch-action:none;}
</style>
</head>
<body>

<canvas id="stage" width="460" height="560"></canvas>

<script>
const c = document.getElementById("stage");
const g = c.getContext("2d");

const puppet = {
  barX: 230,
  barY: 0,              // GLOBAL Y OFFSET
  baseY: 240,
  pose: {
    head: 0,
    lh: 0,
    rh: 0,
    ll: 0,
    rl: 0
  }
};

let drag = null;

const L=(x1,y1,x2,y2)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
const D=(x,y)=>{g.beginPath();g.arc(x,y,6,0,Math.PI*2);g.fill();}

function draw(){
  g.clearRect(0,0,460,560);
  g.lineWidth=2;
  g.strokeStyle="#000";
  g.fillStyle="#c00";

  // CONTROL BARS
  L(puppet.barX-60,50,puppet.barX+60,50);
  D(puppet.barX,50);

  L(400,80+puppet.barY,400,160+puppet.barY);
  D(400,120+puppet.barY);

  const cx = puppet.barX;
  const gy = puppet.barY;  // GLOBAL Y

  // STRINGS
  L(cx,50,cx,puppet.baseY+gy-60);

  // HEAD
  g.beginPath();
  g.arc(cx,
    puppet.baseY+gy-40+puppet.pose.head,
    20,0,Math.PI*2);
  g.stroke();

  // BODY
  L(cx,
    puppet.baseY+gy,
    cx,
    puppet.baseY+gy+90);

  // HANDS
  L(cx,
    puppet.baseY+gy+20,
    cx-50,
    puppet.baseY+gy+40+puppet.pose.lh);

  L(cx,
    puppet.baseY+gy+20,
    cx+50,
    puppet.baseY+gy+40+puppet.pose.rh);

  // LEGS
  L(cx,
    puppet.baseY+gy+90,
    cx-30,
    puppet.baseY+gy+140+puppet.pose.ll);

  L(cx,
    puppet.baseY+gy+90,
    cx+30,
    puppet.baseY+gy+140+puppet.pose.rl);
}

function P(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}

c.onmousedown=c.ontouchstart=e=>{
  const p=P(e);
  if(Math.abs(p.y-50)<10 && Math.abs(p.x-puppet.barX)<60) drag="x";
  else if(Math.abs(p.x-400)<10 && Math.abs(p.y-(120+puppet.barY))<40) drag="y";
};

c.onmousemove=c.ontouchmove=e=>{
  if(!drag) return;
  const p=P(e);
  if(drag==="x") puppet.barX=Math.max(80,Math.min(340,p.x));
  if(drag==="y") puppet.barY=Math.max(-80,Math.min(120,p.y-120));
  draw();
};

c.onmouseup=c.ontouchend=()=>drag=null;

// idle articulation (strings still matter)
setInterval(()=>{
  puppet.pose.lh = Math.sin(Date.now()/300)*8;
  puppet.pose.rh = -Math.sin(Date.now()/300)*8;
  puppet.pose.head = Math.sin(Date.now()/400)*4;
  draw();
},30);

draw();
</script>
</body>
</html>
