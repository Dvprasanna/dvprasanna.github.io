<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppet Animator (Simple UI)</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
}
canvas{
  background:#eee;
  display:block;
  margin:10px auto;
  touch-action:none;
}
#ui{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
button,input{
  padding:8px 12px;
  font-size:14px;
  border-radius:6px;
  border:none;
}
button{background:#444;color:#fff}
input{width:80px}
</style>
</head>
<body>

<canvas id="stage" width="360" height="420"></canvas>

<div id="ui">
  <button id="play">▶ Play</button>
  <button id="restart">⟲ Restart</button>

  Max Frame:
  <input id="maxFrame" type="number" value="60" min="1">

  <button id="add">＋ Add Frame</button>
  <button id="export">⬇ Export GIF</button>

  Frame: <span id="frame">0</span>
</div>

<!-- GIF encoder -->
<script src="https://cdn.jsdelivr.net/npm/gif-encoder-2@1.0.5/dist/gif-encoder.min.js"></script>

<script>
/* ================= CONFIG ================= */
const FPS = 12;

/* ================= CANVAS ================= */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

/* ================= STATE ================= */
let currentFrame = 0;
let playing = false;
let frames = {}; // frameNumber -> puppet snapshot

/* ================= PUPPET ================= */
const puppet = {
  barX: 180,
  barY: 0,
  baseY: 200,
  parts:{
    head:{x:0,y:-40},
    lh:{x:-40,y:30},
    rh:{x:40,y:30},
    ll:{x:-20,y:120},
    rl:{x:20,y:120}
  }
};

let drag=null;

/* ================= DRAW ================= */
function L(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function D(x,y){ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth=3;
  ctx.strokeStyle="#000";
  ctx.fillStyle="#d00";

  const cx=puppet.barX;
  const cy=puppet.baseY+puppet.barY;

  // body
  L(cx,cy,cx,cy+70);

  // head
  const hx=cx+puppet.parts.head.x;
  const hy=cy+puppet.parts.head.y;
  L(cx,cy,hx,hy);
  ctx.beginPath();ctx.arc(hx,hy,16,0,Math.PI*2);ctx.stroke();D(hx,hy);

  // hands
  ["lh","rh"].forEach(k=>{
    const p=puppet.parts[k];
    L(cx,cy+15,cx+p.x,cy+p.y);D(cx+p.x,cy+p.y);
  });

  // legs
  ["ll","rl"].forEach(k=>{
    const p=puppet.parts[k];
    L(cx,cy+70,cx+p.x,cy+p.y);D(cx+p.x,cy+p.y);
  });

  // bars
  L(cx-50,40,cx+50,40);D(cx,40);
  L(330,90+puppet.barY,330,150+puppet.barY);D(330,120+puppet.barY);
}

/* ================= INTERACTION ================= */
function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return{x:t.clientX-r.left,y:t.clientY-r.top};
}
function hit(px,py,x,y){return Math.hypot(px-x,py-y)<12;}

canvas.onmousedown=canvas.ontouchstart=e=>{
  const p=pos(e);
  const cx=puppet.barX,cy=puppet.baseY+puppet.barY;

  if(Math.abs(p.y-40)<12&&Math.abs(p.x-cx)<50){drag={type:"x"};return;}
  if(Math.abs(p.x-330)<12&&Math.abs(p.y-(120+puppet.barY))<30){drag={type:"y"};return;}

  for(const k in puppet.parts){
    const px=cx+puppet.parts[k].x;
    const py=cy+puppet.parts[k].y;
    if(hit(p.x,p.y,px,py)){drag={type:"part",key:k};return;}
  }
};

canvas.onmousemove=canvas.ontouchmove=e=>{
  if(!drag) return;
  const p=pos(e);
  const cx=puppet.barX,cy=puppet.baseY+puppet.barY;

  if(drag.type==="x") puppet.barX=p.x;
  if(drag.type==="y") puppet.barY=p.y-120;
  if(drag.type==="part"){
    puppet.parts[drag.key].x=p.x-cx;
    puppet.parts[drag.key].y=p.y-cy;
  }
  draw();
};

canvas.onmouseup=canvas.ontouchend=()=>drag=null;

/* ================= UI ================= */
document.getElementById("play").onclick=()=>{
  playing=true;
};

document.getElementById("restart").onclick=()=>{
  currentFrame=0;
  applyFrame(0);
};

document.getElementById("add").onclick=()=>{
  const max=parseInt(document.getElementById("maxFrame").value);
  const f=parseInt(prompt(`Enter frame number (0-${max})`));
  if(isNaN(f)||f<0||f>max) return;
  frames[f]=JSON.parse(JSON.stringify(puppet));
};

function applyFrame(f){
  if(frames[f]){
    Object.assign(puppet, JSON.parse(JSON.stringify(frames[f])));
  }
  document.getElementById("frame").innerText=f;
  draw();
}

/* ================= PLAYBACK ================= */
setInterval(()=>{
  if(!playing) return;
  const max=parseInt(document.getElementById("maxFrame").value);
  currentFrame++;
  if(currentFrame>max) currentFrame=0;
  applyFrame(currentFrame);
},1000/FPS);

/* ================= EXPORT GIF ================= */
document.getElementById("export").onclick=()=>{
  const max=parseInt(document.getElementById("maxFrame").value);
  const encoder = new GIFEncoder(canvas.width,canvas.height);
  encoder.setDelay(1000/FPS);
  encoder.start();

  for(let f=0;f<=max;f++){
    applyFrame(f);
    encoder.addFrame(ctx);
  }

  encoder.finish();
  const blob = new Blob([encoder.out.getData()],{type:"image/gif"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="puppet.gif";
  a.click();
};

/* ================= START ================= */
draw();
</script>

</body>
</html>
