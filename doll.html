<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Working Digital Puppet</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
  }
  canvas {
    background: #eaeaea;
    display: block;
    margin: 10px auto;
    touch-action: none;
  }
  button {
    margin: 6px;
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: #444;
    color: #fff;
  }
</style>
</head>
<body>

<canvas id="stage" width="360" height="480"></canvas>

<div>
  <button>Rama</button>
  <button>Sita</button>
  <button>Hanuman</button>
  <button>Ravana</button>
</div>

<script>
window.onload = function () {

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  ctx.lineWidth = 4;
  ctx.strokeStyle = "#000";
  ctx.fillStyle = "#d00";

  const puppet = {
    barX: 180,
    barY: 0,
    baseY: 220,
    parts: {
      head:{x:0,y:-50},
      lh:{x:-50,y:30},
      rh:{x:50,y:30},
      ll:{x:-25,y:130},
      rl:{x:25,y:130}
    }
  };

  let drag = null;

  function line(x1,y1,x2,y2){
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  function dot(x,y){
    ctx.beginPath();
    ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const cx = puppet.barX;
    const cy = puppet.baseY + puppet.barY;

    /* TOP BAR (X) */
    line(cx-60,40,cx+60,40);
    dot(cx,40);

    /* SIDE BAR (Y) */
    line(330,80+puppet.barY,330,160+puppet.barY);
    dot(330,120+puppet.barY);

    /* BODY */
    line(cx,cy,cx,cy+80);

    /* NECK + HEAD */
    const hx = cx + puppet.parts.head.x;
    const hy = cy + puppet.parts.head.y;
    line(cx,cy,hx,hy);
    ctx.beginPath();
    ctx.arc(hx,hy,18,0,Math.PI*2);
    ctx.stroke();
    dot(hx,hy);

    /* HANDS */
    ["lh","rh"].forEach(k=>{
      const px = cx + puppet.parts[k].x;
      const py = cy + puppet.parts[k].y;
      line(cx,cy+15,px,py);
      dot(px,py);
    });

    /* LEGS */
    ["ll","rl"].forEach(k=>{
      const px = cx + puppet.parts[k].x;
      const py = cy + puppet.parts[k].y;
      line(cx,cy+80,px,py);
      dot(px,py);
    });
  }

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x:t.clientX-r.left,y:t.clientY-r.top};
  }

  function hit(px,py,x,y){
    return Math.hypot(px-x,py-y) < 15;
  }

  canvas.onmousedown = canvas.ontouchstart = e => {
    const p = pos(e);

    if(Math.abs(p.y-40)<12 && Math.abs(p.x-puppet.barX)<60){
      drag={type:"x"}; return;
    }
    if(Math.abs(p.x-330)<12 && Math.abs(p.y-(120+puppet.barY))<40){
      drag={type:"y"}; return;
    }

    const cx = puppet.barX;
    const cy = puppet.baseY + puppet.barY;

    for(const k in puppet.parts){
      const px = cx + puppet.parts[k].x;
      const py = cy + puppet.parts[k].y;
      if(hit(p.x,p.y,px,py)){
        drag={type:"part",key:k};
        return;
      }
    }
  };

  canvas.onmousemove = canvas.ontouchmove = e => {
    if(!drag) return;
    const p = pos(e);
    const cx = puppet.barX;
    const cy = puppet.baseY + puppet.barY;

    if(drag.type==="x"){
      puppet.barX = Math.max(80,Math.min(280,p.x));
    }
    if(drag.type==="y"){
      puppet.barY = Math.max(-120,Math.min(120,p.y-120));
    }
    if(drag.type==="part"){
      puppet.parts[drag.key].x = p.x - cx;
      puppet.parts[drag.key].y = p.y - cy;
    }
    draw();
  };

  canvas.onmouseup = canvas.ontouchend = () => drag=null;

  draw();
};
</script>

</body>
</html>
