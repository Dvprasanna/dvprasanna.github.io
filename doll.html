<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Puppet XY Control</title>
<style>
  body { background:#111; display:flex; justify-content:center; }
  canvas { background:#fff; margin-top:20px; touch-action:none; }
</style>
</head>
<body>

<canvas id="stage" width="460" height="560"></canvas>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const puppet = {
  barX: 230,
  barY: 70,
  cx: 230,
  cy: 240,
  strings: {
    head:{y:70},
    lh:{y:90},
    rh:{y:90},
    ll:{y:110},
    rl:{y:110}
  }
};

let drag = null;

const line=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
const dot =(x,y)=>{ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();}

function draw(){
  ctx.clearRect(0,0,460,560);
  ctx.lineWidth=2;
  ctx.strokeStyle="#000";
  ctx.fillStyle="#c00";

  // CONTROL BARS
  line(puppet.barX-60,50,puppet.barX+60,50); // X bar
  dot(puppet.barX,50);

  line(400,puppet.barY-40,400,puppet.barY+40); // Y bar
  dot(400,puppet.barY);

  puppet.cx = puppet.barX;
  puppet.cy = 240 + (puppet.barY-70); // 🔑 Y-axis control

  const {cx,cy,strings}=puppet;

  // STRINGS
  line(cx,50,cx,strings.head.y);
  line(cx-40,50,cx-40,strings.lh.y);
  line(cx+40,50,cx+40,strings.rh.y);

  // HEAD
  ctx.beginPath();
  ctx.arc(cx,cy-40+(strings.head.y-70)/2,20,0,Math.PI*2);
  ctx.stroke();

  // BODY
  line(cx,cy,cx,cy+90);

  // HANDS
  line(cx,cy+20,cx-50,cy+40+(strings.lh.y-90));
  line(cx,cy+20,cx+50,cy+40+(strings.rh.y-90));

  // LEGS
  line(cx,cy+90,cx-30,cy+140+(strings.ll.y-110));
  line(cx,cy+90,cx+30,cy+140+(strings.rl.y-110));

  // STRING HANDLES
  dot(cx,strings.head.y);
  dot(cx-40,strings.lh.y);
  dot(cx+40,strings.rh.y);
  dot(cx-20,strings.ll.y);
  dot(cx+20,strings.rl.y);
}

function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}

canvas.onmousedown=canvas.ontouchstart=e=>{
  const p=pos(e);
  if(Math.abs(p.y-50)<10 && Math.abs(p.x-puppet.barX)<60) drag="barX";
  else if(Math.abs(p.x-400)<10 && Math.abs(p.y-puppet.barY)<40) drag="barY";
  else for(const k in puppet.strings)
    if(Math.abs(p.y-puppet.strings[k].y)<10) drag=k;
};

canvas.onmousemove=canvas.ontouchmove=e=>{
  if(!drag) return;
  const p=pos(e);
  if(drag==="barX") puppet.barX=Math.max(80,Math.min(340,p.x));
  else if(drag==="barY") puppet.barY=Math.max(50,Math.min(200,p.y));
  else puppet.strings[drag].y=p.y;
  draw();
};

canvas.onmouseup=canvas.ontouchend=()=>drag=null;

draw();
</script>
</body>
</html>
