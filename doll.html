<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Puppet Unified XY Control</title>
<style>
  body { background:#111; display:flex; justify-content:center; }
  canvas { background:#fff; margin-top:20px; touch-action:none; }
</style>
</head>
<body>

<canvas id="stage" width="460" height="560"></canvas>

<script>
const c = document.getElementById("stage");
const x = c.getContext("2d");

const puppet = {
  barX: 230,
  barY: 90,
  baseX: 230,
  baseY: 260,
  pose: { head:0, lh:0, rh:0 }
};

let drag = null;

const L=(a,b,c,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();}
const D=(a,b)=>{x.beginPath();x.arc(a,b,6,0,Math.PI*2);x.fill();}

function draw(){
  x.clearRect(0,0,460,560);
  x.lineWidth=2;
  x.strokeStyle="#000";
  x.fillStyle="#c00";

  // CONTROL BARS
  L(puppet.barX-60,50,puppet.barX+60,50); // X bar
  D(puppet.barX,50);

  L(400,puppet.barY-40,400,puppet.barY+40); // Y bar
  D(400,puppet.barY);

  // 🔑 unified movement
  const cx = puppet.barX;
  const cy = puppet.baseY + (puppet.barY-90);

  // STRINGS (visual only)
  L(cx,50,cx,cy-60);

  // HEAD
  x.beginPath();
  x.arc(cx,cy-40+puppet.pose.head,20,0,Math.PI*2);
  x.stroke();

  // BODY
  L(cx,cy,cx,cy+90);

  // HANDS
  L(cx,cy+20,cx-50,cy+40+puppet.pose.lh);
  L(cx,cy+20,cx+50,cy+40+puppet.pose.rh);

  // LEGS
  L(cx,cy+90,cx-30,cy+150);
  L(cx,cy+90,cx+30,cy+150);
}

function P(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}

c.onmousedown=c.ontouchstart=e=>{
  const p=P(e);
  if(Math.abs(p.y-50)<10 && Math.abs(p.x-puppet.barX)<60) drag="x";
  else if(Math.abs(p.x-400)<10 && Math.abs(p.y-puppet.barY)<40) drag="y";
};

c.onmousemove=c.ontouchmove=e=>{
  if(!drag) return;
  const p=P(e);
  if(drag==="x") puppet.barX=Math.max(80,Math.min(340,p.x));
  if(drag==="y") puppet.barY=Math.max(60,Math.min(220,p.y));
  draw();
};

c.onmouseup=c.ontouchend=()=>drag=null;

// idle pose motion
setInterval(()=>{
  puppet.pose.lh = Math.sin(Date.now()/300)*8;
  puppet.pose.rh = -Math.sin(Date.now()/300)*8;
  puppet.pose.head = Math.sin(Date.now()/400)*4;
  draw();
},30);

draw();
</script>
</body>
</html>
