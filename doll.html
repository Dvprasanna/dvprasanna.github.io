<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppet Animator</title>
<style>
  body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center}
  canvas{background:#eee;display:block;margin:10px auto;touch-action:none}
  #ui{display:flex;justify-content:center;gap:10px;align-items:center}
  #timeline{height:60px;background:#222;margin:10px}
  #timeline canvas{background:#333}
  button{padding:4px 10px}
</style>
</head>
<body>

<canvas id="stage" width="360" height="420"></canvas>

<div id="ui">
  <button id="play">▶</button>
  <button id="stop">■</button>
  FPS: <span id="fps">12</span>
  Frame: <span id="frame">0</span>
</div>

<canvas id="timeline" width="360" height="60"></canvas>

<script>
const FPS = 12;
const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
const tl = document.getElementById("timeline");
const tctx = tl.getContext("2d");

let currentFrame = 0;
let playing = false;
let keyframes = [];

/* ---------- PUPPET MODEL ---------- */
const puppet = {
  barX: 180, barY: 0, baseY: 200,
  parts:{
    head:{x:0,y:-40}, lh:{x:-40,y:30}, rh:{x:40,y:30},
    ll:{x:-20,y:120}, rl:{x:20,y:120}
  }
};

/* ---------- DRAW PUPPET ---------- */
function L(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function D(x,y){ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();}

function drawPuppet(){
  ctx.clearRect(0,0,stage.width,stage.height);
  ctx.lineWidth=3; ctx.strokeStyle="#000"; ctx.fillStyle="#d00";

  const cx=puppet.barX, cy=puppet.baseY+puppet.barY;

  L(cx,cy,cx,cy+70);

  const hx=cx+puppet.parts.head.x, hy=cy+puppet.parts.head.y;
  L(cx,cy,hx,hy); ctx.beginPath(); ctx.arc(hx,hy,16,0,Math.PI*2); ctx.stroke();

  ["lh","rh"].forEach(k=>{
    const p=puppet.parts[k];
    L(cx,cy+15,cx+p.x,cy+p.y); D(cx+p.x,cy+p.y);
  });
  ["ll","rl"].forEach(k=>{
    const p=puppet.parts[k];
    L(cx,cy+70,cx+p.x,cy+p.y); D(cx+p.x,cy+p.y);
  });
}

/* ---------- TIMELINE ---------- */
function drawTimeline(){
  tctx.clearRect(0,0,tl.width,tl.height);
  const frames=60;
  for(let i=0;i<frames;i++){
    tctx.fillStyle = i===currentFrame ? "#0f0" : "#555";
    tctx.fillRect(i*6,20,4,20);
  }
  keyframes.forEach(k=>{
    tctx.fillStyle="#f00";
    tctx.fillRect(k.time*6,10,6,40);
  });
}

/* ---------- KEYFRAME ---------- */
stage.ondblclick = ()=>{
  keyframes.push({
    time: currentFrame,
    state: JSON.parse(JSON.stringify(puppet))
  });
  drawTimeline();
};

/* ---------- PLAYBACK ---------- */
function interpolate(a,b,t){
  return a+(b-a)*t;
}

function applyFrame(frame){
  const before=[...keyframes].filter(k=>k.time<=frame).pop();
  const after=[...keyframes].filter(k=>k.time>frame)[0];
  if(!before||!after) return;

  const t=(frame-before.time)/(after.time-before.time);
  puppet.barX=interpolate(before.state.barX,after.state.barX,t);
  puppet.barY=interpolate(before.state.barY,after.state.barY,t);

  for(const k in puppet.parts){
    puppet.parts[k].x=interpolate(before.state.parts[k].x,after.state.parts[k].x,t);
    puppet.parts[k].y=interpolate(before.state.parts[k].y,after.state.parts[k].y,t);
  }
}

setInterval(()=>{
  if(playing){
    currentFrame++;
    applyFrame(currentFrame);
    document.getElementById("frame").innerText=currentFrame;
    drawPuppet(); drawTimeline();
  }
},1000/FPS);

/* ---------- UI ---------- */
document.getElementById("play").onclick=()=>playing=true;
document.getElementById("stop").onclick=()=>playing=false;

drawPuppet(); drawTimeline();
</script>

</body>
</html>
