<!DOCTYPE html>
<html lang="en">
<!-- 1 -->

<head>
  <!-- 1.1 -->
  <meta charset="UTF-8">
  <title>Visiting Card – Fixed Name Update</title>

  <!-- 1.2 -->
  <style>
    body { background:#eee; padding:20px; font-family:Arial; }
    canvas { width:350px; height:200px; border:1px solid #999; display:block; margin-bottom:15px; }
    .controls input, .controls select, .controls button {
      width:320px; margin:6px 0; padding:6px; display:block;
    }
  </style>
</head>

<body>
  <!-- 1.3 -->
  <canvas id="card" width="1050" height="600"></canvas>

  <!-- 1.3.1 -->
  <div class="controls">
    <select id="layout">
      <option value="1">Layout 1</option>
      <option value="2">Layout 2</option>
      <option value="3">Layout 3</option>
    </select>

    <input id="nameField" value="John Doe">
    <input id="roleField" value="Software Engineer">
    <input id="phoneField" value="+91 90000 00000">
    <input id="emailField" value="john@email.com">
    <input id="websiteField" value="www.company.com">
    <input id="companyField" value="COMPANY NAME">
    <input id="branchField" value="Bangalore Branch">
    <input id="addressField" value="MG Road, Bangalore">

    <input id="c1" type="color" value="#ffffff">
    <input id="c2" type="color" value="#eaeaea">

    <button onclick="download()">Download</button>
  </div>

  <!-- 1.4 -->
  <script>
    // 1.4.1
    const canvas = document.getElementById("card");
    const ctx = canvas.getContext("2d");

    // 1.4.2
    const g = id => document.getElementById(id);

    const layoutEl  = g("layout");
    const nameEl    = g("nameField");
    const roleEl    = g("roleField");
    const phoneEl   = g("phoneField");
    const emailEl   = g("emailField");
    const websiteEl = g("websiteField");
    const companyEl = g("companyField");
    const branchEl  = g("branchField");
    const addressEl = g("addressField");
    const c1El      = g("c1");
    const c2El      = g("c2");

    // 1.4.3
    [
      layoutEl, nameEl, roleEl, phoneEl, emailEl, websiteEl,
      companyEl, branchEl, addressEl, c1El, c2El
    ].forEach(e => e.addEventListener("input", draw));

    // 1.4.4
    function bg() {
      const gr = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
      gr.addColorStop(0,c1El.value);
      gr.addColorStop(1,c2El.value);
      ctx.fillStyle = gr;
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#000";
    }

    // 1.4.5
    function draw() {
      bg();
      if (layoutEl.value === "1") layout1();
      if (layoutEl.value === "2") layout2();
      if (layoutEl.value === "3") layout3();
    }

    // 1.4.6
    function layout1() {
      ctx.textAlign="left"; ctx.font="bold 48px Arial";
      ctx.fillText(nameEl.value,60,90);

      ctx.textAlign="right"; ctx.font="36px Arial";
      ctx.fillText(roleEl.value,canvas.width-60,90);

      ctx.textAlign="left"; ctx.font="32px Arial";
      ctx.fillText(phoneEl.value,60,170);
      ctx.fillText(emailEl.value,60,215);
      ctx.fillText(websiteEl.value,60,260);

      ctx.textAlign="center"; ctx.font="bold 64px Arial";
      ctx.fillText(companyEl.value,canvas.width/2,360);

      ctx.font="30px Arial";
      ctx.fillText(branchEl.value,canvas.width/2,500);
      ctx.fillText(addressEl.value,canvas.width/2,540);
    }

    // 1.4.7
    function layout2() {
      ctx.textAlign="center";
      ctx.font="bold 72px Arial";
      ctx.fillText(companyEl.value,canvas.width/2,140);

      ctx.font="42px Arial";
      ctx.fillText(nameEl.value,canvas.width/2,220);

      ctx.font="34px Arial";
      ctx.fillText(roleEl.value,canvas.width/2,270);

      ctx.font="30px Arial";
      ctx.fillText(phoneEl.value,canvas.width/2,350);
      ctx.fillText(emailEl.value,canvas.width/2,390);
      ctx.fillText(websiteEl.value,canvas.width/2,430);

      ctx.font="28px Arial";
      ctx.fillText(branchEl.value+" – "+addressEl.value,canvas.width/2,520);
    }

    // 1.4.8
    function layout3() {
      ctx.textAlign="left";
      ctx.font="bold 60px Arial";
      ctx.fillText(companyEl.value,60,120);

      ctx.font="42px Arial";
      ctx.fillText(nameEl.value,60,200);

      ctx.font="34px Arial";
      ctx.fillText(roleEl.value,60,250);

      ctx.font="30px Arial";
      ctx.fillText(phoneEl.value,60,330);
      ctx.fillText(emailEl.value,60,370);
      ctx.fillText(websiteEl.value,60,410);

      ctx.textAlign="right";
      ctx.font="28px Arial";
      ctx.fillText(branchEl.value,canvas.width-60,500);
      ctx.fillText(addressEl.value,canvas.width-60,540);
    }

    // 1.4.9
    function download() {
      const a = document.createElement("a");
      a.download = "visiting-card-300dpi.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    // 1.4.10
    draw();
  </script>

<!-- 1.5 -->
</html>
