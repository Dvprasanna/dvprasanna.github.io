<!DOCTYPE html>
<html lang="en">
<!-- 1 -->

<head>
  <!-- 1.1 -->
  <meta charset="UTF-8">
  <title>Canvas Visiting Card</title>

  <!-- 1.2 -->
  <style>
    /* 1.2.1 */
    body {
      font-family: Arial, sans-serif;
      background: #eee;
      padding: 20px;
    }

    /* 1.2.2 */
    canvas {
      display: block;
      margin-bottom: 15px;
      border: 1px solid #ccc;
    }

    /* 1.2.3 */
    .controls input,
    .controls button {
      display: block;
      width: 300px;
      margin: 6px 0;
      padding: 6px;
    }
  </style>
</head>

<body>
  <!-- 1.3 -->

  <!-- 1.3.1 -->
  <canvas id="card" width="350" height="200"></canvas>

  <!-- 1.3.2 -->
  <div class="controls">
    <!-- 1.3.2.1 -->
    <input id="name" value="John Doe">
    <!-- 1.3.2.2 -->
    <input id="role" value="Software Engineer">
    <!-- 1.3.2.3 -->
    <input id="phone" value="+91 90000 00000">
    <!-- 1.3.2.4 -->
    <input id="email" value="john@email.com">
    <!-- 1.3.2.5 -->
    <input id="c1" type="color" value="#1e3c72">
    <!-- 1.3.2.6 -->
    <input id="c2" type="color" value="#2a5298">
    <!-- 1.3.2.7 -->
    <button onclick="download()">Download</button>
  </div>

  <!-- 1.4 -->
  <script>
    // 1.4.1
    const canvas = document.getElementById("card");
    const ctx = canvas.getContext("2d");

    // 1.4.2
    const inputs = ["name", "role", "phone", "email", "c1", "c2"];

    // 1.4.3
    inputs.forEach(id => {
      document.getElementById(id).addEventListener("input", draw);
    });

    // 1.4.4
    function draw() {
      // 1.4.4.1
      const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      g.addColorStop(0, c1.value);
      g.addColorStop(1, c2.value);

      // 1.4.4.2
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1.4.4.3
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px Arial";
      ctx.fillText(name.value, 20, 40);

      // 1.4.4.4
      ctx.font = "14px Arial";
      ctx.fillText(role.value, 20, 70);
      ctx.fillText(phone.value, 20, 110);
      ctx.fillText(email.value, 20, 140);
    }

    // 1.4.5
    function download() {
      const a = document.createElement("a");
      a.download = "visiting-card.png";
      a.href = canvas.toDataURL();
      a.click();
    }

    // 1.4.6
    draw();
  </script>

</body>
<!-- 1.5 -->

</html>
