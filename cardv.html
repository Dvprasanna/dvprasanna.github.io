<!DOCTYPE html>
<html lang="en">
<!-- 1 -->

<head>
  <!-- 1.1 -->
  <meta charset="UTF-8">
  <title>Print Visiting Card (300 DPI)</title>

  <!-- 1.2 -->
  <style>
    /* 1.2.1 */
    body {
      font-family: Arial, sans-serif;
      background: #eee;
      padding: 20px;
    }

    /* 1.2.2 : screen preview only */
    canvas {
      width: 350px;
      height: 200px;
      border: 1px solid #999;
      display: block;
      margin-bottom: 15px;
    }

    /* 1.2.3 */
    .controls input,
    .controls button {
      display: block;
      width: 320px;
      margin: 6px 0;
      padding: 6px;
    }
  </style>
</head>

<body>
  <!-- 1.3 -->

  <!-- 1.3.1 : PRINT SIZE (3.5 x 2 inch @ 300 DPI) -->
  <canvas id="card" width="1050" height="600"></canvas>

  <!-- 1.3.2 -->
  <div class="controls">
    <input id="name" value="John Doe">
    <input id="role" value="Software Engineer">

    <input id="phone" value="+91 90000 00000">
    <input id="email" value="john@email.com">
    <input id="website" value="www.company.com">

    <input id="company" value="COMPANY NAME">

    <input id="branch" value="Bangalore Branch">
    <input id="address" value="MG Road, Bangalore">

    <input id="c1" type="color" value="#ffffff">
    <input id="c2" type="color" value="#eaeaea">

    <button onclick="download()">Download PNG</button>
  </div>

  <!-- 1.4 -->
  <script>
    // 1.4.1
    const canvas = document.getElementById("card");
    const ctx = canvas.getContext("2d");

    // 1.4.2
    const g = id => document.getElementById(id);

    const nameEl = g("name");
    const roleEl = g("role");
    const phoneEl = g("phone");
    const emailEl = g("email");
    const websiteEl = g("website");
    const companyEl = g("company");
    const branchEl = g("branch");
    const addressEl = g("address");
    const c1El = g("c1");
    const c2El = g("c2");

    // 1.4.3
    [
      nameEl, roleEl, phoneEl, emailEl, websiteEl,
      companyEl, branchEl, addressEl, c1El, c2El
    ].forEach(el => el.addEventListener("input", draw));

    // 1.4.4
    function draw() {
      // 1.4.4.1 background
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, c1El.value);
      grad.addColorStop(1, c2El.value);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#000";

      // 1.4.4.2 top left
      ctx.textAlign = "left";
      ctx.font = "bold 48px Arial";
      ctx.fillText(nameEl.value, 60, 90);

      // 1.4.4.3 top right
      ctx.textAlign = "right";
      ctx.font = "36px Arial";
      ctx.fillText(roleEl.value, canvas.width - 60, 90);

      // 1.4.4.4 contact
      ctx.textAlign = "left";
      ctx.font = "32px Arial";
      ctx.fillText(phoneEl.value, 60, 160);
      ctx.fillText(emailEl.value, 60, 205);
      ctx.fillText(websiteEl.value, 60, 250);

      // 1.4.4.5 center company
      ctx.textAlign = "center";
      ctx.font = "bold 64px Arial";
      ctx.fillText(companyEl.value, canvas.width / 2, 360);

      // 1.4.4.6 bottom address
      ctx.font = "30px Arial";
      ctx.fillText(branchEl.value, canvas.width / 2, 500);
      ctx.fillText(addressEl.value, canvas.width / 2, 540);
    }

    // 1.4.5
    function download() {
      const a = document.createElement("a");
      a.download = "visiting-card-300dpi.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    // 1.4.6
    draw();
  </script>

</body>
<!-- 1.5 -->

</html>
