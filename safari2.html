<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Playground</title>

<!-- html2canvas CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 10px;
  background: #f5f5f5;
}

h3 {
  margin-bottom: 4px;
}

textarea {
  width: 100%;
  height: 120px;
  font-family: monospace;
  margin-bottom: 10px;
  padding: 8px;
  box-sizing: border-box;
}

button {
  padding: 10px 14px;
  margin: 5px 5px 10px 0;
  font-size: 14px;
  cursor: pointer;
}

iframe {
  width: 100%;
  height: 300px;
  border: 1px solid #ccc;
  background: #fff;
}

@media (min-width: 768px) {
  textarea { height: 150px; }
  iframe { height: 400px; }
}
</style>
</head>

<body>

<h3>HTML</h3>
<textarea id="html">
<h1>Hello Playground</h1>
<p>Edit HTML, CSS, JS</p>
</textarea>

<h3>CSS</h3>
<textarea id="css">
body { background: #eef; }
h1 { color: darkblue; }
</textarea>

<h3>JavaScript</h3>
<textarea id="js">
document.querySelector("p").onclick = () => {
  alert("Clicked!");
};
</textarea>

<button onclick="runCode()">Run</button>
<button onclick="downloadHTML()">Download HTML</button>
<button onclick="exportJPEG()">Export as JPEG</button>

<iframe id="preview"></iframe>

<script>
function buildContent() {
  const html = document.getElementById("html").value;
  const css  = document.getElementById("css").value;
  const js   = document.getElementById("js").value;

  return `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>${css}</style>
</head>
<body>
${html}
<script>${js}<\/script>
</body>
</html>
`;
}

function runCode() {
  document.getElementById("preview").srcdoc = buildContent();
}

function downloadHTML() {
  const blob = new Blob([buildContent()], { type: "text/html" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "index.html";
  link.click();
}

function exportJPEG() {
  const iframe = document.getElementById("preview");
  const doc = iframe.contentDocument || iframe.contentWindow.document;

  html2canvas(doc.body, { scale: 2 }).then(canvas => {
    const link = document.createElement("a");
    link.download = "preview.jpg";
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.click();
  });
}
</script>

</body>
</html>
