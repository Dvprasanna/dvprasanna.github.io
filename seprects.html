<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Non-Overlapping Rectangles</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:system-ui,sans-serif;
  text-align:center;
}
canvas{
  background:#000;
  border:1px solid #444;
  touch-action:none;
}
</style>
</head>

<body>
<h3>Non-Overlapping Rectangles (Stable)</h3>
<canvas id="c" width="360" height="500"></canvas>

<script>
/* =========================
   Non-Overlapping Rects
   Version: 1.1 (bug-fixed)
   ========================= */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let rects = [];
let drawing = false;
let sx = 0, sy = 0;
let current = null;

/* ---------- Geometry ---------- */

function norm(r){
  const x = Math.min(r.x, r.x + r.w);
  const y = Math.min(r.y, r.y + r.h);
  return { x, y, w: Math.abs(r.w), h: Math.abs(r.h) };
}

function overlap(a,b){
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

/* ---------- Core resolution ---------- */

function resolve(candidate){
  let r = norm(candidate);
  let changed = true;

  while (changed) {
    changed = false;

    for (let o0 of rects) {
      let o = norm(o0);
      if (!overlap(r, o)) continue;

      const dx1 = (o.x + o.w) - r.x;       // push right
      const dx2 = (r.x + r.w) - o.x;       // push left
      const dy1 = (o.y + o.h) - r.y;       // push down
      const dy2 = (r.y + r.h) - o.y;       // push up

      const min = Math.min(dx1, dx2, dy1, dy2);

      if (min === dx1) {
        r.x += dx1;
      } else if (min === dx2) {
        r.x -= dx2;
      } else if (min === dy1) {
        r.y += dy1;
      } else {
        r.y -= dy2;
      }

      changed = true;
      break;
    }
  }

  return r;
}

/* ---------- Drawing ---------- */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#0f0";
  for(let r of rects){
    ctx.strokeRect(r.x,r.y,r.w,r.h);
  }
  if(current){
    ctx.strokeStyle="#fff";
    ctx.strokeRect(current.x,current.y,current.w,current.h);
  }
}

/* ---------- Input ---------- */

function pos(e){
  const r=canvas.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return {x:p.clientX-r.left,y:p.clientY-r.top};
}

function start(e){
  e.preventDefault();
  const p=pos(e);
  drawing=true;
  sx=p.x; sy=p.y;
  current={x:sx,y:sy,w:0,h:0};
}

function move(e){
  if(!drawing) return;
  e.preventDefault();
  const p=pos(e);
  current.w=p.x-sx;
  current.h=p.y-sy;
  draw();
}

function end(){
  if(!drawing) return;
  drawing=false;

  const r=resolve(current);
  if(r.w>3 && r.h>3){
    rects.push(r);
  }
  current=null;
  draw();
}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);

canvas.addEventListener("touchstart",start,{passive:false});
canvas.addEventListener("touchmove",move,{passive:false});
canvas.addEventListener("touchend",end);

draw();
</script>
</body>
</html>
