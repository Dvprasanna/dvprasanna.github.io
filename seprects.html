<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Non-Overlapping Rectangles (Stable)</title>

<style>
html,body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:system-ui,sans-serif;
  text-align:center;
}
canvas{
  background:#000;
  border:1px solid #444;
  touch-action:none;
  margin:16px auto;
  display:block;
}
</style>
</head>

<body>
<h3>Non-Overlapping Rectangles (Stable)</h3>
<canvas id="c" width="360" height="520"></canvas>

<script>
/* =====================================
   Non-Overlapping Rectangles
   Version: 1.2.1 (loop-safe)
   ===================================== */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let rects = [];
let drawing = false;
let sx = 0, sy = 0;
let current = null;

/* ---------- Geometry ---------- */

function norm(r){
  const x = Math.min(r.x, r.x + r.w);
  const y = Math.min(r.y, r.y + r.h);
  return { x, y, w: Math.abs(r.w), h: Math.abs(r.h) };
}

function overlap(a,b){
  return (
    a.w > 0 && a.h > 0 &&
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

/* ---------- Core resolution (clamp, not push) ---------- */

function resolve(candidate){
  let r = norm(candidate);
  const intentX = Math.abs(candidate.w) >= Math.abs(candidate.h);

  let iterations = 0;
  const MAX = 20;

  let changed = true;

  while (changed && iterations < MAX) {
    iterations++;
    changed = false;

    for (const o0 of rects) {
      const o = norm(o0);
      if (!overlap(r, o)) continue;

      const before = { ...r };

      if (intentX) {
        if (candidate.w > 0) {
          r.w = Math.max(0, o.x - r.x);
        } else {
          const right = r.x + r.w;
          r.x = o.x + o.w;
          r.w = right - r.x;
        }
      } else {
        if (candidate.h > 0) {
          r.h = Math.max(0, o.y - r.y);
        } else {
          const bottom = r.y + r.h;
          r.y = o.y + o.h;
          r.h = bottom - r.y;
        }
      }

      // no change → stop resolving
      if (
        r.x === before.x &&
        r.y === before.y &&
        r.w === before.w &&
        r.h === before.h
      ) {
        return r;
      }

      changed = true;
      break;
    }
  }

  return r;
}

/* ---------- Drawing ---------- */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = "#0f0";
  for (const r of rects){
    ctx.strokeRect(r.x,r.y,r.w,r.h);
  }

  if (current){
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(current.x,current.y,current.w,current.h);
  }
}

/* ---------- Input ---------- */

function pos(e){
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x:p.clientX-r.left, y:p.clientY-r.top };
}

function start(e){
  e.preventDefault();
  const p = pos(e);
  drawing = true;
  sx = p.x; sy = p.y;
  current = { x:sx, y:sy, w:0, h:0 };
}

function move(e){
  if (!drawing) return;
  e.preventDefault();
  const p = pos(e);
  current.w = p.x - sx;
  current.h = p.y - sy;
  draw();
}

function end(){
  if (!drawing) return;
  drawing = false;

  const r = resolve(current);
  if (r.w > 3 && r.h > 3) rects.push(r);

  current = null;
  draw();
}

/* ---------- Events ---------- */

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("mouseup", end);

canvas.addEventListener("touchstart", start, {passive:false});
canvas.addEventListener("touchmove", move, {passive:false});
canvas.addEventListener("touchend", end);

draw();
</script>
</body>
</html>
