<script>
let data = JSON.parse(localStorage.getItem("financeData") || "[]");
let editIndex = null;

function addEntry() {
  const entry = {
    type: type.value,
    name: name.value,
    amount: amount.value,
    date: date.value
  };
  if (!entry.name || !entry.amount || !entry.date) return;

  if (editIndex !== null) {
    data[editIndex] = entry;
    editIndex = null;
  } else {
    data.push(entry);
  }

  localStorage.setItem("financeData", JSON.stringify(data));
  clearForm();
  render();
}

function clearForm() {
  name.value = amount.value = date.value = "";
  document.querySelector("button").innerText = "Add";
}

function editEntry(i) {
  const e = data[i];
  type.value = e.type;
  name.value = e.name;
  amount.value = e.amount;
  date.value = e.date;
  editIndex = i;
  document.querySelector("button").innerText = "Save";
}

function deleteEntry(i) {
  if (!confirm("Delete this entry?")) return;
  data.splice(i, 1);
  localStorage.setItem("financeData", JSON.stringify(data));
  render();
}

function getStatus(d) {
  const today = new Date();
  const due = new Date(d);
  const diff = Math.ceil((due - today) / 86400000);
  if (diff < 0) return ["Overdue", "status-overdue"];
  if (diff <= 5) return ["Urgent", "status-urgent"];
  return ["Normal", "status-normal"];
}

function render() {
  list.innerHTML = "";
  data.sort((a,b)=>new Date(a.date)-new Date(b.date));

  data.forEach((e, i) => {
    const [label, cls] = getStatus(e.date);
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `
      <div>
        <b>${e.name}</b><br>
        <small>${e.type} | ₹${e.amount} | ${e.date}</small>
      </div>
      <div>
        <span class="${cls}">${label}</span><br>
        <button onclick="editEntry(${i})">Edit</button>
        <button onclick="deleteEntry(${i})">Delete</button>
      </div>
    `;
    list.appendChild(div);
  });
}

render();
</script>
