<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Financial View</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system;
  background: #111;
  color: #eee;
}
header {
  padding: 10px;
  text-align: center;
  font-size: 16px;
  border-bottom: 1px solid #222;
}
.container { padding: 10px; }

.card {
  background: #151515;
  border: 1px solid #222;
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 8px;
}

input, select, button {
  width: 100%;
  padding: 6px;
  margin: 4px 0;
  background: #222;
  color: #fff;
  border: 1px solid #333;
  border-radius: 5px;
  font-size: 13px;
}

button { font-weight: 600; }

.filters {
  display: flex;
  gap: 6px;
}

.filters select {
  flex: 1;
}

.entry {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  padding: 6px 0;
  border-bottom: 1px solid #222;
  font-size: 13px;
}

.entry small { color: #888; }

.actions button {
  font-size: 11px;
  padding: 3px 6px;
  margin-top: 2px;
}

.status-normal { color: #9aa0a6; }
.status-urgent { color: #fbbc04; }
.status-overdue { color: #ea4335; }

#totalsBar small {
  display: block;
  text-align: center;
}
</style>
</head>

<body>
<header>My Financial View</header>

<div class="container">

<!-- ADD / EDIT -->
<div class="card">
  <select id="entryType">
    <option>Investment</option>
    <option>Income</option>
    <option>Loan</option>
  </select>
  <input id="entryName" placeholder="Name / Source">
  <input id="entryAmount" type="number" placeholder="Amount">
  <input id="entryDate" type="date">
  <button id="saveBtn">Add Entry</button>
</div>

<!-- FILTERS -->
<div class="card filters">
  <select id="typeFilter">
    <option value="All">All Types</option>
    <option>Investment</option>
    <option>Income</option>
    <option>Loan</option>
  </select>
  <select id="dateFilter">
    <option value="All">All Dates</option>
    <option value="Upcoming">Upcoming</option>
    <option value="Overdue">Overdue</option>
  </select>
</div>

<!-- TOTALS (FILTER AWARE) -->
<div class="card" id="totalsBar">
  <small>
    Invest: ₹<span id="tInv">0</span> |
    Income: ₹<span id="tInc">0</span> |
    Loans: ₹<span id="tLoan">0</span> |
    <b>Net: ₹<span id="tNet">0</span></b>
  </small>
</div>

<!-- LIST -->
<div class="card">
  <div id="list"></div>
</div>

<!-- EXPORT -->
<div class="card">
  <button id="pdfBtn">Export PDF</button>
</div>

</div>

<script>
/* ---------- STATE ---------- */
let data = JSON.parse(localStorage.getItem("financeData") || "[]");
let editIndex = null;

/* ---------- ELEMENTS ---------- */
const entryType   = document.getElementById("entryType");
const entryName   = document.getElementById("entryName");
const entryAmount = document.getElementById("entryAmount");
const entryDate   = document.getElementById("entryDate");
const saveBtn     = document.getElementById("saveBtn");
const list        = document.getElementById("list");
const pdfBtn      = document.getElementById("pdfBtn");
const typeFilter  = document.getElementById("typeFilter");
const dateFilter  = document.getElementById("dateFilter");

const tInv  = document.getElementById("tInv");
const tInc  = document.getElementById("tInc");
const tLoan = document.getElementById("tLoan");
const tNet  = document.getElementById("tNet");

/* ---------- EVENTS ---------- */
saveBtn.onclick = saveEntry;
pdfBtn.onclick = exportPDF;
typeFilter.onchange = render;
dateFilter.onchange = render;

/* ---------- LOGIC ---------- */
function saveEntry() {
  const entry = {
    type: entryType.value,
    name: entryName.value.trim(),
    amount: Number(entryAmount.value),
    date: entryDate.value
  };

  if (!entry.name || !entry.amount || !entry.date) {
    alert("Fill all fields");
    return;
  }

  if (editIndex !== null) {
    data[editIndex] = entry;
    editIndex = null;
    saveBtn.innerText = "Add Entry";
  } else {
    data.push(entry);
  }

  localStorage.setItem("financeData", JSON.stringify(data));
  entryName.value = entryAmount.value = entryDate.value = "";
  render();
}

function editEntry(i) {
  const e = data[i];
  entryType.value = e.type;
  entryName.value = e.name;
  entryAmount.value = e.amount;
  entryDate.value = e.date;
  editIndex = i;
  saveBtn.innerText = "Save";
}

function deleteEntry(i) {
  if (!confirm("Delete this entry?")) return;
  data.splice(i, 1);
  localStorage.setItem("financeData", JSON.stringify(data));
  render();
}

function getStatus(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(d);
  const diff = Math.ceil((due - today) / 86400000);
  if (diff < 0) return ["Overdue","status-overdue"];
  if (diff <= 5) return ["Urgent","status-urgent"];
  return ["Normal","status-normal"];
}

function render() {
  list.innerHTML = "";

  let totalInv = 0, totalInc = 0, totalLoan = 0;

  let filtered = data.filter(e => {
    if (typeFilter.value !== "All" && e.type !== typeFilter.value) return false;
    const [status] = getStatus(e.date);
    if (dateFilter.value === "Upcoming" && status === "Overdue") return false;
    if (dateFilter.value === "Overdue" && status !== "Overdue") return false;
    return true;
  });

  filtered.forEach(e => {
    if (e.type === "Investment") totalInv += e.amount;
    if (e.type === "Income") totalInc += e.amount;
    if (e.type === "Loan") totalLoan += e.amount;
  });

  tInv.textContent  = totalInv;
  tInc.textContent  = totalInc;
  tLoan.textContent = totalLoan;
  tNet.textContent  = totalInv + totalInc - totalLoan;

  if (filtered.length === 0) {
    list.innerHTML = "<small>No matching entries</small>";
    return;
  }

  filtered
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .forEach(e => {
      const [label, cls] = getStatus(e.date);
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = `
        <div>
          <b>${e.name}</b><br>
          <small>${e.type} | ₹${e.amount} | ${e.date}</small>
        </div>
        <div class="actions">
          <div class="${cls}">${label}</div>
          <button onclick="editEntry(${data.indexOf(e)})">✏️</button>
          <button onclick="deleteEntry(${data.indexOf(e)})">🗑</button>
        </div>
      `;
      list.appendChild(div);
    });
}

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  let y = 10;
  pdf.text("My Financial View", 10, y);
  y += 10;

  data.forEach(e => {
    pdf.text(`${e.type} | ${e.name} | ₹${e.amount} | ${e.date}`, 10, y);
    y += 8;
    if (y > 280) { pdf.addPage(); y = 10; }
  });

  pdf.save("financial-view.pdf");
}

render();
</script>

<!-- Version: 1.5 -->
</body>
</html>
