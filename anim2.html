<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Walking Stickman – Natural Arms</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#cfcfcf; }
canvas { display:block; margin:auto; background:#f7f7f7; }
</style>
</head>
<body>

<canvas id="c" width="520" height="300"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let t = 0;
const sin = Math.sin;
const cos = Math.cos;
const PI = Math.PI;

function line(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function joint(x,y,len,ang){
  return {
    x: x + len * cos(ang),
    y: y + len * sin(ang)
  };
}

function loop(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#111";

  t += 0.05;

  /* -------- TORSO (LINEAR) -------- */
  const baseX = 120 + t * 2;
  const baseY = 160 + sin(t) * 6;

  line(baseX, baseY-45, baseX, baseY+35);

  /* -------- HEAD -------- */
  ctx.beginPath();
  ctx.arc(baseX, baseY-60, 10, 0, PI*2);
  ctx.stroke();

  /* -------- ARM MOTION (FIXED) -------- */
  const armBase = PI / 2;          // downwards
  const armSwing = sin(t) * 0.5;   // forward/back
  const elbowBend = sin(t + PI/2) * 0.6;

  // LEFT ARM (forward when right leg forward)
  let shoulderL = { x: baseX, y: baseY-30 };
  let elbowL = joint(
    shoulderL.x,
    shoulderL.y,
    30,
    armBase + armSwing
  );
  let handL = joint(
    elbowL.x,
    elbowL.y,
    25,
    armBase + armSwing - elbowBend
  );

  line(shoulderL.x, shoulderL.y, elbowL.x, elbowL.y);
  line(elbowL.x, elbowL.y, handL.x, handL.y);

  // RIGHT ARM (opposite phase)
  let shoulderR = { x: baseX, y: baseY-30 };
  let elbowR = joint(
    shoulderR.x,
    shoulderR.y,
    30,
    armBase - armSwing
  );
  let handR = joint(
    elbowR.x,
    elbowR.y,
    25,
    armBase - armSwing + elbowBend
  );

  line(shoulderR.x, shoulderR.y, elbowR.x, elbowR.y);
  line(elbowR.x, elbowR.y, handR.x, handR.y);

  /* -------- LEG MOTION (ALREADY OK) -------- */
  const legSwing = sin(t) * 0.9;
  const kneeBend = sin(t + PI/2) * 0.7;

  // LEFT LEG
  let hipL = { x: baseX, y: baseY+35 };
  let kneeL = joint(hipL.x, hipL.y, 35, PI/2 + legSwing);
  let footL = joint(kneeL.x, kneeL.y, 35, PI/2 + legSwing + kneeBend);

  line(hipL.x, hipL.y, kneeL.x, kneeL.y);
  line(kneeL.x, kneeL.y, footL.x, footL.y);

  // RIGHT LEG
  let hipR = { x: baseX, y: baseY+35 };
  let kneeR = joint(hipR.x, hipR.y, 35, PI/2 - legSwing);
  let footR = joint(kneeR.x, kneeR.y, 35, PI/2 - legSwing - kneeBend);

  line(hipR.x, hipR.y, kneeR.x, kneeR.y);
  line(kneeR.x, kneeR.y, footR.x, footR.y);

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
