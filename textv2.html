<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Table Maker — Full + Text Size & HR & Align</title>
<style>
  :root{--a:#0366d6}
  body{font-family:system-ui;margin:18px;color:#111;background:#fff}
  h1{font-size:18px;margin:0 0 10px}
  .c{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  button,.d{padding:8px 12px;border-radius:6px;border:1px solid #bbb;background:#f7f8fa;cursor:pointer}
  button.p{background:var(--a);color:#fff;border-color:var(--a)}
  .m{position:relative;display:inline-block}
  .dd{display:none;position:absolute;background:#fff;min-width:160px;box-shadow:0 6px 18px rgba(0,0,0,.12);border-radius:6px;border:1px solid #eee;z-index:1000;padding:6px}
  .dd button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;border:none;padding:8px 10px;border-radius:6px}
  .dd button:hover{background:#f3f6fb}
  #e{min-height:300px;border:1px dashed #ccc;padding:12px;border-radius:8px;outline:none}
  #o{width:100%;height:140px;margin-top:10px;padding:8px;box-sizing:border-box;font-family:monospace}
  table.generated{border-collapse:collapse;margin:10px 0}
  td{border:1px solid #999;padding:6px 8px;min-width:40px}
  table.border-light td{border-width:1px}
  table.border-medium td{border-width:3px}
  table.border-high td{border-width:6px}
  hr{margin:16px 0;border:0;border-top:2px solid #ddd}
  .s{width:1px;height:28px;background:#e6e6e6;margin:0 6px}
  button[disabled]{opacity:.6;cursor:not-allowed}
</style>
</head>
<body>

<h1>Table Maker — Full + Tools</h1>

<div class="c">
  <button id="mt" class="p">Make Table</button>
  <button id="mc">Make Columns</button>
  <button id="s3">Split 3</button>

  <div class="m"><button class="d">Text</button>
    <div class="dd">
      <button data-a="title">Title (H1)</button>
      <button data-a="subtitle">Subtitle (H2)</button>
      <button data-a="body">Body (P)</button>
      <button data-a="normal">Normal</button>
      <hr>
      <button data-a="bold">Bold</button>
      <button data-a="center">Center Text</button>
    </div>
  </div>

  <div class="m"><button class="d">Insert</button>
    <div class="dd">
      <button data-a="hr">Horizontal Line (HR)</button>
    </div>
  </div>

  <div class="m"><button class="d">Table</button>
    <div class="dd">
      <div style="font-weight:600;padding:6px 10px">Border</div>
      <button data-a="bl">Light</button>
      <button data-a="bm">Medium</button>
      <button data-a="bh">High</button>
      <hr>
      <button data-a="al">Align Left</button>
      <button data-a="ac">Align Center</button>
      <button data-a="ar">Align Right</button>
      <hr>
      <button data-a="merge">Merge Cells</button>
    </div>
  </div>

  <span class="s"></span>
  <button id="sa">Select All</button>
  <span class="s></span>
  <button id="u">Undo</button>
  <button id="r">Redo</button>
  <span class="s"></span>
  <button id="ex">Export CSV</button>
  <button id="cp">Copy CSV</button>
  <button id="cl">Clear</button>
</div>

<div id="e" contenteditable spellcheck="false">
Paste text → select lines → Make Table
</div>

<textarea id="o" placeholder="CSV appears here"></textarea>

<script>
const e = document.getElementById('e'), o = document.getElementById('o');
let h = [], hi = -1, block = false;
const push = () => { if(block)return; const s=e.innerHTML; if(hi>=0&&h[hi]===s)return; h=h.slice(0,hi+1); h.push(s); if(h.length>60)h.shift(); hi=h.length-1; up(); };
const undo = ()=>{ if(hi<=0)return; block=true; hi--; e.innerHTML=h[hi]; block=false; up(); focusEnd(); };
const redo = ()=>{ if(hi>=h.length-1)return; block=true; hi++; e.innerHTML=h[hi]; block=false; up(); focusEnd(); };
const up = ()=>{ document.getElementById('u').disabled=hi<=0; document.getElementById('r').disabled=hi>=h.length-1; };
const focusEnd = ()=>{ const r=document.createRange(); r.selectNodeContents(e); r.collapse(false); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); e.focus(); };
push(); e.addEventListener('input',()=>setTimeout(push,400));

document.addEventListener('keydown',ev=>{
  const c = navigator.platform.includes('Mac') ? ev.metaKey : ev.ctrlKey;
  if(c&&ev.key==='z'&&!ev.shiftKey){ev.preventDefault();undo();}
  if(c&&ev.key==='y'||c&&ev.shiftKey&&ev.key==='z'){ev.preventDefault();redo();}
});

const sel = ()=>window.getSelection();
 esc = s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'})[c]);
 csv = v=>(v=String(v), /["\n,]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v);

const td = ()=> { const n=sel().anchorNode; return n&&(n.nodeType===3?n.parentNode:n).closest('td'); };
const table = ()=> { const n=sel().anchorNode; return n&&(n.nodeType===3?n.parentNode:n).closest('table'); };

// Buttons
document.getElementById('mt').onclick = () => {
  const lines = sel().toString().trim().split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return alert('Select lines');
  push();
  const t = document.createElement('table'); t.className='generated border-light';
  lines.forEach(l=>{ const r=t.insertRow(); r.insertCell().innerHTML=esc(l); });
  sel().getRangeAt(0).insertNode(t);
  push(); focusEnd();
};

document.getElementById('mc').onclick = () => {
  const r = sel().getRangeAt(0), t = td(); if(!t)return alert('Inside cell');
  push();
  const before = document.createRange(); before.selectNodeContents(t); before.setEnd(r.startContainer,r.startOffset);
  const after = document.createRange(); after.selectNodeContents(t); after.setStart(r.endContainer,r.endOffset);
  const selText = r.toString(), left = selText||before.toString(), right = selText ? (before+after).toString() : after.toString();
  t.innerHTML = esc(left.trim());
  const n = t.parentNode.insertCell(t.cellIndex+1);
  n.innerHTML = esc(right.trim());
  push(); focusEnd();
};

document.getElementById('s3').onclick = () => {
  const r = sel().getRangeAt(0), t = td(); if(!t)return alert('Inside cell');
  const s = r.toString().trim(); if(!s)return alert('Select text');
  push();
  const before = document.createRange(); before.selectNodeContents(t); before.setEnd(r.startContainer,r.startOffset);
  const after = document.createRange(); after.selectNodeContents(t); after.setStart(r.endContainer,r.endOffset);
  t.innerHTML = esc(s);
  const m = t.parentNode.insertCell(t.cellIndex+1); m.innerHTML = esc(after.toString().trim());
  const l = m.parentNode.insertCell(m.cellIndex+1); l.innerHTML = esc(before.toString().trim());
  push(); focusEnd();
};

document.getElementById('sa').onclick = ()=>{ const r=document.createRange(); r.selectNodeContents(e); sel().removeAllRanges(); sel().addRange(r); };
document.getElementById('u').onclick = undo;
document.getElementById('r').onclick = redo;
document.getElementById('cl').onclick = ()=>{ push(); e.innerHTML=''; o.value=''; push(); e.focus(); };

document.getElementById('ex').onclick = () => {
  const rows = [];
  e.querySelectorAll('table.generated tr').forEach(tr=>rows.push([...tr.cells].map(c=>csv(c.innerText)).join(',')));
  if(!rows.length) e.innerText.trim().split('\n').filter(Boolean).forEach(l=>rows.push(csv(l)));
  o.value = rows.join('\n');
};
document.getElementById('cp').onclick = ()=>navigator.clipboard.writeText(o.value).then(()=>alert('Copied!'));

document.querySelectorAll('.dd button[data-a]').forEach(b=>b.onclick=()=>{ const a=b.dataset.a;
  const t = table();
  push();
  if(a==='title') document.execCommand('formatBlock',false,'<h1>');
  if(a==='subtitle') document.execCommand('formatBlock',false,'<h2>');
  if(a==='body') document.execCommand('formatBlock',false,'<p>');
  if(a==='normal') document.execCommand('formatBlock',false,'<div>');
  if(a==='bold') document.execCommand('bold');
  if(a==='center') { if(td()) td().style.textAlign='center'; else document.execCommand('justifyCenter'); }
  if(a==='hr') document.execCommand('insertHorizontalRule');
  if(a==='bl') t?.classList.replace(/border-\w+/,'border-light');
  if(a==='bm') t?.classList.replace(/border-\w+/,'border-medium');
  if(a==='bh') t?.classList.replace(/border-\w+/,'border-high');
  if(a==='al') { if(t){t.style.margin='10px 0';t.style.marginLeft='0';t.style.marginRight='auto';} }
  if(a==='ac') { if(t){t.style.margin='10px auto';t.style.display='table';} }
  if(a==='ar') { if(t){t.style.margin='10px 0';t.style.marginLeft='auto';t.style.marginRight='0';} }
  if(a==='merge'){
    const r=sel().getRangeAt(0), tr=td()?.closest('tr');
    if(!tr)return alert('Select cells in same row');
    const cells=[...tr.cells].filter(c=>r.intersectsNode(c));
    if(cells.length<2||!cells.every((c,i)=>i===0||c.previousElementSibling===cells[i-1]))return alert('Select adjacent cells');
    cells[0].innerHTML=esc(cells.map(c=>c.innerText.trim()).filter(Boolean).join(' '));
    cells[0].colSpan=cells.length;
    cells.slice(1).forEach(c=>c.remove());
  }
  push(); e.focus();
});

// Dropdown toggle
document.querySelectorAll('.m').forEach(m=>{
  const btn=m.querySelector('.d'), dd=m.querySelector('.dd');
  btn.onclick=()=>{ document.querySelectorAll('.dd').forEach(d=>d.style.display='none'); dd.style.display=dd.style.display==='block'?'none':'block'; };
});
document.addEventListener('click',e=>{ if(!e.target.closest('.m')) document.querySelectorAll('.dd').forEach(d=>d.style.display='none'); });

// Keep focus
document.querySelectorAll('button').forEach(b=>b.addEventListener('mouseup',()=>setTimeout(()=>e.focus(),10)));
</script>
</body>
</html>
