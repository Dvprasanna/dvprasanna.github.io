<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:system-ui, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h2{ margin:10px 0 6px; }

#controls{
  text-align:center;
  margin:6px;
}

#puzzle{
  display:grid;
  grid-template-columns:repeat(3, 100px);
  grid-template-rows:repeat(4, 75px);
  gap:6px;
  margin:10px 0;
  touch-action:manipulation;
}

.tile{
  background:#eee;
  color:#000;
  font-size:26px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  box-shadow:inset 0 0 0 2px #222;
  cursor:pointer;
  user-select:none;
  background-size:300px 300px;
}

.blank{
  background:none !important;
  box-shadow:none;
  cursor:default;
}

button,input{
  margin:4px;
  padding:6px 12px;
  font-size:14px;
}
</style>
</head>

<body>

<h2>Sliding Puzzle (3 × 4)</h2>

<div id="controls">
  <input type="file" accept="image/*" onchange="loadImage(event)">
  <br>
  <button onclick="shuffle()">Shuffle</button>
  <button onclick="resetPuzzle()">Reset</button>
  <button onclick="toggleMusic()">Play / Pause Music</button>
</div>

<div id="puzzle"></div>

<script>
/* =========================================================
   PROJECT INFO
   ---------------------------------------------------------
   Sliding Puzzle (3×4)
   Version: v1.3.0
   Created by: YOUR NAME HERE
   Contact / Link: OPTIONAL
   ========================================================= */

/* ===== CONFIG ===== */
const COLS = 3;
const ROWS = 4;
const SIZE = COLS * ROWS;

/* ===== STATE ===== */
let tiles = [...Array(SIZE - 1).keys()].map(i => i + 1);
tiles.push(0);

let imgURL = null;
let bgMusic = null;

const puzzle = document.getElementById("puzzle");

/* ===== INIT ===== */
render();

/* ===== RENDER ===== */
function render(){
  puzzle.innerHTML = "";
  tiles.forEach((val, i)=>{
    const div = document.createElement("div");
    div.className = "tile" + (val === 0 ? " blank" : "");

    if(val !== 0){
      if(imgURL){
        const x = (val - 1) % COLS;
        const y = Math.floor((val - 1) / COLS);
        div.style.backgroundImage = `url(${imgURL})`;
        div.style.backgroundPosition =
          `${-x * 100}px ${-y * 75}px`;
      }else{
        div.textContent = val;
      }
      div.onclick = () => tryMove(i);
    }
    puzzle.appendChild(div);
  });
}

/* ===== MOVE ===== */
function tryMove(i){
  initMusic(); // unlock audio on first interaction

  const blank = tiles.indexOf(0);
  const x1 = i % COLS, y1 = Math.floor(i / COLS);
  const x2 = blank % COLS, y2 = Math.floor(blank / COLS);

  if(Math.abs(x1 - x2) + Math.abs(y1 - y2) === 1){
    [tiles[i], tiles[blank]] = [tiles[blank], tiles[i]];
    render();
  }
}

/* ===== IMAGE LOAD ===== */
function loadImage(e){
  const file = e.target.files[0];
  if(!file) return;
  imgURL = URL.createObjectURL(file);
  render();
}

/* ===== MUSIC (iOS SAFE) ===== */
function initMusic(){
  if(bgMusic) return;

  bgMusic = new Audio(
    "https://cdn.pixabay.com/download/audio/2022/03/15/audio_9c1e8b6f2d.mp3"
  );
  bgMusic.loop = true;
  bgMusic.volume = 0.25;
  bgMusic.play().catch(()=>{});
}

function toggleMusic(){
  initMusic();
  if(!bgMusic) return;

  if(bgMusic.paused){
    bgMusic.play();
  }else{
    bgMusic.pause();
  }
}

/* ===== SHUFFLE ===== */
function shuffle(){
  do{
    tiles = [...Array(SIZE).keys()];
    for(let i = SIZE - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
  } while(!isSolvable());
  render();
}

/* ===== RESET ===== */
function resetPuzzle(){
  tiles = [...Array(SIZE - 1).keys()].map(i => i + 1);
  tiles.push(0);
  render();
}

/* ===== SOLVABLE CHECK ===== */
function isSolvable(){
  let inv = 0;
  for(let i = 0; i < tiles.length; i++){
    for(let j = i + 1; j < tiles.length; j++){
      if(tiles[i] && tiles[j] && tiles[i] > tiles[j]) inv++;
    }
  }
  const blankRowFromBottom = ROWS - Math.floor(tiles.indexOf(0) / COLS);
  return (blankRowFromBottom % 2 === 0) !== (inv % 2 === 0);
}
</script>

</body>
</html>
