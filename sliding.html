<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle – Image</title>

<style>
  body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h2{ margin:10px 0 6px; }

  #controls{
    margin:8px;
    text-align:center;
  }

  #puzzle{
    display:grid;
    grid-template-columns:repeat(3, 100px);
    grid-template-rows:repeat(4, 75px);
    gap:6px;
    margin:10px 0;
    touch-action:manipulation;
  }

  .tile{
    background:#eee;
    color:#000;
    font-size:26px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    box-shadow:inset 0 0 0 2px #222;
    cursor:pointer;
    user-select:none;
    background-size:300px 300px;
  }

  .blank{
    background:none !important;
    box-shadow:none;
    cursor:default;
  }

  button,input{
    margin:4px;
    padding:6px 12px;
    font-size:14px;
  }
</style>
</head>

<body>

<h2>Sliding Puzzle (3 × 4)</h2>

<div id="controls">
  <input type="file" accept="image/*" onchange="loadImage(event)">
  <br>
  <button onclick="shuffle()">Shuffle</button>
  <button onclick="resetPuzzle()">Reset</button>
</div>

<div id="puzzle"></div>

<script>
/* ===== CONFIG ===== */
const COLS = 3;
const ROWS = 4;
const SIZE = COLS * ROWS;

/* ===== STATE ===== */
let tiles = [...Array(SIZE - 1).keys()].map(i => i + 1);
tiles.push(0);
let imgURL = null;

const puzzle = document.getElementById("puzzle");

/* ===== INIT ===== */
render();

/* ===== RENDER ===== */
function render(){
  puzzle.innerHTML = "";
  tiles.forEach((val, i)=>{
    const div = document.createElement("div");
    div.className = "tile" + (val === 0 ? " blank" : "");
    
    if(val !== 0){
      if(imgURL){
        const x = (val - 1) % COLS;
        const y = Math.floor((val - 1) / COLS);
        div.style.backgroundImage = `url(${imgURL})`;
        div.style.backgroundPosition =
          `${-x * 100}px ${-y * 75}px`;
      }else{
        div.textContent = val;
      }
      div.onclick = () => tryMove(i);
    }
    puzzle.appendChild(div);
  });
}

/* ===== MOVE LOGIC ===== */
function tryMove(i){
  const blank = tiles.indexOf(0);
  const x1 = i % COLS, y1 = Math.floor(i / COLS);
  const x2 = blank % COLS, y2 = Math.floor(blank / COLS);

  if(Math.abs(x1 - x2) + Math.abs(y1 - y2) === 1){
    [tiles[i], tiles[blank]] = [tiles[blank], tiles[i]];
    render();
  }
}

/* ===== IMAGE LOAD ===== */
function loadImage(e){
  const file = e.target.files[0];
  if(!file) return;
  imgURL = URL.createObjectURL(file);
  render();
}

/* ===== SHUFFLE ===== */
function shuffle(){
  do{
    tiles = [...Array(SIZE).keys()];
    for(let i = SIZE - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
  } while(!isSolvable());
  render();
}

/* ===== RESET ===== */
function resetPuzzle(){
  tiles = [...Array(SIZE - 1).keys()].map(i => i + 1);
  tiles.push(0);
  render();
}

/* ===== SOLVABILITY ===== */
function isSolvable(){
  let inv = 0;
  for(let i = 0; i < tiles.length; i++){
    for(let j = i + 1; j < tiles.length; j++){
      if(tiles[i] && tiles[j] && tiles[i] > tiles[j]) inv++;
    }
  }
  const blankRowFromBottom = ROWS - Math.floor(tiles.indexOf(0) / COLS);
  return (blankRowFromBottom % 2 === 0) !== (inv % 2 === 0);
}
</script>

<!-- Version: v1.1.0 -->
</body>
</html>
