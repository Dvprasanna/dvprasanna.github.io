<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Viewer</title>

<style>

body{
margin:0;
font-family:Arial;
}

#menu{
background:#222;
color:white;
padding:8px;
display:flex;
gap:10px;
}

button{
padding:6px 10px;
}

#tabs{
display:flex;
background:#eee;
}

.tab{
flex:1;
text-align:center;
padding:10px;
cursor:pointer;
}

.active{
background:#ccc;
}

#editor{
width:100%;
height:calc(100vh - 80px);
border:none;
padding:10px;
font-family:monospace;
font-size:16px;
}

#viewer{
width:100%;
height:calc(100vh - 80px);
border:none;
display:none;
}

</style>
</head>

<body>

<div id="menu">
<button onclick="zoomIn()">Zoom +</button>
<button onclick="zoomOut()">Zoom -</button>
<button onclick="exportPDF()">Export PDF</button>
</div>

<div id="tabs">
<div id="t1" class="tab active" onclick="showHTML()">HTML</div>
<div id="t2" class="tab" onclick="showOutput()">Output</div>
</div>

<textarea id="editor"></textarea>

<iframe id="viewer"></iframe>

<script>

let zoom = 1;

let editor = document.getElementById("editor");
let viewer = document.getElementById("viewer");


// LOAD SAVED CODE
window.onload = function(){

let saved = localStorage.getItem("html_viewer_code");

if(saved){
editor.value = saved;
}else{
editor.value = "<h1>Hello</h1>\n<p>Paste your HTML here</p>";
}

}


// AUTO SAVE
editor.addEventListener("input",function(){

localStorage.setItem("html_viewer_code",editor.value);

});



function showHTML(){

editor.style.display="block";
viewer.style.display="none";

t1.classList.add("active");
t2.classList.remove("active");

}



function showOutput(){

let code = editor.value;

viewer.srcdoc = code;

viewer.onload = function(){

try{
viewer.contentWindow.document.body.style.zoom = zoom;
}catch(e){}

}

editor.style.display="none";
viewer.style.display="block";

t2.classList.add("active");
t1.classList.remove("active");

}



function zoomIn(){

zoom += 0.1;

try{
viewer.contentWindow.document.body.style.zoom = zoom;
}catch(e){}

}



function zoomOut(){

zoom -= 0.1;

try{
viewer.contentWindow.document.body.style.zoom = zoom;
}catch(e){}

}



function exportPDF(){

window.print();

}

</script>

</body>
</html>
