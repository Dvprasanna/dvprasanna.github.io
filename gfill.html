<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Fill Drawing Canvas</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #f5f5f5;
        font-family: system-ui, -apple-system;
    }

    #toolbar {
        position: fixed;
        top: 10px;
        left: 10px;
        background: #ffffff;
        padding: 8px 12px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        z-index: 10;
    }

    #toolbar input {
        width: 60px;
    }

    canvas {
        display: block;
    }
</style>
</head>
<body>

<div id="toolbar">
    Grid size:
    <input type="number" id="gridSize" value="20" min="5" max="100">
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const gridInput = document.getElementById("gridSize");

let gridSize = parseInt(gridInput.value);
let isDrawing = false;
let filledCells = new Set();

/* ---------- Resize Canvas ---------- */
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ---------- Grid Helpers ---------- */
function cellKey(x, y) {
    return x + "," + y;
}

function drawGrid() {
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 1;

    for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}

function drawFilledCells() {
    ctx.fillStyle = "#222";
    filledCells.forEach(key => {
        const [x, y] = key.split(",").map(Number);
        ctx.fillRect(x, y, gridSize, gridSize);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawFilledCells();
}

/* ---------- Drawing Logic ---------- */
function fillCell(mouseX, mouseY) {
    const x = Math.floor(mouseX / gridSize) * gridSize;
    const y = Math.floor(mouseY / gridSize) * gridSize;
    filledCells.add(cellKey(x, y));
    draw();
}

canvas.addEventListener("mousedown", e => {
    isDrawing = true;
    fillCell(e.offsetX, e.offsetY);
});

canvas.addEventListener("mousemove", e => {
    if (isDrawing) {
        fillCell(e.offsetX, e.offsetY);
    }
});

canvas.addEventListener("mouseup", () => isDrawing = false);
canvas.addEventListener("mouseleave", () => isDrawing = false);

/* ---------- Grid Size Change ---------- */
gridInput.addEventListener("change", () => {
    gridSize = parseInt(gridInput.value);
    filledCells.clear();
    draw();
});
</script>

</body>
</html>
