<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rotated Grid Drawing</title>
<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f4f4f4;
    font-family: system-ui;
}
#panel {
    position: fixed;
    top: 10px;
    left: 10px;
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    z-index: 10;
}
canvas {
    display: block;
}
</style>
</head>
<body>

<div id="panel">
    Grid: <input id="grid" type="number" value="30" min="5"><br>
    Angle°: <input id="angle" type="number" value="0">
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const gridInput = document.getElementById("grid");
const angleInput = document.getElementById("angle");

let gridSize = 30;
let angleDeg = 0;
let drawing = false;
const filled = new Set();

/* ---------- Canvas ---------- */
function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    draw();
}
window.onresize = resize;
resize();

/* ---------- Math ---------- */
function rotate(x, y, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: x * c - y * s, y: x * s + y * c };
}

function unrotate(x, y, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: x * c + y * s, y: -x * s + y * c };
}

/* ---------- Drawing ---------- */
function drawGrid() {
    const a = angleDeg * Math.PI / 180;
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 1;

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(a);
    ctx.translate(-canvas.width / 2, -canvas.height / 2);

    for (let x = -canvas.width; x < canvas.width * 2; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, -canvas.height);
        ctx.lineTo(x, canvas.height * 2);
        ctx.stroke();
    }

    for (let y = -canvas.height; y < canvas.height * 2; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(-canvas.width, y);
        ctx.lineTo(canvas.width * 2, y);
        ctx.stroke();
    }

    ctx.restore();
}

function drawFilled() {
    const a = angleDeg * Math.PI / 180;

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(a);
    ctx.translate(-canvas.width / 2, -canvas.height / 2);

    ctx.fillStyle = "#222";
    for (let k of filled) {
        const [x, y] = k.split(",").map(Number);
        ctx.fillRect(x, y, gridSize, gridSize);
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    drawFilled();
}

/* ---------- Input ---------- */
function snapAndFill(mx, my) {
    const a = -angleDeg * Math.PI / 180;

    // rotate mouse into grid space
    const cx = mx - canvas.width / 2;
    const cy = my - canvas.height / 2;
    const r = rotate(cx, cy, a);

    const gx = Math.floor((r.x + canvas.width / 2) / gridSize) * gridSize;
    const gy = Math.floor((r.y + canvas.height / 2) / gridSize) * gridSize;

    filled.add(gx + "," + gy);
    draw();
}

canvas.onmousedown = e => {
    drawing = true;
    snapAndFill(e.offsetX, e.offsetY);
};
canvas.onmousemove = e => drawing && snapAndFill(e.offsetX, e.offsetY);
canvas.onmouseup = () => drawing = false;
canvas.onmouseleave = () => drawing = false;

/* ---------- Controls ---------- */
gridInput.onchange = () => {
    gridSize = +gridInput.value;
    filled.clear();
    draw();
};

angleInput.oninput = () => {
    angleDeg = +angleInput.value;
    draw();
};
</script>

</body>
</html>
