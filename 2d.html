<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rect Drawer</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  font-family:monospace;
  color:#0f0;
  overflow:hidden;
}
#canvas{
  display:block;
  background:#000;
}
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:44px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 8px;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="bar">
  <span>&gt;</span>
  <input id="cmd" autocomplete="off">
</div>

<script>
/* ================= VIEWPORT (iPhone SAFE) ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function viewportHeight(){
  return window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;
}

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = viewportHeight() - 44;
  draw();
}

window.addEventListener("resize", resize);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", resize);
}
resize();

/* ================= STATE ================= */
let cursor = {x:0,y:0};
let lines = [];

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();

  /* center + cartesian */
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(1,-1);

  /* axes */
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(-2000,0); ctx.lineTo(2000,0);
  ctx.moveTo(0,-2000); ctx.lineTo(0,2000);
  ctx.stroke();

  /* lines */
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  /* cursor */
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ================= COMMANDS ================= */
function exec(cmd){
  const p = cmd.trim().split(/\s+/);
  if(p.length<2) return;

  const n = Number(p[1]);
  if(isNaN(n)) return;

  let nx = cursor.x;
  let ny = cursor.y;

  if(p[0]==="r") nx += n;
  if(p[0]==="l") nx -= n;
  if(p[0]==="u") ny += n;
  if(p[0]==="d") ny -= n;

  lines.push({x1:cursor.x,y1:cursor.y,x2:nx,y2:ny});
  cursor = {x:nx,y:ny};
  draw();
}

/* ================= INPUT ================= */
const input = document.getElementById("cmd");
input.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    exec(input.value);
    input.value="";
  }
});

input.focus();
</script>

</body>
</html>
