<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMD Draw</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#0b0b0b;
  font-family:-apple-system, BlinkMacSystemFont, monospace;
  color:#9aff9a;
}

/* ===== LAYOUT ===== */
#app{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ===== CANVAS AREA ===== */
#viewport{
  flex:0 0 55%;
  overflow:auto;
  background:#000;
}

#canvas{
  width:800px;
  height:800px;
  display:block;
  margin:auto;
  background:#000;
}

/* ===== COMMAND AREA ===== */
#panel{
  flex:1;
  padding:10px;
  background:#0f0f0f;
}

/* DISPLAY */
#display{
  height:32px;
  line-height:32px;
  padding:0 10px;
  margin-bottom:10px;
  background:#000;
  border-radius:8px;
  overflow:hidden;
  white-space:nowrap;
}

/* KEYBOARD */
#keys{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.key{
  background:#151515;
  border-radius:10px;
  text-align:center;
  padding:14px 0;
  font-size:16px;
  user-select:none;
}
.key:active{
  background:#2a2a2a;
}
.key.action{
  background:#1f3f1f;
}
.key.run{
  background:#2a6f2a;
}
</style>
</head>

<body>

<div id="app">

  <div id="viewport">
    <canvas id="canvas" width="800" height="800"></canvas>
  </div>

  <div id="panel">
    <div id="display">READY</div>

    <div id="keys">
      <div class="key">r</div>
      <div class="key">l</div>
      <div class="key">u</div>
      <div class="key">d</div>
      <div class="key action">CLR</div>
      <div class="key run">RUN</div>

      <div class="key">100</div>
      <div class="key">200</div>
      <div class="key">300</div>
      <div class="key">400</div>
      <div class="key action">DEL</div>
      <div class="key">↵</div>
    </div>
  </div>

</div>

<script>
/* ===== CANVAS ===== */
const ctx = canvas.getContext("2d");

/* ===== STATE ===== */
let cursor = {x:0,y:0};
let lines = [];
let buffer = "";

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,800,800);

  ctx.save();
  ctx.translate(0,800);
  ctx.scale(1,-1);

  ctx.strokeStyle="#333";
  ctx.strokeRect(0,0,800,800);

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  lines.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}
draw();

/* ===== EXEC ONE COMMAND ===== */
function exec(cmd){
  cmd = cmd.trim();
  if(!cmd) return;

  const [c,nStr] = cmd.split(/\s+/);
  const n = Number(nStr);
  if(!c || isNaN(n)) return;

  let nx = cursor.x;
  let ny = cursor.y;

  if(c==="r") nx+=n;
  if(c==="l") nx-=n;
  if(c==="u") ny+=n;
  if(c==="d") ny-=n;

  lines.push({x1:cursor.x,y1:cursor.y,x2:nx,y2:ny});
  cursor={x:nx,y:ny};
}

/* ===== DISPLAY ===== */
function updateDisplay(){
  const last = buffer.split("\n").filter(Boolean).slice(-1)[0];
  display.textContent = last || "READY";
}

/* ===== KEY HANDLER ===== */
document.querySelectorAll(".key").forEach(k=>{
  k.onclick = ()=>{
    const v = k.textContent;

    if(v==="RUN"){
      buffer.split("\n").forEach(exec);
      buffer="";
      draw();
    }
    else if(v==="CLR"){
      buffer="";
      updateDisplay();
    }
    else if(v==="DEL"){
      buffer = buffer.slice(0,-1);
      updateDisplay();
    }
    else if(v==="↵"){
      buffer += "\n";
      updateDisplay();
    }
    else{
      buffer += (buffer.endsWith("\n") || buffer==="" ? v : " "+v);
      updateDisplay();
    }
  };
});
</script>

</body>
</html>
