<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CMD Canvas</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
  overflow:hidden;
}

/* 🔴 RED = viewport / layout boundary */
#canvas-wrap{
  position:relative;
  width:100%;
  height:100%;
  box-sizing:border-box;
  border:2px solid red;
}

/* 🟢 GREEN = actual drawable canvas */
#canvas{
  display:block;
  background:#000;
  width:100%;
  height:100%;
  box-sizing:border-box;
  border:2px solid lime;
  touch-action:none; /* required for pinch */
}

/* COMMAND BAR */
#bar{
  position:fixed;
  bottom:0; left:0; right:0;
  height:64px;
  background:#111;
  display:flex;
  gap:6px;
  padding:6px;
  box-sizing:border-box;
}
#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}
#run{
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px 12px;
}
</style>
</head>

<body>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div id="bar">
  <input id="cmd" placeholder="r 600">
  <button id="run">RUN</button>
</div>

<script>
/* ================= VIEWPORT (iPhone SAFE) ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function viewportHeight(){
  return window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;
}

function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = viewportHeight() - 64;
  draw();
}

window.addEventListener("resize", resize);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", resize);
}
resize();

/* ================= STATE ================= */
let cursor = { x:0, y:0 };
let lines  = [];

/* VIEW (pinch / pan only) */
let view = {
  scale: 1,
  offsetX: 0,
  offsetY: 0
};

/* ================= PERSISTENCE ================= */
const STORAGE_KEY = "cmd-canvas-state-v1";

function saveState(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({ lines, cursor, view })
  );
}

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  try{
    const s = JSON.parse(raw);
    lines  = s.lines  || [];
    cursor = s.cursor || {x:0,y:0};
    view   = s.view   || {scale:1,offsetX:0,offsetY:0};
  }catch{}
}

loadState();

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();

  /* VIEW TRANSFORM */
  ctx.translate(view.offsetX, view.offsetY);
  ctx.scale(view.scale, view.scale);

  /* BOTTOM-LEFT CARTESIAN */
  ctx.translate(0, canvas.height);
  ctx.scale(1, -1);

  /* axes (visual reference) */
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(canvas.width,0);
  ctx.moveTo(0,0); ctx.lineTo(0,canvas.height);
  ctx.stroke();

  /* lines */
  ctx.strokeStyle="#fff";
  ctx.lineWidth = 2 / view.scale;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  }

  /* cursor */
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x, cursor.y, 4 / view.scale, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

draw();

/* ================= COMMAND EXEC ================= */
function exec(cmd){
  cmd = cmd.trim();
  if(!cmd) return;

  const p = cmd.split(/\s+/);
  if(p.length !== 2) return;

  const n = Number(p[1]);
  if(isNaN(n)) return;

  let nx = cursor.x;
  let ny = cursor.y;

  if(p[0]==="r") nx += n;
  else if(p[0]==="l") nx -= n;
  else if(p[0]==="u") ny += n;
  else if(p[0]==="d") ny -= n;
  else return;

  lines.push({
    x1: cursor.x,
    y1: cursor.y,
    x2: nx,
    y2: ny
  });

  cursor = { x:nx, y:ny };
  draw();
  saveState();
}

/* ================= UI ================= */
const input = document.getElementById("cmd");
const run   = document.getElementById("run");

function runCmd(){
  exec(input.value);
  input.value="";
  input.focus();
}

run.onclick = runCmd;
input.addEventListener("keydown", e=>{
  if(e.key==="Enter") runCmd();
});

input.focus();

/* ================= PINCH + PAN ================= */
let lastPan = null;
let lastDist = null;

function dist(a,b){
  return Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY);
}
function mid(a,b){
  return {
    x:(a.clientX+b.clientX)/2,
    y:(a.clientY+b.clientY)/2
  };
}

canvas.addEventListener("touchstart", e=>{
  if(e.touches.length===1){
    lastPan = {
      x:e.touches[0].clientX,
      y:e.touches[0].clientY
    };
  }
  if(e.touches.length===2){
    lastDist = dist(e.touches[0], e.touches[1]);
  }
},{passive:false});

canvas.addEventListener("touchmove", e=>{
  e.preventDefault();

  /* PAN */
  if(e.touches.length===1 && lastPan){
    const t = e.touches[0];
    view.offsetX += t.clientX - lastPan.x;
    view.offsetY += t.clientY - lastPan.y;
    lastPan = {x:t.clientX,y:t.clientY};
    draw();
    saveState();
  }

  /* PINCH */
  if(e.touches.length===2){
    const d = dist(e.touches[0], e.touches[1]);
    const m = mid(e.touches[0], e.touches[1]);
    const factor = d / lastDist;

    const newScale = Math.min(5, Math.max(0.2, view.scale * factor));

    view.offsetX = m.x - (m.x - view.offsetX) * (newScale / view.scale);
    view.offsetY = m.y - (m.y - view.offsetY) * (newScale / view.scale);

    view.scale = newScale;
    lastDist = d;

    draw();
    saveState();
  }
},{passive:false});

canvas.addEventListener("touchend", ()=>{
  lastPan = null;
  lastDist = null;
});
</script>

</body>
</html>
