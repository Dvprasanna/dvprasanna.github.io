<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>800x800 Scroll Canvas</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
}

/* APP LAYOUT */
#app{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* 🔴 CANVAS VIEWPORT (50% SCREEN HEIGHT) */
#canvas-viewport{
  height:50vh;               /* EXACTLY 50% of screen */
  overflow:auto;             /* SCROLLBARS */
  border:4px solid red;      /* DEBUG */
  box-sizing:border-box;
  background:#111;
}

/* 🟢 FIXED CANVAS SIZE */
#canvas{
  width:800px;
  height:800px;
  background:#000;
  border:4px solid lime;     /* DEBUG */
  box-sizing:border-box;
  display:block;
}

/* COMMAND BAR */
#bar{
  flex:1;
  background:#111;
  display:flex;
  gap:6px;
  padding:6px;
  box-sizing:border-box;
}

#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}

#run{
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px 12px;
}
</style>
</head>

<body>

<div id="app">

  <!-- 🔴 50% HEIGHT SCROLLABLE AREA -->
  <div id="canvas-viewport">
    <canvas id="canvas" width="800" height="800"></canvas>
  </div>

  <!-- COMMAND BAR (rest of screen) -->
  <div id="bar">
    <input id="cmd" placeholder="r 600">
    <button id="run">RUN</button>
  </div>

</div>

<script>
/* ===== CANVAS SETUP ===== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

/* ===== STATE ===== */
let cursor = {x:0,y:0};
let lines  = [];

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,800,800);

  ctx.save();

  /* bottom-left cartesian */
  ctx.translate(0,800);
  ctx.scale(1,-1);

  /* axes */
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(800,0);
  ctx.moveTo(0,0); ctx.lineTo(0,800);
  ctx.stroke();

  /* lines */
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  /* cursor */
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

draw();

/* ===== COMMAND EXEC ===== */
function exec(cmd){
  cmd = cmd.trim();
  if(!cmd) return;

  const p = cmd.split(/\s+/);
  if(p.length!==2) return;

  const n = Number(p[1]);
  if(isNaN(n)) return;

  let nx = cursor.x;
  let ny = cursor.y;

  if(p[0]==="r") nx+=n;
  else if(p[0]==="l") nx-=n;
  else if(p[0]==="u") ny+=n;
  else if(p[0]==="d") ny-=n;
  else return;

  lines.push({x1:cursor.x,y1:cursor.y,x2:nx,y2:ny});
  cursor={x:nx,y:ny};
  draw();
}

/* ===== UI ===== */
const input=document.getElementById("cmd");
const run=document.getElementById("run");

function runCmd(){
  exec(input.value);
  input.value="";
  input.focus();
}

run.onclick=runCmd;
input.addEventListener("keydown",e=>{
  if(e.key==="Enter") runCmd();
});
input.focus();
</script>

</body>
</html>
