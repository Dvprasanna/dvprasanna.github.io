<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Keyboard CAD Canvas v1.0</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    overflow: hidden;
    font-family: monospace;
  }

  canvas {
    display: block;
    border: 2px solid white;
    background: #000;
  }

  #hud {
    position: fixed;
    bottom: 10px;
    left: 10px;
    color: #0f0;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 6px 10px;
    border: 1px solid #0f0;
  }
</style>
</head>

<body>

<canvas id="cad"></canvas>
<div id="hud">CMD: <span id="cmd"></span></div>

<script>
/* =======================
   CANVAS SETUP
======================= */
const canvas = document.getElementById("cad");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawCursor();
}
window.addEventListener("resize", resize);
resize();

/* =======================
   STATE
======================= */
let x = canvas.width / 2;
let y = canvas.height / 2;
let buffer = "";
let shift = false;
let grid = false;

/* =======================
   DRAWING
======================= */
ctx.strokeStyle = "#fff";
ctx.lineWidth = 1;

function drawLine(dx, dy) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  x += dx;
  y += dy;
  ctx.lineTo(x, y);
  ctx.stroke();
  drawCursor();
}

function drawCursor() {
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();
}

/* =======================
   GRID
======================= */
function drawGrid() {
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 1;
  for (let i = 0; i < canvas.width; i += 50) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, canvas.height);
    ctx.stroke();
  }
  for (let i = 0; i < canvas.height; i += 50) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(canvas.width, i);
    ctx.stroke();
  }
  ctx.strokeStyle = "#fff";
}

/* =======================
   COMMAND EXECUTION
======================= */
function execute(cmd) {
  const dir = cmd[0];
  let val = parseInt(cmd.slice(1)) || 0;

  if (shift) val *= 10;

  if (dir === "r") drawLine(val, 0);
  if (dir === "l") drawLine(-val, 0);
  if (dir === "u") drawLine(0, -val);
  if (dir === "d") drawLine(0, val);
}

/* =======================
   KEYBOARD INPUT
======================= */
document.addEventListener("keydown", e => {
  if (e.key === "Shift") shift = true;

  if (e.key >= "0" && e.key <= "9") {
    buffer += e.key;
  }

  if (["r","l","u","d"].includes(e.key)) {
    buffer = e.key;
  }

  if (e.key === "Enter") {
    execute(buffer);
    buffer = "";
  }

  if (e.key === "g") {
    grid = !grid;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (grid) drawGrid();
  }

  document.getElementById("cmd").textContent = buffer;
});

document.addEventListener("keyup", e => {
  if (e.key === "Shift") shift = false;
});
</script>

</body>
</html>
