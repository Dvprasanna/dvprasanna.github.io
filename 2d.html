<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CMD Canvas</title>

<style>
/* ===== GLOBAL ===== */
html,body{
  margin:0;
  padding:0;
  height:100%;
  background:#000;
  color:#0f0;
  font-family:monospace;
  overflow:hidden;
}

/* ===== LAYOUT ===== */
#app{
  position:relative;
  width:100%;
  height:100%;
}

/* 🔴 RED BORDER = drawable region (excluding command bar) */
#canvas-wrap{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:64px;              /* reserve space for command bar */
  box-sizing:border-box;
  border:4px solid red;
  z-index:1;
  background:#000;
}

/* 🟢 GREEN BORDER = actual canvas */
#canvas{
  display:block;
  width:100%;
  height:100%;
  box-sizing:border-box;
  border:4px solid lime;
  background:#000;
  touch-action:none;        /* required for pinch */
}

/* ===== COMMAND BAR ===== */
#bar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:64px;
  box-sizing:border-box;
  background:#111;
  display:flex;
  gap:6px;
  padding:6px;
  z-index:2;                /* above canvas */
}

#cmd{
  flex:1;
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  font-size:16px;
}

#run{
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:6px 12px;
}
</style>
</head>

<body>

<div id="app">

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div id="bar">
    <input id="cmd" placeholder="r 600">
    <button id="run">RUN</button>
  </div>

</div>

<script>
/* ===== CANVAS SETUP ===== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function viewportHeight(){
  return window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;
}

function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = viewportHeight() - 64;
  draw();
}

window.addEventListener("resize", resize);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", resize);
}
resize();

/* ===== STATE ===== */
let cursor = {x:0,y:0};
let lines  = [];

let view = {
  scale:1,
  offsetX:0,
  offsetY:0
};

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();

  /* view transform */
  ctx.translate(view.offsetX, view.offsetY);
  ctx.scale(view.scale, view.scale);

  /* bottom-left cartesian */
  ctx.translate(0, canvas.height);
  ctx.scale(1,-1);

  /* axes */
  ctx.strokeStyle="#333";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(canvas.width,0);
  ctx.moveTo(0,0); ctx.lineTo(0,canvas.height);
  ctx.stroke();

  /* lines */
  ctx.strokeStyle="#fff";
  ctx.lineWidth = 2 / view.scale;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  /* cursor */
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,4/view.scale,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

draw();

/* ===== COMMAND EXEC ===== */
function exec(cmd){
  cmd = cmd.trim();
  if(!cmd) return;

  const p = cmd.split(/\s+/);
  if(p.length!==2) return;

  const n = Number(p[1]);
  if(isNaN(n)) return;

  let nx = cursor.x;
  let ny = cursor.y;

  if(p[0]==="r") nx += n;
  else if(p[0]==="l") nx -= n;
  else if(p[0]==="u") ny += n;
  else if(p[0]==="d") ny -= n;
  else return;

  lines.push({
    x1:cursor.x, y1:cursor.y,
    x2:nx, y2:ny
  });

  cursor={x:nx,y:ny};
  draw();
}

/* ===== UI ===== */
const input=document.getElementById("cmd");
const run=document.getElementById("run");

function runCmd(){
  exec(input.value);
  input.value="";
  input.focus();
}

run.onclick=runCmd;
input.addEventListener("keydown",e=>{
  if(e.key==="Enter") runCmd();
});
input.focus();

/* ===== PINCH + PAN ===== */
let lastPan=null, lastDist=null;

function dist(a,b){
  return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
}
function mid(a,b){
  return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};
}

canvas.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    lastPan={x:e.touches[0].clientX,y:e.touches[0].clientY};
  }
  if(e.touches.length===2){
    lastDist=dist(e.touches[0],e.touches[1]);
  }
},{passive:false});

canvas.addEventListener("touchmove",e=>{
  e.preventDefault();

  if(e.touches.length===1 && lastPan){
    const t=e.touches[0];
    view.offsetX+=t.clientX-lastPan.x;
    view.offsetY+=t.clientY-lastPan.y;
    lastPan={x:t.clientX,y:t.clientY};
    draw();
  }

  if(e.touches.length===2){
    const d=dist(e.touches[0],e.touches[1]);
    const m=mid(e.touches[0],e.touches[1]);
    const factor=d/lastDist;

    const newScale=Math.min(5,Math.max(0.2,view.scale*factor));

    view.offsetX=m.x-(m.x-view.offsetX)*(newScale/view.scale);
    view.offsetY=m.y-(m.y-view.offsetY)*(newScale/view.scale);

    view.scale=newScale;
    lastDist=d;
    draw();
  }
},{passive:false});

canvas.addEventListener("touchend",()=>{
  lastPan=null;
  lastDist=null;
});
</script>

</body>
</html>
