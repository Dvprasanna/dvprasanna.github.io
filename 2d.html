<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Photo → Trace → Merge</title>
<style>
  body { margin:0; background:#111; color:#fff; }
  #ui { padding:8px; background:#222; }
  canvas { display:block; margin:auto; background:#fff; }
</style>
</head>
<body>

<div id="ui">
  <input type="file" id="imgInput">
  <button id="hideImg">Hide Photo</button>
  <span>Right-click to trace | Press M to merge</span>
</div>

<canvas id="c" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let img = null;
let showImg = true;
let lines = [];
let selected = new Set();

/* ---------- IMAGE LOAD ---------- */
imgInput.onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  img = new Image();
  img.onload = draw;
  img.src = URL.createObjectURL(f);
};

hideImg.onclick = () => {
  showImg = !showImg;
  draw();
};

/* ---------- DRAW ---------- */
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (img && showImg) {
    const s = Math.min(canvas.width/img.width, canvas.height/img.height);
    const w = img.width*s, h = img.height*s;
    ctx.drawImage(img, (canvas.width-w)/2, (canvas.height-h)/2, w, h);
  }

  for (let l of lines) {
    ctx.strokeStyle = selected.has(l) ? "red" : "black";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }
}

/* ---------- RIGHT CLICK TRACE ---------- */
canvas.oncontextmenu = e => {
  e.preventDefault();

  // simulate edge-trace output: MANY parallel lines
  lines = [];
  for (let i=0;i<10;i++) {
    lines.push({
      x1:300+i*3, y1:100,
      x2:300+i*3, y2:500
    });
  }
  draw();
};

/* ---------- SELECTION ---------- */
canvas.onmousedown = e => {
  selected.clear();
  const r = canvas.getBoundingClientRect();
  const x = e.clientX-r.left;

  for (let l of lines) {
    if (Math.abs(l.x1-x)<6) selected.add(l);
  }
  draw();
};

/* ---------- MERGE ---------- */
window.onkeydown = e => {
  if (e.key.toLowerCase()==="m" && selected.size>1) {
    let sum=0;
    for (let l of selected) sum+=l.x1;
    const x=sum/selected.size;
    const ref=[...selected][0];

    lines=lines.filter(l=>!selected.has(l));
    lines.push({x1:x,y1:ref.y1,x2:x,y2:ref.y2});
    selected.clear();
    draw();
  }
};

</script>
</body>
</html>
