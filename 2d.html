<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mouse Drawing App v1.2</title>

<style>
body {
  margin: 0;
  background: #1c1c1c;
  overflow: hidden;
}

canvas {
  display: block;
  background: #111;
  cursor: crosshair;
}

/* Context Menu */
#menu {
  position: absolute;
  background: #222;
  border: 1px solid #555;
  display: none;
  z-index: 100;
  min-width: 200px;
}
#menu div {
  padding: 8px 12px;
  color: #fff;
  cursor: pointer;
  border-bottom: 1px solid #333;
}
#menu div:hover {
  background: #444;
}
#menu hr {
  border: none;
  border-top: 1px solid #444;
  margin: 4px 0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="menu">
  <div id="loadBg">Load Background Image</div>
  <div id="toggleGrid">Toggle Grid</div>
  <div id="setGrid">Set Grid Size (px)</div>
  <hr>
  <div id="togglePan">Toggle Pan</div>
  <hr>
  <div id="offsetLine">Offset Selected Line</div>
  <div id="deleteLine">Delete Selected Line</div>
  <div id="clearAll">Clear All Lines</div>
  <hr>
  <div id="fullscreen">Toggle Fullscreen</div>
</div>

<input type="file" id="bgLoader" hidden>

<script>
/* ========= VERSION =========
   Mouse Drawing App v1.2
=========================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.onresize = resize;
resize();

/* ===== STATE ===== */
let bgImage = null;
let gridOn = true;
let gridSize = 20;

let lines = [];
let currentLine = null;
let selectedLine = null;

let panMode = false;
let pan = { x: 0, y: 0 };
let panStart = null;

/* ===== HELPERS ===== */
function snap(v) {
  return gridOn ? Math.round(v / gridSize) * gridSize : v;
}

function distToLine(px, py, l) {
  const A = px - l.x1;
  const B = py - l.y1;
  const C = l.x2 - l.x1;
  const D = l.y2 - l.y1;
  const t = Math.max(0, Math.min(1, (A*C + B*D) / (C*C + D*D)));
  const dx = l.x1 + t*C - px;
  const dy = l.y1 + t*D - py;
  return Math.hypot(dx, dy);
}

/* ===== DRAW ===== */
function drawGrid() {
  if (!gridOn) return;
  ctx.strokeStyle = "#333";
  for (let x = -pan.x % gridSize; x < canvas.width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = -pan.y % gridSize; y < canvas.height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function redraw() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.translate(pan.x, pan.y);

  if (bgImage) ctx.drawImage(bgImage, 0, 0);
  drawGrid();

  lines.forEach(l => {
    ctx.strokeStyle = l === selectedLine ? "red" : "white";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  });
}

/* ===== MOUSE ===== */
canvas.onmousedown = e => {
  hideMenu();

  const x = snap(e.offsetX - pan.x);
  const y = snap(e.offsetY - pan.y);

  if (panMode) {
    panStart = { x: e.clientX, y: e.clientY };
    return;
  }

  selectedLine = null;
  for (let l of lines) {
    if (distToLine(x, y, l) < 6) {
      selectedLine = l;
      redraw();
      return;
    }
  }

  currentLine = { x1: x, y1: y, x2: x, y2: y };
  lines.push(currentLine);
};

canvas.onmousemove = e => {
  if (panStart) {
    pan.x += e.clientX - panStart.x;
    pan.y += e.clientY - panStart.y;
    panStart = { x: e.clientX, y: e.clientY };
    redraw();
    return;
  }
  if (!currentLine) return;
  currentLine.x2 = snap(e.offsetX - pan.x);
  currentLine.y2 = snap(e.offsetY - pan.y);
  redraw();
};

canvas.onmouseup = () => {
  currentLine = null;
  panStart = null;
};

/* ===== CONTEXT MENU ===== */
canvas.oncontextmenu = e => {
  e.preventDefault();
  const menu = document.getElementById("menu");
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.style.display = "block";
};

function hideMenu() {
  document.getElementById("menu").style.display = "none";
}

/* ===== MENU ACTIONS ===== */
toggleGrid.onclick = () => { gridOn = !gridOn; redraw(); };

setGrid.onclick = () => {
  const v = prompt("Grid size in pixels:", gridSize);
  if (v) gridSize = Number(v);
  redraw();
};

togglePan.onclick = () => {
  panMode = !panMode;
};

offsetLine.onclick = () => {
  if (!selectedLine) return alert("Select a line first");
  const d = Number(prompt("Offset in px:", 10));
  const dx = selectedLine.x2 - selectedLine.x1;
  const dy = selectedLine.y2 - selectedLine.y1;
  const len = Math.hypot(dx, dy);
  const nx = -dy / len, ny = dx / len;
  lines.push({
    x1: selectedLine.x1 + nx*d,
    y1: selectedLine.y1 + ny*d,
    x2: selectedLine.x2 + nx*d,
    y2: selectedLine.y2 + ny*d
  });
  redraw();
};

deleteLine.onclick = () => {
  if (!selectedLine) return;
  lines = lines.filter(l => l !== selectedLine);
  selectedLine = null;
  redraw();
};

clearAll.onclick = () => {
  lines = [];
  selectedLine = null;
  redraw();
};

fullscreen.onclick = () => {
  if (!document.fullscreenElement) document.body.requestFullscreen();
  else document.exitFullscreen();
};

loadBg.onclick = () => bgLoader.click();

bgLoader.onchange = e => {
  const img = new Image();
  img.onload = () => { bgImage = img; redraw(); };
  img.src = URL.createObjectURL(e.target.files[0]);
};

document.onclick = hideMenu;

redraw();
</script>

</body>
</html>
