<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mouse Drawing App v1.0</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #1c1c1c;
  color: #fff;
}
#topbar {
  display: flex;
  gap: 8px;
  padding: 8px;
  background: #2a2a2a;
  align-items: center;
}
input, button {
  background: #111;
  color: #fff;
  border: 1px solid #444;
  padding: 4px 6px;
}
canvas {
  display: block;
  background: #111;
  cursor: crosshair;
}
</style>
</head>

<body>

<div id="topbar">
  <input type="file" id="bgLoader" />
  Grid(px): <input id="gridSize" type="number" value="20" style="width:60px">
  <button id="gridToggle">Grid ON</button>
  Offset(px): <input id="offsetVal" type="number" value="10" style="width:60px">
  <button id="offsetBtn">Apply Offset</button>
</div>

<canvas id="canvas" width="1200" height="700"></canvas>

<script>
/* ====== STATE ====== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let bgImage = null;
let gridOn = true;
let gridSize = 20;

let lines = [];
let currentLine = null;
let selectedLine = null;

/* ====== HELPERS ====== */
function snap(v) {
  return gridOn ? Math.round(v / gridSize) * gridSize : v;
}

function distToLine(px, py, l) {
  const A = px - l.x1;
  const B = py - l.y1;
  const C = l.x2 - l.x1;
  const D = l.y2 - l.y1;
  const dot = A * C + B * D;
  const len = C * C + D * D;
  const t = Math.max(0, Math.min(1, dot / len));
  const dx = l.x1 + t * C - px;
  const dy = l.y1 + t * D - py;
  return Math.sqrt(dx * dx + dy * dy);
}

/* ====== DRAW ====== */
function drawGrid() {
  if (!gridOn) return;
  ctx.strokeStyle = "#222";
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (bgImage) ctx.drawImage(bgImage, 0, 0);

  drawGrid();

  lines.forEach(l => {
    ctx.strokeStyle = l === selectedLine ? "red" : "white";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  });
}

/* ====== MOUSE ====== */
canvas.onmousedown = e => {
  const x = snap(e.offsetX);
  const y = snap(e.offsetY);

  selectedLine = null;
  for (let l of lines) {
    if (distToLine(x, y, l) < 6) {
      selectedLine = l;
      redraw();
      return;
    }
  }

  currentLine = { x1: x, y1: y, x2: x, y2: y };
  lines.push(currentLine);
};

canvas.onmousemove = e => {
  if (!currentLine) return;
  currentLine.x2 = snap(e.offsetX);
  currentLine.y2 = snap(e.offsetY);
  redraw();
};

canvas.onmouseup = () => {
  currentLine = null;
};

/* ====== OFFSET ====== */
document.getElementById("offsetBtn").onclick = () => {
  if (!selectedLine) return;
  const d = Number(document.getElementById("offsetVal").value);

  const dx = selectedLine.x2 - selectedLine.x1;
  const dy = selectedLine.y2 - selectedLine.y1;
  const len = Math.hypot(dx, dy);
  const nx = -dy / len;
  const ny = dx / len;

  lines.push({
    x1: selectedLine.x1 + nx * d,
    y1: selectedLine.y1 + ny * d,
    x2: selectedLine.x2 + nx * d,
    y2: selectedLine.y2 + ny * d
  });

  redraw();
};

/* ====== UI ====== */
document.getElementById("gridToggle").onclick = () => {
  gridOn = !gridOn;
  redraw();
};

document.getElementById("gridSize").onchange = e => {
  gridSize = Number(e.target.value);
  redraw();
};

document.getElementById("bgLoader").onchange = e => {
  const img = new Image();
  img.onload = () => {
    bgImage = img;
    redraw();
  };
  img.src = URL.createObjectURL(e.target.files[0]);
};

redraw();
</script>

</body>
</html>
