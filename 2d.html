<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Parallel Line Merge Demo</title>
<style>
  body { margin:0; background:#111; }
  canvas { display:block; margin:auto; background:#fff; }
</style>
</head>
<body>

<canvas id="c" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let lines = [];
let selected = new Set();
let dragging = false;
let lastY = 0;

// create MANY parallel lines (simulate blurry edge output)
for (let i = 0; i < 8; i++) {
  lines.push({ x1:200+i*3, y1:50, x2:200+i*3, y2:450 });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for (let l of lines) {
    ctx.strokeStyle = selected.has(l) ? "red" : "black";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }
}

draw();

/* hit test */
function nearLine(l,x,y) {
  return Math.abs(x-l.x1) < 6;
}

/* mouse */
canvas.onmousedown = e => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX-r.left;
  const y = e.clientY-r.top;

  selected.clear();
  for (let l of lines) {
    if (nearLine(l,x,y)) selected.add(l);
  }

  if (selected.size) {
    dragging = true;
    lastY = y;
  }
  draw();
};

canvas.onmousemove = e => {
  if (!dragging) return;
  const r = canvas.getBoundingClientRect();
  const y = e.clientY-r.top;
  const dy = y-lastY;
  lastY = y;

  for (let l of selected) {
    l.y1 += dy;
    l.y2 += dy;
  }
  draw();
};

canvas.onmouseup = () => dragging=false;

/* MERGE */
window.onkeydown = e => {
  if (e.key.toLowerCase() === "m" && selected.size > 1) {
    // average X position
    let sum = 0;
    for (let l of selected) sum += l.x1;
    let avgX = sum / selected.size;

    // get height
    let ref = [...selected][0];

    // remove selected
    lines = lines.filter(l => !selected.has(l));

    // add merged line
    lines.push({
      x1:avgX, y1:ref.y1,
      x2:avgX, y2:ref.y2
    });

    selected.clear();
    draw();
  }
};
</script>

</body>
</html>
