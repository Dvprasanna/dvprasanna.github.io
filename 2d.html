<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini CMD Draw</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#111;
  font-family:monospace;
  color:#0f0;
}

/* SCROLLABLE DRAW AREA */
#viewport{
  height:60vh;                 /* easy viewing area */
  overflow:auto;
  border:2px solid red;        /* debug */
  background:#000;
}

/* FIXED CANVAS */
#canvas{
  width:800px;
  height:800px;
  background:#000;
  border:2px solid lime;       /* debug */
  display:block;
}

/* FLOATING COMMAND BAR (2 LINES) */
#bar{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  background:#000;
  border:2px solid #0f0;
  padding:6px;
  z-index:10;
}

#cmd{
  width:100%;
  height:48px;                 /* two lines */
  background:#000;
  color:#0f0;
  border:none;
  outline:none;
  resize:none;
  font-size:16px;
}
</style>
</head>

<body>

<div id="viewport">
  <canvas id="canvas" width="800" height="800"></canvas>
</div>

<div id="bar">
  <textarea id="cmd" placeholder="r 200&#10;d 200"></textarea>
</div>

<script>
/* ===== BASIC SETUP ===== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

/* ===== STATE ===== */
let cursor = {x:0,y:0};
let lines = [];

/* ===== DRAW ===== */
function draw(){
  ctx.clearRect(0,0,800,800);

  // cartesian bottom-left
  ctx.save();
  ctx.translate(0,800);
  ctx.scale(1,-1);

  // border reference
  ctx.strokeStyle="#333";
  ctx.strokeRect(0,0,800,800);

  // draw lines
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  for(const l of lines){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  }

  // cursor
  ctx.fillStyle="#0f0";
  ctx.beginPath();
  ctx.arc(cursor.x,cursor.y,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

draw();

/* ===== COMMAND EXEC ===== */
function exec(line){
  const p = line.trim().split(/\s+/);
  if(p.length!==2) return;

  const n = Number(p[1]);
  if(isNaN(n)) return;

  let nx = cursor.x;
  let ny = cursor.y;

  if(p[0]==="r") nx += n;
  if(p[0]==="l") nx -= n;
  if(p[0]==="u") ny += n;
  if(p[0]==="d") ny -= n;

  lines.push({x1:cursor.x,y1:cursor.y,x2:nx,y2:ny});
  cursor = {x:nx,y:ny};
}

/* ===== RUN ON ENTER ===== */
const input = document.getElementById("cmd");

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();

    const linesInput = input.value.split("\n");
    for(const line of linesInput){
      exec(line);
    }

    input.value="";
    draw();
  }
});
</script>

</body>
</html>
