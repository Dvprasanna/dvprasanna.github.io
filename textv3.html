<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Maker</title>

<style>
:root{--accent:#0366d6}

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
margin:0;
background:#fff;
color:#111
}

h1{font-size:18px;margin:15px}

.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center;
padding:10px 15px;
position:sticky;
top:0;
background:#fff;
border-bottom:1px solid #eee;
z-index:10
}

button,.dropbtn{
padding:8px 12px;
border-radius:6px;
border:1px solid #bbb;
background:#f7f8fa;
cursor:pointer
}

button.primary{
background:var(--accent);
color:#fff;
border-color:var(--accent)
}

button:hover{background:#eef3ff}

.menu{position:relative;display:inline-block}

.dropdown{
display:none;
position:absolute;
background:#fff;
min-width:200px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
border-radius:6px;
border:1px solid #eee;
padding:6px
}

.dropdown button{
display:block;
width:100%;
text-align:left;
background:none;
border:none;
padding:8px 10px
}

.dropdown button:hover{
background:#f3f6fb;
border-radius:6px
}

.toolbar-sep{
width:1px;
height:28px;
background:#e6e6e6;
margin:0 6px
}

#editor{
margin:15px;
min-height:320px;
border:1px dashed #ccc;
border-radius:8px;
padding:12px;
background:#fafafa;
overflow:auto
}

table.generated{
border-collapse:collapse;
margin-top:8px
}

table.generated td{
border:1px solid #999;
padding:6px 8px;
min-width:40px;
transition:background .15s
}

table.generated td:hover{background:#f5f9ff}

table.border-light td{border-width:1px}
table.border-medium td{border-width:3px}
table.border-high td{border-width:6px}

table.align-left{margin-left:0;margin-right:auto}
table.align-center{margin-left:auto;margin-right:auto}
table.align-right{margin-left:auto;margin-right:0}

#output{
width:calc(100% - 30px);
height:140px;
margin:15px;
padding:8px;
font-family:monospace
}

.hint{margin:15px;font-size:13px;color:#666}

button[disabled]{opacity:.5;cursor:not-allowed}
</style>
</head>

<body>

<h1>Table Maker</h1>

<div class="controls">

<button id="btn-make-table" class="primary">Make Table</button>
<button id="btn-make-columns">Make Columns</button>
<button id="btn-split-3">Split 3</button>

<div class="menu">
<button class="dropbtn" id="btn-table-menu">Table ▾</button>
<div class="dropdown" id="dropdown-table">

<div style="font-weight:600;padding:6px 8px">Line width</div>
<button data-action="border-light">Light</button>
<button data-action="border-medium">Medium</button>
<button data-action="border-high">High</button>

<hr>

<button data-action="merge-cells">Merge cells (row)</button>

<hr>

<div style="font-weight:600;padding:6px 8px">Vertical Merge</div>
<button data-action="merge-top">Merge with Top Row</button>
<button data-action="merge-bottom">Merge with Bottom Row</button>

<hr>

<div style="font-weight:600;padding:6px 8px">Align Table</div>
<button data-action="align-table-left">Align Left</button>
<button data-action="align-table-center">Align Center</button>
<button data-action="align-table-right">Align Right</button>

</div>
</div>

<div class="menu">
<button class="dropbtn" id="btn-text-menu">Text ▾</button>
<div class="dropdown" id="dropdown-text">
<button data-action="center-text">Center Text</button>
<button data-action="bold-text">Bold</button>
</div>
</div>

<div class="toolbar-sep"></div>

<button id="btn-select-all">Select All</button>

<div class="toolbar-sep"></div>

<button id="btn-undo">Undo</button>
<button id="btn-redo">Redo</button>

<div class="toolbar-sep"></div>

<button id="btn-export">Export CSV</button>
<button id="btn-copy">Copy CSV</button>
<button id="btn-clear">Clear</button>
<button id="btn-add-hr">Add HR</button>

</div>

<div id="editor" contenteditable="true">
Paste text lines here

one
two
three

Select lines → Make Table
</div>

<textarea id="output"></textarea>

<div class="hint">
Workflow: select lines → Make Table → edit cells → merge/split → export CSV
</div>

<script>

const editor=document.getElementById("editor")
const output=document.getElementById("output")

function getSel(){return window.getSelection()}
function getSelText(){return getSel().toString()}

function escapeHtml(s){
return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
}

function csvEscape(v){
if(!v)return""
if(v.includes(",")||v.includes('"')||v.includes("\n"))
return '"'+v.replace(/"/g,'""')+'"'
return v
}

let history=[]
let index=-1

function pushHistory(){
const snap=editor.innerHTML
history=history.slice(0,index+1)
history.push(snap)
index=history.length-1
updateButtons()
}

function undo(){
if(index<=0)return
index--
editor.innerHTML=history[index]
updateButtons()
}

function redo(){
if(index>=history.length-1)return
index++
editor.innerHTML=history[index]
updateButtons()
}

function updateButtons(){
btn_undo.disabled=index<=0
btn_redo.disabled=index>=history.length-1
}

pushHistory()

function makeTable(){
const text=getSelText().trim()
if(!text)return alert("select lines")

pushHistory()

const lines=text.split("\n").filter(l=>l.trim())

let html='<table class="generated border-light"><tbody>'
lines.forEach(l=>{
html+=`<tr><td>${escapeHtml(l)}</td></tr>`
})
html+="</tbody></table>"

document.execCommand("insertHTML",false,html)

pushHistory()
}

function makeColumns(){
const sel=getSel()
if(!sel.rangeCount)return
let node=sel.anchorNode
if(node.nodeType==3)node=node.parentElement
const td=node.closest("td")
if(!td)return
pushHistory()

const text=td.innerText
const mid=Math.floor(text.length/2)

td.innerHTML=escapeHtml(text.slice(0,mid))

const td2=document.createElement("td")
td2.innerHTML=escapeHtml(text.slice(mid))

td.after(td2)

pushHistory()
}

function split3(){
const sel=getSel()
if(!sel.rangeCount)return
let node=sel.anchorNode
if(node.nodeType==3)node=node.parentElement
const td=node.closest("td")
if(!td)return

const text=td.innerText
const size=Math.floor(text.length/3)

pushHistory()

td.innerHTML=escapeHtml(text.slice(0,size))

const td2=document.createElement("td")
td2.innerHTML=escapeHtml(text.slice(size,size*2))

const td3=document.createElement("td")
td3.innerHTML=escapeHtml(text.slice(size*2))

td.after(td2)
td2.after(td3)

pushHistory()
}

function mergeCells(){
const td=getSel().anchorNode.closest("td")
if(!td)return
const next=td.nextElementSibling
if(!next)return
pushHistory()

td.colSpan=2
td.innerHTML+=" "+next.innerHTML
next.remove()

pushHistory()
}

function mergeTop(){
const td=getSel().anchorNode.closest("td")
if(!td)return
const row=td.parentElement
const prev=row.previousElementSibling
if(!prev)return alert("No row above")

const col=[...row.children].indexOf(td)
const topCell=prev.children[col]

pushHistory()

topCell.rowSpan=(topCell.rowSpan||1)+1
topCell.innerHTML+=" "+td.innerHTML
td.remove()

pushHistory()
}

function mergeBottom(){
const td=getSel().anchorNode.closest("td")
if(!td)return
const row=td.parentElement
const next=row.nextElementSibling
if(!next)return alert("No row below")

const col=[...row.children].indexOf(td)
const botCell=next.children[col]

pushHistory()

td.rowSpan=(td.rowSpan||1)+1
td.innerHTML+=" "+botCell.innerHTML
botCell.remove()

pushHistory()
}

function setBorder(type){
document.querySelectorAll("table.generated").forEach(t=>{
t.classList.remove("border-light","border-medium","border-high")
t.classList.add("border-"+type)
})
}

function alignTable(type){
document.querySelectorAll("table.generated").forEach(t=>{
t.classList.remove("align-left","align-center","align-right")
t.classList.add("align-"+type)
})
}

function centerText(){document.execCommand("justifyCenter")}
function boldText(){document.execCommand("bold")}

function exportCSV(){
const tables=editor.querySelectorAll("table")
let out=[]
tables.forEach(t=>{
t.querySelectorAll("tr").forEach(tr=>{
let row=[]
tr.querySelectorAll("td").forEach(td=>{
row.push(csvEscape(td.innerText))
})
out.push(row.join(","))
})
})
output.value=out.join("\n")
}

function copyCSV(){
navigator.clipboard.writeText(output.value)
alert("copied")
}

function clearAll(){
pushHistory()
editor.innerHTML=""
output.value=""
pushHistory()
}

function insertHr(){
document.execCommand("insertHTML",false,"<hr>")
}

function toggleMenu(id){
const el=document.getElementById(id)
document.querySelectorAll(".dropdown").forEach(d=>d.style.display="none")
el.style.display="block"
}

btn_table_menu.onclick=()=>toggleMenu("dropdown-table")
btn_text_menu.onclick=()=>toggleMenu("dropdown-text")

document.addEventListener("click",e=>{
if(!e.target.closest(".menu"))
document.querySelectorAll(".dropdown").forEach(d=>d.style.display="none")
})

dropdown_table.onclick=e=>{
const a=e.target.dataset.action

if(a==="border-light")setBorder("light")
if(a==="border-medium")setBorder("medium")
if(a==="border-high")setBorder("high")

if(a==="merge-cells")mergeCells()
if(a==="merge-top")mergeTop()
if(a==="merge-bottom")mergeBottom()

if(a==="align-table-left")alignTable("left")
if(a==="align-table-center")alignTable("center")
if(a==="align-table-right")alignTable("right")
}

dropdown_text.onclick=e=>{
const a=e.target.dataset.action
if(a==="center-text")centerText()
if(a==="bold-text")boldText()
}

btn_make_table.onclick=makeTable
btn_make_columns.onclick=makeColumns
btn_split_3.onclick=split3
btn_export.onclick=exportCSV
btn_copy.onclick=copyCSV
btn_clear.onclick=clearAll
btn_add_hr.onclick=insertHr
btn_undo.onclick=undo
btn_redo.onclick=redo

btn_select_all.onclick=()=>{
const r=document.createRange()
r.selectNodeContents(editor)
const s=getSel()
s.removeAllRanges()
s.addRange(r)
}

</script>

</body>
</html>
